function StandaloneMemoryTrainer(config) {
    config = config || {};
    this.cards = Array.isArray(config.cards) ? config.cards : [];
    this.sessionTitle = config.sessionTitle || "Sesión de Estudio";
    this.instructions = config.instructions || "Haz clic en las cartas para voltearlas.";
    this.studyMode = config.studyMode || "mixed";
    this.cardsPerSession = parseInt(config.cardsPerSession) || Math.min(this.cards.length, 200);
    this.order = config.order || "sequential";
    this.showTimer = config.showTimer !== false;
    this.autoFlip = config.autoFlip !== false;
    this.enableSound = config.enableSound !== false;
    this.showProgress = config.showProgress !== false;
    this.customColors = config.customColors || {
        primary: "#4361ee",
        cardFront: "#ffffff",
        cardBack: "#f8f9fa",
        success: "#06d6a0",
        warning: "#ffd166",
        danger: "#ef476f"
    };
    this.state = {
        active: false,
        currentSession: [],
        currentCardIndex: 0,
        startTime: null,
        learnedCards: [],
        difficultCards: [],
        cardStatus: {},
        flippedCards: new Set(),
        sessionStats: {
            totalCards: 0,
            learned: 0,
            difficult: 0,
            remaining: 0,
            timeSpent: 0
        }
    };
    this._processCards();
}

StandaloneMemoryTrainer.prototype._processCards = function() {
    if (!Array.isArray(this.cards)) {
        throw new Error("Las cartas deben ser un array");
    }
    this.cards = this.cards.map(function(card) {
        if (!card || typeof card !== "object") return null;
        var conceptStr = card.concept ? String(card.concept).trim() : "";
        var definitionStr = card.definition ? String(card.definition).trim() : "";
        var warningChar = "⚠️";
        var isImportantConcept = conceptStr.indexOf(warningChar) === 0;
        var isImportantDefinition = definitionStr.indexOf(warningChar) === 0;
        var newCard = {
            concept: isImportantConcept ? conceptStr.substring(warningChar.length).trim() : conceptStr,
            definition: isImportantDefinition ? definitionStr.substring(warningChar.length).trim() : definitionStr,
            important: isImportantConcept || isImportantDefinition,
            status: "unseen",
            timesSeen: 0,
            timesFlipped: 0,
            lastSeen: null
        };
        return newCard;
    }).filter(function(card) {
        return card && card.concept && card.definition;
    });
    if (this.cards.length < 1) {
        throw new Error("Se necesita al menos 1 carta para estudiar");
    }
};

StandaloneMemoryTrainer.prototype._shuffleArray = function(array) {
    var shuffled = array.slice();
    for (var i = shuffled.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = shuffled[i];
        shuffled[i] = shuffled[j];
        shuffled[j] = temp;
    }
    return shuffled;
};

StandaloneMemoryTrainer.prototype._getElapsedTime = function() {
    if (!this.state.startTime) return 0;
    return Date.now() - this.state.startTime;
};

StandaloneMemoryTrainer.prototype._formatTime = function(ms) {
    var seconds = Math.floor(ms / 1000);
    var minutes = Math.floor(seconds / 60);
    var remainingSeconds = seconds % 60;
    if (minutes > 0) {
        return minutes + ":" + (remainingSeconds < 10 ? "0" : "") + remainingSeconds;
    }
    return "0:" + (remainingSeconds < 10 ? "0" : "") + remainingSeconds;
};

StandaloneMemoryTrainer.prototype._updateStats = function() {
    var total = this.state.currentSession.length;
    var learned = this.state.learnedCards.length;
    var difficult = this.state.difficultCards.length;
    var remaining = total - learned;
    this.state.sessionStats = {
        totalCards: total,
        learned: learned,
        difficult: difficult,
        remaining: remaining,
        timeSpent: this._getElapsedTime()
    };
};

StandaloneMemoryTrainer.prototype.startSession = function() {
    if (this.cards.length < 1) {
        throw new Error("No hay cartas para estudiar");
    }
    this.state = {
        active: true,
        currentSession: [],
        currentCardIndex: 0,
        startTime: Date.now(),
        learnedCards: [],
        difficultCards: [],
        cardStatus: {},
        flippedCards: new Set(),
        sessionStats: {
            totalCards: 0,
            learned: 0,
            difficult: 0,
            remaining: 0,
            timeSpent: 0
        }
    };
    var cardsToStudy = this.cards.slice();
    if (this.studyMode === "difficult") {
        cardsToStudy = cardsToStudy.filter(function(card) {
            return this.state.cardStatus[card.concept] === "difficult" || card.important;
        }.bind(this));
    }
    cardsToStudy = cardsToStudy.slice(0, this.cardsPerSession);
    if (this.order === "random") {
        cardsToStudy = this._shuffleArray(cardsToStudy);
    }
    this.state.currentSession = cardsToStudy;
    this.state.sessionStats.totalCards = cardsToStudy.length;
    this.state.sessionStats.remaining = cardsToStudy.length;
    cardsToStudy.forEach(function(card) {
        this.state.cardStatus[card.concept] = card.status || "unseen";
    }.bind(this));
    return {
        success: true,
        totalCards: cardsToStudy.length,
        firstCard: cardsToStudy[0],
        sessionTitle: this.sessionTitle
    };
};

StandaloneMemoryTrainer.prototype.getNextCard = function() {
    if (!this.state.active || this.state.currentCardIndex >= this.state.currentSession.length) {
        return null;
    }
    var card = this.state.currentSession[this.state.currentCardIndex];
    var totalCards = this.state.currentSession.length;
    var currentNumber = this.state.currentCardIndex + 1;
    var progress = totalCards > 0 ? Math.round((this.state.currentCardIndex / totalCards) * 100) : 0;
    card.timesSeen = (card.timesSeen || 0) + 1;
    card.lastSeen = new Date().toISOString();
    return {
        card: card,
        cardNumber: currentNumber,
        totalCards: totalCards,
        progress: progress,
        isImportant: card.important,
        status: this.state.cardStatus[card.concept] || "unseen",
        flipped: this.state.flippedCards.has(card.concept),
        timeSpent: this._getElapsedTime()
    };
};

StandaloneMemoryTrainer.prototype.nextCard = function() {
    if (this.state.currentCardIndex >= this.state.currentSession.length - 1) {
        return false;
    }
    this.state.currentCardIndex++;
    return true;
};

StandaloneMemoryTrainer.prototype.previousCard = function() {
    if (this.state.currentCardIndex <= 0) {
        return false;
    }
    this.state.currentCardIndex--;
    return true;
};

StandaloneMemoryTrainer.prototype.flipCard = function(cardConcept) {
    var card = this.state.currentSession.find(function(c) {
        return c.concept === cardConcept;
    });
    if (!card) {
        return { success: false, error: "Carta no encontrada" };
    }
    this.state.flippedCards.add(cardConcept);
    card.timesFlipped = (card.timesFlipped || 0) + 1;
    return {
        success: true,
        card: card,
        flipped: true,
        definition: card.definition,
        timesFlipped: card.timesFlipped
    };
};

StandaloneMemoryTrainer.prototype.markAsLearned = function(cardConcept) {
    var card = this.state.currentSession.find(function(c) {
        return c.concept === cardConcept;
    });
    if (!card) {
        return { success: false, error: "Carta no encontrada" };
    }
    this.state.cardStatus[cardConcept] = "learned";
    if (this.state.learnedCards.indexOf(cardConcept) === -1) {
        this.state.learnedCards.push(cardConcept);
    }
    var difficultIndex = this.state.difficultCards.indexOf(cardConcept);
    if (difficultIndex > -1) {
        this.state.difficultCards.splice(difficultIndex, 1);
    }
    this._updateStats();
    return {
        success: true,
        card: card,
        status: "learned",
        learnedCount: this.state.learnedCards.length,
        difficultCount: this.state.difficultCards.length
    };
};

StandaloneMemoryTrainer.prototype.markAsDifficult = function(cardConcept) {
    var card = this.state.currentSession.find(function(c) {
        return c.concept === cardConcept;
    });
    if (!card) {
        return { success: false, error: "Carta no encontrada" };
    }
    this.state.cardStatus[cardConcept] = "difficult";
    if (this.state.difficultCards.indexOf(cardConcept) === -1) {
        this.state.difficultCards.push(cardConcept);
    }
    var learnedIndex = this.state.learnedCards.indexOf(cardConcept);
    if (learnedIndex > -1) {
        this.state.learnedCards.splice(learnedIndex, 1);
    }
    this._updateStats();
    return {
        success: true,
        card: card,
        status: "difficult",
        learnedCount: this.state.learnedCards.length,
        difficultCount: this.state.difficultCards.length
    };
};

StandaloneMemoryTrainer.prototype.resetCard = function(cardConcept) {
    var card = this.state.currentSession.find(function(c) {
        return c.concept === cardConcept;
    });
    if (!card) {
        return { success: false, error: "Carta no encontrada" };
    }
    this.state.cardStatus[cardConcept] = "unseen";
    var learnedIndex = this.state.learnedCards.indexOf(cardConcept);
    if (learnedIndex > -1) {
        this.state.learnedCards.splice(learnedIndex, 1);
    }
    var difficultIndex = this.state.difficultCards.indexOf(cardConcept);
    if (difficultIndex > -1) {
        this.state.difficultCards.splice(difficultIndex, 1);
    }
    this._updateStats();
    return {
        success: true,
        card: card,
        status: "unseen"
    };
};

StandaloneMemoryTrainer.prototype.getStats = function() {
    var timeSpent = this._getElapsedTime();
    var progress = this.state.currentSession.length > 0 ? 
        Math.round((this.state.learnedCards.length / this.state.currentSession.length) * 100) : 0;
    return {
        totalCards: this.state.sessionStats.totalCards,
        learned: this.state.sessionStats.learned,
        difficult: this.state.sessionStats.difficult,
        remaining: this.state.sessionStats.remaining,
        timeSpent: timeSpent,
        timeFormatted: this._formatTime(timeSpent),
        progress: progress,
        currentCard: this.state.currentCardIndex + 1,
        totalCardsInSession: this.state.currentSession.length,
        flippedCards: this.state.flippedCards.size
    };
};

StandaloneMemoryTrainer.prototype.endSession = function() {
    this.state.active = false;
    var timeSpent = this._getElapsedTime();
    var totalCards = this.state.currentSession.length;
    var learnedCards = this.state.learnedCards.length;
    var difficultCards = this.state.difficultCards.length;
    var progress = totalCards > 0 ? Math.round((learnedCards / totalCards) * 100) : 0;
    var message, recommendation;
    if (progress >= 80) {
        message = "¡Excelente trabajo! Has aprendido la mayoría de los conceptos.";
        recommendation = "Puedes repasar las cartas marcadas como difíciles o empezar una nueva sesión.";
    } else if (progress >= 50) {
        message = "Buen progreso. Continúa estudiando para mejorar tu dominio.";
        recommendation = "Enfócate en las cartas marcadas como difíciles en tu próximo estudio.";
    } else {
        message = "Es un buen comienzo. Sigue practicando para mejorar.";
        recommendation = "Te recomendamos repasar más las cartas que aún no dominas.";
    }
    // Obtener la lista completa de conceptos difíciles con sus definiciones
    var difficultConcepts = this.state.difficultCards.map(function(concept) {
        var card = this.state.currentSession.find(function(c) {
            return c.concept === concept;
        });
        return card ? { 
            concept: card.concept, 
            definition: card.definition,
            important: card.important || false
        } : null;
    }.bind(this)).filter(function(item) { return item !== null; });
    return {
        sessionTitle: this.sessionTitle,
        timeSpent: timeSpent,
        timeFormatted: this._formatTime(timeSpent),
        totalCards: totalCards,
        learnedCards: learnedCards,
        difficultCards: difficultCards,
        unseenCards: totalCards - learnedCards - difficultCards,
        progress: progress,
        message: message,
        recommendation: recommendation,
        difficultConcepts: difficultConcepts  // ← INCLUYE TODA LA INFORMACIÓN
    };
};

StandaloneMemoryTrainer.prototype.exportConfig = function() {
    var exportCards = this.cards.map(function(card) {
        return {
            concept: card.important ? ("⚠️ " + card.concept) : card.concept,
            definition: card.important ? ("⚠️ " + card.definition) : card.definition
        };
    });
    return {
        metadata: {
            version: "1.0",
            created: new Date().toISOString(),
            author: "Memory Trainer",
            lastModified: new Date().toISOString(),
            sessionTitle: this.sessionTitle,
            totalCards: this.cards.length,
            importantTerms: this.cards.filter(function(c) { return c.important; }).length
        },
        config: {
            sessionTitle: this.sessionTitle,
            instructions: this.instructions,
            subject: this.subject || "General",
            studyMode: this.studyMode,
            cardsPerSession: this.cardsPerSession,
            order: this.order,
            showTimer: this.showTimer,
            autoFlip: this.autoFlip,
            enableSound: this.enableSound,
            showProgress: this.showProgress,
            customColors: this.customColors
        },
        content: {
            cards: exportCards
        }
    };
};

function escapeHTML(text) {
    if (text === null || text === undefined) return "";
    var div = document.createElement("div");
    div.textContent = String(text);
    return div.innerHTML;
}

function showMessage(message, type) {
    var messageDiv = document.createElement("div");
    messageDiv.className = "status-message " + type;
    var emoji = "ℹ️";
    if (type === "error") emoji = "❌";
    else if (type === "warning") emoji = "⚠️";
    else if (type === "success") emoji = "✅";
    messageDiv.innerHTML = "<span class=\"emoji\">" + emoji + "</span> " + escapeHTML(message);
    var trainerContent = document.getElementById("trainerContent");
    trainerContent.insertBefore(messageDiv, trainerContent.firstChild);
    setTimeout(function() {
        if (messageDiv.parentNode) {
            messageDiv.parentNode.removeChild(messageDiv);
        }
    }, 3000);
}

function initTrainer() {
    try {
        var cardsToUse = EMBEDDED_TRAINER_DATA.content.cards || [];
        if (cardsToUse.length < 1) {

        trainer = new StandaloneMemoryTrainer({
            cards: cardsToUse,

    html += '<span>' + trainer.cards.length + ' cartas disponibles</span>';
    html += '</div>';
    html += '<div class="summary-item">';
    html += '<span class="emoji">⚙️</span>';
    html += '<span>Modo: ' + (trainer.studyMode === "difficult" ? "Solo difíciles" : "Todas") + '</span>';
    html += '</div>';
    html += '<div class="summary-item">';
    html += '<span class="emoji">🔀</span>';
    html += '<span>Orden: ' + (trainer.order === "random" ? "Aleatorio" : "Secuencial") + '</span>';
    html += '</div>';
    html += '</div>';
    html += '<div class="controls">';
    html += '<button class="btn btn-primary btn-large" id="startStudyBtn">';
    html += '<span class="emoji">▶️</span> Comenzar Estudio';
    html += '</button>';
    html += '</div>';
    html += '</div>';
    trainerContent.innerHTML = html;
    document.getElementById("startStudyBtn").addEventListener("click", startStudySession);
}

function startStudySession() {
    sessionActive = true;
    var result = trainer.startSession();
    if (result.success) {
        showStudyCard();
        startTimer();
    }
}

function showStudyCard() {
    currentCard = trainer.getNextCard();
    if (!currentCard) {
        endStudySession();
        return;
    }
    var trainerContent = document.getElementById("trainerContent");
    var card = currentCard.card;
    var importantBadge = currentCard.isImportant ? '<div class="important-badge"><span class="emoji">⚠️</span> Importante</div>' : "";
    var statusBadge = "";
    if (currentCard.status === "learned") {
        statusBadge = '<div class="status-badge learned"><span class="emoji">✅</span> Aprendida</div>';
    } else if (currentCard.status === "difficult") {
        statusBadge = '<div class="status-badge difficult"><span class="emoji">⚠️</span> Dificultad</div>';
    }
    var html = "";
    html += '<div class="study-screen">';
    html += '<div class="progress-bar-container">';
    html += '<div class="progress-bar" style="width: ' + currentCard.progress + '%"></div>';
    html += '<div class="progress-label">Carta ' + currentCard.cardNumber + ' de ' + currentCard.totalCards + ' (' + currentCard.progress + '%)</div>';
    html += '</div>';
    html += importantBadge;
    html += statusBadge;
    html += '<div class="card-container" id="cardContainer">';
    html += '<div class="flashcard" id="flashcard">';
    html += '<div class="card-front" id="cardFront">';
    html += '<div class="card-content">';
    html += '<h3>Concepto</h3>';
    html += '<div class="concept-text">' + escapeHTML(card.concept) + '</div>';
    html += '</div>';
    html += '<div class="card-hint">Haz clic para ver la definición</div>';
    html += '</div>';
    html += '<div class="card-back" id="cardBack">';
    html += '<div class="card-content">';
    html += '<h3>Definición</h3>';
    html += '<div class="definition-text">' + escapeHTML(card.definition) + '</div>';
    html += '</div>';
    html += '<div class="card-hint">Haz clic para ver el concepto</div>';
    html += '</div>';
    html += '</div>';
    html += '</div>';
    html += '<div class="card-actions">';
    html += '<button class="btn btn-success" id="markLearnedBtn">';
    html += '<span class="emoji">✅</span> ✓ Aprendida';
    html += '</button>';
    html += '<button class="btn btn-warning" id="markDifficultBtn">';
    html += '<span class="emoji">⚠️</span> ✗ Dificultad';
    html += '</button>';
    html += '<button class="btn btn-secondary" id="resetCardBtn">';
    html += '<span class="emoji">🔄</span> Reiniciar';
    html += '</button>';
    html += '</div>';
    html += '<div class="session-controls">';
    html += '<button class="btn btn-danger" id="endSessionBtn">';
    html += '<span class="emoji">⏹️</span> Terminar Sesión';
    html += '</button>';
    html += '</div>';
    html += '</div>';
    trainerContent.innerHTML = html;
    updateUI();
    var flashcard = document.getElementById("flashcard");
    if (currentCard.flipped) {
        flashcard.classList.add("flipped");
    }
    flashcard.addEventListener("click", function() {
        flipCurrentCard();
    });
    document.getElementById("markLearnedBtn").addEventListener("click", function() {
        markCardAsLearnedAndContinue();
    });
    document.getElementById("markDifficultBtn").addEventListener("click", function() {
        markCardAsDifficultAndContinue();
    });
    document.getElementById("resetCardBtn").addEventListener("click", function() {
        resetCardStatus();
    });
    document.getElementById("endSessionBtn").addEventListener("click", endStudySession);
    if (trainer.autoFlip && !currentCard.flipped) {
        startAutoFlipTimer();
    }
}

function flipCurrentCard() {
    if (!currentCard || !sessionActive) return;
    var flashcard = document.getElementById("flashcard");
    var result = trainer.flipCard(currentCard.card.concept);
    if (result.success) {
        flashcard.classList.toggle("flipped");
        if (trainer.enableSound) {
            playFlipSound();
        }
        clearAutoFlipTimer();
    }
}

function markCardAsLearnedAndContinue() {
    if (!currentCard || !sessionActive) return;
    var result = trainer.markAsLearned(currentCard.card.concept);
    if (result.success) {
        showMessage("✅ Marcada como aprendida - Pasando a la siguiente...", "success");
        updateUI();
        setTimeout(function() {
            if (trainer.nextCard()) {
                showStudyCard();
            } else {
                endStudySession();
            }
        }, 800);
    }
}

function markCardAsDifficultAndContinue() {
    if (!currentCard || !sessionActive) return;
    var result = trainer.markAsDifficult(currentCard.card.concept);
    if (result.success) {
        showMessage("⚠️ Marcada como difícil - Pasando a la siguiente...", "warning");
        updateUI();
        setTimeout(function() {
            if (trainer.nextCard()) {
                showStudyCard();
            } else {
                endStudySession();
            }
        }, 800);
    }
}

function resetCardStatus() {
    if (!currentCard || !sessionActive) return;
    var result = trainer.resetCard(currentCard.card.concept);
    if (result.success) {
        showMessage("🔄 Estado de la carta reiniciado", "info");
        updateUI();
    }
}

function startAutoFlipTimer() {
    if (!trainer.autoFlip) return;
    clearAutoFlipTimer();
    autoFlipTimeout = setTimeout(function() {
        if (sessionActive && currentCard && !currentCard.flipped) {
            flipCurrentCard();
        }
    }, 5000);
}

function clearAutoFlipTimer() {
    if (autoFlipTimeout) {
        clearTimeout(autoFlipTimeout);
        autoFlipTimeout = null;
    }
}

function startTimer() {
    if (!trainer.showTimer) return;
    clearInterval(timerInterval);
    timerInterval = setInterval(updateTimer, 1000);
}

function updateTimer() {
    if (!sessionActive) {
        clearInterval(timerInterval);
        return;
    }
    var stats = trainer.getStats();
    document.getElementById("timeDisplay").textContent = stats.timeFormatted;
}

function updateUI() {
    if (!sessionActive) return;
    var stats = trainer.getStats();
    document.getElementById("learnedDisplay").textContent = stats.learned;
    if (trainer.showTimer) {
        document.getElementById("timeDisplay").textContent = stats.timeFormatted;
    }
}

function playFlipSound() {
    try {
        var audioContext = new (window.AudioContext || window.webkitAudioContext)();
        var oscillator = audioContext.createOscillator();
        var gainNode = audioContext.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        oscillator.frequency.value = 523.25;
        gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
        oscillator.start(audioContext.currentTime);
        oscillator.stop(audioContext.currentTime + 0.5);
    } catch (e) {
        // Silenciar error si AudioContext no está disponible
    }
}

function endStudySession() {
    sessionActive = false;
    clearAutoFlipTimer();
    clearInterval(timerInterval);
    var results = trainer.endSession();
    showResultsScreen(results);
}

function showResultsScreen(results) {
    var trainerContent = document.getElementById("trainerContent");
    var html = "";
    html += '<div class="results-screen">';
    html += '<h2><span class="emoji">🏆</span> Sesión Completada</h2>';
    html += '<div class="results-message">' + escapeHTML(results.message) + '</div>';
    html += '<div class="results-recommendation">' + escapeHTML(results.recommendation) + '</div>';
    html += '<div class="results-stats">';
    html += '<div class="stat-card">';
    html += '<div class="stat-icon"><span class="emoji">⏱️</span></div>';
    html += '<div class="stat-value">' + escapeHTML(results.timeFormatted) + '</div>';
    html += '<div class="stat-label">Tiempo</div>';
    html += '</div>';
    html += '<div class="stat-card">';
    html += '<div class="stat-icon"><span class="emoji">✅</span></div>';
    html += '<div class="stat-value">' + results.learnedCards + '</div>';
    html += '<div class="stat-label">Aprendidas</div>';
    html += '</div>';
    html += '<div class="stat-card">';
    html += '<div class="stat-icon"><span class="emoji">⚠️</span></div>';
    html += '<div class="stat-value">' + results.difficultCards + '</div>';
    html += '<div class="stat-label">Difíciles</div>';
    html += '</div>';
    html += '<div class="stat-card">';
    html += '<div class="stat-icon"><span class="emoji">📊</span></div>';
    html += '<div class="stat-value">' + results.progress + '%</div>';
    html += '<div class="stat-label">Progreso</div>';
    html += '</div>';
    html += '</div>';
    if (results.difficultConcepts && results.difficultConcepts.length > 0) {
        html += '<div class="difficult-concepts">';
        html += '<h3><span class="emoji">⚠️</span> Conceptos marcados como difíciles</h3>';
        html += '<p>Estos son los conceptos que deberías repasar en tu próxima sesión:</p>';
        html += '<div class="concepts-list">';
        // Generar cada concepto difícil
        results.difficultConcepts.forEach(function(item) {
            var importantTag = item.important ? '<span class="important-tag">IMPORTANTE</span>' : "";
            html += '<div class="concept-item">';
            html += '<div class="concept-header">';
            html += '<span class="emoji">📌</span>';
            html += '<div class="concept-title">' + escapeHTML(item.concept) + '</div>';
            html += importantTag;
            html += '</div>';
            html += '<div class="definition-content">';
            html += '<strong>Definición:</strong> ' + escapeHTML(item.definition);
            html += '</div>';
            html += '</div>';
        });
        html += '</div>';
        html += '</div>';
    } else {
        html += '<div class="difficult-concepts">';
        html += '<h3><span class="emoji">🎉</span> ¡Excelente trabajo!</h3>';
        html += '<div class="no-difficult-concepts">';
        html += '<span class="emoji">✅</span>';
        html += '<p>No hay conceptos marcados como difíciles. ¡Has dominado todos los conceptos de esta sesión!</p>';
        html += '</div>';
        html += '</div>';
    }
    html += '<div class="controls">';
    html += '<button class="btn btn-primary" id="restartSessionBtn">';
    html += '<span class="emoji">🔄</span> Nueva Sesión';
    html += '</button>';
    html += '<button class="btn btn-secondary" id="mainMenuBtn">';
    html += '<span class="emoji">🏠</span> Menú Principal';
    html += '</button>';
    html += '</div>';
    html += '</div>';
    trainerContent.innerHTML = html;
    document.getElementById("restartSessionBtn").addEventListener("click", function() {
        startStudySession();
    });
    document.getElementById("mainMenuBtn").addEventListener("click", showStartScreen);
}

// INICIALIZAR CUANDO SE CARGA LA PÁGINA
document.addEventListener("DOMContentLoaded", function() {
    initTrainer();
});

    </script>
