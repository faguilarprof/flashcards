stion small{color:var(--muted);font-weight:750}.question h3{margin:13px 0 0;font-size:27px;line-height:1.38}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.option{position:relative;min-height:90px;padding:20px 16px 16px 48px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-weight:700;text-align:left}.option:hover:not(:disabled){border-color:var(--p);transform:translateY(-2px)}.option:before{content:attr(data-key);position:absolute;left:13px;top:13px;display:grid;place-items:center;width:25px;height:25px;border-radius:50%;color:var(--p);background:#eef2ff;font-size:11px}.option.correct{color:#065f46;border-color:var(--ok);background:#d1fae5}.option.incorrect{color:#7f1d1d;border-color:var(--bad);background:#fee2e2}.feedback{margin-top:14px;padding:14px;border-radius:12px;text-align:center;font-weight:800}.feedback.ok{color:#065f46;background:#d1fae5}.feedback.bad{color:#7f1d1d;background:#fee2e2}.result-score{font-size:72px;font-weight:900;line-height:1;color:var(--p);margin:25px 0 8px}.result-grade{font-size:22px;font-weight:850}.certificate-box{margin-top:24px;padding:20px;border:2px solid #fcd34d;border-radius:17px;background:linear-gradient(135deg,#fffbeb,#fff)}.certificate-box input{width:min(450px,100%);padding:12px;border:1px solid #d6b661;border-radius:10px}.diploma-page{padding:38px;border:8px double var(--p);border-radius:7px;background:#fff;text-align:center}.diploma-page .seal{font-size:50px}.diploma-page h2{font-size:34px}.diploma-name{margin:26px 0 8px;color:var(--p);font:900 33px Georgia,serif}.diploma-line{width:70%;height:2px;margin:8px auto 22px;background:var(--a)}.toast{position:fixed;right:18px;bottom:18px;z-index:10;max-width:360px;padding:13px 16px;border-radius:11px;color:#fff;background:#334155;box-shadow:0 14px 35px rgba(0,0,0,.25)}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:720px){body{padding:7px}.app{border-radius:16px;min-height:96vh}.head{align-items:flex-start;flex-direction:column}.content{padding:20px 14px}.mode-grid,.options,.direction-grid{grid-template-columns:1fr}.flip-wrap{height:280px}.face strong{font-size:23px}.review-results{grid-template-columns:1fr}.stats{max-width:100%}h2{font-size:27px}.question h3{font-size:22px}}@media print{body{padding:0;background:#fff}.app>header,.diploma-controls{display:none!important}.app{box-shadow:none;border:0}.content{padding:0}.screen:not(.printable){display:none}.diploma-page{min-height:190mm;display:flex;flex-direction:column;justify-content:center}.toast{display:none}}

<script>
(function(){'use strict';var DATA={"id":"qsu-mu3uc5zw-yf9p3n","cards":[{"id":1,"concept":"Acervo comunitario","definition":"Conjunto de normas, leyes, regulaciones, políticas y prácticas que conforman el cuerpo de legislación y reglamentación de la Unión Europea (UE)","featured":false},{"id":2,"concept":"Administración local","definition":"Conjunto de administraciones existentes con un ámbito geográfico inferior a la Comunidad Autónoma (Diputaciones provinciales, Cabildos y Consejos insulares, comarcas, ayuntamientos, Pedanías, distritos, áreas metropolitanas, etc)","featured":true},{"id":3,"concept":"Administración Pública","definition":"Herramienta con la que cuentan los poderes ejecutivos del Estado (gobierno estatal, autonómico y también Diputaciones provinciales, ayuntamientos...) para gestionar los servicios públicos","featured":true},{"id":4,"concept":"Autonomía territorial","definition":"Principio constitucional por el cual el Estado se organiza en municipios, provincias y comunidades autónomas, con capacidad para gestionar sus propios intereses","featured":false},{"id":5,"concept":"Bando municipal","definition":"Acto administrativo consistente en una manifestación solemne, emitida por el alcalde de un municipio","featured":false},{"id":6,"concept":"BOE (Boletín Oficial del Estado)","definition":"Diario oficial español dedicado a la publicación de determinadas leyes, disposiciones y actos de inserción obligatoria.","featured":true},{"id":7,"concept":"Comunidades Autónomas","definition":"Entidades territoriales que forman parte de la organización territorial del Estado español, con capacidades de autogobierno reguladas por sus estatutos de autonomía","featured":true},{"id":8,"concept":"Congreso de los Diputados","definition":"Cámara Baja de las Cortes Generales que representa a los ciudadanos del estado español. Controla la acción del Gobierno, tiene el mayor peso en la redacción legislativa y elige al Presidente del Gobierno","featured":true},{"id":9,"concept":"Consejo de Estado","definition":"Máximo órgano consultivo del Gobierno, emite dictámenes sobre aquellos asuntos que someten a su consulta el Gobierno o sus miembros, bien con carácter preceptivo o facultativo.","featured":false},{"id":10,"concept":"Constitución española","definition":"Norma jurídica suprema del Estado español que establece los derechos y deberes fundamentales de los ciudadanos y determina la estructura y funcionamiento de los poderes públicos. A ella están sujetos todos los poderes públicos y ciudadanos de España​ desde su entrada en vigor el 29 de diciembre de 1978.","featured":true},{"id":11,"concept":"Convenio internacional","definition":"Acuerdo producido en el seno de una Organización internacional que los estados, en uso de su soberanía, son libres de ratificar e incorporar a derecho interno.","featured":true},{"id":12,"concept":"Convenios colectivos","definition":"Acuerdos negociados entre representantes de trabajadores y empresarios que establecen condiciones laborales para grupos de trabajadores","featured":true},{"id":13,"concept":"Cortes Generales","definition":"Poder legislativo del Estado español compuesto por dos cámaras: Congreso de los Diputados y Senado, que representan al pueblo español","featured":true},{"id":14,"concept":"Costumbre jurídica","definition":"Norma jurídica no escrita que se ha convertido en obligatoria por el uso repetido y constante en el tiempo","featured":true},{"id":15,"concept":"Cuestión de confianza","definition":"Procedimiento por el cual el Presidente del Gobierno expone su programa ante el Congreso para pedir que ratifique su confianza en el mismo. Si la pierde, está obligado a dimitir y convocar elecciones.","featured":false},{"id":16,"concept":"Defensor del Pueblo","definition":"Alto comisionado de las Cortes Generales designado para la defensa y protección de los derechos fundamentales recogidos en la Constitución","featured":false},{"id":17,"concept":"Delegado del Gobierno","definition":"Alto funcionario designado por el Gobierno de España para representar al gobierno central en una comunidad autónoma. Tiene responsabilidades relacionadas con el mantenimiento del orden público, la seguridad, la coordinación de servicios públicos y la implementación de políticas gubernamentales en su área de jurisdicción.","featured":false},{"id":18,"concept":"Derecho administrativo","definition":"Rama del derecho público que regula la actividad de las administraciones públicas, incluyendo procedimientos administrativos y servicios públicos","featured":false},{"id":19,"concept":"Derecho civil","definition":"Rama del derecho privado que regula las relaciones civiles y personales entre individuos, incluyendo propiedad, contratos, sucesiones y familia","featured":false},{"id":20,"concept":"Derecho constitucional","definition":"Rama del derecho público que regula la estructura y funcionamiento del Estado, así como los derechos fundamentales de los ciudadanos","featured":false},{"id":21,"concept":"Derecho laboral","definition":"Conjunto de normas jurídicas que regulan las relaciones laborales entre empleadores y empleados, estableciendo derechos y obligaciones de ambas partes","featured":true},{"id":22,"concept":"Derecho mercantil","definition":"Rama del derecho privado que regula las relaciones comerciales y empresariales, incluyendo sociedades comerciales y contratos comerciales","featured":false},{"id":23,"concept":"Derecho mixto","definition":"Categoría jurídica que involucra aspectos tanto del derecho público como del privado, siendo el derecho laboral un ejemplo clásico","featured":false},{"id":24,"concept":"Derecho penal","definition":"Rama del derecho público que establece las normas y sanciones aplicables a los delitos y las infracciones","featured":false},{"id":25,"concept":"Derecho privado","definition":"Conjunto de normas que regulan las relaciones entre individuos, empresas y otras entidades privadas, protegiendo intereses privados","featured":true},{"id":26,"concept":"Derecho procesal","definition":"Rama del derecho público que establece las reglas y procedimientos para la resolución de conflictos en los distintos tribunales","featured":false},{"id":27,"concept":"Derecho público","definition":"Conjunto de normas que regulan las relaciones entre el Estado y los individuos o entre entidades públicas","featured":true},{"id":28,"concept":"Derechos Fundamentales","definition":"quellos derechos inviolables que pertenecen a todos los ciudadanos españoles, sin distinción de raza, sexo, religión, opinión o cualquier otra condición personal o social.","featured":true},{"id":29,"concept":"Directiva Comunitaria","definition":"Norma legislativa de la Unión Europea que establece unas directrices y objetivos a los Estados para que adapten su legislación a lo establecido en ella. Es de obligado cumplimiento para los estados y requiere transposición a derecho interno a través de una ley de adaptación","featured":true},{"id":30,"concept":"Estatuto de los Trabajadores","definition":"Texto normativo fundamental que regula las relaciones laborales en España, estableciendo derechos y obligaciones de trabajadores y empresarios","featured":true},{"id":31,"concept":"Gobierno de España","definition":"Cabeza del ejecutivo español. Según la CE sus funciones son: dirigir la política interior y exterior, la Administración civil y militar y la defensa del Estado. Ejercer la función ejecutiva y la potestad reglamentaria de acuerdo con la Constitución y las leyes","featured":true},{"id":32,"concept":"Jurisprudencia","definition":"Conjunto de decisiones judiciales que establecen una interpretación uniforme de las normas jurídicas, especialmente del Tribunal Supremo","featured":true},{"id":33,"concept":"Ley","definition":"En el régimen constitucional, disposición votada por las cámaras legislativas y sancionada por el jefe del Estado.","featured":true},{"id":34,"concept":"Ley autonómica","definition":"Ley emanada de las Comunidades Autónomas en virtud de la potestad legislativa que les es propia","featured":false},{"id":35,"concept":"Ley ordinaria","definition":"Norma jurídica aprobada por el Congreso de los Diputados y el Senado con mayoría simple que regula materias de carácter general.","featured":true},{"id":36,"concept":"Ley orgánica","definition":"Norma jurídica aprobada por el Congreso de los Diputados con mayoría absoluta que regula materias de especial importancia constitucional: Son las relativas al desarrollo de los derechos fundamentales y de las libertades públicas, las que aprueben los Estatutos de Autonomía y el régimen electoral general y otras previstas expresamente en la Constitución.","featured":true},{"id":37,"concept":"Mayoría absoluta","definition":"Consenso que se consigue cuando una decisión obtiene la mitad más uno de los votos en el órgano colegiado que corresponda.","featured":true},{"id":38,"concept":"Mayoría simple","definition":"Más votos a favor que en contra","featured":false},{"id":39,"concept":"Moción de censura","definition":"Procedimento que permite al Congreso de los Diputados retirar su confianza al presidente del Gobierno y forzar su dimisión. Debe ser constructiva, proponiendo un candidato alternativo","featured":false},{"id":40,"concept":"Monarquía parlamentaria","definition":"Forma política del Estado español establecida en la Constitución donde el Rey es jefe de Estado pero el poder ejecutivo reside en el Gobierno","featured":true},{"id":41,"concept":"Negociación colectiva","definition":"Derecho constitucional a negociar condiciones laborales entre representantes de trabajadores y empresarios","featured":false},{"id":42,"concept":"Norma mínima","definition":"Principio jurídico laboral que establece que las normas de rango superior determinan el contenido mínimo inderogable en beneficio del trabajador","featured":true},{"id":43,"concept":"Orden Ministerial","definition":"Disposición reglamentaria dictada por un ministro en el ámbito de sus competencias.","featured":true},{"id":44,"concept":"Ordenamiento jurídico","definition":"Conjunto de leyes, principios y valores que organizan y regulan la vida en sociedad, garantizando la justicia y la convivencia pacífica","featured":true},{"id":45,"concept":"Ordenanza Municipal","definition":"Disposiciones administrativas de carácter general y de rango inferior a la ley aprobadas por los entes locales en el ámbito de sus competencias y en ejercicio de la potestad reglamentaria que tienen atribuida.","featured":false},{"id":46,"concept":"Organización internacional","definition":"Son asociaciones que los Estados han creado voluntariamente en virtud de un tratado, para tratar cuestiones de interés común","featured":true},{"id":47,"concept":"Poder ejecutivo","definition":"Es el poder que se encarga del Gobierno y gestión de los servicios públicos","featured":true},{"id":48,"concept":"Poder judicial","definition":"Poder del estado que se encarga de impartir justicia en los tribunales, aplicando las normas del Derecho para resolver los conflictos juridicos.","featured":true},{"id":49,"concept":"Poder legislativo","definition":"Poder que se encarga de la redacción y aprobación de las leyes.","featured":true},{"id":50,"concept":"Principio de autonomía de la voluntad","definition":"Libertad para establecer entre particulares toda clase de pactos o condiciones siempre que no vayan en contra de la ley, la moral ni el orden público","featured":false},{"id":51,"concept":"Principio de jerarquía normativa","definition":"Ordenación jerárquica o escalonada de las normas jurídicas de modo que las normas de rango inferior no pueden contradecir ni vulnerar lo establecido por una norma de rango superior","featured":true},{"id":52,"concept":"Principios generales del derecho","definition":"Normas jurídicas no escritas que se deducen de la propia naturaleza del derecho y complementan el ordenamiento","featured":true},{"id":53,"concept":"Principios rectores de la política social y económica","definition":"Principios que reconocidos en la CE, arts. 39 a 52, informan la legislación positiva, la práctica judicial y la actuación de todos los poderes públicos. La protección a la salud, la cultura, los hijos, la familia, etc son ejemplos de este tipo de principios","featured":false},{"id":54,"concept":"Rama del derecho","definition":"Parte del ordenamiento jurídico que se ocupa de una determinada materia o ámbito de la vida social. Se pueden clasificar en dos grandes grupos: derecho público y privado","featured":false},{"id":55,"concept":"Real Decreto","definition":"Reglamento dictado por el Gobierno reunido en Consejo de Ministros de aplicación general a todo el territorio nacional","featured":true},{"id":56,"concept":"Real Decreto Legislativo","definition":"Norma jurídica con rango de ley, que emana del poder ejecutivo central, en virtud de delegación expresa efectuada por el poder legislativo (Cortes Generales) a través de una ley de bases","featured":true},{"id":57,"concept":"Real Decreto Ley","definition":"Norma jurídica con rango de ley, propia de países con monarquía parlamentaria, que emana del poder ejecutivo y es dictada en caso de extraordinaria y urgente necesidad. Requiere de posterior convalidación o ratificación de parte del poder legislativo, en los 30 días siguientes a su promulgación","featured":true},{"id":58,"concept":"Reglamento","definition":"Conjunto ordenado de reglas o preceptos dictados por la autoridad competente para la ejecución de una ley, para el funcionamiento de una corporación, de un servicio o de cualquier actividad.","featured":true},{"id":59,"concept":"Reglamento Comunitario","definition":"Norma legislativa de la Unión Europea de obligado cumplimiento para los Estados y los ciudadanos de la Unión Europea. De aplicación directa","featured":false},{"id":60,"concept":"Senado","definition":"Cámara Alta de las Cortes Generales. Representa a los territorios de España","featured":true},{"id":61,"concept":"Separación de poderes","definition":"Principio constitucional function certName(){var el=document.getElementById('studentName'),name=el?el.value.trim():'';if(name.length<3){notify('Escribe el nombre completo para el diploma');if(el)el.focus();return''}return name}function rgb(hex){hex=String(hex).replace('#','');if(hex.length===3)hex=hex.split('').map(function(x){return x+x}).join('');return[parseInt(hex.slice(0,2),16)||0,parseInt(hex.slice(2,4),16)||0,parseInt(hex.slice(4,6),16)||0]}function ascii(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^ -~]/g,'')}function fileName(s){return ascii(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'alumno'}
function certificate(printOnly){var name=certName(),r=app.results;if(!name)return;if(printOnly||!window.jspdf){showPrintable(name,r);if(!printOnly)notify('La biblioteca PDF no está disponible; usa Imprimir → Guardar como PDF');return}try{var jsPDF=window.jspdf.jsPDF,doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'}),p=rgb(cfg.colors.primary),a=rgb(cfg.colors.accent),ok=rgb(cfg.colors.success);doc.setFillColor(255,255,255);doc.rect(0,0,297,210,'F');doc.setDrawColor(p[0],p[1],p[2]);doc.setLineWidth(3);doc.rect(14,14,269,182);doc.setLineWidth(.7);doc.rect(19,19,259,172);doc.setFont('helvetica','bold');doc.setTextColor(p[0],p[1],p[2]);doc.setFontSize(30);doc.text('DIPLOMA DE APROVECHAMIENTO',148.5,39,{align:'center'});doc.setTextColor(a[0],a[1],a[2]);doc.setFontSize(19);doc.text(doc.splitTextToSize(ascii(cfg.title),220),148.5,55,{align:'center'});doc.setTextColor(55,65,81);doc.setFont('helvetica','normal');doc.setFontSize(14);doc.text('Se concede el presente diploma a',148.5,82,{align:'center'});doc.setFont('helvetica','bold');doc.setTextColor(p[0],p[1],p[2]);doc.setFontSize(27);doc.text(ascii(name).toUpperCase(),148.5,103,{align:'center'});doc.setDrawColor(a[0],a[1],a[2]);doc.line(55,109,242,109);doc.setFont('helvetica','normal');doc.setTextColor(55,65,81);doc.setFontSize(13);doc.text('por haber superado satisfactoriamente la actividad',148.5,122,{align:'center'});doc.setFont('helvetica','bold');doc.setTextColor(ok[0],ok[1],ok[2]);doc.setFontSize(20);doc.text('Calificacion: '+r.grade+' / 10',148.5,139,{align:'center'});doc.setFont('helvetica','normal');doc.setTextColor(100,116,139);doc.setFontSize(10);doc.text('Aciertos: '+r.correct+'/'+r.total+'   |   Precision: '+r.percent+'%   |   Tiempo: '+r.time,148.5,153,{align:'center'});doc.text('Fecha: '+new Date().toLocaleDateString('es-ES')+'   |   Materia: '+ascii(cfg.subject)+'   |   ID: '+r.id,148.5,169,{align:'center'});doc.save('diploma-'+fileName(name)+'.pdf');notify('Diploma descargado')}catch(e){notify('No se pudo crear el PDF: '+e.message);showPrintable(name,r)}}
function showPrintable(name,r){setStats('');setScreen('diploma','<section class="screen printable"><div class="diploma-page"><div class="seal">🎓</div><h2>DIPLOMA DE APROVECHAMIENTO</h2><h3>'+esc(cfg.title)+'</h3><p>Se concede el presente diploma a</p><div class="diploma-name">'+esc(name.toUpperCase())+'</div><div class="diploma-line"></div><p>por haber superado satisfactoriamente la actividad</p><h3 style="color:var(--ok)">Calificación: '+r.grade+' / 10</h3><p>Aciertos: '+r.correct+'/'+r.total+' · Precisión: '+r.percent+'% · Tiempo: '+r.time+'</p><p><small>'+new Date().toLocaleDateString('es-ES')+' · '+esc(cfg.subject)+' · ID: '+r.id+'</small></p></div><div class="btns diploma-controls"><button class="btn primary" id="doPrint">Imprimir / Guardar como PDF</button><button class="btn secondary" id="backResults">Volver a resultados</button></div></section>');document.getElementById('doPrint').onclick=function(){window.print()};document.getElementById('backResults').onclick=finishQuiz}
document.addEventListener('keydown',function(e){if(app.screen==='quiz-question'&&!app.quiz.locked&&/^[1-4]$/.test(e.key))answerQuiz(parseInt(e.key,10)-1);if(app.screen==='review-card'&&(e.key===' '||e.key==='Enter')){e.preventDefault();flipReview()}});window.addEventListener('beforeunload',function(){if(app.screen==='review-card')saveReviewProgress()});document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'&&app.screen==='review-card')saveReviewProgress()});function init(){if(!cards.length){setScreen('home','<section class="screen center"><h2>No hay fichas disponibles</h2></section>');return}if(cfg.outputMode==='both'){if(cfg.startMode==='review')showReviewStart();else if(cfg.startMode==='quiz'&&cards.length>=4)showQuizStart();else showHome(true)}else showHome(false)}init()})();
</script></body></html>
