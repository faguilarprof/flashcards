        "definition": "⚠️ ️ Toda lesión corporal que el trabajador sufra con ocasión o por consecuencia del trabajo que ejecute por cuenta ajena."
      },
      {
        "concept": "⚠️ ️ Accidente no laboral",
        "definition": "⚠️ ️ Lesión o alteración de la salud derivada de accidente siempre que éste no sea consecuencia del trabajo realizado. Le corresponde la acción protectora en la misma forma que en la enfermedad común, sin exigencia de periodo previo de cotización, salvo para acceder a pensiones de incapacidad permanente absoluta o gran invalidez, o de muerte y supervivencia, desde situaciones de no-alta."

      {
        "concept": "⚠️ ️ Alta en Seguridad Social",
        "definition": "⚠️ ️ Comunicación a la Tesorería General de la Seguridad Social de la incorporación de un trabajador a una actividad que le convierte en un sujeto protegido del Sistema de Seguridad Social."
      },
      {
        "concept": "Alta especial",
        "definition": "La que tiene lugar en supuestos de huelga, cierre patronal y otras situaciones que puedan determinarse y tiene los efectos que fije la norma que hubiere establecido este tipo de alta."
      },
      {
        "concept": "⚠️ ️ Alta médica",
        "definition": "⚠️ ️ Declaración médica, mediante parte médico, en las situaciones de incapacidad temporal, tras el reconocimiento del trabajador, que establece la plena aptitud para el trabajo o el alta con propuesta de invalidez."
      },
      {
        "concept": "Asignación económica por hijo o menor acogido a cargo",
        "definition": "Prestación familiar, de modalidad no contributiva, de carácter económico, que se reconoce en determinadas condiciones, por cada hijo menor de 18 años o, cuando siendo mayor de dicha edad, está afectado por una discapacidad, en un grado igual o superior al 65 por 100, a cargo del beneficiario"
      },
      {
        "concept": "Asistencia jurídica gratuita",
        "definition": "Derecho a participar gratuitamente en los pleitos laborales y de Seguridad Social por parte de los trabajadores, beneficiarios, Entidades Gestoras y otras personas, en los términos reconocidos por las leyes."
      },
      {
        "concept": "⚠️ ️ Autónomo",
        "definition": "⚠️ ️ Trabajador por cuenta propia, mayor de 18 años, que realiza de forma habitual, personal y directa, una actividad económica a título lucrativo, en territorio nacional, sin sujeción por ella a contrato de trabajo y aunque utilice el servicio remunerado de otras personas, sea o no titular de la empresa,"
      },
      {
        "concept": "Auxilio por defunción",
        "definition": "Prestaciones por muerte y supervivencia, consistente en una cantidad a tanto alzado que para el año 2019 asciende a 46,50 euros, actualizándose a partir de ese año con arreglo al índice de precios al consumo (IPC), para hacer frente a los gastos de sepelio a quien los haya soportado."
      },
      {
        "concept": "⚠️ ️ Baja en Seguridad Social",
        "definition": "⚠️ ️ Comunicación obligatoria que debe hacer el empresario cuando un trabajador cesa en la empresa o el trabajador por cuenta propia cuando éste cesa en su actividad profesional."
      },
      {
        "concept": "⚠️ ️ Baja médica",
        "definition": "⚠️ ️ Declaración médica, mediante el parte médico expedido por el facultativo del Servicio Público de Salud, o de la Mutua colaboradora con la Seguridad Social Profesionales, que determina la baja en el trabajo, y en su caso, el derecho a la prestación económica por incapacidad temporal."
      },
      {
        "concept": "⚠️ ️ Base reguladora",
        "definition": "⚠️ ️ Uno de los factores que intervienen en el cálculo de las prestaciones económicas de la Seguridad Social y consiste en fijar una cuantía u obtener un resultado a través de una fórmula de cálculo determinada en función de las bases por las que se hayan efectuado las cotizaciones durante los periodos que se señalan para cada prestación,"
      },
      {
        "concept": "⚠️ ️ Bases de cotización",
        "definition": "⚠️ ️ Son las cantidades sobre las que se aplican los tipos de cotización para la obtención de las cuotas de la Seguridad Social, que los sujetos responsables ingresan en el Sistema y que constituyen su principal recurso económico."
      },
      {
        "concept": "Centro de trabajo",
        "definition": "Unidad productiva con organización específica, que sea dada de alta, como tal, ante la autoridad laboral."
      },
      {
        "concept": "⚠️ ️ Cese de actividad",
        "definition": "⚠️ ️ Situación en la que pueden encontrarse los trabajadores autónomos y que ha sido objeto de un sistema específico de protección, mediante una prestación por cese de actividad, a la que pueden acogerse estos trabajadores voluntariamente, y que garantiza los principios de contributividad, solidaridad y sostenibilidad financiera."
      },
      {
        "concept": "Cierre patronal",
        "definition": "Derecho por el que se permite al empresario el cierre del centro de trabajo y, por tanto, la suspensión del contrato de trabajo, lo que suspende asimismo las obligaciones recíprocas de trabajar y de percibir el salario y la cotización a la Seguridad Social, entre otros derechos. Los trabajadores permanecen en situación de alta especial durante el cierre patronal."
      },
      {
        "concept": "⚠️ ️ Código cuenta de cotización",
        "definition": "⚠️ ️ Código numérico que la Tesorería General de la Seguridad Social asigna a los empresarios y demás sujetos responsables del pago de cuotas al Sistema de la Seguridad Social."
      },
      {
        "concept": "Complemento de gran invalidez",
        "definition": "Cuantía que se abona al pensionista de gran invalidez, destinada a que pueda remunerar a la persona que le atienda."
      },
      {
        "concept": "⚠️ ️ Contingencias comunes",
        "definition": "⚠️ ️ Aquéllas que no guardan relación con el desempeño de una actividad laboral"
      },
      {
        "concept": "⚠️ ️ Contingencias profesionales",
        "definition": "⚠️ ️ Se derivan, directa o indirectamente, del trabajo."
      },
      {
        "concept": "⚠️ ️ Cotización",
        "definition": "⚠️ ️ Obligación contributiva impuesta a empresarios y trabajadores para el sostenimiento de las cargas económicas de la Seguridad Social."
      },
      {
        "concept": "Cuidado de menores afectados por una enfermedad grave",
        "definition": "Prestación económica para los progenitores, adoptantes, guardadores con fines de adopción o acogedores con carácter permanente, en aquellos casos en que ambos trabajen, para el cuidado de un menor a su cargo afectado por cáncer u otra enfermedad grave que requiera ingreso hospitalario de larga duración. Exige una reducción de jornada de al menos un 50 por ciento para dedicarse al cuidado directo, continuo y permanente del menor."
      },
      {
        "concept": "⚠️ ️ Desempleo",
        "definition": "⚠️ ️ Situación protegida de quienes, pudiendo y queriendo trabajar, pierden su empleo, o ven reducida su jornada de trabajo, y que atribuye un posible derecho a prestaciones económicas, bien como prestación o como subsidio."
      },
      {
        "concept": "Empresario",
        "definition": "Toda persona natural o jurídica, aunque su actividad no esté motivada por ánimo de lucro, a la que prestan servicios, con la consideración de trabajadores por cuenta ajena, las personas incluidas en el campo de aplicación de cualquier Régimen de la Seguridad Social."
      },
      {
        "concept": "⚠️ ️ Enfermedad común",
        "definition": "⚠️ ️ Alteración de la salud que no tenga la condición de accidente no laboral, accidente de trabajo o enfermedad profesional."
      },
      {
        "concept": "⚠️ ️ Enfermedad profesional",
        "definition": "⚠️ ️ Enfermedad contraída a consecuencia del trabajo ejecutado por cuenta ajena en las actividades especificadas como causantes de la misma en el cuadro de Enfermedades Profesionales aprobado por el Ministerio de Empleo y Seguridad Social, y que esté provocada por la acción de los elementos o sustancias que en dicho cuadro se indican para cada enfermedad profesional."
      },
      {
        "concept": "⚠️ ️ Entidades Gestoras",
        "definition": "⚠️ ️ Entidades públicas con personalidad jurídica que, bajo la dirección y tutela de los respectivos departamentos ministeriales, efectúan la gestión y administración de las prestaciones y servicios que son competencia de la Seguridad Social."
      },
      {
        "concept": "Equipo de Valoración de Incapacidades (EVI)",
        "definition": "Órgano colegiado formado por distintos profesionales, existente en cada Dirección Provincial del INSS (excepto en las de Cataluña), que tiene como función, entre otras, examinar la situación de incapacidad del trabajador y formular al Director Provincial el dictamen-propuesta, preceptivo y no vinculante, en materia de anulación o disminución de la capacidad para el trabajo, la procedencia o no de revisión, la determinación del carácter común o profesional de la enfermedad, etc."
      },
      {
        "concept": "Excedencia por cuidado de hijos",
        "definition": "Derecho individual de los trabajadores, hombres o mujeres, de duración no superior a tres años para atender el cuidado de cada hijo, por naturaleza o adopción, guarda con fines de adopción o acogimiento familiar, a contar desde la fecha de nacimiento o, en su caso, de la resolución judicial o administrativa"
      },
      {
        "concept": "Gran invalidez",
        "definition": "Incapacidad permanente cuando, por consecuencia de pérdidas anatómicas o funcionales, se necesita la asistencia de otra persona para los actos más esenciales de la vida, tales como vestirse, desplazarse, comer o análogos."
      },
      {
        "concept": "⚠️ ️ Grupo de cotización",
        "definition": "⚠️ ️ Cada uno de los actuales 11 grupos, de los 12 establecidos en el Decreto que inicialmente los creó, en los que se clasifican, a efectos de cotización a la Seguridad Social, las categorías profesionales existentes en las distintas Reglamentaciones de Trabajo"
      },
      {
        "concept": "⚠️ ️ Hecho causante",
        "definition": "⚠️ ️ Aquél que da lugar a la realización de la contingencia o situación protegida y que ha sido fijado por la ley o por el reglamento en fecha determinada (por ejemplo, la muerte para la pensión de viudedad, el cumplimiento de la edad y el cese en el trabajo para la pensión de jubilación,"
      },
      {
        "concept": "⚠️ ️ IMSERSO",
        "definition": "⚠️ ️ Entidad Gestora de la Seguridad Social dotada de personalidad jurídica, a la que se encomienda la gestión de las pensiones no contributivas, y la de los servicios complementarios de las prestaciones del Sistema de la Seguridad Social orientadas fundamentalmente a los colectivos de la tercera edad, personas con discapacidad y otros. En Aragón, sus atribuciones están transferidaa al IASS."
      },
      {
        "concept": "⚠️ ️ Incapacidad permanente",
        "definition": "⚠️ ️ Distintos estados de la reducción, disminución o anulación de la capacidad de trabajo del interesado, que pueden constituir incapacidad permanente parcial, total, absoluta y de gran invalidez, y que pueden atribuir derechos a prestaciones de diversa cuantía.Situación del trabajador que, después de haber estado sometido al tratamiento prescrito y de haber sido dado de alta médicamente, presenta reducciones anatómicas o funcionales graves, susceptibles de determinación objetiva y previsiblemente definitivas, que disminuyan o anulen su capacidad laboral, y que puede causar derecho a una prestación de cuantía variable según su grado"
      },
      {
        "concept": "Incapacidad permanente absoluta",
        "definition": "La que inhabilita por completo al trabajador para toda profesión u oficio. La pensión es del 100% de la base reguladora."
      },
      {
        "concept": "Incapacidad permanente parcial",
        "definition": "La que, sin alcanzar el grado de total, ocasione al trabajador una disminución no inferior al 33% en su rendimiento normal para la profesión habitual, sin impedirle la realización de las tareas fundamentales de la misma. La prestación consiste en una cantidad a tanto alzado."
      },
      {
        "concept": "Incapacidad permanente total",
        "definition": "La que inhabilita al trabajador para la realización de todas o de las fundamentales tareas de su profesión habitual, siempre que pueda dedicarse a otra distinta."
      },
      {
        "concept": "⚠️ ️ Incapacidad temporal",
        "definition": "⚠️ ️ Situación de enfermedad común o profesional y accidente, sea o no de trabajo, que puede atribuir el derecho a un subsidio mientras se reciba asistencia sanitaria de la Seguridad Social y se esté impedido para el trabajo, con una duración máxima"
      },
      {
        "concept": "Indemnización por lesiones permanentes no invalidantes",
        "definition": "Prestación económica abonable, conforme a un baremo establecido, por una sola vez, a causa de la existencia de lesiones permanentes que no impiden trabajar, producidas por contingencia profesional y que no llegan a alcanzar un grado de incapacidad."
      },
      {
        "concept": "Informe de vida laboral",
        "definition": "Contiene información respecto de las situaciones de alta o baja de una persona en el conjunto de los distintos regímenes del sistema de la Seguridad Social, durante toda su vida de trabajo."
      },
      {
        "concept": "⚠️ ️ INGESA",
        "definition": "⚠️ ️ Entidad Gestora de la Seguridad Social, con personalidad jurídica propia a la que se atribuye la gestión de las prestaciones sanitarias de la Seguridad Social en el ámbito de las Ciudades de Ceuta y Melilla. En Aragón, sus atribuciones están transferidas al SALUD"
      },
      {
        "concept": "⚠️ ️ Inscripción de empresas",
        "definition": "⚠️ ️ Acto administrativo por el que la Tesorería General de la Seguridad Social, a solicitud de un empresario, realiza su inscripción en el Sistema de la Seguridad Social, que será válida durante la existencia de la persona natural o jurídica, o del ente empleador solicitante"
      },
      {
        "concept": "⚠️ ️ INSS",
        "definition": "⚠️ ️ Entidad Gestora con personalidad jurídica propia, cuya competencia genérica se extiende a la gestión y administración de las prestaciones económicas del Sistema de la Seguridad Social"
      },
      {
        "concept": "IPREM",
        "definition": "Indicador o referencia del nivel de renta que sirve para determinar la cuantía de determinadas prestaciones o para acceder a determinados beneficios, prestaciones o servicios públicos, sustituyendo al salario mínimo interprofesional en esta función"
      },
      {
        "concept": "⚠️ ️ ISM",
        "definition": "⚠️ ️ Entidad Gestora de la Seguridad Social en materia de las prestaciones correspondientes a los trabajadores integrados en el Régimen Especial de los Trabajadores del Mar"
      },
      {
        "concept": "⚠️ ️ Jubilación",
        "definition": "⚠️ ️ Pensión vitalicia reconocida al trabajador que, una vez alcanzada la edad legal, cesa (o ya había cesado) en el trabajo, habiendo cumplido los requisitos exigidos. Existen distintas clases o tipos de jubilación."
      },
      {
        "concept": "⚠️ ️ Jubilación anticipada",
        "definition": "⚠️ ️ Jubilación que se concede en ciertos casos antes de cumplir la edad legal que en cada caso resulte aplicable, con o sin aplicación de porcentajes de reducción de su cuantía."
      },
      {
        "concept": "Jubilación para mayores de la edad ordinaria",
        "definition": "Cuando se acceda a la pensión con posterioridad a la edad que en cada caso resulte aplicable, el trabajador podrá percibir un porcentaje adicional del 2 por 100 de la cuantía resultante, por cada año completo cotizado entre la fecha en que cumplió dicha edad y la del hecho causante,"
      },
      {
        "concept": "⚠️ ️ Jubilación parcial",
        "definition": "⚠️ ️ La iniciada después del cumplimiento de la edad exigida según los periodos cotizados en el momento del hecho causante simultánea con un contrato de trabajo a tiempo parcial y vinculada con un contrato de relevo celebrado con un trabajador en situación de desempleo o que tenga concertado con la empresa un contrato de duración determinada."
      },
      {
        "concept": "Lesiones permanentes no invalidantes",
        "definition": "Lesiones, mutilaciones y deformidades de carácter definitivo, causadas por accidentes de trabajo o enfermedades profesionales que, sin llegar a constituir una incapacidad permanente, supongan una disminución o alteración de la integridad física del trabajador y aparezcan recogidas en el baremo anejo a las disposiciones de desarrollo de la Ley General de la Seguridad Social,"
      },
      {
        "concept": "Mejoras voluntarias",
        "definition": "Aumento voluntario de las cotizaciones o de las prestaciones sociales en la forma y condiciones que autorizan las normas reglamentarias del Régimen General y de los regímenes especiales de la Seguridad Social."
      },
      {
        "concept": "⚠️ ️ Modalidad contributiva",
        "definition": "⚠️ ️ De carácter eminentemente profesional, destinada a la protección de los trabajadores cotizantes"
      },
      {
        "concept": "⚠️ ️ Modalidad no contributiva",
        "definition": "⚠️ ️ Se dirige a la protección de quienes, acreditando una situación de carencia o insuficiencia de recursos, no han cotizado nunca al Sistema de la Seguridad Social o no han cotizado lo suficiente para acceder a prestaciones del nivel contributivo"
      },
      {
        "concept": "⚠️ ️ Modelo TA. 0521",
        "definition": "⚠️ ️ Solicitud de alta / baja / variación de datos en el Régimen Especial de Autónomos"
      },
      {
        "concept": "Modelo TA.1",
        "definition": "Solicitud de Afiliación a la Seguridad Social, Asignación de número de Seguridad Social y Variación de datos"
      },
      {
        "concept": "⚠️ ️ Modelo TA.2/S",
        "definition": "⚠️ ️ Alta, Baja, Variación de datos del trabajador por cuenta Ajena"
      },
      {
        "concept": "Modelo TA.6",
        "definition": "Solicitud de inscripción en el sistema de la Seguridad Social."
      },
      {
        "concept": "⚠️ ️ Mutua",
        "definition": "⚠️ ️ Asociación voluntaria de empresas que gestionan servicios relacionados con la atención a su plantilla en caso de AT y EP. No pueden generar beneficios económicos a sus asociados."
      },
      {
        "concept": "⚠️ ️ Nacimiento y cuidado de menor",
        "definition": "⚠️ ️ Prestación que cubre las siguientes situaciones: el nacimiento, la adopción, guarda con fines de adopción y el acogimiento familiar. Estas situaciones originan el derecho a la suspensión del contrato de trabajo, así como el derecho a una prestación económica a cargo de la Seguridad Social."
      },
      {
        "concept": "⚠️ ️ Número de afiliación",
        "definition": "⚠️ ️ El nº que la Tesorería General de la Seguridad Social asigna al trabajador, sea por cuenta ajena o propia, cuando causa alta inicial en la Seguridad Social. Tiene carácter vitalicio y único para el Sistema de la Seguridad Social en todo el territorio nacional."
      },
      {
        "concept": "Orfandad",
        "definition": "Pensión que perciben los hijos del causante fallecido, cualquiera que sea la naturaleza legal de su filiación, y los aportados al matrimonio por el cónyuge sobreviviente, (si reúnen los demás requisitos exigidos), siempre que, al fallecer el causante, sean menores de veintiún años o estén incapacitados para el trabajo y que el causante se encontrase en alta o situación asimilada al alta."
      },
      {
        "concept": "Pago delegado",
        "definition": "Forma de colaboración obligatoria consistente en el pago, por delegación de la Entidad gestora, de las prestaciones correspondientes a la incapacidad temporal."
      },
      {
        "concept": "Pensión compensatoria",
        "definition": "Compensación consistente en una pensión temporal o por tiempo indefinido, o en una prestación única, según se determine en el convenio regulador o en la sentencia, que se abona al cónyuge al que la separación o el divorcio produzca un desequilibrio económico en relación con la posición del otro, que implique un empeoramiento en su situación anterior en el matrimonio."
      },
      {
        "concept": "⚠️ ️ Pensiones",
        "definition": "⚠️ ️ Prestaciones económicas de la Seguridad Social, de pago periódico y de duración normalmente vitalicia o hasta que el beneficiario alcance una edad predeterminada."
      },
      {
        "concept": "⚠️ ️ Período de carencia",
        "definition": "⚠️ ️ Periodo exigido en general, salvo excepciones, entre otros requisitos, para tener derecho a las prestaciones de la Seguridad Social."
      },
      {
        "concept": "Persona a cargo",
        "definition": "Persona que convive y depende económicamente del trabajador o beneficiario de una prestación y que puede atribuir mayor cuantía de la referida prestación (por ejemplo: complementos por mínimos en las pensiones de jubilación y viudedad)."
      },
      {
        "concept": "Pluriactividad",
        "definition": "Situación del trabajador que desarrolla su trabajo en dos o más actividades que obligan a la inclusión en distintos Regímenes de la Seguridad Social, por lo que ha de considerarse si reúne los requisitos que cada Régimen tenga establecidos."
      },
      {
        "concept": "Pluriempleo",
        "definition": "Situación del trabajador que desarrolla su actividad en dos o más empresas del mismo Régimen."
      },
      {
        "concept": "Póliza",
        "definition": "Declaración anexa de la entidad gestora y/o la entidad o entidades colaboradoras por las que opta tanto a la protección por accidentes de trabajo y enfermedades profesionales como a la cobertura de la prestación económica por IT derivada de contingencias comunes."
      },
      {
        "concept": "Prescripción",
        "definition": "Lapso de tiempo, transcurrido el cual sin interrupción válida, se extinguen los derechos y las acciones no ejercitadas."
      },
      {
        "concept": "Prestación en favor de familiares",
        "definition": "Prestación (pensión o subsidio) establecida en favor de ciertos familiares del trabajador o pensionista fallecido, que han convivido con él y bajo su dependencia económica."
      },
      {
        "concept": "Prestaciones económicas",
        "definition": "Derechos de contenido dinerario que corresponden al beneficiario cuando concurren las condiciones exigidas para su adquisición."
      },
      {
        "concept": "⚠️ ️ Primas de Accidentes de Trabajo y Enfermedades Profesionales",
        "definition": "⚠️ ️ Cuotas que deben pagar las empresas para cubrir los riesgos de accidentes de trabajo y enfermedades profesionales según su actividad. Están definidas en la CNAE, Cuadro nacional de actividades Económicas."
      },
      {
        "concept": "Prótesis",
        "definition": "Aparato o dispositivo quirúrgico u ortopédico que puede ser proporcionado como prestación sanitaria o dar lugar a la concesión de ayudas en los casos y según los baremos que reglamentariamente se establezcan."
      },
      {
        "concept": "⚠️ ️ Regímenes de la SS",
        "definition": "⚠️ ️ Establecidos para algunas actividades profesionales por su naturaleza, sus peculiares condiciones de tiempo y lugar, o por la índole de sus procesos productivos para la correcta aplicación de la acción protectora de la Seguridad Social"
      },
      {
        "concept": "⚠️ ️ Riesgo durante el embarazo",
        "definition": "⚠️ ️ Suspensión del contrato o cese en la actividad que da lugar a una prestación económica que consiste en un subsidio equivalente al 100 por 100 de la base reguladora, que será la establecida para la prestación de incapacidad temporal derivada de contingencias profesionales, para proteger la salud de la trabajadora embarazada o del feto durante el período de suspensión del contrato de trabajo"
      },
      {
        "concept": "⚠️ ️ Riesgo durante la lactancia natural",
        "definition": "⚠️ ️ Suspensión del contrato o cese en la actividad que da lugar a una prestación económica que consiste en un subsidio equivalente al 100 por 100 de la base reguladora, que será la establecida para la prestación de incapacidad temporal derivada de contingencias profesionales, para proteger la salud de la trabajadora o del hijo durante el período de suspensión del contrato de trabajo o de la actividad en los supuestos en que, debiendo la mujer trabajadora cambiar de puesto de trabajo por otro compatible con su estado, dicho cambio de puesto no resulte técnica u objetivamente posible, o no pueda razonablemente exigirse por motivos justificados. Se concede en los mismos términos y condiciones que la prestación por riesgo durante el embarazo, si bien se extinguirá cuando el hijo cumpla nueve meses"
      },
      {
        "concept": "Seguro Escolar",
        "definition": "Régimen Especial para los estudiantes que, sin embargo, no ha llegado a desarrollarse del todo. Alcanza a los matriculados en centros oficiales desde la enseñanza secundaria hasta la universitaria y, como máximo, hasta los 28 años"
      },
      {
        "concept": "⚠️ ️ SEPE",
        "definition": "⚠️ ️ Organismo Autónomo, dotado de personalidad jurídica propia para el cumplimiento de sus fines , tiene como principales competencias la gestión y el control de las prestaciones por desempleo;"

function StandaloneFlashcardsGame(config) {
    config = config || {};
    this.cards = Array.isArray(config.cards) ? config.cards : [];
    this.lives = parseInt(config.lives) || 3;
    this.cardsPerGame = parseInt(config.cardsPerGame) || Math.min(this.cards.length, 10);
    this.mode = config.mode || "concept-to-definition";
    this.shuffleCards = config.shuffleCards !== false;
    this.enableReview = config.enableReview !== false;
    this.showFeedback = config.showFeedback !== false;
    this.gameTitle = config.gameTitle || "Flashcards Interactivas";
    this.gameDescription = config.gameDescription || "Aprende y memoriza conceptos importantes";
    this.pointsPerCorrect = parseInt(config.pointsPerCorrect) || 10;
    this.pointsMultiplier = parseFloat(config.pointsMultiplier) || 1.0;
    this.state = {
        gameActive: false,
        currentLives: this.lives,
        score: 0,
        currentRound: 0,
        totalRounds: 0,
        startTime: null,
        cardsToReview: [],
        currentQuestion: null,
        answeredQuestions: 0,
        correctAnswers: 0,
        selectedCards: []
    };
    this._validateCards();
}

StandaloneFlashcardsGame.prototype._validateCards = function() {
    if (!Array.isArray(this.cards)) {
        throw new Error("Las cartas deben ser un array");
    }
    var self = this;
    this.cards = this.cards.map(function(card) {
        if (!card || typeof card !== "object") return null;
        var conceptStr = card.concept ? String(card.concept).trim() : "";
        var definitionStr = card.definition ? String(card.definition).trim() : "";
        var warningChar = "\u26A0\uFE0F";
        var isEvaluableConcept = conceptStr.indexOf(warningChar) === 0;
        var isEvaluableDefinition = definitionStr.indexOf(warningChar) === 0;
        var newCard = {
            concept: isEvaluableConcept ? conceptStr.substring(warningChar.length).trim() : conceptStr,
            definition: isEvaluableDefinition ? definitionStr.substring(warningChar.length).trim() : definitionStr,
            evaluable: isEvaluableConcept || isEvaluableDefinition
        };
        return newCard;
    }).filter(function(card) {
        return card && card.concept && card.definition;
    });
    if (this.cards.length < 4) {
        throw new Error("Se necesitan al menos 4 cartas validas. Encontradas: " + this.cards.length);
    }
};

StandaloneFlashcardsGame.prototype._shuffleArray = function(array) {
    var shuffled = array.slice();
    for (var i = shuffled.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = shuffled[i];
        shuffled[i] = shuffled[j];
        shuffled[j] = temp;
    }
    return shuffled;
};

StandaloneFlashcardsGame.prototype._getWrongOptions = function(correctAnswer, count) {
    var self = this;
    var wrong = [];
    var allCards = this.cards.filter(function(card) {
        var candidate = self.mode === "concept-to-definition" ? card.definition : card.concept;
        return candidate !== correctAnswer && candidate.trim() !== "";
    });
    var shuffledCards = this._shuffleArray(allCards.slice());
    for (var i = 0; i < shuffledCards.length; i++) {
        if (wrong.length >= count) break;
        var card = shuffledCards[i];
        var wrongAnswer = this.mode === "concept-to-definition" ? card.definition : card.concept;
        if (wrong.indexOf(wrongAnswer) === -1 && wrongAnswer !== correctAnswer) {
            wrong.push(wrongAnswer);
        }
    }
    while (wrong.length < count) {
        var genericOption = "Opcion " + (wrong.length + 1);
        if (wrong.indexOf(genericOption) === -1 && genericOption !== correctAnswer) {
            wrong.push(genericOption);
        }
    }
    return wrong.slice(0, count);
};

StandaloneFlashcardsGame.prototype._formatTime = function(ms) {
    var seconds = Math.floor(ms / 1000);
    var minutes = Math.floor(seconds / 60);
    var remainingSeconds = seconds % 60;
    if (minutes > 0) {
        return minutes + "m " + remainingSeconds + "s";
    }
    return remainingSeconds + "s";
};

StandaloneFlashcardsGame.prototype.initializeGame = function() {
    if (this.cards.length < 4) {
        throw new Error("Se necesitan al menos 4 cartas para jugar");
    }
    this.state = {
        gameActive: true,
        currentLives: this.lives,
        score: 0,
        currentRound: 0,
        totalRounds: Math.min(this.cardsPerGame, this.cards.length),
        startTime: Date.now(),
        cardsToReview: [],
        currentQuestion: null,
        answeredQuestions: 0,
        correctAnswers: 0,
        selectedCards: []
    };
    var cardsToPlay = this.cards.slice();
    if (this.shuffleCards) {
        cardsToPlay = this._shuffleArray(cardsToPlay);
    }
    this.state.selectedCards = cardsToPlay.slice(0, this.state.totalRounds);
    return this.getNextQuestion();
};

StandaloneFlashcardsGame.prototype.getNextQuestion = function() {
    if (!this.state.gameActive) {
        return null;
    }
    if (this.enableReview && this.state.cardsToReview.length > 0 && this.state.currentRound >= this.state.totalRounds) {
        if (this.state.cardsToReview.length === 0) return null;
        var card = this.state.cardsToReview.shift();
        var questionData = this._createQuestionData(card, true);
        this.state.currentQuestion = questionData;
        return questionData;
    }
    if (this.state.currentRound >= this.state.totalRounds) {
        return null;
    }
    var card = this.state.selectedCards[this.state.currentRound];
    this.state.currentRound++;
    var questionData = this._createQuestionData(card, false);
    this.state.currentQuestion = questionData;
    return questionData;
};

StandaloneFlashcardsGame.prototype._createQuestionData = function(card, isReview) {
    isReview = isReview || false;
    var isConceptToDef = this.mode === "concept-to-definition";
    var question = isConceptToDef ? card.concept : card.definition;
    var correctAnswer = isConceptToDef ? card.definition : card.concept;
    var isEvaluable = card.evaluable;
    if (isEvaluable) {
        var warningSymbol = '<span class="evaluable-symbol">\u26A0\uFE0F</span>';
        question = warningSymbol + question;
    }
    var wrongOptions = this._getWrongOptions(correctAnswer, 3);
    var allOptions = [correctAnswer].concat(wrongOptions);
    var options = this._shuffleArray(allOptions);
    var totalQuestions = this.state.totalRounds + (this.enableReview ? this.state.cardsToReview.length : 0);
    var currentProgress = this.state.currentRound + (this.state.totalRounds - this.state.cardsToReview.length);
    var progress = totalQuestions > 0 ? Math.round((currentProgress / totalQuestions) * 100) : 0;
    return {
        question: question,
        options: options,
        correctAnswer: correctAnswer,
        questionNumber: this.state.currentRound,
        totalQuestions: totalQuestions,
        progress: progress,
        isReview: isReview,
        isEvaluable: isEvaluable,
        lives: this.state.currentLives,
        score: this.state.score,
        concept: card.concept,
        definition: card.definition,
        originalCard: card
    };
};

StandaloneFlashcardsGame.prototype.checkAnswer = function(selectedAnswer) {
    if (!this.state.gameActive || !this.state.currentQuestion) {
        return { valid: false, error: "No hay pregunta activa" };
    }
    if (!this.state.currentQuestion.correctAnswer) {
        console.error("currentQuestion:", this.state.currentQuestion);
        return { valid: false, error: "Error interno" };
    }
    this.state.answeredQuestions++;
    var cleanSelectedAnswer = selectedAnswer.trim();
    var cleanCorrectAnswer = this.state.currentQuestion.correctAnswer.trim();
    var isCorrect = cleanSelectedAnswer === cleanCorrectAnswer;
    if (isCorrect) {
        this.state.correctAnswers++;
        var pointsEarned = this.pointsPerCorrect * this.pointsMultiplier;
        this.state.score += pointsEarned;
        return {
            valid: true,
            isCorrect: true,
            pointsEarned: pointsEarned,
            currentScore: this.state.score,
            livesRemaining: this.state.currentLives,
            gameOver: false
        };
    } else {
        this.state.currentLives--;
        if (this.enableReview) {
            var cardToReview = this.state.currentQuestion.originalCard || {
                concept: this.state.currentQuestion.concept,
                definition: this.state.currentQuestion.definition,
                evaluable: this.state.currentQuestion.isEvaluable
            };
            var self = this;
            var alreadyInReview = this.state.cardsToReview.some(function(card) {
                return card.concept === cardToReview.concept;
            });
            if (!alreadyInReview) {
                this.state.cardsToReview.push(cardToReview);
            }
        }
        var gameOver = this.state.currentLives <= 0;
        if (gameOver) {
            this.state.gameActive = false;
        }
        return {
            valid: true,
            isCorrect: false,
            correctAnswer: this.state.currentQuestion.correctAnswer,
            currentScore: this.state.score,
            livesRemaining: this.state.currentLives,
            gameOver: gameOver,
            addedToReview: this.enableReview
        };
    }
};

StandaloneFlashcardsGame.prototype.endGame = function() {
    this.state.gameActive = false;
    var timePlayed = Date.now() - this.state.startTime;
    var accuracy = this.state.answeredQuestions > 0 ? Math.round((this.state.correctAnswers / this.state.answeredQuestions) * 100) : 0;
    var grade, message;
    var perfectScore = this.state.totalRounds * this.pointsPerCorrect;
    var scorePercentage = perfectScore > 0 ? (this.state.score / perfectScore) * 100 : 0;
    if (scorePercentage >= 90 && this.state.currentLives === this.lives) {
        grade = "Perfecto!";
        message = "Dominaste completamente el material. Excelente trabajo!";
    } else if (scorePercentage >= 70) {
        grade = "Muy bien";
        message = "Buen rendimiento. Ya dominas la mayoria de los conceptos.";
    } else if (scorePercentage >= 50) {
        grade = "Aprobado";
        message = "Conoces los conceptos basicos. Podrias practicar un poco mas.";
    } else {
        grade = "Necesitas repasar";
        message = "Es recomendable revisar el material antes de intentarlo nuevamente.";
    }
    var scoreOutOf10 = perfectScore > 0 ? Math.min(10, Math.round((this.state.score / perfectScore) * 10)) : 0;
    return {
        finalScore: this.state.score,
        maxPossibleScore: perfectScore,
        scoreOutOf10: scoreOutOf10,
        livesRemaining: this.state.currentLives,
        totalRounds: this.state.totalRounds,
        correctAnswers: this.state.correctAnswers,
        accuracy: accuracy,
        grade: grade,
        message: message,
        timePlayed: timePlayed,
        timePlayedFormatted: this._formatTime(timePlayed),
        cardsToReview: this.state.cardsToReview.length,
        gameTitle: this.gameTitle,
        passed: scorePercentage >= 50
    };
};

StandaloneFlashcardsGame.prototype.changeMode = function(newMode) {
    var validModes = ["concept-to-definition", "definition-to-concept"];
    if (validModes.indexOf(newMode) !== -1) {
        this.mode = newMode;
        return true;
    }
    return false;
};


// FUNCIONES PRINCIPALES DEL JUEGO
var game = null;
var currentQuestion = null;
var selectedAnswer = null;
var gameActive = false;
var currentResults = null;

function escapeHTML(text) {
    if (text === null || text === undefined) return "";
    var div = document.createElement("div");
    div.textContent = String(text);
    return div.innerHTML;
}

function showMessage(message, type) {
    var messageDiv = document.createElement("div");
    messageDiv.className = "status-message " + type;
    var iconClass = "info-circle";
    if (type === "error") iconClass = "exclamation-circle";
    else if (type === "warning") iconClass = "exclamation-triangle";
    else if (type === "success") iconClass = "check-circle";
    messageDiv.innerHTML = '<i class="fas fa-' + iconClass + '"></i>' + escapeHTML(message);
    var gameContent = document.getElementById("gameContent");
    gameContent.insertBefore(messageDiv, gameContent.firstChild);
    setTimeout(function() {
        if (messageDiv.parentNode) {
            messageDiv.parentNode.removeChild(messageDiv);
        }
    }, 5000);
}

function initGame() {
    try {
        var cardsToUse = EMBEDDED_FLASHCARDS_DATA.content.cards || [];
        if (cardsToUse.length < 4) {
            showNoCardsScreen("Se necesitan al menos 4 cartas validas");
            return;
        }
        game = new StandaloneFlashcardsGame({
            cards: cardsToUse,
            mode: EMBEDDED_FLASHCARDS_DATA.config.mode || "concept-to-definition",
            cardsPerGame: EMBEDDED_FLASHCARDS_DATA.config.cardsPerGame || 10,
            enableReview: EMBEDDED_FLASHCARDS_DATA.config.enableReview !== false,
            showFeedback: EMBEDDED_FLASHCARDS_DATA.config.showFeedback !== false,
            shuffleCards: EMBEDDED_FLASHCARDS_DATA.config.shuffleCards !== false,
            gameTitle: EMBEDDED_FLASHCARDS_DATA.config.gameTitle || "Flashcards",
            gameDescription: EMBEDDED_FLASHCARDS_DATA.config.gameDescription || "",
            lives: EMBEDDED_FLASHCARDS_DATA.config.lives || 3,
            pointsPerCorrect: EMBEDDED_FLASHCARDS_DATA.config.pointsPerCorrect || 10,
            pointsMultiplier: EMBEDDED_FLASHCARDS_DATA.config.pointsMultiplier || 1.0
        });
        showStartScreen();
    } catch (error) {
        console.error("Error:", error);
        showNoCardsScreen(error.message);
    }
}

function showNoCardsScreen(message) {
    var gameContent = document.getElementById("gameContent");
    var html = "";
    html += '<div class="no-cards-screen">';
    html += '<i class="fas fa-exclamation-triangle"></i>';
    html += '<h2>Error</h2>';
    html += '<p>' + escapeHTML(message) + '</p>';
    html += '<button class="btn btn-primary" onclick="location.reload()">';
    html += '<i class="fas fa-redo"></i> Recargar';
    html += '</button>';
    html += '</div>';
    gameContent.innerHTML = html;
}

function showStartScreen() {
    var gameContent = document.getElementById("gameContent");
    var description = EMBEDDED_FLASHCARDS_DATA.config.gameDescription || "Aprende y memoriza conceptos";
    var html = "";
    html += '<div class="start-screen">';
    html += '<h2><i class="fas fa-play-circle"></i> Comenzar</h2>';
    html += '<p>' + escapeHTML(description) + '</p>';
    html += '<div class="mode-selector">';
    html += '<div class="mode-card active" data-mode="concept-to-definition" id="modeConcept">';
    html += '<i class="fas fa-question-circle"></i>';
    html += '<h3>Concepto - Definicion</h3>';
    html += '<p>Muestra concepto, elige definicion</p>';
    html += '</div>';
    html += '<div class="mode-card" data-mode="definition-to-concept" id="modeDef">';
    html += '<i class="fas fa-exchange-alt"></i>';
    html += '<h3>Definicion - Concepto</h3>';
    html += '<p>Muestra definicion, elige concepto</p>';
    html += '</div>';
    html += '</div>';
    html += '<div class="config-summary">';
    html += '<div class="summary-item">';
    html += '<i class="fas fa-layer-group"></i>';
    html += '<span>' + game.cards.length + ' cartas</span>';
    html += '</div>';
    html += '<div class="summary-item">';
    html += '<i class="fas fa-heart"></i>';
    html += '<span>' + game.lives + ' vidas</span>';
    html += '</div>';
    html += '<div class="summary-item">';
    html += '<i class="fas fa-gamepad"></i>';
    html += '<span>' + game.cardsPerGame + ' por juego</span>';
    html += '</div>';
    html += '</div>';
    html += '<div class="controls">';
    html += '<button class="btn btn-primary btn-large" id="startBtn">';
    html += '<i class="fas fa-play"></i> Comenzar';
    html += '</button>';
    html += '</div>';
    html += '</div>';
    gameContent.innerHTML = html;
    document.getElementById("modeConcept").addEventListener("click", function() {
        selectGameMode("concept-to-definition");
    });
    document.getElementById("modeDef").addEventListener("click", function() {
        selectGameMode("definition-to-concept");
    });
    document.getElementById("startBtn").addEventListener("click", startGame);
}

function selectGameMode(mode) {
    var modeCards = document.querySelectorAll(".mode-card");
    for (var i = 0; i < modeCards.length; i++) {
        modeCards[i].classList.remove("active");
    }
    document.querySelector('[data-mode="' + mode + '"]').classList.add("active");
    game.changeMode(mode);
}

function startGame() {
    gameActive = true;
    selectedAnswer = null;
    currentQuestion = game.initializeGame();
    if (!currentQuestion) {
        showNoCardsScreen("Error al iniciar");
        return;
    }
    renderQuestion(currentQuestion);
}

function renderQuestion(questionData) {
    var gameContent = document.getElementById("gameContent");
    var optionsHTML = "";
    for (var i = 0; i < questionData.options.length; i++) {
        optionsHTML += '<div class="option" data-index="' + i + '">';
        optionsHTML += '<div class="option-number">' + (i + 1) + '</div>';
        optionsHTML += '<div class="option-content">' + escapeHTML(questionData.options[i]) + '</div>';
        optionsHTML += '</div>';
    }
    var reviewNote = "";
    if (questionData.isReview) {
        reviewNote = '<div class="review-note"><i class="fas fa-redo"></i> Repaso</div>';
    }
    var html = "";
    html += '<div class="game-screen">';
    html += '<div class="progress-bar-container">';
    html += '<div class="progress-bar" style="width: ' + questionData.progress + '%"></div>';
    html += '<div class="progress-label">' + questionData.progress + '%</div>';
    html += '</div>';
    html += '<div class="question-container">';
    html += reviewNote;
    html += '<div class="question-text">' + questionData.question + '</div>';
    html += '<div class="question-hint">Pregunta ' + questionData.questionNumber + ' de ' + questionData.totalQuestions + '</div>';
    html += '</div>';
    html += '<div class="options-container" id="optionsContainer">';
    html += optionsHTML;
    html += '</div>';
    html += '<div class="controls">';
    html += '<button class="btn btn-secondary" id="menuBtn">';
    html += '<i class="fas fa-home"></i> Menu';
    html += '</button>';
    html += '<div class="keyboard-hint">Usa teclas 1-4</div>';
    html += '</div>';
    html += '</div>';
    gameContent.innerHTML = html;
    updateUI();
    var options = document.querySelectorAll(".option");
    for (var j = 0; j < options.length; j++) {
        options[j].addEventListener("click", function() {
            if (!gameActive || selectedAnswer !== null) return;
            var answer = this.querySelector(".option-content").textContent;
            selectAnswer(answer, this);
        });
    }
    document.getElementById("menuBtn").addEventListener("click", showStartScreen);
    document.removeEventListener("keydown", handleKeyboardInput);
    document.addEventListener("keydown", handleKeyboardInput);
}

function selectAnswer(answer, element) {
    if (!gameActive || selectedAnswer !== null) return;
    selectedAnswer = answer;
    var options = document.querySelectorAll(".option");
    for (var i = 0; i < options.length; i++) {
        options[i].classList.add("disabled");
        options[i].style.cursor = "not-allowed";
        options[i].classList.remove("selected");
    }
    element.classList.add("selected");
    element.classList.add("selected-answer");
    var result = game.checkAnswer(answer);
    if (result.valid) {
        showFeedback(result);
    }
}

function handleKeyboardInput(event) {
    if (!gameActive || selectedAnswer !== null) return;
    var key = event.key;
    if (key >= "1" && key <= "4") {
        var index = parseInt(key) - 1;
        var option = document.querySelector('.option[data-index="' + index + '"]');
        if (option) {
            var answer = option.querySelector(".option-content").textContent;
            selectAnswer(answer, option);
        }
    }
}

function showFeedback(result) {
    var gameScreen = document.querySelector(".game-screen");
    var optionsContainer = document.getElementById("optionsContainer");
    var feedbackHTML = "";
    if (result.isCorrect) {
        feedbackHTML = '<div class="feedback correct">';
        feedbackHTML += '<div class="feedback-header">';
        feedbackHTML += '<i class="fas fa-check-circle"></i>';
        feedbackHTML += '<span>Correcto!</span>';
        feedbackHTML += '</div>';
        feedbackHTML += '<div class="points-earned">+' + result.pointsEarned + ' puntos</div>';
        feedbackHTML += '</div>';
    } else {
        var reviewNoteHTML = "";
        if (result.addedToReview) {
            reviewNoteHTML = '<div class="review-note"><i class="fas fa-redo"></i> Agregada a repaso</div>';
        }
        feedbackHTML = '<div class="feedback incorrect">';
        feedbackHTML += '<div class="feedback-header">';
        feedbackHTML += '<i class="fas fa-times-circle"></i>';
        feedbackHTML += '<span>Incorrecto</span>';
        feedbackHTML += '</div>';
        feedbackHTML += '<div class="correct-answer">Correcta: ' + escapeHTML(result.correctAnswer) + '</div>';
        feedbackHTML += reviewNoteHTML;
        feedbackHTML += '</div>';
    }
    var feedbackDiv = document.createElement("div");
    feedbackDiv.innerHTML = feedbackHTML;
    gameScreen.insertBefore(feedbackDiv, optionsContainer.nextSibling);
    var options = document.querySelectorAll(".option");
    for (var i = 0; i < options.length; i++) {
        var optionContent = options[i].querySelector(".option-content").textContent;
        if (optionContent === result.correctAnswer) {
            options[i].classList.add("correct");
            options[i].classList.remove("selected", "selected-answer");
        } else if (options[i].classList.contains("selected")) {
            options[i].classList.add("incorrect");
        }
    }
    updateUI();
    setTimeout(function() {
        if (result.gameOver) {
            showResults();
        } else {
            nextQuestion();
        }
    }, 2000);
}

function nextQuestion() {
    selectedAnswer = null;
    currentQuestion = game.getNextQuestion();
    if (!currentQuestion) {
        showResults();
    } else {
        renderQuestion(currentQuestion);
    }
}

function updateUI() {
    var livesDisplay = document.getElementById("livesDisplay");
    if (livesDisplay && game) {
        livesDisplay.innerHTML = "";
        for (var i = 0; i < game.lives; i++) {
            var heart = document.createElement("i");
            heart.className = "fas fa-heart heart";
            heart.dataset.index = i;
            if (i >= game.state.currentLives) {
                heart.classList.add("lost");
            }
            livesDisplay.appendChild(heart);
        }
    }
    var scoreDisplay = document.getElementById("scoreDisplay");
    if (scoreDisplay && game) {
        scoreDisplay.textContent = game.state.score;
    }
    var progressDisplay = document.getElementById("progressDisplay");
    if (progressDisplay && currentQuestion) {
        progressDisplay.textContent = currentQuestion.questionNumber + "/" + currentQuestion.totalQuestions;
    }
}

function showResults() {
    gameActive = false;
    currentResults = game.endGame();
    var gameContent = document.getElementById("gameContent");
    var certificateButton = "";
    if (currentResults.passed) {
        certificateButton = '<button class="btn btn-warning" id="certificateBtn">';
        certificateButton += '<i class="fas fa-certificate"></i> Obtener Certificado';
        certificateButton += '</button>';
    }
    var html = "";

// Funcion para limpiar texto para PDF
function cleanTextForPDF(text) {
    if (!text) return "";
    var str = String(text);
    var replacements = {
        "\u00e1": "a", "\u00e9": "e", "\u00ed": "i", "\u00f3": "o", "\u00fa": "u",
        "\u00c1": "A", "\u00c9": "E", "\u00cd": "I", "\u00d3": "O", "\u00da": "U",
        "\u00f1": "n", "\u00d1": "N",
        "\u00fc": "u", "\u00dc": "U",
        "\u00bf": "", "\u00a1": "",
        "\u0060": "'", "\u00b4": "'",
        "\u00ab": "\"", "\u00bb": "\"",
        "\u201c": "\"", "\u201d": "\"",
        "\u2018": "'", "\u2019": "'"
    };
    for (var key in replacements) {
        if (replacements.hasOwnProperty(key)) {
            str = str.split(key).join(replacements[key]);
        }
    }
    var result = "";
    for (var i = 0; i < str.length; i++) {
        var charCode = str.charCodeAt(i);
        if (charCode >= 0 && charCode <= 127) {
            result += str.charAt(i);
        }
    }
    return result.replace(/  +/g, " ").trim();
}

function generateCertificate(studentName, results) {
    try {
        if (typeof window.jspdf === "undefined") {
            console.error("jsPDF no esta disponible");
            showMessage("Error: No se puede generar el certificado. La libreria PDF no esta disponible.", "error");
            return false;
        }
        var jsPDF = window.jspdf.jsPDF;
        var doc = new jsPDF({
            orientation: "landscape",
            unit: "mm",
            format: "a4",
            compress: true
        });
        var COLOR_PRIMARY = [220, 0, 106];
        var COLOR_SECONDARY = [255, 105, 180];
        var COLOR_SUCCESS = [16, 185, 129];
        var COLOR_TEXT = [55, 65, 81];
        var COLOR_LIGHT = [156, 163, 175];
        var COLOR_BACKGROUND = [255, 255, 255];
        doc.setFillColor(COLOR_BACKGROUND[0], COLOR_BACKGROUND[1], COLOR_BACKGROUND[2]);
        doc.rect(0, 0, 297, 210, "F");
        doc.setDrawColor(COLOR_PRIMARY[0], COLOR_PRIMARY[1], COLOR_PRIMARY[2]);
        doc.setLineWidth(3);
        doc.rect(15, 15, 267, 180);
        doc.setFontSize(32);
        doc.setTextColor(COLOR_PRIMARY[0], COLOR_PRIMARY[1], COLOR_PRIMARY[2]);
        doc.setFont("helvetica", "bold");
        var certificateTitle = cleanTextForPDF("CERTIFICADO DE APROVECHAMIENTO");
        doc.text(certificateTitle, 148.5, 40, { align: "center" });
        var activityTitle = cleanTextForPDF(results.gameTitle || "Actividad Educativa");
        doc.setFontSize(20);
        doc.setTextColor(COLOR_SECONDARY[0], COLOR_SECONDARY[1], COLOR_SECONDARY[2]);
        doc.setFont("helvetica", "bold");
        var titleLines = doc.splitTextToSize(activityTitle, 220);
        var titleY = 55;
        for (var t = 0; t < titleLines.length && t < 2; t++) {
            doc.text(titleLines[t], 148.5, titleY, { align: "center" });
            titleY += 9;
        }
        doc.setDrawColor(COLOR_SECONDARY[0], COLOR_SECONDARY[1], COLOR_SECONDARY[2]);
        doc.setLineWidth(1);
        doc.line(50, titleY + 5, 247, titleY + 5);
        var contentY = titleY + 18;
        doc.setFontSize(14);
        doc.setTextColor(COLOR_TEXT[0], COLOR_TEXT[1], COLOR_TEXT[2]);
        doc.setFont("helvetica", "normal");
        doc.text(cleanTextForPDF("Se otorga el presente certificado a:"), 148.5, contentY, { align: "center" });
        doc.setFontSize(26);
        doc.setTextColor(COLOR_PRIMARY[0], COLOR_PRIMARY[1], COLOR_PRIMARY[2]);
        doc.setFont("helvetica", "bold");
        var cleanStudentName = cleanTextForPDF(studentName);
        doc.text(cleanStudentName.toUpperCase(), 148.5, contentY + 18, { align: "center" });
        doc.setFontSize(14);
        doc.setTextColor(COLOR_TEXT[0], COLOR_TEXT[1], COLOR_TEXT[2]);
        doc.setFont("helvetica", "normal");
        doc.text(cleanTextForPDF("Por haber completado satisfactoriamente la actividad"), 148.5, contentY + 32, { align: "center" });
        var scoreY = contentY + 50;
        doc.setFontSize(18);
        doc.setTextColor(COLOR_SUCCESS[0], COLOR_SUCCESS[1], COLOR_SUCCESS[2]);
        doc.setFont("helvetica", "bold");
        doc.text("Puntuacion: " + results.scoreOutOf10 + " / 10", 148.5, scoreY, { align: "center" });
        if (results.passed) {
            doc.setFontSize(16);
            doc.text("Enhorabuena! Has superado esta actividad", 148.5, scoreY + 12, { align: "center" });
        }
        var detailsY = scoreY + 30;
        doc.setFontSize(11);
        doc.setTextColor(COLOR_LIGHT[0], COLOR_LIGHT[1], COLOR_LIGHT[2]);
        doc.setFont("helvetica", "normal");
        var today = new Date();
        var formattedDate = today.toLocaleDateString("es-ES", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        });
        doc.text("Fecha: " + formattedDate, 50, detailsY);
        doc.text("Aciertos: " + results.correctAnswers + "/" + results.totalRounds, 247, detailsY, { align: "right" });
        doc.text("Precision: " + results.accuracy + "%", 50, detailsY + 7);
        doc.text("Tiempo: " + results.timePlayedFormatted, 247, detailsY + 7, { align: "right" });
        var certificateId = "FLASH-" + Date.now().toString(36).toUpperCase() + "-" + Math.random().toString(36).substr(2, 4).toUpperCase();
        doc.setFontSize(9);
        doc.text("Certificado generado automaticamente - Actividad Interactiva de FOL | ID: " + certificateId, 148.5, detailsY + 18, { align: "center" });
        var cleanFileName = cleanStudentName.toLowerCase().replace(/ +/g, "-").replace(/[^a-z0-9-]/g, "");
        var fileName = "certificado-" + cleanFileName + ".pdf";
        doc.save(fileName);
        return true;
    } catch (error) {
        console.error("Error al generar certificado:", error);
        showMessage("Error al generar el certificado: " + error.message, "error");
        return false;
    }
}
