stion small{color:var(--muted);font-weight:750}.question h3{margin:13px 0 0;font-size:27px;line-height:1.38}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.option{position:relative;min-height:90px;padding:20px 16px 16px 48px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-weight:700;text-align:left}.option:hover:not(:disabled){border-color:var(--p);transform:translateY(-2px)}.option:before{content:attr(data-key);position:absolute;left:13px;top:13px;display:grid;place-items:center;width:25px;height:25px;border-radius:50%;color:var(--p);background:#eef2ff;font-size:11px}.option.correct{color:#065f46;border-color:var(--ok);background:#d1fae5}.option.incorrect{color:#7f1d1d;border-color:var(--bad);background:#fee2e2}.feedback{margin-top:14px;padding:14px;border-radius:12px;text-align:center;font-weight:800}.feedback.ok{color:#065f46;background:#d1fae5}.feedback.bad{color:#7f1d1d;background:#fee2e2}.result-score{font-size:72px;font-weight:900;line-height:1;color:var(--p);margin:25px 0 8px}.result-grade{font-size:22px;font-weight:850}.certificate-box{margin-top:24px;padding:20px;border:2px solid #fcd34d;border-radius:17px;background:linear-gradient(135deg,#fffbeb,#fff)}.certificate-box input{width:min(450px,100%);padding:12px;border:1px solid #d6b661;border-radius:10px}.diploma-page{padding:38px;border:8px double var(--p);border-radius:7px;background:#fff;text-align:center}.diploma-page .seal{font-size:50px}.diploma-page h2{font-size:34px}.diploma-name{margin:26px 0 8px;color:var(--p);font:900 33px Georgia,serif}.diploma-line{width:70%;height:2px;margin:8px auto 22px;background:var(--a)}.toast{position:fixed;right:18px;bottom:18px;z-index:10;max-width:360px;padding:13px 16px;border-radius:11px;color:#fff;background:#334155;box-shadow:0 14px 35px rgba(0,0,0,.25)}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:720px){body{padding:7px}.app{border-radius:16px;min-height:96vh}.head{align-items:flex-start;flex-direction:column}.content{padding:20px 14px}.mode-grid,.options,.direction-grid{grid-template-columns:1fr}.flip-wrap{height:280px}.face strong{font-size:23px}.review-results{grid-template-columns:1fr}.stats{max-width:100%}h2{font-size:27px}.question h3{font-size:22px}}@media print{body{padding:0;background:#fff}.app>header,.diploma-controls{display:none!important}.app{box-shadow:none;border:0}.content{padding:0}.screen:not(.printable){display:none}.diploma-page{min-height:190mm;display:flex;flex-direction:column;justify-content:center}.toast{display:none}}

<script>
(function(){'use strict';var DATA={"id":"qsu-mu3uc5zw-yf9p3n","cards":[{"id":1,"concept":"Absorción y compensación del salario","definition":"Práctica que permite compensar las subidas salariales fijadas en convenio con otras cantidades que el empresario paga voluntariamente al trabajador en nómina","featured":true},{"id":2,"concept":"Accidente de trabajo in itínere","definition":"Accidente que sufre el trabajador al ir o al volver del trabajo","featured":false},{"id":3,"concept":"Arbitraje","definition":"Sistema de solución extrajudicial donde un árbitro toma una decisión vinculante para ambas partes en conflicto, conocida como laudo arbitral","featured":true},{"id":4,"concept":"Asamblea de trabajadores","definition":"Reunión de los trabajadores de una misma empresa o centro de trabajo que se realiza fuera de las horas de trabajo, salvo acuerdo con el empresario","featured":true},{"id":5,"concept":"Base de cotización","definition":"Cantidad de la nómina por la que se debe cotizar a la Seguridad Social para tener derecho a las prestaciones del sistema","featured":true},{"id":6,"concept":"Bonificaciones a la contratación","definition":"Reducciones en las cotizaciones sociales que el Gobierno ofrece para incentivar la contratación de determinados colectivos o tipos de contratos","featured":false},{"id":7,"concept":"CEPYME","definition":"Confederación Española de la Pequeña y Mediana Empresa, organización empresarial más representativa a nivel estatal junto con CEOE","featured":true},{"id":8,"concept":"CEOE","definition":"Confederación Española de Organizaciones Empresariales, organización empresarial más representativa a nivel estatal","featured":true},{"id":9,"concept":"Cierre patronal","definition":"Medida utilizada por la empresa que consiste en cerrar el centro de trabajo para impedir el acceso a los trabajadores en casos de ocupación violenta o huelga abusiva","featured":true},{"id":10,"concept":"Complementos extrasalariales","definition":"Retribuciones no salariales que compensan gastos que tienen los trabajadores por realizar el trabajo, como transporte, dietas o locomoción","featured":true},{"id":11,"concept":"Complementos salariales","definition":"Retribuciones que se añaden al salario base en función de características personales del trabajador, del puesto de trabajo o del rendimiento","featured":true},{"id":12,"concept":"Comité de empresa","definition":"Órgano de representación colegiado de los trabajadores en las empresas o centros de trabajo con 50 o más trabajadores","featured":true},{"id":13,"concept":"Comité de empresa europeo","definition":"Órgano que se puede crear en empresas con centros en distintos países europeos, con funciones de información y consulta","featured":false},{"id":14,"concept":"Comité intercentros","definition":"Órgano formado por máximo trece miembros designados de entre los componentes de los comités de los distintos centros de trabajo de una empresa","featured":false},{"id":15,"concept":"Conciliación","definition":"Sistema de solución extrajudicial donde un conciliador intenta que las partes alcancen un acuerdo mutuo sin proponer soluciones específicas","featured":true},{"id":16,"concept":"Contrato de formación en alternancia","definition":"Contrato donde se alterna la actividad laboral retribuida con la formación universitaria o de FP, para personas sin la titulación correspondiente","featured":true},{"id":17,"concept":"Contrato de jubilación parcial","definition":"Contrato donde un trabajador a tiempo completo que puede acceder a la pensión convierte su contrato en parcial, pasando a cobrar una jubilación parcial","featured":true},{"id":18,"concept":"Contrato de relevo","definition":"Contrato para sustituir la jornada que reduce un trabajador que se jubila parcialmente, pudiendo ser a tiempo parcial o completo","featured":true},{"id":19,"concept":"Contrato de trabajo","definition":"Acuerdo entre trabajador y empresario donde se establecen las condiciones laborales, requiriendo consentimiento, objeto lícito y causa válida","featured":true},{"id":20,"concept":"Contrato fijo discontinuo","definition":"Contrato indefinido para trabajos estacionales, de temporada o intermitentes que requieren llamamiento del trabajador cuando se reanuda la actividad","featured":true},{"id":21,"concept":"Contrato indefinido","definition":"Contrato sin fecha de finalización que puede realizarse con cualquier empresa y trabajador, tanto a tiempo completo como parcial","featured":true},{"id":22,"concept":"Contrato para circunstancias de la producción","definition":"Contrato temporal para cubrir incrementos ocasionales e imprevisibles de la actividad o desajustes temporales entre empleo disponible y necesario","featured":true},{"id":23,"concept":"Contrato para la obtención de la práctica profesional","definition":"Contrato para realizar trabajo retribuido que facilite la práctica profesional de una titulación, dentro de los 3 años siguientes a terminar los estudios","featured":true},{"id":24,"concept":"Contrato para sustitución","definition":"Contrato temporal para sustituir a un trabajador con reserva de puesto, completar jornada reducida o cubrir proceso de selección de vacante","featured":true},{"id":25,"concept":"Contrato temporal","definition":"Contrato con fecha de finalización determinada, pudiendo ser por circunstancias de la producción o por sustitución de persona trabajadora","featured":true},{"id":26,"concept":"Crédito horario","definition":"Horas retribuidas dentro de la jornada laboral que tienen los representantes de los trabajadores para realizar sus funciones sindicales","featured":true},{"id":27,"concept":"Cuota de Seguridad Social","definition":"Resultado de aplicar el tipo de cotización a la base de cotización, que se debe ingresar en la Tesorería General","featured":true},{"id":28,"concept":"Delegados de personal","definition":"Representantes de los trabajadores en empresas o centros de trabajo con más de 10 y menos de 50 trabajadores","featured":false},{"id":29,"concept":"Delegados sindicales","definition":"Representantes del sindicato dentro de la empresa elegidos por los afiliados, con derecho a asistir a reuniones del comité con voz pero sin voto","featured":false},{"id":30,"concept":"Descuelgue salarial","definition":"Cláusula que permite a las empresas no aplicar las subidas salariales previstas en el convenio colectivo en caso de pérdidas económicas","featured":true},{"id":31,"concept":"Desplazamiento temporal","definition":"Cambio de centro de trabajo que no supera el año en un periodo de 3 años, requiriendo preaviso mínimo de 5 días si supera 3 meses","featured":true},{"id":32,"concept":"Despido colectivo","definition":"Despido por razones económicas, técnicas, organizativas o de producción que afecta a un número determinado de trabajadores en 90 días","featured":true},{"id":33,"concept":"Despido disciplinario","definition":"Extinción del contrato basada en incumplimiento grave y culpable del trabajador, sin derecho a indemnización si es procedente","featured":true},{"id":34,"concept":"Despido improcedente","definition":"Despido donde no queda acreditado el incumplimiento del trabajador o falta la carta de despido, con indemnización de 33 días por año","featured":true},{"id":35,"concept":"Despido nulo","definition":"Despido por discriminación, violación de derechos fundamentales o motivos protegidos, obligando a la readmisión del trabajador y pago de salarios de tramitación","featured":true},{"id":36,"concept":"Despido por causas objetivas","definition":"Extinción del contrato por ineptitud, falta de adaptación, finalización de contrata o amortización de puestos, con indemnización de 20 días por año","featured":true},{"id":37,"concept":"Despido procedente","definition":"Extinción del contrato donde existe causa justificada que ha quedado acreditada en juicio, sin indemnización para el trabajador","featured":true},{"id":38,"concept":"Dimisión","definition":"Decisión voluntaria del trabajador de finalizar el contrato avisando con antelación según convenio, sin derecho a indemnización","featured":true},{"id":39,"concept":"Distribución irregular de jornada","definition":"Sistema donde la empresa puede distribuir hasta el 10% de las horas anuales aumentando jornada en determinadas épocas y compensando con descanso en otras","featured":true},{"id":40,"concept":"Empresas de trabajo temporal","definition":"Empresas cuya actividad consiste en poner a disposición de otra empresa trabajadores por ella contratados con carácter temporal","featured":true},{"id":41,"concept":"ERE","definition":"Expediente de Regulación de Empleo, procedimiento para despido colectivo que requiere periodo de consultas con representantes y comunicación a Autoridad Laboral","featured":true},{"id":42,"concept":"ERTE","definition":"Expediente de Regulación Temporal de Empleo que suspende temporalmente los contratos por causas objetivas o fuerza mayor, cobrando trabajadores prestación por desempleo","featured":true},{"id":43,"concept":"Excedencia","definition":"Suspensión temporal de la relación laboral donde el trabajador deja de prestar servicios conservando el vínculo laboral y en ciertos casos la reserva de puesto","featured":true},{"id":44,"concept":"Excedencia forzosa","definition":"Suspensión del contrato cuando el trabajador es elegido para cargo público o sindical que imposibilite la asistencia al trabajo","featured":true},{"id":45,"concept":"Excedencia por cuidado de familiares","definition":"Suspensión del contrato de máximo 2 años para cuidar familiar hasta 2º grado que no pueda valerse por sí mismo, con reserva de puesto el primer año","featured":true},{"id":46,"concept":"Excedencia por cuidado de hijos","definition":"Suspensión del contrato para cuidar menores de 3 años, con reserva de puesto el primer año y de grupo profesional el segundo y tercero","featured":true},{"id":47,"concept":"Excedencia voluntaria","definition":"Suspensión del contrato solicitada por el trabajador con al menos un año de antigüedad, sin reserva de puesto pero con preferencia de reingreso","featured":true},{"id":48,"concept":"Finiquito","definition":"Cantidad de dinero que una empresa debe pagar a un empleado cuando finaliza la relación laboral, incluyendo salario pendiente, vacaciones e indemnización en su caso","featured":true},{"id":49,"concept":"FOGASA","definition":"Fondo de Garantía Salarial, organismo autónomo que garantiza parcialmente a los trabajadores salarios e indemnizaciones pendientes en caso de insolvencia empresarial","featured":true},{"id":50,"concept":"Grupo profesional","definition":"Agrupación de aptitudes profesionales y titulaciones por su semejanza, formado por varias categorías profesionales","featured":false},{"id":51,"concept":"Horas complementarias","definition":"Horas adicionales en contratos a tiempo parcial hasta el 30% de la jornada pactada, ampliable por convenio hasta el 60%","featured":true},{"id":52,"concept":"Horas extraordinarias","definition":"Cada hora de trabajo efectivo que se realiza sobrepasando la duración máxima de la jornada ordinaria, con límite de 80 al año","featured":true},{"id":53,"concept":"Huelga","definition":"Derecho fundamental que consiste en la suspensión de la prestación laboral para defender intereses de los trabajadores","featured":true},{"id":54,"concept":"Huelga abusiva","definition":"Huelga ilegal por su modalidad, incluyendo las rotatorias, estratégicas, de celo o a la japonesa","featured":false},{"id":55,"concept":"Incapacidad temporal","definition":"Situación de baja laboral donde el trabajador suspende su contrato cobrando prestación por enfermedad o accidente","featured":false},{"id":56,"concept":"Indemnización por despido","definition":"Cantidad económica que recibe el trabajador cuando finaliza su contrato por decisión empresarial, variando según el tipo de despido","featured":true},{"id":57,"concept":"IRPF","definition":"Impuesto sobre la Renta de las Personas Físicas, tributo que se retiene mensualmente de la nómina como anticipo a cuenta de la declaración anual","featured":false},{"id":58,"concept":"Jornada laboral","definition":"Tiempo diario, semanal o anual que un trabajador dedica a la ejecución de su actividad laboral, con máximo de 40 horas semanales","featured":true},{"id":59,"concept":"Ley Rider","definition":"Ley 12/2021 que establece la presunción de laboralidad para trabajadores de plataformas digitales de reparto a domicilio","featured":false},{"id":60,"concept":"Libertad sindical","definition":"Derecho fundamental de los trabajadores a afiliarse o no a un sindicato, reconocido en la Constitución desde 1978","featured":true},{"id":61,"concept":"Llamamiento","definition":"Comunicación obligatoria del empresario al trabajador fijo discontinuo cuando se reanuda la actividad estacional o intermitente","featured":false},{"id":62,"concept":"Mediación","definition":"Sistema de solución extrajudicial de conflictos, donde el mediador propone soluciones intentando lograr un acuerdo satisfactorio para ambas partes","featured":true},{"id":63,"concept":"Mecanismo de equidad intergeneracional","definition":"Cotización adicional de un pequeño porcentaje que se incrementa cada año, para el sostenimiento del sistema de pensiones","featured":false},{"id":64,"concept":"Modificación funcional","definition":"Cambio del puesto de trabajo del trabajador dentro o fuera de su grupo profesional por causas organizativas o técnicas","featured":true},{"id":65,"concept":"Modificación geográfica","definition":"Cambio de centro de trabajo que conlleva cambio de residencia, pudiendo ser traslado definitivo o desplazamiento temporal, en función de su duración.","featured":true},{"id":66,"concept":"Modificación sustancial de condiciones de trabajo","definition":"Cambio de jornada, horario, turnos, retribución, sistema de trabajo o grupo profesional que requiere justificación y preaviso de 15 días","featured":true},{"id":67,"concept":"Movilidad funcional","definition":"Capacidad de la empresa de cambiar al trabajador de puesto dentro del grupo profesional o temporalmente fuera de él","featured":true},{"id":68,"concept":"Negociación colectiva","definition":"Proceso de negociación entre representantes de trabajadores y empresarios para establecer condiciones laborales mediante convenios","featured":true},{"id":69,"concept":"Nómina","definition":"Documento donde figura el salario bruto del trabajador, las deducciones por Seguridad Social e IRPF, y el líquido a percibir (Recibo de Salarios)","featured":true},{"id":70,"concept":"Pagas extraordinarias","definition":"Retribuciones extraordinarias que se abonan mínimo dos veces al año y que siempre cotizan a la Seguridad Social de forma prorrateada","featured":true},{"id":71,"concept":"Permisos retribuidos","definition":"Ausencias del trabajo por causas establecidas en la ley que el empresario debe retribuir, como matrimonio, fallecimiento de familiar o traslado de domicilio","featured":true},{"id":72,"concept":"Periodo de prueba","definition":"Tiempo pactado en el contrato donde trabajador y empresario comprueban si la contratación les resulta conveniente, con posibilidad de finalización sin indemnización","featured":true},{"id":73,"concept":"Plan de igualdad","definition":"Conjunto de medidas para alcanzar la igualdad de trato y oportunidades entre mujeres y hombres, obligatorio para empresas de más de 50 trabajadores","featured":true},{"id":74,"concept":"Prestación por nacimiento y cuidado de menor","definition":"Suspensión del contrato de 19 semanas para ambos progenitores, siendo 6 obligatorias tras el parto, cobrando el 100% de la base de cotización","featured":false},{"id":75,"concept":"Reducción de jornada","definition":"Disminución de las horas de trabajo por cuidado de familiares, lactancia o víctima de violencia de género, con reducción proporcional de salario","featured":false},{"id":76,"concept":"Representación sindical","definition":"Sistema de participación de trabajadores afiliados a un sindi function renderQuestion(){var q=app.quiz;if(q.index>=q.deck.length||q.lives<=0){finishQuiz();return}q.locked=false;q.current=makeQuestion(q.deck[q.index]);var x=q.current,pct=Math.round(q.index/q.deck.length*100),label=x.direction==='concept-to-definition'?'Elige la definición correcta':'Elige el concepto correcto';setScreen('quiz-question','<section class="screen"><div class="progress"><span style="width:'+pct+'%"></span></div><div class="question">'+(x.card.featured?'<div class="featured">★ Término evaluable</div>':'')+'<small>'+label+' · Pregunta '+(q.index+1)+' de '+q.deck.length+'</small><h3>'+esc(x.question)+'</h3></div><div class="options">'+x.options.map(function(o,i){return'<button class="option" data-index="'+i+'" data-key="'+(i+1)+'">'+esc(o)+'</button>'}).join('')+'</div><div id="feedback"></div></section>');quizStats();document.querySelectorAll('.option').forEach(function(b){b.onclick=function(){answerQuiz(parseInt(b.dataset.index,10))}})}
function answerQuiz(index){var q=app.quiz;if(q.locked)return;q.locked=true;q.answered++;var x=q.current,ok=index===x.correctIndex;if(ok){q.correct++;beep(880)}else{q.lives--;beep(190)}document.querySelectorAll('.option').forEach(function(b){var i=parseInt(b.dataset.index,10);b.disabled=true;if(i===x.correctIndex)b.classList.add('correct');else if(i===index)b.classList.add('incorrect')});quizStats();var f=document.getElementById('feedback');if(cfg.quizFeedback)f.innerHTML='<div class="feedback '+(ok?'ok':'bad')+'">'+(ok?'✓ Correcto':'✗ Incorrecto. Respuesta correcta: '+esc(x.correct))+'</div>';app.transition=setTimeout(function(){q.index++;renderQuestion()},cfg.quizFeedback?1450:650)}
function finishQuiz(){var q=app.quiz,total=q.deck.length,percent=Math.round(q.correct/total*100),grade=Math.round(q.correct/total*100)/10,passed=percent>=cfg.passPercent,res={correct:q.correct,total:total,percent:percent,grade:grade,time:elapsed(q.start),passed:passed,id:'QSU-'+Date.now().toString(36).toUpperCase()};app.results=res;setStats('<span class="stat">Resultado: '+grade+'/10</span>');var cert=passed&&cfg.diploma?'<div class="certificate-box"><h3>🎓 Generar diploma</h3><p>Escribe tu nombre y apellidos tal como deben aparecer.</p><input id="studentName" placeholder="Nombre y apellidos" autocomplete="name"><div class="btns"><button class="btn warning" id="pdfBtn">Descargar diploma PDF</button><button class="btn secondary" id="printBtn">Ver / imprimir diploma</button></div></div>':'';setScreen('quiz-results','<section class="screen center"><span class="eyebrow">'+(passed?'✓ Actividad superada':'↻ Sigue practicando')+'</span><div class="result-score">'+grade+'<small style="font-size:25px">/10</small></div><div class="result-grade">'+(passed?'¡Enhorabuena!':'Aún no has alcanzado el '+cfg.passPercent+'%')+'</div><p class="lead">Has acertado '+q.correct+' de '+total+' preguntas ('+percent+'%) en '+res.time+'.</p><div class="review-results"><div class="metric"><b>'+q.correct+'/'+total+'</b><span>Aciertos</span></div><div class="metric"><b>'+percent+'%</b><span>Precisión</span></div><div class="metric"><b>'+q.lives+'</b><span>Vidas restantes</span></div></div>'+cert+'<div class="btns"><button class="btn primary" id="retryQuiz">Intentar de nuevo</button><button class="btn secondary" id="quizMenu">Volver</button></div></section>');document.getElementById('retryQuiz').onclick=startQuiz;document.getElementById('quizMenu').onclick=goHome;if(passed&&cfg.diploma){document.getElementById('pdfBtn').onclick=function(){certificate(false)};document.getElementById('printBtn').onclick=function(){certificate(true)}}}
function certName(){var el=document.getElementById('studentName'),name=el?el.value.trim():'';if(name.length<3){notify('Escribe el nombre completo para el diploma');if(el)el.focus();return''}return name}function rgb(hex){hex=String(hex).replace('#','');if(hex.length===3)hex=hex.split('').map(function(x){return x+x}).join('');return[parseInt(hex.slice(0,2),16)||0,parseInt(hex.slice(2,4),16)||0,parseInt(hex.slice(4,6),16)||0]}function ascii(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^ -~]/g,'')}function fileName(s){return ascii(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'alumno'}
function certificate(printOnly){var name=certName(),r=app.results;if(!name)return;if(printOnly||!window.jspdf){showPrintable(name,r);if(!printOnly)notify('La biblioteca PDF no está disponible; usa Imprimir → Guardar como PDF');return}try{var jsPDF=window.jspdf.jsPDF,doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'}),p=rgb(cfg.colors.primary),a=rgb(cfg.colors.accent),ok=rgb(cfg.colors.success);doc.setFillColor(255,255,255);doc.rect(0,0,297,210,'F');doc.setDrawColor(p[0],p[1],p[2]);doc.setLineWidth(3);doc.rect(14,14,269,182);doc.setLineWidth(.7);doc.rect(19,19,259,172);doc.setFont('helvetica','bold');doc.setTextColor(p[0],p[1],p[2]);doc.setFontSize(30);doc.text('DIPLOMA DE APROVECHAMIENTO',148.5,39,{align:'center'});doc.setTextColor(a[0],a[1],a[2]);doc.setFontSize(19);doc.text(doc.splitTextToSize(ascii(cfg.title),220),148.5,55,{align:'center'});doc.setTextColor(55,65,81);doc.setFont('helvetica','normal');doc.setFontSize(14);doc.text('Se concede el presente diploma a',148.5,82,{align:'center'});doc.setFont('helvetica','bold');doc.setTextColor(p[0],p[1],p[2]);doc.setFontSize(27);doc.text(ascii(name).toUpperCase(),148.5,103,{align:'center'});doc.setDrawColor(a[0],a[1],a[2]);doc.line(55,109,242,109);doc.setFont('helvetica','normal');doc.setTextColor(55,65,81);doc.setFontSize(13);doc.text('por haber superado satisfactoriamente la actividad',148.5,122,{align:'center'});doc.setFont('helvetica','bold');doc.setTextColor(ok[0],ok[1],ok[2]);doc.setFontSize(20);doc.text('Calificacion: '+r.grade+' / 10',148.5,139,{align:'center'});doc.setFont('helvetica','normal');doc.setTextColor(100,116,139);doc.setFontSize(10);doc.text('Aciertos: '+r.correct+'/'+r.total+'   |   Precision: '+r.percent+'%   |   Tiempo: '+r.time,148.5,153,{align:'center'});doc.text('Fecha: '+new Date().toLocaleDateString('es-ES')+'   |   Materia: '+ascii(cfg.subject)+'   |   ID: '+r.id,148.5,169,{align:'center'});doc.save('diploma-'+fileName(name)+'.pdf');notify('Diploma descargado')}catch(e){notify('No se pudo crear el PDF: '+e.message);showPrintable(name,r)}}
function showPrintable(name,r){setStats('');setScreen('diploma','<section class="screen printable"><div class="diploma-page"><div class="seal">🎓</div><h2>DIPLOMA DE APROVECHAMIENTO</h2><h3>'+esc(cfg.title)+'</h3><p>Se concede el presente diploma a</p><div class="diploma-name">'+esc(name.toUpperCase())+'</div><div class="diploma-line"></div><p>por haber superado satisfactoriamente la actividad</p><h3 style="color:var(--ok)">Calificación: '+r.grade+' / 10</h3><p>Aciertos: '+r.correct+'/'+r.total+' · Precisión: '+r.percent+'% · Tiempo: '+r.time+'</p><p><small>'+new Date().toLocaleDateString('es-ES')+' · '+esc(cfg.subject)+' · ID: '+r.id+'</small></p></div><div class="btns diploma-controls"><button class="btn primary" id="doPrint">Imprimir / Guardar como PDF</button><button class="btn secondary" id="backResults">Volver a resultados</button></div></section>');document.getElementById('doPrint').onclick=function(){window.print()};document.getElementById('backResults').onclick=finishQuiz}
document.addEventListener('keydown',function(e){if(app.screen==='quiz-question'&&!app.quiz.locked&&/^[1-4]$/.test(e.key))answerQuiz(parseInt(e.key,10)-1);if(app.screen==='review-card'&&(e.key===' '||e.key==='Enter')){e.preventDefault();flipReview()}});window.addEventListener('beforeunload',function(){if(app.screen==='review-card')saveReviewProgress()});document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'&&app.screen==='review-card')saveReviewProgress()});function init(){if(!cards.length){setScreen('home','<section class="screen center"><h2>No hay fichas disponibles</h2></section>');return}if(cfg.outputMode==='both'){if(cfg.startMode==='review')showReviewStart();else if(cfg.startMode==='quiz'&&cards.length>=4)showQuizStart();else showHome(true)}else showHome(false)}init()})();
</script></body></html>
