<style>
*{box-sizing:border-box}:root{--p:#e50052;--a:#ec4899;--front:#ffffff;--back:#f8fafc;--ok:#10b981;--bad:#ef4444;--warn:#f59e0b;--ink:#172033;--muted:#64748b;--line:#dbe3ef}body{margin:0;min-height:100vh;padding:22px;font-family:Inter,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 12% 8%,color-mix(in srgb,var(--p) 30%,transparent),transparent 31%),radial-gradient(circle at 90% 8%,color-mix(in srgb,var(--a) 22%,transparent),transparent 28%),linear-gradient(135deg,#0f172a,color-mix(in srgb,var(--p) 42%,#111827),#111827);display:grid;place-items:center}.app{width:min(1100px,100%);min-height:650px;overflow:hidden;border:1px solid rgba(255,255,255,.25);border-radius:25px;background:#fff;box-shadow:0 35px 100px rgba(0,0,0,.38)}header{position:relative;padding:24px 28px;color:#fff;background:linear-gradient(135deg,var(--p),color-mix(in srgb,var(--p) 62%,#111827));overflow:hidden}header:after{content:"";position:absolute;width:230px;height:230px;right:-65px;top:-115px;border-radius:50%;background:rgba(255,255,255,.13)}.head{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:15px}.head h1{margin:0;font-size:27px;letter-spacing:-.035em}.head p{margin:5px 0 0;font-size:13px;opacity:.85}.head-actions{display:flex;align-items:center;gap:10px}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{padding:8px 11px;border:1px solid rgba(255,255,255,.22);border-radius:11px;background:rgba(15,23,42,.17);font-size:12px;font-weight:750}.home-btn{border:1px solid rgba(255,255,255,.28);border-radius:10px;padding:8px 11px;color:#fff;background:rgba(255,255,255,.12);font-weight:750}.content{min-height:505px;padding:30px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#f8fafc,#fff)}.screen{width:min(850px,100%);animation:enter .3s ease-out}.center{text-align:center}.eyebrow{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;color:var(--p);background:color-mix(in srgb,var(--p) 10%,white);font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.08em}h2{margin:15px 0 8px;color:var(--p);font-size:32px;letter-spacing:-.04em}.lead{margin:0 auto 24px;max-width:680px;color:var(--muted);font-size:17px;line-height:1.55}.mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:28px 0}.mode-card{padding:25px;border:1px solid var(--line);border-radius:18px;background:#fff;text-align:left;box-shadow:0 12px 30px rgba(15,23,42,.07);transition:.2s}.mode-card:hover:not(:disabled){transform:translateY(-4px);border-color:var(--p);box-shadow:0 18px 38px color-mix(in srgb,var(--p) 17%,transparent)}.mode-card .icon{font-size:38px}.mode-card h3{margin:12px 0 5px;font-size:21px}.mode-card p{margin:0;color:var(--muted);line-height:1.5}.mode-card:disabled{opacity:.5;cursor:not-allowed}.summary{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:20px 0}.chip{padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:12px;font-weight:750}.btns{display:flex;justify-content:center;gap:11px;flex-wrap:wrap;margin-top:24px}.btn{border:0;border-radius:11px;padding:12px 20px;font-weight:800;transition:.2s}.btn:hover:not(:disabled){transform:translateY(-2px)}.btn:disabled{opacity:.45}.primary{color:#fff;background:linear-gradient(135deg,var(--p),var(--a));box-shadow:0 10px 24px color-mix(in srgb,var(--p) 28%,transparent)}.secondary{color:#334155;background:#fff;border:1px solid var(--line)}.success{color:#fff;background:var(--ok)}.warning{color:#fff;background:var(--warn)}.danger{color:#fff;background:var(--bad)}.progress{height:12px;margin-bottom:22px;border-radius:999px;background:#e2e8f0;overflow:hidden}.progress span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--p),var(--a));transition:width .35s}.featured{display:inline-flex;padding:6px 10px;margin-bottom:10px;border-radius:999px;color:#92400e;background:#fef3c7;border:1px solid #fcd34d;font-size:11px;font-weight:850}.flip-wrap{width:min(580px,100%);height:320px;margin:12px auto 20px;perspective:1200px}.flashcard{position:relative;width:100%;height:100%;border:0;background:transparent;transform-style:preserve-3d;transition:transform .55s}.flashcard.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;border:3px solid var(--p);border-radius:20px;backface-visibility:hidden;box-shadow:0 22px 45px rgba(15,23,42,.14)}.front{background:var(--front)}.back{background:var(--back);border-color:var(--ok);transform:rotateY(180deg)}.face small{text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:850}.face strong{display:block;max-height:210px;overflow:auto;margin:18px 0;font-size:29px;line-height:1.35}.face em{color:var(--muted);font-size:12px}.review-actions{display:flex;justify-content:center;gap:11px;flex-wrap:wrap}.review-results{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:25px 0}.metric{padding:18px;border:1px solid var(--line);border-radius:15px;background:#fff;text-align:center}.metric b{display:block;color:var(--p);font-size:29px}.metric span{color:var(--muted);font-size:11px;text-transform:uppercase}.difficult-list{max-height:240px;overflow:auto;margin:18px 0;padding:14px;border:1px solid #fcd34d;border-radius:14px;background:#fffbeb;text-align:left}.difficult-list div{padding:9px;border-bottom:1px solid #fde68a}.difficult-list div:last-child{border:0}.direction-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:20px 0}.direction{padding:18px;border:2px solid var(--line);border-radius:14px;background:#fff}.direction.active{border-color:var(--p);background:color-mix(in srgb,var(--p) 8%,white)}.question{padding:28px;margin-bottom:19px;border:1px solid var(--line);border-radius:18px;background:#fff;text-align:center;box-shadow:0 12px 30px rgba(15,23,42,.07)}.question small{color:var(--muted);font-weight:750}.question h3{margin:13px 0 0;font-size:27px;line-height:1.38}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.option{position:relative;min-height:90px;padding:20px 16px 16px 48px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-weight:700;text-align:left}.option:hover:not(:disabled){border-color:var(--p);transform:translateY(-2px)}.option:before{content:attr(data-key);position:absolute;left:13px;top:13px;display:grid;place-items:center;width:25px;height:25px;border-radius:50%;color:var(--p);background:#eef2ff;font-size:11px}.option.correct{color:#065f46;border-color:var(--ok);background:#d1fae5}.option.incorrect{color:#7f1d1d;border-color:var(--bad);background:#fee2e2}.feedback{margin-top:14px;padding:14px;border-radius:12px;text-align:center;font-weight:800}.feedback.ok{color:#065f46;background:#d1fae5}.feedback.bad{color:#7f1d1d;background:#fee2e2}.result-score{font-size:72px;font-weight:900;line-height:1;color:var(--p);margin:25px 0 8px}.result-grade{font-size:22px;font-weight:850}.certificate-box{margin-top:24px;padding:20px;border:2px solid #fcd34d;border-radius:17px;background:linear-gradient(135deg,#fffbeb,#fff)}.certificate-box input{width:min(450px,100%);padding:12px;border:1px solid #d6b661;border-radius:10px}.diploma-page{padding:38px;border:8px double var(--p);border-radius:7px;background:#fff;text-align:center}.diploma-page .seal{font-size:50px}.diploma-page h2{font-size:34px}.diploma-name{margin:26px 0 8px;color:var(--p);font:900 33px Georgia,serif}.diploma-line{width:70%;height:2px;margin:8px auto 22px;background:var(--a)}.toast{position:fixed;right:18px;bottom:18px;z-index:10;max-width:360px;padding:13px 16px;border-radius:11px;color:#fff;background:#334155;box-shadow:0 14px 35px rgba(0,0,0,.25)}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:720px){body{padding:7px}.app{border-radius:16px;min-height:96vh}.head{align-items:flex-start;flex-direction:column}.content{padding:20px 14px}.mode-grid,.options,.direction-grid{grid-template-columns:1fr}.flip-wrap{height:280px}.face strong{font-size:23px}.review-results{grid-template-columns:1fr}.stats{max-width:100%}h2{font-size:27px}.question h3{font-size:22px}}@media print{body{padding:0;background:#fff}.app>header,.diploma-controls{display:none!important}.app{box-shadow:none;border:0}.content{padding:0}.screen:not(.printable){display:none}.diploma-page{min-height:190mm;display:flex;flex-direction:column;justify-content:center}.toast{display:none}}
</style></head><body><div class="app"><header><div class="head"><div><h1>🧠 Flashcards UD05 LOE Seguridad e higiene en el trabajo</h1><p>General</p></div><div class="head-actions"><div class="stats" id="stats"></div><button class="home-btn" id="homeBtn" hidden>⌂ Menú</button></div></div></header><main class="content" id="content"></main></div>
<script>
(function(){'use strict';var DATA={"id":"qsu-mu3uc5zw-yf9p3n","cards":[{"id":1,"concept":"Accidente de Trabajo","definition":"Según la Seguridad Social, toda lesión corporal que el trabajador sufra con ocasión o como consecuencia del trabajo que ejecute por cuenta ajena","featured":true},{"id":2,"concept":"Accidente de trabajo \"en misión\"","definition":"Aquellos accidentes que no ocurren en el centro de trabajo ni al ir o volver del mismo pero que ocurren en el cumplimiento de su trabajo o de los encargos encomendados por la empresa.","featured":true},{"id":3,"concept":"Accidente de trabajo \"in itínere\"","definition":"Accidente que sufre el trabajador al ir o al volver del trabajo","featured":true},{"id":4,"concept":"Accidente de trabajo con baja","definition":"Aquellos accidentes que incapacitan al trabajador para continuar con su trabajo. Para que se considere tal, el trabajador debe ausentarse de su puesto de trabajo al menos un día, sin contar el día del accidente.","featured":false},{"id":5,"concept":"Accidente de trabajo sin baja","definition":"Son aquellos accidentes en los que existe lesión, pero el trabajador puede continuar su trabajo tras ser asistido.","featured":false},{"id":6,"concept":"Accidente en materia de prevención","definition":"Todo suceso anormal, no querido ni deseado, que se presenta de manera imprevista y brusca, interrumpiendo la continuidad del trabajo y que es susceptible de causar daños a las cosas o lesiones a las personas.","featured":true},{"id":7,"concept":"Aeorosoles","definition":"Suspensión de partículas en aire (polvos \u003c 0,5 micrones y humos>0,5 micrones) o líquidos en aire (neblinas \u003c 0,5 micrones y rocíos > 0,5 micrones).","featured":false},{"id":8,"concept":"Agencia Europea de Seguridad y Salud en el Trabajo","definition":"Órgano de la Unión Europea encargado de recopilar, coordinar y distribuir la información relativa a la seguridad y la salud en el trabajo entre los Estados miembros de la UE y los medios interesados.","featured":false},{"id":9,"concept":"Agentes biológicos","definition":"Microorganismos o vegetales u otro tipo de animales capaces de causar enfermedad profesional: virus, bacterias, protozoos, plantas (litre) o insectos ponzoñosos (araña del trigo, etc.).","featured":true},{"id":10,"concept":"Agentes físicos","definition":"Manifestaciones de diversos tipos de energía que, producida por diversas fuentes, puede llegar a afectar a los trabajadores expuestos a ella","featured":true},{"id":11,"concept":"Agentes Químicos","definition":"Aerosoles, gases y vapores que pueden causar enfermedad profesional.","featured":true},{"id":12,"concept":"Aire","definition":"Medio principal a través del cual los agentes químicos ingresan al trabajador.","featured":false},{"id":13,"concept":"Asbesto","definition":"Fibra compuesta principalmente por sílice y oxígeno, además de calcio, magnesio, hierro y sodio. Sus efectos pueden dividirse en no malignos y malignos.","featured":false},{"id":14,"concept":"Asma ocupacional","definition":"Enfermedad caracterizada por una obstrucción reversible y variable de la vía aérea, desencadenada por un agente presente en el sitio de trabajo.","featured":false},{"id":15,"concept":"Audiometría","definition":"Técnica de Medición del umbral auditivo de las personas, mediante un aparato que entrega tonos puros en diversas frecuencias y a niveles variables de intensidad. Se utiliza para pesquisar y diagnosticar el daño auditivo inducido por ruido.","featured":true},{"id":16,"concept":"Bacteria","definition":"Microorganismo unicelular que puede vivir en un medio sin necesidad de un huesped","featured":true},{"id":17,"concept":"Bienestar físico","definition":"En materia de prevención, funcionamiento correcto del conjunto de células, tejidos y órganos","featured":true},{"id":18,"concept":"Bienestar psíquico","definition":"Equilibrio mental y emocional","featured":true},{"id":19,"concept":"Bienestar social","definition":"Bienestar de la persona en sus relaciones sociales","featured":true},{"id":20,"concept":"Bossing","definition":"Acoso ejercido por un superior jerárquico a un trabajador","featured":true},{"id":21,"concept":"Burnout","definition":"También conocido como \"síndrome del quemado\", consiste en el desgaste personal, menor realización personal y la despersonalización que experimenta a veces una persona cuando trabaja en contacto con clientes y usuarios","featured":true},{"id":22,"concept":"Carga de trabajo","definition":"Todo esfuerzo que tenemos que realizar para desempeñar nuestra actividad laboral","featured":true},{"id":23,"concept":"Carga mental","definition":"Nivel de actividad mental o esfuerzo intelectual necesario para desarrollar un trabajo.","featured":true},{"id":24,"concept":"Comburente","definition":"Gases oxidantes como el mismo oxígeno que producen la combustión","featured":true},{"id":25,"concept":"Combustible","definition":"Sustancia o materia capaz de arder","featured":true},{"id":26,"concept":"Comisión Nacional de Seguridad y Salud en el Trabajo","definition":"Órgano colegiado asesor de las Administraciones Públicas en la formulación de las políticas de prevención y el órgano de participación institucional en materia de Seguridad y Salud en el Trabajo","featured":true},{"id":27,"concept":"Comité de Seguridad y Salud","definition":"Órgano paritario y colegiado de participación y consulta en materia de prevención de riesgos laborales de obligada existencia en aquellas empresas que cuenten con 50 o más trabajadores.","featured":true},{"id":28,"concept":"Condición de trabajo","definition":"En materia de prevención, lo es cualquier característica del trabajo que puede tener una influencia significativa en la aparición de riesgos para la seguridad y salud del trabajador","featured":true},{"id":29,"concept":"Condiciones de Seguridad","definition":"Factores de riesgo enfocados en los lugares de trabajo o en los equipos de trabajo que son susceptibles de producir accidentes de trabajo","featured":false},{"id":30,"concept":"Confort térmico","definition":"Sensación de bienestar del trabajador con la temperatura de su ambiente de trabajo. Influyen en el mismo la temperatura, la humedad, la ventilación y también la ropa y las características personales del trabajador.","featured":false},{"id":31,"concept":"Daños derivados del trabajo","definition":"Enfermedades, patologías o lesiones sufridas con motivo u ocasión del trabajo","featured":true},{"id":32,"concept":"Decibelio","definition":"Medidos en dB, unidad que se utiliza para medir la intensidad del sonido y otras magnitudes físicas. Un decibelio es la décima parte de un belio (B), unidad que recibe su nombre por Graham Bell.","featured":true},{"id":33,"concept":"Delegados de prevención","definition":"Representantes de los trabajadores con funciones específicas en materia de prevención de riesgos en el trabajo.","featured":true},{"id":34,"concept":"Diferencial","definition":"Dispositivo de seguridad que interrumpe la corriente eléctrica en el momento que se produce una sobrecarga de tensión en el circuito eléctrico","featured":false},{"id":35,"concept":"Dispositivo de seguridad","definition":"Elemento distinto al resguardo que elimina o reduce el riesgo","featured":true},{"id":36,"concept":"Efecto corrosivo","definition":"Efecto de algunos contaminantes químicos como los ácidos que producen la destrucción de los tejidos sobre los que actúan","featured":true},{"id":37,"concept":"Efectos neumoconióticos","definition":"Efecto de contaminantes químicos como los asbestos, el hierro, el aluminio, etc que actúan a través de su acumulación en el pulmón","featured":true},{"id":38,"concept":"Electrización","definition":"Paso de corriente eléctrica por el cuerpo humano produciendo en el mismo movimientos reflejos.","featured":true},{"id":39,"concept":"Energía de activación","definition":"Energía que permite que el fuego se inicie","featured":false},{"id":40,"concept":"Enfermedad profesional","definition":"Enfermedad contraída a consecuencia del trabajo ejecutado por cuenta ajena que proceda de las actividades y sustancias relacionadas en el cuadro establecido por el RD 1299/2006, de 10 de diciembre.","featured":true},{"id":41,"concept":"Envejecimiento prematuro","definition":"Envejecimiento natural que afecta a todos los seres vivos y que puede acelerarse como consecuencia de la realización de determinados trabajos","featured":true},{"id":42,"concept":"Estrés","definition":"Tensión provocada por situaciones agobiantes que originan reacciones psicosomáticas o trastornos psicológicos a veces graves.","featured":true},{"id":43,"concept":"Estrés térmico","definition":"Carga de calor que los trabajadores reciben o acumulan en su cuerpo y que se origina por la interacción de las características del lugar donde trabajan, la ropa que llevan y el trabajo que realizan","featured":false},{"id":44,"concept":"Evaluación de riesgos","definition":"Actividad fundamental que la Ley establece que debe llevarse a cabo inicialmente y cuando se efectúen determinados cambios, para poder detectar los riesgos que puedan existir en todos y cada uno de los puestos de trabajo de la empresa y que puedan afectar a la seguridad y salud de los trabajadores.","featured":true},{"id":45,"concept":"Factor de riesgo","definition":"Aquella condición de trabajo que, estando presente, incrementa la posibilidad de generación de un daño.","featured":true},{"id":46,"concept":"Factores de riesgo ambientales","definition":"Contaminantes físicos, químicos o biológicos susceptibles de producir enfermedades","featured":true},{"id":47,"concept":"Factores de riesgo ergonómicos","definition":"Factores de riesgo relacionados con la carga física o mental susceptibles de producir fatiga o trastornos músculo esqueléticos.","featured":true},{"id":48,"concept":"Factores de riesgo psicosociales","definition":"Factores relacionados con la organización o la ordenación del trabajo susceptibles de generar estrés, insatisfacción o conflictos interpersonales","featured":true},{"id":49,"concept":"Fatiga","definition":"Disminución de la capacidad física y/o  mental de un trabajador.","featured":true},{"id":50,"concept":"Fibrilación ventricular","definition":"Ruptura del ritmo del corazón cuando es atravesado por una corriente eléctrica y que puede derivar en una parada cardíaca.","featured":true},{"id":51,"concept":"Gestión del riesgo","definition":"Proceso conjunto de evaluación del riesgo y control del mismo.","featured":false},{"id":52,"concept":"Gusano","definition":"Organismo de vida libre o parásito","featured":true},{"id":53,"concept":"Herramienta manual","definition":"Aquella herramienta que es accionada por la fuerza humana","featured":false},{"id":54,"concept":"Herramienta portátil","definition":"Aquella herramienta que tiene un accionamiento hidráulico, neumático o eléctrico.","featured":false},{"id":55,"concept":"Higiene industrial","definition":"Disciplina que tiene por objeto el reconocimiento, evaluación y control de aquellos factores ambientales o tensiones que se originan en el lugar de trabajo y que pueden causar enfermedades, perjuicios a la salud o al bienestar, incomodidades e ineficiencia entre los trabajadores o entre los ciudadanos de la comunidad.","featured":true},{"id":56,"concept":"Hongo","definition":"Microorganismo vegetal parasitario que puede vivir también en material orgánico en descomposición","featured":true},{"id":57,"concept":"Humos","definition":"Suspensión en el aire de partículas sólidas originadas en procesos de combustión incompleta. Su tamaño es generalmente inferior a 0,1 micrones.","featured":true},{"id":58,"concept":"Imprudencia profesional","definition":"Acción u omisión voluntaria no maliciosa que omite el deber de cuidado creando un riesgo previsible y evitable, el cual provoca un resultado dañoso derivado, en adecuada relación de causalidad, de aquella conducta.","featured":true},{"id":59,"concept":"Imprudencia temeraria","definition":"Total omisión de prudencia y cuidado, y que supone un daño o un peligro para la vida o la seguridad de otros.","featured":true},{"id":60,"concept":"Incidente","definition":"Suceso que paros o pérdidas de tiempo en el proceso productivo pero no daños materiales ni personales","featured":true},{"id":61,"concept":"Insatisfacción laboral","definition":"Malestar que sufre el trabajador como consecuencia de su trabajo. Generalmente se produce cuando las compensaciones percibidas no compensan el esfuerzo realizado.","featured":true},{"id":62,"concept":"Inspección de Trabajo","definition":"Servicio público al que corresponde ejercer la vigilancia del cumplimiento de las normas laborales; de prevención de riesgos laborales; de Seguridad Social y protección social; de colocación, empleo y protección por desempleo; de cooperativas; de migración y trabajo de extranjeros; y de cuantas otras materias le sean legalmente atribuidas.","featured":true},{"id":63,"concept":"INSST","definition":"Órgano Científico-Técnico especializado de la Administración General del Estado que tiene como misión el análisis y estudio de las condiciones de Seguridad y Salud en el Trabajo, así como la promoción y apoyo a la mejora de las mismas.","featured":true},{"id":64,"concept":"Ionización","definition":"Separación de un átomo o de una molécula en iones positivos y negativos.","featured":true},{"id":65,"concept":"Láser","definition":"Amplificación de Luz por Emisión Estimulada de Radiación. Un dispositivo láser produce un haz intenso de luz con las propiedades únicas de coherencia, colimación y monocromaticidad.","featured":true},{"id":66,"concept":"Lugares de trabajo","definition":"Áreas del centro de trabajo a las cuales el trabajador puede acceder o permanecer como consecuencia de su trabajo","featured":true},{"id":67,"concept":"Lux (lx)","definition":"Unidad de medida para la iluminancia o nivel de iluminación. Equivale a un lumen /m².","featured":true},{"id":68,"concept":"Luz visible","definition":"Manifestación de radiación no ionizante, su falta o exceso produce una serie de problemas en el ámbito del trabajo","featured":false},{"id":69,"concept":"Manipulación manual de cargas","definition":"Operación de transporte o sujeción de una carga por uno o varios trabajadores que, pueda entrañar riesgos para el sistema musculoesquelético del trabajador.","featured":false},{"id":70,"concept":"Manual de instrucciones","definition":"Especificaciones realizadas por el fabricante sobre el uso, instalación y mantenimiento de una máquina o herramienta.","featured":false},{"id":71,"concept":"Mobbing","definition":"También conocido como \"acoso laboral\", es aquella situación en la que una persona o grupo de personas ejerce una presión extrema de manera sistemática y prolongada sobre un compañero en el centro de trabajo","featured":true},{"id":72,"concept":"mSv","definition":"MiliSievert, siendo un sievert​ una unidad que mide la dosis de radiación absorbida por la materia viva, corregida por los posibles efectos biológicos producidos.","featured":false},{"id":73,"concept":"Parasitosis","definition":"Cualquier enfermedad causada por parásitos.","featured":false},{"id":74,"concept":"Pictograma","definition":"En materia de prevención, símbolo identificativo de los riesgos que debe figurar en el envase de los productos","featured":true},{"id":75,"concept":"Plan de prevención","definition":"Herramienta a través de la cual se integra la actividad preventiva de la empresa en su sistema general de gestión y se establece su política de prevención de riesgos laborales","featured":true},{"id":76,"concept":"Prevención","definition":"Conjunto de actividades o medidas adoptadas o previstas en cada fase de actividad de la empresa con el fin de evitar o reducir los riesgos derivados del trabajo","featured":true},{"id":77,"concept":"Protozoo","definition":"Organismo unicelular o pluricelular que vive en ambientes húmedos o directamente acuáticos como parásito de otros seres vivos.","featured":true},{"id function makeQuestion(card){var q=app.quiz,dir=q.direction==='random'?(Math.random()<.5?'concept-to-definition':'definition-to-concept'):q.direction,question=dir==='concept-to-definition'?card.concept:card.definition,correct=dir==='concept-to-definition'?card.definition:card.concept,candidates=[],seen={};cards.forEach(function(c){var x=dir==='concept-to-definition'?c.definition:c.concept;if(x!==correct&&!seen[x]){seen[x]=1;candidates.push(x)}});candidates=shuffle(candidates).slice(0,3);var fillers=['Ninguna de las demás opciones','Todas las demás opciones','No corresponde a este concepto'];for(var i=0;candidates.length<3;i++)candidates.push(fillers[i]);var options=shuffle([correct].concat(candidates));return{card:card,direction:dir,question:question,correct:correct,options:options,correctIndex:options.indexOf(correct)}}

function renderQuestion(){var q=app.quiz;if(q.index>=q.deck.length||q.lives<=0){finishQuiz();return}q.locked=false;q.current=makeQuestion(q.deck[q.index]);var x=q.current,pct=Math.round(q.index/q.deck.length*100),label=x.direction==='concept-to-definition'?'Elige la definición correcta':'Elige el concepto correcto';setScreen('quiz-question','<section class="screen"><div class="progress"><span style="width:'+pct+'%"></span></div><div class="question">'+(x.card.featured?'<div class="featured">★ Término evaluable</div>':'')+'<small>'+label+' · Pregunta '+(q.index+1)+' de '+q.deck.length+'</small><h3>'+esc(x.question)+'</h3></div><div class="options">'+x.options.map(function(o,i){return'<button class="option" data-index="'+i+'" data-key="'+(i+1)+'">'+esc(o)+'</button>'}).join('')+'</div><div id="feedback"></div></section>');quizStats();document.querySelectorAll('.option').forEach(function(b){b.onclick=function(){answerQuiz(parseInt(b.dataset.index,10))}})}
function answerQuiz(index){var q=app.quiz;if(q.locked)return;q.locked=true;q.answered++;var x=q.current,ok=index===x.correctIndex;if(ok){q.correct++;beep(880)}else{q.lives--;beep(190)}document.querySelectorAll('.option').forEach(function(b){var i=parseInt(b.dataset.index,10);b.disabled=true;if(i===x.correctIndex)b.classList.add('correct');else if(i===index)b.classList.add('incorrect')});quizStats();var f=document.getElementById('feedback');if(cfg.quizFeedback)f.innerHTML='<div class="feedback '+(ok?'ok':'bad')+'">'+(ok?'✓ Correcto':'✗ Incorrecto. Respuesta correcta: '+esc(x.correct))+'</div>';app.transition=setTimeout(function(){q.index++;renderQuestion()},cfg.quizFeedback?1450:650)}
function finishQuiz(){var q=app.quiz,total=q.deck.length,percent=Math.round(q.correct/total*100),grade=Math.round(q.correct/total*100)/10,passed=percent>=cfg.passPercent,res={correct:q.correct,total:total,percent:percent,grade:grade,time:elapsed(q.start),passed:passed,id:'QSU-'+Date.now().toString(36).toUpperCase()};app.results=res;setStats('<span class="stat">Resultado: '+grade+'/10</span>');var cert=passed&&cfg.diploma?'<div class="certificate-box"><h3>🎓 Generar diploma</h3><p>Escribe tu nombre y apellidos tal como deben aparecer.</p><input id="studentName" placeholder="Nombre y apellidos" autocomplete="name"><div class="btns"><button class="btn warning" id="pdfBtn">Descargar diploma PDF</button><button class="btn secondary" id="printBtn">Ver / imprimir diploma</button></div></div>':'';setScreen('quiz-results','<section class="screen center"><span class="eyebrow">'+(passed?'✓ Actividad superada':'↻ Sigue practicando')+'</span><div class="result-score">'+grade+'<small style="font-size:25px">/10</small></div><div class="result-grade">'+(passed?'¡Enhorabuena!':'Aún no has alcanzado el '+cfg.passPercent+'%')+'</div><p class="lead">Has acertado '+q.correct+' de '+total+' preguntas ('+percent+'%) en '+res.time+'.</p><div class="review-results"><div class="metric"><b>'+q.correct+'/'+total+'</b><span>Aciertos</span></div><div class="metric"><b>'+percent+'%</b><span>Precisión</span></div><div class="metric"><b>'+q.lives+'</b><span>Vidas restantes</span></div></div>'+cert+'<div class="btns"><button class="btn primary" id="retryQuiz">Intentar de nuevo</button><button class="btn secondary" id="quizMenu">Volver</button></div></section>');document.getElementById('retryQuiz').onclick=startQuiz;document.getElementById('quizMenu').onclick=goHome;if(passed&&cfg.diploma){document.getElementById('pdfBtn').onclick=function(){certificate(false)};document.getElementById('printBtn').onclick=function(){certificate(true)}}}
function certName(){var el=document.getElementById('studentName'),name=el?el.value.trim():'';if(name.length<3){notify('Escribe el nombre completo para el diploma');if(el)el.focus();return''}return name}function rgb(hex){hex=String(hex).replace('#','');if(hex.length===3)hex=hex.split('').map(function(x){return x+x}).join('');return[parseInt(hex.slice(0,2),16)||0,parseInt(hex.slice(2,4),16)||0,parseInt(hex.slice(4,6),16)||0]}function ascii(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^ -~]/g,'')}function fileName(s){return ascii(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'alumno'}
function certificate(printOnly){var name=certName(),r=app.results;if(!name)return;if(printOnly||!window.jspdf){showPrintable(name,r);if(!printOnly)notify('La biblioteca PDF no está disponible; usa Imprimir → Guardar como PDF');return}try{var jsPDF=window.jspdf.jsPDF,doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'}),p=rgb(cfg.colors.primary),a=rgb(cfg.colors.accent),ok=rgb(cfg.colors.success);doc.setFillColor(255,255,255);doc.rect(0,0,297,210,'F');doc.setDrawColor(p[0],p[1],p[2]);doc.setLineWidth(3);doc.rect(14,14,269,182);doc.setLineWidth(.7);doc.rect(19,19,259,172);doc.setFont('helvetica','bold');doc.setTextColor(p[0],p[1],p[2]);doc.setFontSize(30);doc.text('DIPLOMA DE APROVECHAMIENTO',148.5,39,{align:'center'});doc.setTextColor(a[0],a[1],a[2]);doc.setFontSize(19);doc.text(doc.splitTextToSize(ascii(cfg.title),220),148.5,55,{align:'center'});doc.setTextColor(55,65,81);doc.setFont('helvetica','normal');doc.setFontSize(14);doc.text('Se concede el presente diploma a',148.5,82,{align:'center'});doc.setFont('helvetica','bold');doc.setTextColor(p[0],p[1],p[2]);doc.setFontSize(27);doc.text(ascii(name).toUpperCase(),148.5,103,{align:'center'});doc.setDrawColor(a[0],a[1],a[2]);doc.line(55,109,242,109);doc.setFont('helvetica','normal');doc.setTextColor(55,65,81);doc.setFontSize(13);doc.text('por haber superado satisfactoriamente la actividad',148.5,122,{align:'center'});doc.setFont('helvetica','bold');doc.setTextColor(ok[0],ok[1],ok[2]);doc.setFontSize(20);doc.text('Calificacion: '+r.grade+' / 10',148.5,139,{align:'center'});doc.setFont('helvetica','normal');doc.setTextColor(100,116,139);doc.setFontSize(10);doc.text('Aciertos: '+r.correct+'/'+r.total+'   |   Precision: '+r.percent+'%   |   Tiempo: '+r.time,148.5,153,{align:'center'});doc.text('Fecha: '+new Date().toLocaleDateString('es-ES')+'   |   Materia: '+ascii(cfg.subject)+'   |   ID: '+r.id,148.5,169,{align:'center'});doc.save('diploma-'+fileName(name)+'.pdf');notify('Diploma descargado')}catch(e){notify('No se pudo crear el PDF: '+e.message);showPrintable(name,r)}}
function showPrintable(name,r){setStats('');setScreen('diploma','<section class="screen printable"><div class="diploma-page"><div class="seal">🎓</div><h2>DIPLOMA DE APROVECHAMIENTO</h2><h3>'+esc(cfg.title)+'</h3><p>Se concede el presente diploma a</p><div class="diploma-name">'+esc(name.toUpperCase())+'</div><div class="diploma-line"></div><p>por haber superado satisfactoriamente la actividad</p><h3 style="color:var(--ok)">Calificación: '+r.grade+' / 10</h3><p>Aciertos: '+r.correct+'/'+r.total+' · Precisión: '+r.percent+'% · Tiempo: '+r.time+'</p><p><small>'+new Date().toLocaleDateString('es-ES')+' · '+esc(cfg.subject)+' · ID: '+r.id+'</small></p></div><div class="btns diploma-controls"><button class="btn primary" id="doPrint">Imprimir / Guardar como PDF</button><button class="btn secondary" id="backResults">Volver a resultados</button></div></section>');document.getElementById('doPrint').onclick=function(){window.print()};document.getElementById('backResults').onclick=finishQuiz}
document.addEventListener('keydown',function(e){if(app.screen==='quiz-question'&&!app.quiz.locked&&/^[1-4]$/.test(e.key))answerQuiz(parseInt(e.key,10)-1);if(app.screen==='review-card'&&(e.key===' '||e.key==='Enter')){e.preventDefault();flipReview()}});window.addEventListener('beforeunload',function(){if(app.screen==='review-card')saveReviewProgress()});document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'&&app.screen==='review-card')saveReviewProgress()});function init(){if(!cards.length){setScreen('home','<section class="screen center"><h2>No hay fichas disponibles</h2></section>');return}if(cfg.outputMode==='both'){if(cfg.startMode==='review')showReviewStart();else if(cfg.startMode==='quiz'&&cards.length>=4)showQuizStart();else showHome(true)}else showHome(false)}init()})();
</script></body></html>
