*{box-sizing:border-box}:root{--p:#55bf1d;--a:#508505;--front:#ffffff;--back:#f8fafc;--ok:#10b981;--bad:#ef4444;--warn:#f59e0b;--ink:#172033;--muted:#64748b;--line:#dbe3ef}body{margin:0;min-height:100vh;padding:22px;font-family:Inter,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 12% 8%,color-mix(in srgb,var(--p) 30%,transparent),transparent 31%),radial-gradient(circle at 90% 8%,color-mix(in srgb,var(--a) 22%,transparent),transparent 28%),linear-gradient(135deg,#0f172a,color-mix(in srgb,var(--p) 42%,#111827),#111827);display:grid;place-items:center}.app{width:min(1100px,100%);min-height:650px;overflow:hidden;border:1px solid rgba(255,255,255,.25);border-radius:25px;background:#fff;box-shadow:0 35px 100px rgba(0,0,0,.38)}header{position:relative;padding:24px 28px;color:#fff;background:linear-gradient(135deg,var(--p),color-mix(in srgb,var(--p) 62%,#111827));overflow:hidden}header:after{content:"";position:absolute;width:230px;height:230px;right:-65px;top:-115px;border-radius:50%;background:rgba(255,255,255,.13)}.head{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:15px}.head h1{margin:0;font-size:27px;letter-spacing:-.035em}.head p{margin:5px 0 0;font-size:13px;opacity:.85}.head-actions{display:flex;align-items:center;gap:10px}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{padding:8px 11px;border:1px solid rgba(255,255,255,.22);border-radius:11px;background:rgba(15,23,42,.17);font-size:12px;font-weight:750}.home-btn{border:1px solid rgba(255,255,255,.28);border-radius:10px;padding:8px 11px;color:#fff;background:rgba(255,255,255,.12);font-weight:750}.content{min-height:505px;padding:30px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#f8fafc,#fff)}.screen{width:min(850px,100%);animation:enter .3s ease-out}.center{text-align:center}.eyebrow{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;color:var(--p);background:color-mix(in srgb,var(--p) 10%,white);font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.08em}h2{margin:15px 0 8px;color:var(--p);font-size:32px;letter-spacing:-.04em}.lead{margin:0 auto 24px;max-width:680px;color:var(--muted);font-size:17px;line-height:1.55}.mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:28px 0}.mode-card{padding:25px;border:1px solid var(--line);border-radius:18px;background:#fff;text-align:left;box-shadow:0 12px 30px rgba(15,23,42,.07);transition:.2s}.mode-card:hover:not(:disabled){transform:translateY(-4px);border-color:var(--p);box-shadow:0 18px 38px color-mix(in srgb,var(--p) 17%,transparent)}.mode-card .icon{font-size:38px}.mode-card h3{margin:12px 0 5px;font-size:21px}.mode-card p{margin:0;color:var(--muted);line-height:1.5}.mode-card:disabled{opacity:.5;cursor:not-allowed}.summary{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:20px 0}.chip{padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:12px;font-weight:750}.btns{display:flex;justify-content:center;gap:11px;flex-wrap:wrap;margin-top:24px}.btn{border:0;border-radius:11px;padding:12px 20px;font-weight:800;transition:.2s}.btn:hover:not(:disabled){transform:translateY(-2px)}.btn:disabled{opacity:.45}.primary{color:#fff;background:linear-gradient(135deg,var(--p),var(--a));box-shadow:0 10px 24px color-mix(in srgb,var(--p) 28%,transparent)}.secondary{color:#334155;background:#fff;border:1px solid var(--line)}.success{color:#fff;background:var(--ok)}.warning{color:#fff;background:var(--warn)}.danger{color:#fff;background:var(--bad)}.progress{height:12px;margin-bottom:22px;border-radius:999px;background:#e2e8f0;overflow:hidden}.progress span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--p),var(--a));transition:width .35s}.featured{display:inline-flex;padding:6px 10px;margin-bottom:10px;border-radius:999px;color:#92400e;background:#fef3c7;border:1px solid #fcd34d;font-size:11px;font-weight:850}.flip-wrap{width:min(580px,100%);height:320px;margin:12px auto 20px;perspective:1200px}.flashcard{position:relative;width:100%;height:100%;border:0;background:transparent;transform-style:preserve-3d;transition:transform .55s}.flashcard.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;border:3px solid var(--p);border-radius:20px;backface-visibility:hidden;box-shadow:0 22px 45px rgba(15,23,42,.14)}.front{background:var(--front)}.back{background:var(--back);border-color:var(--ok);transform:rotateY(180deg)}.face small{text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:850}.face strong{display:block;max-height:210px;overflow:auto;margin:18px 0;font-size:29px;line-height:1.35}.face em{color:var(--muted);font-size:12px}.review-actions{display:flex;justify-content:center;gap:11px;flex-wrap:wrap}.review-results{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:25px 0}.metric{padding:18px;border:1px solid var(--line);border-radius:15px;background:#fff;text-align:center}.metric b{display:block;color:var(--p);font-size:29px}.metric span{color:var(--muted);font-size:11px;text-transform:uppercase}.difficult-list{max-height:240px;overflow:auto;margin:18px 0;padding:14px;border:1px solid #fcd34d;border-radius:14px;background:#fffbeb;text-align:left}.difficult-list div{padding:9px;border-bottom:1px solid #fde68a}.difficult-list div:last-child{border:0}.direction-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:20px 0}.direction{padding:18px;border:2px solid var(--line);border-radius:14px;background:#fff}.direction.active{border-color:var(--p);background:color-mix(in srgb,var(--p) 8%,white)}.question{padding:28px;margin-bottom:19px;border:1px solid var(--line);border-radius:18px;background:#fff;text-align:center;box-shadow:0 12px 30px rgba(15,23,42,.07)}.question small{color:var(--muted);font-weight:750}.question h3{margin:13px 0 0;font-size:27px;line-height:1.38}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.option{position:relative;min-height:90px;padding:20px 16px 16px 48px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-weight:700;text-align:left}.option:hover:not(:disabled){border-color:var(--p);transform:translateY(-2px)}.option:before{content:attr(data-key);position:absolute;left:13px;top:13px;display:grid;place-items:center;width:25px;height:25px;border-radius:50%;color:var(--p);background:#eef2ff;font-size:11px}.option.correct{color:#065f46;border-color:var(--ok);background:#d1fae5}.option.incorrect{color:#7f1d1d;border-color:var(--bad);background:#fee2e2}.feedback{margin-top:14px;padding:14px;border-radius:12px;text-align:center;font-weight:800}.feedback.ok{color:#065f46;background:#d1fae5}.feedback.bad{color:#7f1d1d;background:#fee2e2}.result-score{font-size:72px;font-weight:900;line-height:1;color:var(--p);margin:25px 0 8px}.result-grade{font-size:22px;font-weight:850}.certificate-box{margin-top:24px;padding:20px;border:2px solid #fcd34d;border-radius:17px;background:linear-gradient(135deg,#fffbeb,#fff)}.certificate-box input{width:min(450px,100%);padding:12px;border:1px solid #d6b661;border-radius:10px}.diploma-page{padding:38px;border:8px double var(--p);border-radius:7px;background:#fff;text-align:center}.diploma-page .seal{font-size:50px}.diploma-page h2{font-size:34px}.diploma-name{margin:26px 0 8px;color:var(--p);font:900 33px Georgia,serif}.diploma-line{width:70%;height:2px;margin:8px auto 22px;background:var(--a)}.toast{position:fixed;right:18px;bottom:18px;z-index:10;max-width:360px;padding:13px 16px;border-radius:11px;color:#fff;background:#334155;box-shadow:0 14px 35px rgba(0,0,0,.25)}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:720px){body{padding:7px}.app{border-radius:16px;min-height:96vh}.head{align-items:flex-start;flex-direction:column}.content{padding:20px 14px}.mode-grid,.options,.direction-grid{grid-template-columns:1fr}.flip-wrap{height:280px}.face strong{font-size:23px}.review-results{grid-template-columns:1fr}.stats{max-width:100%}h2{font-size:27px}.question h3{font-size:22px}}@media print{body{padding:0;background:#fff}.app>header,.diploma-controls{display:none!important}.app{box-shadow:none;border:0}.content{padding:0}.screen:not(.printable){display:none}.diploma-page{min-height:190mm;display:flex;flex-direction:column;justify-content:center}.toast{display:none}}
</style></head><body><div class="app"><header><div class="head"><div><h1>🧠 Flashcards UD03 LOGSE El contrato de trabajo</h1><p>General</p></div><div class="head-actions"><div class="stats" id="stats"></div><button class="home-btn" id="homeBtn" hidden>⌂ Menú</button></div></div></header><main class="content" id="content"></main></div>
<script>
(function(){'use strict';var DATA={"id":"qsu-mu3uc5zw-yf9p3n","cards":[{"id":1,"concept":"Abandono","definition":"Renuncia fáctica del trabajador a su puesto de trabajo en la que no existe una manifestación inequívoca de ésta por su parte.","featured":true},{"id":2,"concept":"Abuso de confianza","definition":"Abuso de la especial posición que se goza en un puesto de trabajo para aprovecharse del mismo perjudicando a la otra parte.","featured":false},{"id":3,"concept":"Acto de conciliación","definition":"Procedimiento cuya finalidad es que las partes alcanzen un acuerdo, evitando así un litigio. En el Derecho de Trabajo es un paso necesario y previo a la posterior demanda.","featured":false},{"id":4,"concept":"Ajenidad","definition":"Característica de un contrato en virtud de la cual los frutos del trabajo y los medios de producción son propiedad del empresario","featured":true},{"id":5,"concept":"Ámbito funcional del Convenio Colectivo","definition":"Define las actividades empresariales a las que el convenio es aplicable: construcción, hostelería, metal, etc.","featured":false},{"id":6,"concept":"Ámbito geográfico del convenio colectivo","definition":"Define el territorio al que se aplica el convenio: estatal, autonómico, provincial, etc","featured":false},{"id":7,"concept":"Amortización de puestos de trabajo","definition":"Por causas económicas, técnicas, organizativas o de producción. Son las mismas causas que las del despido colectivo y el número de puestos que se amortizan ha de ser inferior.","featured":false},{"id":8,"concept":"Autónomo","definition":"Aquel trabajador que lleva a cabo una actividad económica o profesional a título lucrativo y de forma habitual, personal y directa sin sujeción a contrato de trabajo.","featured":false},{"id":9,"concept":"Avenencia","definition":"Acuerdo alcanzado en la conciliación que evita el juicio laboral","featured":true},{"id":10,"concept":"Bonificación","definition":"Descuentos en las cotizaciones a la Seguridad Social de ciertos grupos de trabajadores para incentivar su contratación.","featured":false},{"id":11,"concept":"Buena fe contractual","definition":"Principio aplicable a las partes de un contrato consistente en realizar su prestación de manera honesta y negociar, cuando proceda, con vistas a alcanzar acuerdos","featured":false},{"id":12,"concept":"Capacidad de obrar","definition":"Aptitud para el ejercicio de los derechos y el cumplimiento de las obligaciones, o capacidad para realizar actos con eficacia jurídica","featured":true},{"id":13,"concept":"Causas del despido referidas a la producción","definition":"Cuando se produzcan cambios en la demanda de los productos o servicios que la empresa pretende colocar en el mercado.","featured":false},{"id":14,"concept":"Causas económicas del despido","definition":"Cuando de los resultados de la empresa se desprenda una situación económica negativa, en casos como la existencia de pérdidas actuales o previstas, o la disminución persistente de su nivel de ingresos ordinarios o ventas. Se entenderá que la disminución es persistente si, durante tres trimestres consecutivos, el nivel de ingresos ordinarios o ventas de cada trimestre es inferior al registrado en el mismo trimestre del año anterior.","featured":false},{"id":15,"concept":"Causas objetivas","definition":"Causas de extinción del contrato ajenas a la voluntad de las partes como ineptitud del trabajador, amortizaciones de puestos de trabajo, falta de adaptación del trabajador a las modificaciones técnicas, etc","featured":true},{"id":16,"concept":"Causas organizativas del despido","definition":"Cuando se produzcan cambios en el ámbito de los sistemas y métodos de trabajo del personal o en el modo de organizar la producción","featured":false},{"id":17,"concept":"Causas Técnicas del despido","definition":"Cuando se produzcan cambios en el ámbito de los medios o instrumentos de producción.","featured":false},{"id":18,"concept":"Centro especial de empleo","definition":"Empresa cuyo objetivo principal es el de proporcionar a los trabajadores con discapacidad la realización de un trabajo productivo y remunerado, adecuado a sus características personales y que facilite la integración laboral de éstos en el mercado ordinario de trabajo.","featured":false},{"id":19,"concept":"Cesión de trabajadores","definition":"Contrato de servicios entre las empresas, de puesta a disposición de los trabajadores de la empresa cedente a la empresa cesionaria.","featured":false},{"id":20,"concept":"Cesión ilegal de trabajadores","definition":"Se produce cuando una empresa, que no sea una empresa de trabajo temporal (ETT), contrata a un trabajador exclusivamente para que trabaje para otra empresa","featured":false},{"id":21,"concept":"Cierre patronal","definition":"Medida de conflicto colectivo acordada por el empresario con efecto de suspender la relación laboral cuando exista peligo real para personas o bienes o se observe un funcionamiento anormal del proceso productivo","featured":false},{"id":22,"concept":"Conciliación","definition":"Mecanismo de autocomposición de conflictos mediante el cual las partes enfrentadas intentan alcanzar ante un tercero una transacción satisfactoria para ambos, evitándose la necesidad de acudir a un proceso judicial.","featured":true},{"id":23,"concept":"Contrat@","definition":"Servicio web que permite a empresarios actuando en nombre propio y empresas y profesionales colegiados actuando en representación de terceros comunicar el contenido de la contratación laboral a los servicios públicos de empleo","featured":false},{"id":24,"concept":"Contrata","definition":"Aquel contrato en virtud del cual la parte contratista asume la obligación de realizar una obra o servicio a favor de la empresa principal o comitente y esta asume la obligación de pagar un precio","featured":false},{"id":25,"concept":"Contratista","definition":"Persona a la que se encarga la realización de una obra o servicio por medio de una contrata","featured":false},{"id":26,"concept":"Contrato de formación en alternancia","definition":"Tiene por objeto compatibilizar una actividad laboral retribuida con procesos formativos de formación profesional, estudios universitarios o del Catálogo de especialidades formativas del Sistema Nacional de Empleo.","featured":false},{"id":27,"concept":"Contrato de puesta a disposición","definition":"Contrato de naturaleza mercantil que se otorga entre una Empresa de Trabajo Temporal (ETT) y la empresa usuaria, es decir, aquella que pretende contratar a uno o varios trabajadores a través de la ETT. Este contrato debe otorgarse por escrito y en el modelo oficial.","featured":true},{"id":28,"concept":"Contrato de relevo","definition":"Aquel que se concierta con una persona desempleada o que tuviese concertado con la empresa un contrato de duración determinada, para sustituir la jornada dejada vacante por un trabajador de la empresa que accede a la jubilación parcial.","featured":true},{"id":29,"concept":"Contrato de trabajo","definition":"Acuerdo entre empresario y trabajador para iniciar una relación laboral basada en la prestación de un servicio a cambio de una remuneración económica","featured":true},{"id":30,"concept":"Contrato de trabajo a tiempo parcial","definition":"Aquel contrato de trabajo en el que se haya acordado la prestación de servicios durante un número de horas al día, a la semana, al mes o al año inferior a la jornada de trabajo de un trabajador a tiempo completo comparable","featured":true},{"id":31,"concept":"Contrato de trabajo de duración indefinida","definition":"Aquel que se concierta sin establecer límites de tiempo en la prestación de los servicios, en cuanto a la duración del contrato","featured":true},{"id":32,"concept":"Contrato de trabajo fijo discontinuo","definition":"Se concierta para la realización de trabajos estacionales o vinculados a actividades de temporada, para el desarrollo de aquellos que no tengan dicha naturaleza pero que, siendo intermitentes, tengan periodos de ejecución ciertos, determinados o indeterminados.","featured":true},{"id":33,"concept":"Contrato de trabajo temporal","definition":"Contrato de trabajo que establece límites de tiempo en la prestación de los servicios, la duración de la cual depende del objeto del contrato.","featured":true},{"id":34,"concept":"Contrato eventual por circunstancias de la producción","definition":"Es un contrato temporal que tiene como objeto atender los desajustes de plantilla provocados por incrementos ocasionales de actividad ya sean estos previsibles o no.","featured":true},{"id":35,"concept":"Contrato para la obtención de la práctica profesional","definition":"Contrato temporal cuyo objeto es la obtención por el trabajador de la práctica profesional adecuada al nivel de estudios cursados. No se trata únicamente de adquirir experiencia en un trabajo determinado, sino también de que esa experiencia actúe sobre los estudios cursados.","featured":true},{"id":36,"concept":"Contrato por sustitución de personas trabajadoras","definition":"Contrato temporal cuya finalidad es sustituir a un trabajador de la empresa con derecho a reserva de puesto de trabajo. Se puede realizar también para cubrir temporalmente un puesto de trabajo durante un proceso de selección","featured":true},{"id":37,"concept":"Contratos de trabajo de duración determinada.","definition":"Aquellos que tienen como finalización prevista alguna de las causas o circunstancias recogidas en el Estatuto de los Trabajadores (art.15.1. LET)","featured":true},{"id":38,"concept":"Contratos formativos","definition":"Diseñados para facilitar la inserción laboral de los jóvenes y el empleo juvenil. Son dos: el contrato para la formación y el aprendizaje; y el contrato de trabajo en prácticas.","featured":true},{"id":39,"concept":"Convenio colectivo","definition":"Acuerdo negociado libremente entre los representantes de los trabajadores y los empresarios por el que se establecen las condiciones de trabajo y productividad para un ámbito laboral y un periodo de tiempo determinado.","featured":true},{"id":40,"concept":"Dependencia","definition":"Característica del contrato de trabajo en virtud del cual el trabajador presta servicios dentro del ámbito de organización y dirección del empresario","featured":false},{"id":41,"concept":"Despido colectivo","definition":"Extinción de contratos de trabajo fundada en causas económicas, técnicas, organizativas o de producción cuando, en un período de noventa días, la extinción afecte al menos a: a) Diez trabajadores, en las empresas que ocupen menos de cien trabajadores; b) El 10 % del número de trabajadores de la empresa en aquéllas que ocupen entre cien y trescientos trabajadores; c) Treinta trabajadores en las empresas que ocupen más de trescientos trabajadores.","featured":true},{"id":42,"concept":"Despido disciplinario","definition":"Despido basado en el incumplimiento grave y culpable del trabajador","featured":true},{"id":43,"concept":"Despido nulo","definition":"Ineficacia del despido por las causas establecidas legalmente, cuya declaración tiene por efecto la inmediata readmisión del trabajador y el abono de los salarios dejados de percibir","featured":true},{"id":44,"concept":"Despido por causas económicas","definition":"Extinción de la relación laboral a voluntad del empresario como consecuencia de la existencia de pérdidas o disminución persistente de los ingresos o ventas","featured":true},{"id":45,"concept":"Despido por causas objetivas","definition":"Extinción de la relación laboral a voluntad del empresario por razón distinta al incumplimiento de una obligación laboral del trabajador, pudiendo ser ésta económica, técnica, organizativa o de producción","featured":true},{"id":46,"concept":"Despido por fuerza mayor","definition":"Extinción unilateral del contrato de trabajo basada en una circunstancia externa, impuesta e imprevisible que imposibilita la prestación y que ha sido autorizada por la Autoridad Laboral","featured":true},{"id":47,"concept":"Despido procedente","definition":"Extinción de la relación laboral a voluntad del empresario por incumplimiento acreditado de una obligación laboral del trabajador","featured":true},{"id":48,"concept":"Desplazamiento temporal","definition":"Cambio del centro de trabajo a población distinta a la de residencia habitual del trabajador cuando el tiempo de desplazamiento no exceda de doce meses en un periodo de tres años.","featured":false},{"id":49,"concept":"Dimisión","definition":"Desistimiento, es decir, un negocio jurídico por el que se pone fin a una relación obligatoria, sin otra justificación que la propia voluntad. Equivale, aquí, a renunciar al contrato por parte del trabajador.","featured":true},{"id":50,"concept":"Empleo temporal","definition":"Aquel empleo en el que el fin de la relación laboral o del contrato queda determinado por condiciones objeticas, tales como la expiración de cierto plazo, la realización de una tarea determinada, la reincorporación de un empleado al que se había reemplazado temporalmente","featured":false},{"id":51,"concept":"Empresa de trabajo temporal","definition":"Aquella empresa cuya actividad consiste en poner a disposición de otra empresa (usuaria), con carácter temporal, trabajadores por ella contratados.","featured":true},{"id":52,"concept":"Encadenamiento de contratos temporales","definition":"Se permite formalizar varios contratos temporales con un mismo trabajador siempre que en un periodo de 24 meses no se superen los 18 de manera continua o discontinua para el mismo o distinto puesto, en la misma empresa o grupo de empresas, mediante dos o más contratos temporales de circunstancias de la producción, ya sea contratado directamente por la empresa o puesto a disposición por una ETT.","featured":false},{"id":53,"concept":"Excedencia","definition":"Decisión tomada por el trabajador de suspender su relación con una empresa durante un período en el cual se va a dedicar a otras tareas, incluso podrá trabajar en otra empresa si lo desea.","featured":true},{"id":54,"concept":"Excedencia forzosa","definition":"Esta excedencia se concede para poder ejercer funciones sindicales de ámbito provincial o superior, o ser nombrado o elegido para un cargo público que imposibilite asistir al trabajo. La duración de la excedencia es mientras dure el ejercicio del cargo. Se mantiene el puesto de trabajo y computa a efectos de antigüedad.","featured":true},{"id":55,"concept":"Excedencia por cuidado de familiares","definition":"Casos de incapacidad o enfermedad grave de familiar hasta segundo grado. La duración máxima es de dos años y el periodo computa a efectos de antigüedad y asistencia a cursos de formación. Durante el primer año existe reserva de su puesto de trabajo; más adelante, la reserva se refiere a un puesto similar.","featured":true},{"id":56,"concept":"Excedencia voluntaria por cuidado de hijos","definition":"En los casos de nacimiento, adopción o acogimiento de un menor. La duración máxima de la excedencia es de tres años.","featured":true},{"id":57,"concept":"Excedencia voluntaria por interés particular","definition":"Se concede con al menos un año de antigüedad, y no haber disfrutado de otra excedencia en los cuatro años previos. La duración de la excedencia es por un mínimo de cuatro meses y un máximo de cinco años. Este tipo de excedencia no computa a efectos de antigüedad, cotizaciones o prestaciones sociales. En caso de vacante de igual o similar categoría, el trabajador excedente tiene un derecho preferencial a ocuparlo","featured":true},{"id":58,"concept":"Falta de adaptación del trabajador a las modificaciones técnicas","definition":"Deben estar referidas a su puesto de trabajo. siempre que dichos cambios sean razonables y hayan transcurrido como mínimo dos meses desde que se introdujo la modificación o desde que finalizó la formación dirigida a la adaptación","featured":false},{"id":59,"concept":"Finiquito","definition":"Recibo por el cual el trabajador y el empresario dan por terminada la relación laboral y liquidan todas las obligaciones pendientes..","featured":true},{"id":60,"concept":"Fraude de ley","definition":"Actos realizados al amparo de una norma jurídica que persigan actos contrarios al Ordenamiento Jurídico. No impedirán la correcta aplicación de la norma que se haya tratado de eludir","featured":true},{"id":61,"concept":"Grupo profesional","definition":"Tiene en cuenta las características del puesto de trabajo, las tareas que se van a desarrollar, responsabilidades, conocimientos requeridos, etc.","featured":false},{"id":62,"concept":"Huelga","definition":"Paro voluntario en el trabajo por parte de los trabajadores con el fin de obtener ciertas mejoras laborales.","featured":true},{"id":63,"concept":"Incapacidad temporal","definition":"Derivada de accidente o enfermedad, causa de suspensión del contrato de trabajo","featured":true},{"id":64,"concept":"Incentivos a la contratación","definition":"Medidas tomadas por la Administración para facilitar la contratación de ciertos grupos de trabajadores con dificultad de acceso al mercado de trabajo. Estas medidas favorecen a las empresas que van a contratar a un trabajador de estos grupos. Pueden ser de distintos tipos, principalmente: Subvenciones, Bonificaciones en las cuotas de Seguridad Social y deducciones en las cuotas de impuestos directos.","featured":false},{"id":65,"concept":"Ineptitud del trabajador","definition":"Falta de capacidad para el desempeño del trabajo., conocida o sobrevenida con posterioridad a su colocación efectiva en la empresa. Si se conoce ésta durante el periodo de prueba, no se podrá alegar con posterioridad. La jurisprudencia admite tanto la física como la psíquica.","featured":false},{"id":66,"concept":"Ius variandi","definition":"Facultad del empleador de modificar, unilateralmente, dentro de ciertos límites, las condiciones de la prestación de trabajo","featured":false},{"id":67,"concept":"Modificación sustancial de condiciones de trabajo","definition":"Se consideran tales, entre otras, las que afecten a las siguientes materias: Jornada de trabajo, horario y distribución del tiempo de trabajo Régimen de trabajo a turnos Sistemas de remuneración y cuantía salarial Sistema de trabajo y rendimiento. Funciones, cuando excedan de los límites que para la movilidad funcional","featured":true},{"id":68,"concept":"Movilidad funcional","definition":"Realización de funciones tanto superiores como inferiores, no correspondientes al grupo profesional y otras diferentes dentro del mismo grupo profesional","featured":true},{"id":69,"concept":"Movilidad funcional horizontal","definition":"Para que se produzca este cambio en las funciones del trabajador, el empresario no necesita alegar causa ni existe límite temporal, siempre que no se vulneren los derechos fundamentales del trabajador ni su dignidad. El trabajador percibirá la retribución correspondiente a las nuevas funciones que desempeñe, quedando en todo caso garantizada la retribución que venía percibiendo.","featured":false},{"id":70,"concept":"Movilidad funcional vertical ascendente","definition":"Para que se produzca este cambio en las funciones del trabajador, cuando se produzca por un periodo superior a seis meses durante un año, u ocho meses durante dos, el trabajador tendrá derecho a: Percibir el salario correspondiente al grupo profesional mientras dure la situación. Reclamar que se cubra la vacante correspondiente a las funciones que desempeña, de acuerdo con el sistema de ascensos aplicable en la empresa. Ello no implica que al solicitante le vayan a conceder el ascenso.","featured":false},{"id":71,"concept":"Movilidad funcional vertical descendente","definition":"Para que se produzca este cambio en las funciones del trabajador, deberá estar justificada por necesidades urgentes e imprevisibles de la actividad productiva. El empresario solo podrá mantener estas funciones por el tiempo imprescindible y se mantendrá el salario de origen.","featured":false},{"id":72,"concept":"Movilidad geográfica","definition":"Traslado de la persona trabajadora, bien de forma definitiva o bien como desplazamiento temporal a otro centro de trabajo de otra localidad, que implique un cambio en su lugar de residencia habitual por razones técnicas, organizativas, económicas o de producción.","featured":true},{"id":73,"concept":"No avenencia","definition":"Acto de conciliación en el que no se ha podido alcanzar un acuerdo que satisfaga a las partes. Queda expedita la vía judicial","featured":false},{"id":74,"concept":"Pacto de no competencia","definition":"Obliga al trabajador a no competir de manera desleal con el empleador durante el tiempo de prestación de servicios, y tras la extinción del contrato por cualquier causa. una vez extinguido el contrato, el pato no podrá durar más de 2 años para los técnicos o de seis meses para los demás trabajadores","featured":false},{"id":75,"concept":"Pacto de permanencia","definition":"Acuerdo entre trabajador y empresario por el cual el empleado se compromete voluntariamente a permanecer en la empresa el tiempo que se establezca en el pacto.El acuerdo no puede ser superior a dos años y siempre debe formalizarse por escrito","featured":false},{"id":76,"concept":"Pacto de plena dedicación","definition":"Supone que el trabajador se compromete a no trabajar en otras empresas, aun incluso en otro sector empresarial distinto. A cambio, el trabajador recibirá una remuneración que compensará económicamente esa exclusividad. El trabajador puede rescindir el pacto comunicándolo a la empresa, por escrito, con una antelación mínima de 30 días","featured":false},{"id":77,"concept":"Papeleta de conciliación","definition":"Escrito que presenta el trabajador ante el servicio administrativo correspondiente que recoge la solicitud de conciliación o mediación a fin de evitar un proceso laboral.","featured":false},{"id":78,"concept":"Periodo de prueba","definition":"Periodo al inicio del contrato, en el cual el empresario va a evaluar si el trabajador reúne las condiciones necesarias para lo que fue contratado. En este periodo el trabajador también evaluará la conveniencia de la contratación.","featured":true},{"id":79,"concept":"Rescisión de contrato","definition":"Extinción del contrato por voluntad de una de las partes","featured":true},{"id":80,"concept":"Riesgo durante el embarazo","definition":"Causa de suspensión procedente cuando la trabajadora embarazada ocupa un puesto de trabajo con riesgo para su salud o la del feto, y no se ha podido adaptar para hacerlo compatible con su estado, ni reubicarla a otro sin riesgo.","featured":true},{"id":81,"concept":"Riesgo durante la lactancia","definition":"Causa de suspensión procedente cuando la madre lactante encuentra problemas derivados de su actividad laboral que pongan en riesgo la lactancia, como por ejemplo la compatibilidad de horarios o la toxicidad a la que está sometida en su puesto de trabajo. Cuando no es posible reubicar a la trabajadora en la empresa durante ese periodo en otro puesto que no suponga riesgo durante ese intervalo de tiempo, se verá obligada a cesar de forma temporal en la empresa","featured":true},{"id":82,"concept":"Salarios de tramitación","definition":"Cantidades que el trabajador deja de percibir desde la fecha de despido hasta la notificación de la sentencia que declarase la improcedencia o hasta que hubiera encontrado otro empleo","featured":false},{"id":83,"concept":"SEPE","definition":"Organismo autónomo de la Administración General del Estado al que se le encomienda la ordenación, desarrollo y seguimiento de los programas y medidas de la política de empleo, en el marco de lo establecido en esta ley.","featured":true},{"id":84,"concept":"Sistema Red","definition":"Servicio que ofrece la TGSS a empresas, agrupaciones de empresas y profesionales, cuya misión es permitir el intercambio de información y documentos entre la TGSS y los usuarios a través de internet","featured":false},{"id":85,"concept":"SMAC","definition":"Organismo donde se lleva a cabo la Conciliación Previa en las reclamaciones de índole laboral. Todas las comunidades cuentan con una o varias oficinas del SMAC (en Aragón, el SAMA) y representa el paso previo y obligatorio antes de llegar al procedimiento judicial, impuesto por la Ley reguladora de la Jurisdicción Social.","featured":true},{"id":86,"concept":"Subcontrata","definition":"Acuerdo por el que la parte contratista encarga a otra contratista la realización de determinadas obras o servicios.","featured":false},{"id":87,"concept":"Subcontratación","definition":"Contrato mercantil en el que una empresa contrata a otra, para que ésta última realice parte de los servicios por los que la primera ha sido contratada directamente.","featured":false},{"id":88,"concept":"Suspensión del contrato de trabajo","definition":"Interrupción temporal de la prestación laboral y retributiva sin que quede extinguido el contrato","featured":true},{"id":89,"concept":"Técnico no titulado","definition":"Grupo profesional en el que no es necesaria la posesión de un título profesional","featured":false},{"id":90,"concept":"Técnico titulado","definition":"Grupo profesional asociado a la posesión de un título superior o medio","featured":false},{"id":91,"concept":"Trabajador","definition":"Persona física que voluntariamente presta sus servicios retribuidos por cuenta ajena y dentro del ámbito de organización y dirección de otra persona, física o jurídica denominada empleador o empresario","featured":false},{"id":92,"concept":"Traslado colectivo","definition":"El que afecte a la totalidad de trabajadores de un centro de trabajo, siempre que éste ocupe a más de cinco, o cuando en un plazo de noventa días afecte a un número de trabajadores de, al menos: Diez trabajadores, en las empresas que ocupan menos de cien trabajadores; El 10 por 100 del número de trabajadores de la empresa que ocupen entre cien y trescientos trabajadores; Treinta trabajadores en las empresas que ocupen trescientos o más trabajadores.","featured":true},{"id":93,"concept":"Traslado definitivo","definition":"El trabajador es destinado a un centro de trabajo de la misma empresa exigiendo un cambio de residencia de forma definitiva o cuando el desplazamiento exceda de doce meses en un período de tres años.","featured":false},{"id":94,"concept":"Víctima de violencia de género","definition":"A efectos laborales, se considera tal a la trabajadora que acredita tal situación mediante sentencia condenatoria, informe del Ministerio Fiscal, de los Servicios Sociales, o por cualquier otro título previsto por la normativa aplicable a las mismas","featured":true},{"id":95,"concept":"Voluntariedad","definition":"Decisión libre y no coaccionada de las partes de un contrato para celebrar el mismo","featured":false}],"config":{"title":"Flashcards UD03 LOGSE El contrato de trabajo","description":"Repasa las fichas y comprueba después lo que has aprendido.","subject":"General","filename":"flashcards-ud03-logse","outputMode":"both","startMode":"menu","colors":{"primary":"#55bf1d","accent":"#508505","front":"#ffffff","back":"#f8fafc","success":"#10b981","danger":"#ef4444","warning":"#f59e0b"},"reviewCards":100,"reviewOrder":"random","reviewRandomSelection":true,"reviewAutoFlip":5,"reviewTimer":true,"reviewSound":true,"reviewSaveProgress":true,"quizCards":25,"quizLives":3,"quizDirection":"learner","quizShuffle":true,"quizFeedback":true,"passPercent":75,"diploma":true}},cfg=DATA.config,cards=DATA.cards,content=document.getElementById('content'),stats=document.getElementById('stats'),homeBtn=document.getElementById('homeBtn');var app={screen:'',review:null,quiz:null,results:null,timer:null,auto:null,transition:null,chosenDirection:'concept-to-definition'};var difficultKey='quizlet-studio-difficult-'+DATA.id,progressKey='quizlet-studio-review-progress-'+DATA.id,difficultMemory=[],progressMemory=null;
function esc(v){var d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML}function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}function stop(){clearInterval(app.timer);clearTimeout(app.auto);clearTimeout(app.transition);app.timer=app.auto=app.transition=null}function setScreen(name,html){stop();app.screen=name;content.innerHTML=html;homeBtn.hidden=name==='home'&&cfg.outputMode==='both'}function setStats(html){stats.innerHTML=html||''}function notify(msg){var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},3000)}function elapsed(start){var s=Math.max(0,Math.floor((Date.now()-start)/1000)),m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0')}function readDifficult(){try{var raw=localStorage.getItem(difficultKey);if(raw!==null){var v=JSON.parse(raw||'[]');if(Array.isArray(v))difficultMemory=v.slice()}return difficultMemory.slice()}catch(e){return difficultMemory.slice()}}function writeDifficult(ids){difficultMemory=ids.slice();try{localStorage.setItem(difficultKey,JSON.stringify(ids))}catch(e){}}function readReviewProgress(){if(!cfg.reviewSaveProgress)return null;try{var raw=localStorage.getItem(progressKey);if(raw!==null){var v=JSON.parse(raw||'null');if(v&&typeof v==='object')progressMemory=v}return progressMemory?JSON.parse(JSON.stringify(progressMemory)):null}catch(e){return progressMemory?JSON.parse(JSON.stringify(progressMemory)):null}}function writeReviewProgress(data){if(!cfg.reviewSaveProgress)return;progressMemory=JSON.parse(JSON.stringify(data));try{localStorage.setItem(progressKey,JSON.stringify(data))}catch(e){}}function clearReviewProgress(clearDifficult){progressMemory=null;try{localStorage.removeItem(progressKey)}catch(e){}if(clearDifficult)writeDifficult([])}function resumableReview(){var p=readReviewProgress();if(!p||!Array.isArray(p.deckIds)||!p.dec function showHome(force){if(!force&&cfg.outputMode==='review'){showReviewStart();return}if(!force&&cfg.outputMode==='quiz'){showQuizStart();return}setStats('');var quizDisabled=cards.length<4;setScreen('home','<section class="screen center"><span class="eyebrow">'+esc(modeTitle())+'</span><h2>Elige cómo quieres trabajar</h2><p class="lead">'+esc(cfg.description)+'</p><div class="mode-grid"><button class="mode-card" id="reviewMode"><span class="icon">🔄</span><h3>Repasar las fichas</h3><p>Voltea cada ficha y marca lo que ya sabes o lo que necesitas volver a estudiar.</p></button><button class="mode-card" id="quizMode" '+(quizDisabled?'disabled':'')+'><span class="icon">🏆</span><h3>Probar mis conocimientos</h3><p>Responde preguntas con cuatro opciones y consigue tu diploma si alcanzas el '+cfg.passPercent+'%.</p>'+(quizDisabled?'<p><strong>Se necesitan 4 fichas.</strong></p>':'')+'</button></div><div class="summary"><span class="chip">🗂️ '+cards.length+' fichas</span><span class="chip">📚 '+esc(cfg.subject)+'</span></div></section>');document.getElementById('reviewMode').onclick=showReviewStart;if(!quizDisabled)document.getElementById('quizMode').onclick=showQuizStart}

function showReviewStart(){var difficult=readDifficult(),available=difficult.filter(function(id){return cards.some(function(c){return c.id===id})}).length,resume=resumableReview(),resumeButton=resume?'<button class="btn success" id="continueReview">▶ Continuar sesión ('+resume.remaining+' pendientes)</button>':'',canReset=!!resume||available>0;setStats('<span class="stat">🔄 Repaso</span><span class="stat">★ '+available+' pendientes</span>');setScreen('review-start','<section class="screen center"><span class="eyebrow">🔄 Modo repaso</span><h2>Estudia a tu ritmo</h2><p class="lead">'+esc(cfg.description)+'</p><div class="summary"><span class="chip">'+Math.min(cfg.reviewCards,cards.length)+' fichas por sesión</span><span class="chip">'+(cfg.reviewOrder==='random'?'Orden aleatorio':'Orden secuencial')+'</span><span class="chip">'+(cfg.reviewAutoFlip?'Volteo en '+cfg.reviewAutoFlip+' s':'Volteo manual')+'</span>'+(cfg.reviewSaveProgress?'<span class="chip">💾 Guardado local activo</span>':'')+'</div><div class="btns">'+resumeButton+'<button class="btn primary" id="reviewAll">Comenzar nuevo repaso</button><button class="btn warning" id="reviewDifficult" '+(available?'':'disabled')+'>Repasar difíciles ('+available+')</button>'+(cfg.reviewSaveProgress?'<button class="btn secondary" id="resetReview" '+(canReset?'':'disabled')+'>↺ Reiniciar progreso</button>':'')+'</div></section>');var continueBtn=document.getElementById('continueReview');if(continueBtn)continueBtn.onclick=resumeReview;document.getElementById('reviewAll').onclick=function(){startReview(false)};document.getElementById('reviewDifficult').onclick=function(){startReview(true)};var resetBtn=document.getElementById('resetReview');if(resetBtn)resetBtn.onclick=function(){if(confirm('¿Reiniciar el progreso? Se borrarán la sesión guardada y todas las fichas marcadas como difíciles.')){clearReviewProgress(true);app.review=null;notify('Progreso de repaso reiniciado');showReviewStart()}}}

function renderReviewCard(){var r=app.review;if(r.index>=r.deck.length){finishReview();return}var c=r.deck[r.index],pct=Math.round(r.index/r.deck.length*100);r.flipped=false;setScreen('review-card','<section class="screen center"><div class="progress"><span style="width:'+pct+'%"></span></div>'+(c.featured?'<div class="featured">★ Ficha destacada</div>':'')+'<div class="flip-wrap"><button class="flashcard" id="flashcard" aria-label="Voltear ficha"><span class="face front"><small>Concepto</small><strong>'+esc(c.concept)+'</strong><em>Haz clic o pulsa espacio para ver la definición</em></span><span class="face back"><small>Definición</small><strong>'+esc(c.definition)+'</strong><em>Haz clic para volver al concepto</em></span></button></div><div class="review-actions"><button class="btn success" id="learnedBtn">✓ Aprendida</button><button class="btn warning" id="difficultBtn">⚠ Necesito repasarla</button><button class="btn secondary" id="endReviewBtn">Terminar</button></div></section>');updateReviewStats();if(cfg.reviewTimer)app.timer=setInterval(updateReviewStats,1000);document.getElementById('flashcard').onclick=flipReview;document.getElementById('learnedBtn').onclick=function(){markReview(true)};document.getElementById('difficultBtn').onclick=function(){markReview(false)};document.getElementById('endReviewBtn').onclick=finishReview;if(cfg.reviewAutoFlip){app.auto=setTimeout(function(){if(app.screen==='review-card'&&!r.flipped)flipReview()},cfg.reviewAutoFlip*1000)}}
function flipReview(){var r=app.review,el=document.getElementById('flashcard');if(!r||!el)return;r.flipped=!r.flipped;el.classList.toggle('flipped',r.flipped);clearTimeout(app.auto);if(cfg.reviewSound)beep(620)}function beep(freq){try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return;var x=window.__qsuAudio||new C();window.__qsuAudio=x;var o=x.createOscillator(),g=x.createGain();o.frequency.value=freq;g.gain.setValueAtTime(.08,x.currentTime);g.gain.exponentialRampToValueAtTime(.001,x.currentTime+.18);o.connect(g);g.connect(x.destination);o.start();o.stop(x.currentTime+.19)}catch(e){}}
function markReview(learned){var r=app.review,c=r.deck[r.index],ids=readDifficult(),at=ids.indexOf(c.id);if(learned){r.learned++;if(at>=0)ids.splice(at,1);beep(820)}else{if(at<0)ids.push(c.id);r.difficult.push(c);beep(240)}writeDifficult(ids);r.index++;if(r.index>=r.deck.length)clearReviewProgress(false);else saveReviewProgress();app.transition=setTimeout(renderReviewCard,220)}function finishReview(){var r=app.review;if(!r){showReviewStart();return}clearReviewProgress(false);var time=elapsed(r.start),remaining=readDifficult().length,list=r.difficult.length?'<div class="difficult-list"><strong>Para volver a repasar:</strong>'+r.difficult.map(function(c){return'<div>⚠ <b>'+esc(c.concept)+'</b> — '+esc(c.definition)+'</div>'}).join('')+'</div>':'';setStats('<span class="stat">Sesión terminada</span>');setScreen('review-results','<section class="screen center"><span class="eyebrow">✓ Sesión completada</span><h2>Resumen del repaso</h2><div class="review-results"><div class="metric"><b>'+r.learned+'</b><span>Aprendidas</span></div><div class="metric"><b>'+r.difficult.length+'</b><span>Difíciles</span></div><div class="metric"><b>'+time+'</b><span>Tiempo</span></div></div>'+list+'<div class="btns"><button class="btn primary" id="newReview">Nueva sesión</button><button class="btn warning" id="againDifficult" '+(remaining?'':'disabled')+'>Repasar pendientes ('+remaining+')</button></div></section>');document.getElementById('newReview').onclick=function(){startReview(false)};document.getElementById('againDifficult').onclick=function(){startReview(true)}}
function showQuizStart(){if(cards.length<4){var missing=4-cards.length;setStats('<span class="stat">🏆 Evaluación</span><span class="stat">Faltan '+missing+' fichas</span>');setScreen('quiz-unavailable','<section class="screen center"><span class="eyebrow">⚠ Evaluación no disponible</span><h2>Se necesitan al menos 4 fichas</h2><p class="lead">Ahora hay '+cards.length+' ficha'+(cards.length===1?'':'s')+' completa'+(cards.length===1?'':'s')+'. Añade '+missing+' más en el editor para activar la evaluación.</p>'+(cfg.outputMode==='both'?'<div class="btns"><button class="btn secondary" id="backAvailable">Volver al menú</button></div>':'')+'</section>');var back=document.getElementById('backAvailable');if(back)back.onclick=function(){showHome(true)};return}var chooser=cfg.quizDirection==='learner'?'<div class="direction-grid"><button class="direction active" data-direction="concept-to-definition"><b>Concepto → definición</b><br><small>Lee el término y elige su explicación</small></button><button class="direction" data-direction="definition-to-concept"><b>Definición → concepto</b><br><small>Lee la explicación y elige el término</small></button></div>':'';setStats('<span class="stat">🏆 Evaluación</span><span class="stat">♥ '+cfg.quizLives+' vidas</span>');setScreen('quiz-start','<section class="screen center"><span class="eyebrow">🏆 Modo evaluación</span><h2>Comprueba lo que sabes</h2><p class="lead">Cada pregunta tiene cuatro opciones. Necesitas un '+cfg.passPercent+'% para superar la actividad'+(cfg.diploma?' y obtener el diploma':'')+'.</p>'+chooser+'<div class="summary"><span class="chip">'+Math.min(cfg.quizCards,cards.length)+' preguntas</span><span class="chip">'+cfg.quizLives+' vidas</span><span class="chip">Aprobado: '+cfg.passPercent+'%</span></div><div class="btns"><button class="btn primary" id="startQuiz">Comenzar evaluación</button></div></section>');if(cfg.quizDirection==='learner')document.querySelectorAll('.direction').forEach(function(b){b.onclick=function(){document.querySelectorAll('.direction').forEach(function(x){x.classList.remove('active')});b.classList.add('active');app.chosenDirection=b.dataset.direction}});document.getElementById('startQuiz').onclick=startQuiz}
function startQuiz(){var deck=cfg.quizShuffle?shuffle(cards):cards.slice();deck=deck.slice(0,Math.min(cfg.quizCards,deck.length));var direction=cfg.quizDirection==='learner'?app.chosenDirection:cfg.quizDirection;app.quiz={deck:deck,index:0,lives:cfg.quizLives,correct:0,answered:0,start:Date.now(),direction:direction,locked:false,current:null};renderQuestion()}
function makeQuestion(card){var q=app.quiz,dir=q.direction==='random'?(Math.random()<.5?'concept-to-definition':'definition-to-concept'):q.direction,question=dir==='concept-to-definition'?card.concept:card.definition,correct=dir==='concept-to-definition'?card.definition:card.concept,candidates=[],seen={};cards.forEach(function(c){var x=dir==='concept-to-definition'?c.definition:c.concept;if(x!==correct&&!seen[x]){seen[x]=1;candidates.push(x)}});candidates=shuffle(candidates).slice(0,3);var fillers=['Ninguna de las demás opciones','Todas las demás opciones','No corresponde a este concepto'];for(var i=0;candidates.length<3;i++)candidates.push(fillers[i]);var options=shuffle([correct].concat(candidates));return{card:card,direction:dir,question:question,correct:correct,options:options,correctIndex:options.indexOf(correct)}}
function quizStats(){var q=app.quiz,hearts='';for(var i=0;i<cfg.quizLives;i++)hearts+=i<q.lives?'♥':'♡';setStats('<span class="stat">'+hearts+'</span><span class="stat">✓ '+q.correct+'</span><span class="stat">'+Math.min(q.index+1,q.deck.length)+'/'+q.deck.length+'</span>')}
function renderQuestion(){var q=app.quiz;if(q.index>=q.deck.length||q.lives<=0){finishQuiz();return}q.locked=false;q.current=makeQuestion(q.deck[q.index]);var x=q.current,pct=Math.round(q.index/q.deck.length*100),label=x.direction==='concept-to-definition'?'Elige la definición correcta':'Elige el concepto correcto';setScreen('quiz-question','<section class="screen"><div class="progress"><span style="width:'+pct+'%"></span></div><div class="question">'+(x.card.featured?'<div class="featured">★ Término evaluable</div>':'')+'<small>'+label+' · Pregunta '+(q.index+1)+' de '+q.deck.length+'</small><h3>'+esc(x.question)+'</h3></div><div class="options">'+x.options.map(function(o,i){return'<button class="option" data-index="'+i+'" data-key="'+(i+1)+'">'+esc(o)+'</button>'}).join('')+'</div><div id="feedback"></div></section>');quizStats();document.querySelectorAll('.option').forEach(function(b){b.onclick=function(){answerQuiz(parseInt(b.dataset.index,10))}})}
function answerQuiz(index){var q=app.quiz;if(q.locked)return;q.locked=true;q.answered++;var x=q.current,ok=index===x.correctIndex;if(ok){q.correct++;beep(880)}else{q.lives--;beep(190)}document.querySelectorAll('.option').forEach(function(b){var i=parseInt(b.dataset.index,10);b.disabled=true;if(i===x.correctIndex)b.classList.add('correct');else if(i===index)b.classList.add('incorrect')});quizStats();var f=document.getElementById('feedback');if(cfg.quizFeedback)f.innerHTML='<div class="feedback '+(ok?'ok':'bad')+'">'+(ok?'✓ Correcto':'✗ Incorrecto. Respuesta correcta: '+esc(x.correct))+'</div>';app.transition=setTimeout(function(){q.index++;renderQuestion()},cfg.quizFeedback?1450:650)}
function finishQuiz(){var q=app.quiz,total=q.deck.length,percent=Math.round(q.correct/total*100),grade=Math.round(q.correct/total*100)/10,passed=percent>=cfg.passPercent,res={correct:q.correct,total:total,percent:percent,grade:grade,time:elapsed(q.start),passed:passed,id:'QSU-'+Date.now().toString(36).toUpperCase()};app.results=res;setStats('<span class="stat">Resultado: '+grade+'/10</span>');var cert=passed&&cfg.diploma?'<div class="certificate-box"><h3>🎓 Generar diploma</h3><p>Escribe tu nombre y apellidos tal como deben aparecer.</p><input id="studentName" placeholder="Nombre y apellidos" autocomplete="name"><div class="btns"><button class="btn warning" id="pdfBtn">Descargar diploma PDF</button><button class="btn secondary" id="printBtn">Ver / imprimir diploma</button></div></div>':'';setScreen('quiz-results','<section class="screen center"><span class="eyebrow">'+(passed?'✓ Actividad superada':'↻ Sigue practicando')+'</span><div class="result-score">'+grade+'<small style="font-size:25px">/10</small></div><div class="result-grade">'+(passed?'¡Enhorabuena!':'Aún no has alcanzado el '+cfg.passPercent+'%')+'</div><p class="lead">Has acertado '+q.correct+' de '+total+' preguntas ('+percent+'%) en '+res.time+'.</p><div class="review-results"><div class="metric"><b>'+q.correct+'/'+total+'</b><span>Aciertos</span></div><div class="metric"><b>'+percent+'%</b><span>Precisión</span></div><div class="metric"><b>'+q.lives+'</b><span>Vidas restantes</span></div></div>'+cert+'<div class="btns"><button class="btn primary" id="retryQuiz">Intentar de nuevo</button><button class="btn secondary" id="quizMenu">Volver</button></div></section>');document.getElementById('retryQuiz').onclick=startQuiz;document.getElementById('quizMenu').onclick=goHome;if(passed&&cfg.diploma){document.getElementById('pdfBtn').onclick=function(){certificate(false)};document.getElementById('printBtn').onclick=function(){certificate(true)}}}
function certName(){var el=document.getElementById('studentName'),name=el?el.value.trim():'';if(name.length<3){notify('Escribe el nombre completo para el diploma');if(el)el.focus();return''}return name}function rgb(hex){hex=String(hex).replace('#','');if(hex.length===3)hex=hex.split('').map(function(x){return x+x}).join('');return[parseInt(hex.slice(0,2),16)||0,parseInt(hex.slice(2,4),16)||0,parseInt(hex.slice(4,6),16)||0]}function ascii(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^ -~]/g,'')}function fileName(s){return ascii(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'alumno'}
function certificate(printOnly){var name=certName(),r=app.results;if(!name)return;if(printOnly||!window.jspdf){showPrintable(name,r);if(!printOnly)notify('La biblioteca PDF no está disponible; usa Imprimir → Guardar como PDF');return}try{var jsPDF=window.jspdf.jsPDF,doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'}),p=rgb(cfg.colors.primary),a=rgb(cfg.colors.accent),ok=rgb(cfg.colors.success);doc.setFillColor(255,255,255);doc.rect(0,0,297,210,'F');doc.setDrawColor(p[0],p[1],p[2]);doc.setLineWidth(3);doc.rect(14,14,269,182);doc.setLineWidth(.7);doc.rect(19,19,259,172);doc.setFont('helvetica','bold');doc.setTextColor(p[0],p[1],p[2]);doc.setFontSize(30);doc.text('DIPLOMA DE APROVECHAMIENTO',148.5,39,{align:'center'});doc.setTextColor(a[0],a[1],a[2]);doc.setFontSize(19);doc.text(doc.splitTextToSize(ascii(cfg.title),220),148.5,55,{align:'center'});doc.setTextColor(55,65,81);doc.setFont('helvetica','normal');doc.setFontSize(14);doc.text('Se concede el presente diploma a',148.5,82,{align:'center'});doc.setFont('helvetica','bold');doc.setTextColor(p[0],p[1],p[2]);doc.setFontSize(27);doc.text(ascii(name).toUpperCase(),148.5,103,{align:'center'});doc.setDrawColor(a[0],a[1],a[2]);doc.line(55,109,242,109);doc.setFont('helvetica','normal');doc.setTextColor(55,65,81);doc.setFontSize(13);doc.text('por haber superado satisfactoriamente la actividad',148.5,122,{align:'center'});doc.setFont('helvetica','bold');doc.setTextColor(ok[0],ok[1],ok[2]);doc.setFontSize(20);doc.text('Calificacion: '+r.grade+' / 10',148.5,139,{align:'center'});doc.setFont('helvetica','normal');doc.setTextColor(100,116,139);doc.setFontSize(10);doc.text('Aciertos: '+r.correct+'/'+r.total+'   |   Precision: '+r.percent+'%   |   Tiempo: '+r.time,148.5,153,{align:'center'});doc.text('Fecha: '+new Date().toLocaleDateString('es-ES')+'   |   Materia: '+ascii(cfg.subject)+'   |   ID: '+r.id,148.5,169,{align:'center'});doc.save('diploma-'+fileName(name)+'.pdf');notify('Diploma descargado')}catch(e){notify('No se pudo crear el PDF: '+e.message);showPrintable(name,r)}}
function showPrintable(name,r){setStats('');setScreen('diploma','<section class="screen printable"><div class="diploma-page"><div class="seal">🎓</div><h2>DIPLOMA DE APROVECHAMIENTO</h2><h3>'+esc(cfg.title)+'</h3><p>Se concede el presente diploma a</p><div class="diploma-name">'+esc(name.toUpperCase())+'</div><div class="diploma-line"></div><p>por haber superado satisfactoriamente la actividad</p><h3 style="color:var(--ok)">Calificación: '+r.grade+' / 10</h3><p>Aciertos: '+r.correct+'/'+r.total+' · Precisión: '+r.percent+'% · Tiempo: '+r.time+'</p><p><small>'+new Date().toLocaleDateString('es-ES')+' · '+esc(cfg.subject)+' · ID: '+r.id+'</small></p></div><div class="btns diploma-controls"><button class="btn primary" id="doPrint">Imprimir / Guardar como PDF</button><button class="btn secondary" id="backResults">Volver a resultados</button></div></section>');document.getElementById('doPrint').onclick=function(){window.print()};document.getElementById('backResults').onclick=finishQuiz}
document.addEventListener('keydown',function(e){if(app.screen==='quiz-question'&&!app.quiz.locked&&/^[1-4]$/.test(e.key))answerQuiz(parseInt(e.key,10)-1);if(app.screen==='review-card'&&(e.key===' '||e.key==='Enter')){e.preventDefault();flipReview()}});window.addEventListener('beforeunload',function(){if(app.screen==='review-card')saveReviewProgress()});document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'&&app.screen==='review-card')saveReviewProgress()});function init(){if(!cards.length){setScreen('home','<section class="screen center"><h2>No hay fichas disponibles</h2></section>');return}if(cfg.outputMode==='both'){if(cfg.startMode==='review')showReviewStart();else if(cfg.startMode==='quiz'&&cards.length>=4)showQuizStart();else showHome(true)}else showHome(false)}init()})();
</script></body></html>
