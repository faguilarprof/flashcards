        "definition": "Cuando de los resultados de la empresa se desprenda una situación económica negativa, en casos como la existencia de pérdidas actuales o previstas, o la disminución persistente de su nivel de ingresos ordinarios o ventas. Se entenderá que la disminución es persistente si, durante tres trimestres consecutivos, el nivel de ingresos ordinarios o ventas de cada trimestre es inferior al registrado en el mismo trimestre del año anterior."
      },
      {
        "concept": "⚠️ ️ Causas objetivas",
        "definition": "⚠️ ️ Causas de extinción del contrato ajenas a la voluntad de las partes como ineptitud del trabajador, amortizaciones de puestos de trabajo, falta de adaptación del trabajador a las modificaciones técnicas, etc"
      },
      {
        "concept": "Causas organizativas del despido",
        "definition": "Cuando se produzcan cambios en el ámbito de los sistemas y métodos de trabajo del personal o en el modo de organizar la producción"
      },
      {
        "concept": "Causas Técnicas del despido",
        "definition": "Cuando se produzcan cambios en el ámbito de los medios o instrumentos de producción."
      },
      {
        "concept": "Centro especial de empleo",
        "definition": "Empresa cuyo objetivo principal es el de proporcionar a los trabajadores con discapacidad la realización de un trabajo productivo y remunerado, adecuado a sus características personales y que facilite la integración laboral de éstos en el mercado ordinario de trabajo."
      },
      {
        "concept": "Cesión de trabajadores",
        "definition": "Contrato de servicios entre las empresas, de puesta a disposición de los trabajadores de la empresa cedente a la empresa cesionaria."
      },
      {
        "concept": "Cesión ilegal de trabajadores",
        "definition": "Se produce cuando una empresa, que no sea una empresa de trabajo temporal (ETT), contrata a un trabajador exclusivamente para que trabaje para otra empresa"
      },
      {
        "concept": "Cierre patronal",
        "definition": "Medida de conflicto colectivo acordada por el empresario con efecto de suspender la relación laboral cuando exista peligo real para personas o bienes o se observe un funcionamiento anormal del proceso productivo"
      },
      {
        "concept": "⚠️ ️ Conciliación",
        "definition": "⚠️ ️ Mecanismo de autocomposición de conflictos mediante el cual las partes enfrentadas intentan alcanzar ante un tercero una transacción satisfactoria para ambos, evitándose la necesidad de acudir a un proceso judicial."
      },
      {
        "concept": "Contrat@",
        "definition": "Servicio web que permite a empresarios actuando en nombre propio y empresas y profesionales colegiados actuando en representación de terceros comunicar el contenido de la contratación laboral a los servicios públicos de empleo"
      },
      {
        "concept": "Contrata",
        "definition": "Aquel contrato en virtud del cual la parte contratista asume la obligación de realizar una obra o servicio a favor de la empresa principal o comitente y esta asume la obligación de pagar un precio"
      },
      {
        "concept": "Contratista",
        "definition": "Persona a la que se encarga la realización de una obra o servicio por medio de una contrata"
      },
      {
        "concept": "Contrato de formación en alternancia",
        "definition": "Tiene por objeto compatibilizar una actividad laboral retribuida con procesos formativos de formación profesional, estudios universitarios o del Catálogo de especialidades formativas del Sistema Nacional de Empleo."
      },
      {
        "concept": "⚠️ ️ Contrato de puesta a disposición",
        "definition": "⚠️ ️ Contrato de naturaleza mercantil que se otorga entre una Empresa de Trabajo Temporal (ETT) y la empresa usuaria, es decir, aquella que pretende contratar a uno o varios trabajadores a través de la ETT. Este contrato debe otorgarse por escrito y en el modelo oficial."
      },
      {
        "concept": "⚠️ ️ Contrato de relevo",
        "definition": "⚠️ ️ Aquel que se concierta con una persona desempleada o que tuviese concertado con la empresa un contrato de duración determinada, para sustituir la jornada dejada vacante por un trabajador de la empresa que accede a la jubilación parcial."
      },
      {
        "concept": "⚠️ ️ Contrato de trabajo",
        "definition": "⚠️ ️ Acuerdo entre empresario y trabajador para iniciar una relación laboral basada en la prestación de un servicio a cambio de una remuneración económica"
      },
      {
        "concept": "⚠️ ️ Contrato de trabajo a tiempo parcial",
        "definition": "⚠️ ️ Aquel contrato de trabajo en el que se haya acordado la prestación de servicios durante un número de horas al día, a la semana, al mes o al año inferior a la jornada de trabajo de un trabajador a tiempo completo comparable"
      },
      {
        "concept": "⚠️ ️ Contrato de trabajo de duración indefinida",
        "definition": "⚠️ ️ Aquel que se concierta sin establecer límites de tiempo en la prestación de los servicios, en cuanto a la duración del contrato"
      },
      {
        "concept": "⚠️ ️ Contrato de trabajo fijo discontinuo",
        "definition": "⚠️ ️ Se concierta para la realización de trabajos estacionales o vinculados a actividades de temporada, para el desarrollo de aquellos que no tengan dicha naturaleza pero que, siendo intermitentes, tengan periodos de ejecución ciertos, determinados o indeterminados."
      },
      {
        "concept": "⚠️ ️ Contrato de trabajo temporal",
        "definition": "⚠️ ️ Contrato de trabajo que establece límites de tiempo en la prestación de los servicios, la duración de la cual depende del objeto del contrato."
      },
      {
        "concept": "⚠️ ️ Contrato eventual por circunstancias de la producción",
        "definition": "⚠️ ️ Es un contrato temporal que tiene como objeto atender los desajustes de plantilla provocados por incrementos ocasionales de actividad ya sean estos previsibles o no."
      },
      {
        "concept": "⚠️ ️ Contrato para la obtención de la práctica profesional",
        "definition": "⚠️ ️ Contrato temporal cuyo objeto es la obtención por el trabajador de la práctica profesional adecuada al nivel de estudios cursados. No se trata únicamente de adquirir experiencia en un trabajo determinado, sino también de que esa experiencia actúe sobre los estudios cursados."
      },
      {
        "concept": "⚠️ ️ Contrato por sustitución de personas trabajadoras",
        "definition": "⚠️ ️ Contrato temporal cuya finalidad es sustituir a un trabajador de la empresa con derecho a reserva de puesto de trabajo. Se puede realizar también para cubrir temporalmente un puesto de trabajo durante un proceso de selección"
      },
      {
        "concept": "⚠️ ️ Contratos de trabajo de duración determinada.",
        "definition": "⚠️ ️ Aquellos que tienen como finalización prevista alguna de las causas o circunstancias recogidas en el Estatuto de los Trabajadores (art.15.1. LET)"
      },
      {
        "concept": "⚠️ ️ Contratos formativos",
        "definition": "⚠️ ️ Diseñados para facilitar la inserción laboral de los jóvenes y el empleo juvenil. Son dos: el contrato para la formación y el aprendizaje; y el contrato de trabajo en prácticas."
      },
      {
        "concept": "⚠️ ️ Convenio colectivo",
        "definition": "⚠️ ️ Acuerdo negociado libremente entre los representantes de los trabajadores y los empresarios por el que se establecen las condiciones de trabajo y productividad para un ámbito laboral y un periodo de tiempo determinado."
      },
      {
        "concept": "Dependencia",
        "definition": "Característica del contrato de trabajo en virtud del cual el trabajador presta servicios dentro del ámbito de organización y dirección del empresario"
      },
      {
        "concept": "⚠️ ️ Despido colectivo",
        "definition": "⚠️ ️ Extinción de contratos de trabajo fundada en causas económicas, técnicas, organizativas o de producción cuando, en un período de noventa días, la extinción afecte al menos a: a) Diez trabajadores, en las empresas que ocupen menos de cien trabajadores; b) El 10 % del número de trabajadores de la empresa en aquéllas que ocupen entre cien y trescientos trabajadores; c) Treinta trabajadores en las empresas que ocupen más de trescientos trabajadores."
      },
      {
        "concept": "⚠️ ️ Despido disciplinario",
        "definition": "⚠️ ️ Despido basado en el incumplimiento grave y culpable del trabajador"
      },
      {
        "concept": "⚠️ ️ Despido nulo",
        "definition": "⚠️ ️ Ineficacia del despido por las causas establecidas legalmente, cuya declaración tiene por efecto la inmediata readmisión del trabajador y el abono de los salarios dejados de percibir"
      },
      {
        "concept": "⚠️ ️ Despido por causas económicas",
        "definition": "⚠️ ️ Extinción de la relación laboral a voluntad del empresario como consecuencia de la existencia de pérdidas o disminución persistente de los ingresos o ventas"
      },
      {
        "concept": "⚠️ ️ Despido por causas objetivas",
        "definition": "⚠️ ️ Extinción de la relación laboral a voluntad del empresario por razón distinta al incumplimiento de una obligación laboral del trabajador, pudiendo ser ésta económica, técnica, organizativa o de producción"
      },
      {
        "concept": "⚠️ ️ Despido por fuerza mayor",
        "definition": "⚠️ ️ Extinción unilateral del contrato de trabajo basada en una circunstancia externa, impuesta e imprevisible que imposibilita la prestación y que ha sido autorizada por la Autoridad Laboral"
      },
      {
        "concept": "⚠️ ️ Despido procedente",
        "definition": "⚠️ ️ Extinción de la relación laboral a voluntad del empresario por incumplimiento acreditado de una obligación laboral del trabajador"
      },
      {
        "concept": "Desplazamiento temporal",
        "definition": "Cambio del centro de trabajo a población distinta a la de residencia habitual del trabajador cuando el tiempo de desplazamiento no exceda de doce meses en un periodo de tres años."
      },
      {
        "concept": "⚠️ ️ Dimisión",
        "definition": "⚠️ ️ Desistimiento, es decir, un negocio jurídico por el que se pone fin a una relación obligatoria, sin otra justificación que la propia voluntad. Equivale, aquí, a renunciar al contrato por parte del trabajador."
      },
      {
        "concept": "Empleo temporal",
        "definition": "Aquel empleo en el que el fin de la relación laboral o del contrato queda determinado por condiciones objeticas, tales como la expiración de cierto plazo, la realización de una tarea determinada, la reincorporación de un empleado al que se había reemplazado temporalmente"
      },
      {
        "concept": "⚠️ ️ Empresa de trabajo temporal",
        "definition": "⚠️ ️ Aquella empresa cuya actividad consiste en poner a disposición de otra empresa (usuaria), con carácter temporal, trabajadores por ella contratados."
      },
      {
        "concept": "Encadenamiento de contratos temporales",
        "definition": "Se permite formalizar varios contratos temporales con un mismo trabajador siempre que en un periodo de 24 meses no se superen los 18 de manera continua o discontinua para el mismo o distinto puesto, en la misma empresa o grupo de empresas, mediante dos o más contratos temporales de circunstancias de la producción, ya sea contratado directamente por la empresa o puesto a disposición por una ETT."
      },
      {
        "concept": "⚠️ ️ Excedencia",
        "definition": "⚠️ ️ Decisión tomada por el trabajador de suspender su relación con una empresa durante un período en el cual se va a dedicar a otras tareas, incluso podrá trabajar en otra empresa si lo desea."
      },
      {
        "concept": "⚠️ ️ Excedencia forzosa",
        "definition": "⚠️ ️ Esta excedencia se concede para poder ejercer funciones sindicales de ámbito provincial o superior, o ser nombrado o elegido para un cargo público que imposibilite asistir al trabajo. La duración de la excedencia es mientras dure el ejercicio del cargo. Se mantiene el puesto de trabajo y computa a efectos de antigüedad."
      },
      {
        "concept": "⚠️ ️ Excedencia por cuidado de familiares",
        "definition": "⚠️ ️ Casos de incapacidad o enfermedad grave de familiar hasta segundo grado. La duración máxima es de dos años y el periodo computa a efectos de antigüedad y asistencia a cursos de formación. Durante el primer año existe reserva de su puesto de trabajo; más adelante, la reserva se refiere a un puesto similar."
      },
      {
        "concept": "⚠️ ️ Excedencia voluntaria por cuidado de hijos",
        "definition": "⚠️ ️ En los casos de nacimiento, adopción o acogimiento de un menor. La duración máxima de la excedencia es de tres años."
      },
      {
        "concept": "⚠️ ️ Excedencia voluntaria por interés particular",
        "definition": "⚠️ ️ Se concede con al menos un año de antigüedad, y no haber disfrutado de otra excedencia en los cuatro años previos. La duración de la excedencia es por un mínimo de cuatro meses y un máximo de cinco años. Este tipo de excedencia no computa a efectos de antigüedad, cotizaciones o prestaciones sociales. En caso de vacante de igual o similar categoría, el trabajador excedente tiene un derecho preferencial a ocuparlo"
      },
      {
        "concept": "Falta de adaptación del trabajador a las modificaciones técnicas",
        "definition": "Deben estar referidas a su puesto de trabajo. siempre que dichos cambios sean razonables y hayan transcurrido como mínimo dos meses desde que se introdujo la modificación o desde que finalizó la formación dirigida a la adaptación"
      },
      {
        "concept": "⚠️ ️ Finiquito",
        "definition": "⚠️ ️ Recibo por el cual el trabajador y el empresario dan por terminada la relación laboral y liquidan todas las obligaciones pendientes.."
      },
      {
        "concept": "⚠️ ️ Fraude de ley",
        "definition": "⚠️ ️ Actos realizados al amparo de una norma jurídica que persigan actos contrarios al Ordenamiento Jurídico. No impedirán la correcta aplicación de la norma que se haya tratado de eludir"
      },
      {
        "concept": "Grupo profesional",
        "definition": "Tiene en cuenta las características del puesto de trabajo, las tareas que se van a desarrollar, responsabilidades, conocimientos requeridos, etc."
      },
      {
        "concept": "⚠️ ️ Huelga",
        "definition": "⚠️ ️ Paro voluntario en el trabajo por parte de los trabajadores con el fin de obtener ciertas mejoras laborales."
      },
      {
        "concept": "⚠️ ️ Incapacidad temporal",
        "definition": "⚠️ ️ Derivada de accidente o enfermedad, causa de suspensión del contrato de trabajo"
      },
      {
        "concept": "Incentivos a la contratación",
        "definition": "Medidas tomadas por la Administración para facilitar la contratación de ciertos grupos de trabajadores con dificultad de acceso al mercado de trabajo. Estas medidas favorecen a las empresas que van a contratar a un trabajador de estos grupos. Pueden ser de distintos tipos, principalmente: Subvenciones, Bonificaciones en las cuotas de Seguridad Social y deducciones en las cuotas de impuestos directos."
      },
      {
        "concept": "Ineptitud del trabajador",
        "definition": "Falta de capacidad para el desempeño del trabajo., conocida o sobrevenida con posterioridad a su colocación efectiva en la empresa. Si se conoce ésta durante el periodo de prueba, no se podrá alegar con posterioridad. La jurisprudencia admite tanto la física como la psíquica."
      },
      {
        "concept": "Ius variandi",
        "definition": "Facultad del empleador de modificar, unilateralmente, dentro de ciertos límites, las condiciones de la prestación de trabajo"
      },
      {
        "concept": "⚠️ ️ Modificación sustancial de condiciones de trabajo",
        "definition": "⚠️ ️ Se consideran tales, entre otras, las que afecten a las siguientes materias: Jornada de trabajo, horario y distribución del tiempo de trabajo Régimen de trabajo a turnos Sistemas de remuneración y cuantía salarial Sistema de trabajo y rendimiento. Funciones, cuando excedan de los límites que para la movilidad funcional"
      },
      {
        "concept": "⚠️ ️ Movilidad funcional",
        "definition": "⚠️ ️ Realización de funciones tanto superiores como inferiores, no correspondientes al grupo profesional y otras diferentes dentro del mismo grupo profesional"
      },
      {
        "concept": "Movilidad funcional horizontal",
        "definition": "Para que se produzca este cambio en las funciones del trabajador, el empresario no necesita alegar causa ni existe límite temporal, siempre que no se vulneren los derechos fundamentales del trabajador ni su dignidad. El trabajador percibirá la retribución correspondiente a las nuevas funciones que desempeñe, quedando en todo caso garantizada la retribución que venía percibiendo."
      },
      {
        "concept": "Movilidad funcional vertical ascendente",
        "definition": "Para que se produzca este cambio en las funciones del trabajador, cuando se produzca por un periodo superior a seis meses durante un año, u ocho meses durante dos, el trabajador tendrá derecho a: Percibir el salario correspondiente al grupo profesional mientras dure la situación. Reclamar que se cubra la vacante correspondiente a las funciones que desempeña, de acuerdo con el sistema de ascensos aplicable en la empresa. Ello no implica que al solicitante le vayan a conceder el ascenso."
      },
      {
        "concept": "Movilidad funcional vertical descendente",
        "definition": "Para que se produzca este cambio en las funciones del trabajador, deberá estar justificada por necesidades urgentes e imprevisibles de la actividad productiva. El empresario solo podrá mantener estas funciones por el tiempo imprescindible y se mantendrá el salario de origen."
      },
      {
        "concept": "⚠️ ️ Movilidad geográfica",
        "definition": "⚠️ ️ Traslado de la persona trabajadora, bien de forma definitiva o bien como desplazamiento temporal a otro centro de trabajo de otra localidad, que implique un cambio en su lugar de residencia habitual por razones técnicas, organizativas, económicas o de producción."
      },
      {
        "concept": "No avenencia",
        "definition": "Acto de conciliación en el que no se ha podido alcanzar un acuerdo que satisfaga a las partes. Queda expedita la vía judicial"
      },
      {
        "concept": "Pacto de no competencia",
        "definition": "Obliga al trabajador a no competir de manera desleal con el empleador durante el tiempo de prestación de servicios, y tras la extinción del contrato por cualquier causa. una vez extinguido el contrato, el pato no podrá durar más de 2 años para los técnicos o de seis meses para los demás trabajadores"
      },
      {
        "concept": "Pacto de permanencia",
        "definition": "Acuerdo entre trabajador y empresario por el cual el empleado se compromete voluntariamente a permanecer en la empresa el tiempo que se establezca en el pacto.El acuerdo no puede ser superior a dos años y siempre debe formalizarse por escrito"
      },
      {
        "concept": "Pacto de plena dedicación",
        "definition": "Supone que el trabajador se compromete a no trabajar en otras empresas, aun incluso en otro sector empresarial distinto. A cambio, el trabajador recibirá una remuneración que compensará económicamente esa exclusividad. El trabajador puede rescindir el pacto comunicándolo a la empresa, por escrito, con una antelación mínima de 30 días"
      },
      {
        "concept": "Papeleta de conciliación",
        "definition": "Escrito que presenta el trabajador ante el servicio administrativo correspondiente que recoge la solicitud de conciliación o mediación a fin de evitar un proceso laboral."
      },
      {
        "concept": "⚠️ ️ Periodo de prueba",
        "definition": "⚠️ ️ Periodo al inicio del contrato, en el cual el empresario va a evaluar si el trabajador reúne las condiciones necesarias para lo que fue contratado. En este periodo el trabajador también evaluará la conveniencia de la contratación."
      },
      {
        "concept": "⚠️ ️ Rescisión de contrato",
        "definition": "⚠️ ️ Extinción del contrato por voluntad de una de las partes"
      },
      {
        "concept": "⚠️ ️ Riesgo durante el embarazo",
        "definition": "⚠️ ️ Causa de suspensión procedente cuando la trabajadora embarazada ocupa un puesto de trabajo con riesgo para su salud o la del feto, y no se ha podido adaptar para hacerlo compatible con su estado, ni reubicarla a otro sin riesgo."
      },
      {
        "concept": "⚠️ ️ Riesgo durante la lactancia",
        "definition": "⚠️ ️ Causa de suspensión procedente cuando la madre lactante encuentra problemas derivados de su actividad laboral que pongan en riesgo la lactancia, como por ejemplo la compatibilidad de horarios o la toxicidad a la que está sometida en su puesto de trabajo. Cuando no es posible reubicar a la trabajadora en la empresa durante ese periodo en otro puesto que no suponga riesgo durante ese intervalo de tiempo, se verá obligada a cesar de forma temporal en la empresa"
      },
      {
        "concept": "Salarios de tramitación",
        "definition": "Cantidades que el trabajador deja de percibir desde la fecha de despido hasta la notificación de la sentencia que declarase la improcedencia o hasta que hubiera encontrado otro empleo"
      },
      {
        "concept": "⚠️ ️ SEPE",
        "definition": "⚠️ ️ Organismo autónomo de la Administración General del Estado al que se le encomienda la ordenación, desarrollo y seguimiento de los programas y medidas de la política de empleo, en el marco de lo establecido en esta ley."
      },
      {
        "concept": "Sistema Red",
        "definition": "Servicio que ofrece la TGSS a empresas, agrupaciones de empresas y profesionales, cuya misión es permitir el intercambio de información y documentos entre la TGSS y los usuarios a través de internet"
      },
      {
        "concept": "⚠️ ️ SMAC",
        "definition": "⚠️ ️ Organismo donde se lleva a cabo la Conciliación Previa en las reclamaciones de índole laboral. Todas las comunidades cuentan con una o varias oficinas del SMAC (en Aragón, el SAMA) y representa el paso previo y obligatorio antes de llegar al procedimiento judicial, impuesto por la Ley reguladora de la Jurisdicción Social."
      },
      {
        "concept": "Subcontrata",
        "definition": "Acuerdo por el que la parte contratista encarga a otra contratista la realización de determinadas obras o servicios."
      },
      {
        "concept": "Subcontratación",
        "definition": "Contrato mercantil en el que una empresa contrata a otra, para que ésta última realice parte de los servicios por los que la primera ha sido contratada directamente."
      },
      {
        "concept": "⚠️ ️ Suspensión del contrato de trabajo",
        "definition": "⚠️ ️ Interrupción temporal de la prestación laboral y retributiva sin que quede extinguido el contrato"
      },
      {
        "concept": "Técnico no titulado",
        "definition": "Grupo profesional en el que no es necesaria la posesión de un título profesional"
      },
      {
        "concept": "Técnico titulado",
        "definition": "Grupo profesional asociado a la posesión de un título superior o medio"
      },
      {
        "concept": "Trabajador",
        "definition": "Persona física que voluntariamente presta sus servicios retribuidos por cuenta ajena y dentro del ámbito de organización y dirección de otra persona, física o jurídica denominada empleador o empresario"
      },
      {
        "concept": "⚠️ ️ Traslado colectivo",
        "definition": "⚠️ ️ El que afecte a la totalidad de trabajadores de un centro de trabajo, siempre que éste ocupe a más de cinco, o cuando en un plazo de noventa días afecte a un número de trabajadores de, al menos: Diez trabajadores, en las empresas que ocupan menos de cien trabajadores; El 10 por 100 del número de trabajadores de la empresa que ocupen entre cien y trescientos trabajadores; Treinta trabajadores en las empresas que ocupen trescientos o más trabajadores."
      },
      {
        "concept": "Traslado definitivo",
        "definition": "El trabajador es destinado a un centro de trabajo de la misma empresa exigiendo un cambio de residencia de forma definitiva o cuando el desplazamiento exceda de doce meses en un período de tres años."
      },
      {
        "concept": "⚠️ ️ Víctima de violencia de género",

      },
      {
        "concept": "Voluntariedad",
        "definition": "Decisión libre y no coaccionada de las partes de un contrato para celebrar el mismo"
      }
    ]
  }
};

function StandaloneFlashcardsGame(config) {
    config = config || {};
    this.cards = Array.isArray(config.cards) ? config.cards : [];
    this.lives = parseInt(config.lives) || 3;
    this.cardsPerGame = parseInt(config.cardsPerGame) || Math.min(this.cards.length, 10);
    this.mode = config.mode || "concept-to-definition";
    this.shuffleCards = config.shuffleCards !== false;
    this.enableReview = config.enableReview !== false;
    this.showFeedback = config.showFeedback !== false;
    this.gameTitle = config.gameTitle || "Flashcards Interactivas";
    this.gameDescription = config.gameDescription || "Aprende y memoriza conceptos importantes";
    this.pointsPerCorrect = parseInt(config.pointsPerCorrect) || 10;
    this.pointsMultiplier = parseFloat(config.pointsMultiplier) || 1.0;
    this.customColors = config.customColors || {
        primary: "#dc006a",
        selection: "#ff69b4",
        border: "#c6005d",
        light: "#ffe6f2"
    };
    this.state = {
        gameActive: false,
        currentLives: this.lives,
        score: 0,
        currentRound: 0,
        totalRounds: 0,
        startTime: null,
        cardsToReview: [],
        currentQuestion: null,
        answeredQuestions: 0,
        correctAnswers: 0,
        selectedCards: []
    };
    this._validateCards();
}

StandaloneFlashcardsGame.prototype._validateCards = function() {
    if (!Array.isArray(this.cards)) {
        throw new Error("Las cartas deben ser un array");
    }
    var self = this;
    this.cards = this.cards.map(function(card) {
        if (!card || typeof card !== "object") return null;
        var conceptStr = card.concept ? String(card.concept).trim() : "";
        var definitionStr = card.definition ? String(card.definition).trim() : "";
        var warningChar = "\u26A0\uFE0F";
        var isEvaluableConcept = conceptStr.indexOf(warningChar) === 0;
        var isEvaluableDefinition = definitionStr.indexOf(warningChar) === 0;
        var newCard = {
            concept: isEvaluableConcept ? conceptStr.substring(warningChar.length).trim() : conceptStr,
            definition: isEvaluableDefinition ? definitionStr.substring(warningChar.length).trim() : definitionStr,
            evaluable: isEvaluableConcept || isEvaluableDefinition
        };
        return newCard;
    }).filter(function(card) {
        return card && card.concept && card.definition;
    });
    if (this.cards.length < 4) {
        throw new Error("Se necesitan al menos 4 cartas validas. Encontradas: " + this.cards.length);
    }
};

StandaloneFlashcardsGame.prototype._shuffleArray = function(array) {
    var shuffled = array.slice();
    for (var i = shuffled.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = shuffled[i];
        shuffled[i] = shuffled[j];
        shuffled[j] = temp;
    }
    return shuffled;
};

StandaloneFlashcardsGame.prototype._getWrongOptions = function(correctAnswer, count) {
    var self = this;
    var wrong = [];
    var allCards = this.cards.filter(function(card) {
        var candidate = self.mode === "concept-to-definition" ? card.definition : card.concept;
        return candidate !== correctAnswer && candidate.trim() !== "";
    });
    var shuffledCards = this._shuffleArray(allCards.slice());
    for (var i = 0; i < shuffledCards.length; i++) {
        if (wrong.length >= count) break;
        var card = shuffledCards[i];
        var wrongAnswer = this.mode === "concept-to-definition" ? card.definition : card.concept;
        if (wrong.indexOf(wrongAnswer) === -1 && wrongAnswer !== correctAnswer) {
            wrong.push(wrongAnswer);
        }
    }
    while (wrong.length < count) {
        var genericOption = "Opcion " + (wrong.length + 1);
        if (wrong.indexOf(genericOption) === -1 && genericOption !== correctAnswer) {
            wrong.push(genericOption);
        }
    }
    return wrong.slice(0, count);
};

StandaloneFlashcardsGame.prototype._formatTime = function(ms) {
    var seconds = Math.floor(ms / 1000);
    var minutes = Math.floor(seconds / 60);
    var remainingSeconds = seconds % 60;
    if (minutes > 0) {
        return minutes + "m " + remainingSeconds + "s";
    }
    return remainingSeconds + "s";
};

StandaloneFlashcardsGame.prototype.initializeGame = function() {
    if (this.cards.length < 4) {
        throw new Error("Se necesitan al menos 4 cartas para jugar");
    }
    this.state = {
        gameActive: true,
        currentLives: this.lives,
        score: 0,
        currentRound: 0,
        totalRounds: Math.min(this.cardsPerGame, this.cards.length),
        startTime: Date.now(),
        cardsToReview: [],
        currentQuestion: null,
        answeredQuestions: 0,
        correctAnswers: 0,
        selectedCards: []
    };
    var cardsToPlay = this.cards.slice();
    if (this.shuffleCards) {
        cardsToPlay = this._shuffleArray(cardsToPlay);
    }
    this.state.selectedCards = cardsToPlay.slice(0, this.state.totalRounds);
    return this.getNextQuestion();
};

StandaloneFlashcardsGame.prototype.getNextQuestion = function() {
    if (!this.state.gameActive) {
        return null;
    }
    if (this.enableReview && this.state.cardsToReview.length > 0 && this.state.currentRound >= this.state.totalRounds) {
        if (this.state.cardsToReview.length === 0) return null;
        var card = this.state.cardsToReview.shift();
        var questionData = this._createQuestionData(card, true);
        this.state.currentQuestion = questionData;
        return questionData;
    }
    if (this.state.currentRound >= this.state.totalRounds) {
        return null;
    }
    var card = this.state.selectedCards[this.state.currentRound];
    this.state.currentRound++;
    var questionData = this._createQuestionData(card, false);
    this.state.currentQuestion = questionData;
    return questionData;
};

StandaloneFlashcardsGame.prototype._createQuestionData = function(card, isReview) {
    isReview = isReview || false;
    var isConceptToDef = this.mode === "concept-to-definition";
    var question = isConceptToDef ? card.concept : card.definition;
    var correctAnswer = isConceptToDef ? card.definition : card.concept;
    var isEvaluable = card.evaluable;
    if (isEvaluable) {
        var warningSymbol = '<span class="evaluable-symbol">\u26A0\uFE0F</span>';
        question = warningSymbol + question;
    }
    var wrongOptions = this._getWrongOptions(correctAnswer, 3);
    var allOptions = [correctAnswer].concat(wrongOptions);
    var options = this._shuffleArray(allOptions);
    var totalQuestions = this.state.totalRounds + (this.enableReview ? this.state.cardsToReview.length : 0);
    var currentProgress = this.state.currentRound + (this.state.totalRounds - this.state.cardsToReview.length);
    var progress = totalQuestions > 0 ? Math.round((currentProgress / totalQuestions) * 100) : 0;
    return {
        question: question,
        options: options,
        correctAnswer: correctAnswer,
        questionNumber: this.state.currentRound,
        totalQuestions: totalQuestions,
        progress: progress,
        isReview: isReview,
        isEvaluable: isEvaluable,
        lives: this.state.currentLives,
        score: this.state.score,
        concept: card.concept,
        definition: card.definition,
        originalCard: card
    };
};

StandaloneFlashcardsGame.prototype.checkAnswer = function(selectedAnswer) {
    if (!this.state.gameActive || !this.state.currentQuestion) {
        return { valid: false, error: "No hay pregunta activa" };
    }
    if (!this.state.currentQuestion.correctAnswer) {
        console.error("currentQuestion:", this.state.currentQuestion);
        return { valid: false, error: "Error interno" };
    }
    this.state.answeredQuestions++;
    var cleanSelectedAnswer = selectedAnswer.trim();
    var cleanCorrectAnswer = this.state.currentQuestion.correctAnswer.trim();
    var isCorrect = cleanSelectedAnswer === cleanCorrectAnswer;
    if (isCorrect) {
        this.state.correctAnswers++;
        var pointsEarned = this.pointsPerCorrect * this.pointsMultiplier;
        this.state.score += pointsEarned;
        return {
            valid: true,
            isCorrect: true,
            pointsEarned: pointsEarned,
            currentScore: this.state.score,
            livesRemaining: this.state.currentLives,
            gameOver: false
        };
    } else {
        this.state.currentLives--;
        if (this.enableReview) {
            var cardToReview = this.state.currentQuestion.originalCard || {
                concept: this.state.currentQuestion.concept,
                definition: this.state.currentQuestion.definition,
                evaluable: this.state.currentQuestion.isEvaluable
            };
            var self = this;
            var alreadyInReview = this.state.cardsToReview.some(function(card) {
                return card.concept === cardToReview.concept;
            });
            if (!alreadyInReview) {
                this.state.cardsToReview.push(cardToReview);
            }
        }
        var gameOver = this.state.currentLives <= 0;
        if (gameOver) {
            this.state.gameActive = false;
        }
        return {
            valid: true,
            isCorrect: false,
            correctAnswer: this.state.currentQuestion.correctAnswer,
            currentScore: this.state.score,
            livesRemaining: this.state.currentLives,
            gameOver: gameOver,
            addedToReview: this.enableReview
        };
    }
};

StandaloneFlashcardsGame.prototype.endGame = function() {
    this.state.gameActive = false;
    var timePlayed = Date.now() - this.state.startTime;
    var accuracy = this.state.answeredQuestions > 0 ? Math.round((this.state.correctAnswers / this.state.answeredQuestions) * 100) : 0;
    var grade, message;
    var perfectScore = this.state.totalRounds * this.pointsPerCorrect;
    var scorePercentage = perfectScore > 0 ? (this.state.score / perfectScore) * 100 : 0;
    if (scorePercentage >= 90 && this.state.currentLives === this.lives) {
        grade = "Perfecto!";
        message = "Dominaste completamente el material. Excelente trabajo!";
    } else if (scorePercentage >= 70) {
        grade = "Muy bien";
        message = "Buen rendimiento. Ya dominas la mayoria de los conceptos.";
    } else if (scorePercentage >= 50) {
        grade = "Aprobado";
        message = "Conoces los conceptos basicos. Podrias practicar un poco mas.";
    } else {
        grade = "Necesitas repasar";
        message = "Es recomendable revisar el material antes de intentarlo nuevamente.";
    }
    var scoreOutOf10 = perfectScore > 0 ? Math.min(10, Math.round((this.state.score / perfectScore) * 10)) : 0;
    return {
        finalScore: this.state.score,
        maxPossibleScore: perfectScore,
        scoreOutOf10: scoreOutOf10,
        livesRemaining: this.state.currentLives,
        totalRounds: this.state.totalRounds,
        correctAnswers: this.state.correctAnswers,
        accuracy: accuracy,
        grade: grade,
        message: message,
        timePlayed: timePlayed,
        timePlayedFormatted: this._formatTime(timePlayed),
        cardsToReview: this.state.cardsToReview.length,
        gameTitle: this.gameTitle,
        passed: scorePercentage >= 50
    };
};

StandaloneFlashcardsGame.prototype.changeMode = function(newMode) {
    var validModes = ["concept-to-definition", "definition-to-concept"];
    if (validModes.indexOf(newMode) !== -1) {
        this.mode = newMode;
        return true;
    }
    return false;
};

function escapeHTML(text) {
    if (text === null || text === undefined) return "";
    var div = document.createElement("div");
    div.textContent = String(text);
    return div.innerHTML;
}

function showMessage(message, type) {
    var messageDiv = document.createElement("div");
    messageDiv.className = "status-message " + type;
    var iconClass = "info-circle";
    if (type === "error") iconClass = "exclamation-circle";
    else if (type === "warning") iconClass = "exclamation-triangle";
    else if (type === "success") iconClass = "check-circle";
    messageDiv.innerHTML = '<i class="fas fa-' + iconClass + '"></i>' + escapeHTML(message);
    var gameContent = document.getElementById("gameContent");
    gameContent.insertBefore(messageDiv, gameContent.firstChild);
    setTimeout(function() {
        if (messageDiv.parentNode) {
            messageDiv.parentNode.removeChild(messageDiv);
        }
    }, 5000);
}

function initGame() {
    try {
        var cardsToUse = EMBEDDED_FLASHCARDS_DATA.content.cards || [];
        if (cardsToUse.length < 4) {
            showNoCardsScreen("Se necesitan al menos 4 cartas validas");
            return;
        }
        game = new StandaloneFlashcardsGame({
            cards: cardsToUse,
            mode: EMBEDDED_FLASHCARDS_DATA.config.mode || "concept-to-definition",
            cardsPerGame: EMBEDDED_FLASHCARDS_DATA.config.cardsPerGame || 10,
            enableReview: EMBEDDED_FLASHCARDS_DATA.config.enableReview !== false,
            showFeedback: EMBEDDED_FLASHCARDS_DATA.config.showFeedback !== false,
            shuffleCards: EMBEDDED_FLASHCARDS_DATA.config.shuffleCards !== false,
            gameTitle: EMBEDDED_FLASHCARDS_DATA.config.gameTitle || "Flashcards",
            gameDescription: EMBEDDED_FLASHCARDS_DATA.config.gameDescription || "",
            lives: EMBEDDED_FLASHCARDS_DATA.config.lives || 3,
            pointsPerCorrect: EMBEDDED_FLASHCARDS_DATA.config.pointsPerCorrect || 10,
            pointsMultiplier: EMBEDDED_FLASHCARDS_DATA.config.pointsMultiplier || 1.0,
            customColors: EMBEDDED_FLASHCARDS_DATA.config.customColors || {
                primary: "#dc006a",
                selection: "#ff69b4",
                border: "#c6005d",
                light: "#ffe6f2"

function selectGameMode(mode) {
    var modeCards = document.querySelectorAll(".mode-card");
    for (var i = 0; i < modeCards.length; i++) {
        modeCards[i].classList.remove("active");
    }
    document.querySelector('[data-mode="' + mode + '"]').classList.add("active");
    game.changeMode(mode);
}

function startGame() {
    gameActive = true;
    selectedAnswer = null;
    currentQuestion = game.initializeGame();
    if (!currentQuestion) {
        showNoCardsScreen("Error al iniciar");
        return;
    }
    renderQuestion(currentQuestion);
}

function renderQuestion(questionData) {
    var gameContent = document.getElementById("gameContent");
    var optionsHTML = "";
    for (var i = 0; i < questionData.options.length; i++) {
        optionsHTML += '<div class="option" data-index="' + i + '">';
        optionsHTML += '<div class="option-number">' + (i + 1) + '</div>';
        optionsHTML += '<div class="option-content">' + escapeHTML(questionData.options[i]) + '</div>';
        optionsHTML += '</div>';
    }
    var reviewNote = "";
    if (questionData.isReview) {
        reviewNote = '<div class="review-note"><i class="fas fa-redo"></i> Repaso</div>';
    }
    var html = "";
    html += '<div class="game-screen">';
    html += '<div class="progress-bar-container">';
    html += '<div class="progress-bar" style="width: ' + questionData.progress + '%"></div>';
    html += '<div class="progress-label">' + questionData.progress + '%</div>';
    html += '</div>';
    html += '<div class="question-container">';
    html += reviewNote;
    html += '<div class="question-text">' + questionData.question + '</div>';
    html += '<div class="question-hint">Pregunta ' + questionData.questionNumber + ' de ' + questionData.totalQuestions + '</div>';
    html += '</div>';
    html += '<div class="options-container" id="optionsContainer">';
    html += optionsHTML;
    html += '</div>';
    html += '<div class="controls">';
    html += '<button class="btn btn-secondary" id="menuBtn">';
    html += '<i class="fas fa-home"></i> Menu';
    html += '</button>';
    html += '<div class="keyboard-hint">Usa teclas 1-4</div>';
    html += '</div>';
    html += '</div>';
    gameContent.innerHTML = html;
    updateUI();
    var options = document.querySelectorAll(".option");
    for (var j = 0; j < options.length; j++) {
        options[j].addEventListener("click", function() {
            if (!gameActive || selectedAnswer !== null) return;
            var answer = this.querySelector(".option-content").textContent;
            selectAnswer(answer, this);
        });
    }
    document.getElementById("menuBtn").addEventListener("click", showStartScreen);
    document.removeEventListener("keydown", handleKeyboardInput);
    document.addEventListener("keydown", handleKeyboardInput);
}

function selectAnswer(answer, element) {
    if (!gameActive || selectedAnswer !== null) return;
    selectedAnswer = answer;
    var options = document.querySelectorAll(".option");
    for (var i = 0; i < options.length; i++) {
        options[i].classList.add("disabled");
        options[i].style.cursor = "not-allowed";
        options[i].classList.remove("selected");
    }
    element.classList.add("selected");
    element.classList.add("selected-answer");
    var result = game.checkAnswer(answer);
    if (result.valid) {
        showFeedback(result);
    }
}

function handleKeyboardInput(event) {
    if (!gameActive || selectedAnswer !== null) return;
    var key = event.key;
    if (key >= "1" && key <= "4") {
        var index = parseInt(key) - 1;
        var option = document.querySelector('.option[data-index="' + index + '"]');
        if (option) {
            var answer = option.querySelector(".option-content").textContent;
            selectAnswer(answer, option);
        }
    }
}

function showFeedback(result) {
    var gameScreen = document.querySelector(".game-screen");
    var optionsContainer = document.getElementById("optionsContainer");
    var feedbackHTML = "";
    if (result.isCorrect) {
        feedbackHTML = '<div class="feedback correct">';
        feedbackHTML += '<div class="feedback-header">';
        feedbackHTML += '<i class="fas fa-check-circle"></i>';
        feedbackHTML += '<span>Correcto!</span>';
        feedbackHTML += '</div>';
        feedbackHTML += '<div class="points-earned">+' + result.pointsEarned + ' puntos</div>';
        feedbackHTML += '</div>';
    } else {
        var reviewNoteHTML = "";
        if (result.addedToReview) {
            reviewNoteHTML = '<div class="review-note"><i class="fas fa-redo"></i> Agregada a repaso</div>';
        }
        feedbackHTML = '<div class="feedback incorrect">';
        feedbackHTML += '<div class="feedback-header">';
        feedbackHTML += '<i class="fas fa-times-circle"></i>';
        feedbackHTML += '<span>Incorrecto</span>';
        feedbackHTML += '</div>';
        feedbackHTML += '<div class="correct-answer">Correcta: ' + escapeHTML(result.correctAnswer) + '</div>';
        feedbackHTML += reviewNoteHTML;
        feedbackHTML += '</div>';
    }
    var feedbackDiv = document.createElement("div");
    feedbackDiv.innerHTML = feedbackHTML;
    gameScreen.insertBefore(feedbackDiv, optionsContainer.nextSibling);
    var options = document.querySelectorAll(".option");
    for (var i = 0; i < options.length; i++) {
        var optionContent = options[i].querySelector(".option-content").textContent.trim();
        var correctAnswerClean = result.correctAnswer ? result.correctAnswer.trim() : "";
        
        // Primero, limpiar clases de color anteriores
        options[i].classList.remove("correct", "incorrect");
        
        // Marcar la respuesta correcta en VERDE (siempre)
        if (optionContent === correctAnswerClean) {
            options[i].classList.add("correct");
        }
        // Marcar la respuesta seleccionada en ROJO (solo si es incorrecta)
        else if (options[i].classList.contains("selected") && !result.isCorrect) {
            options[i].classList.add("incorrect");
        }
        
        // Limpiar la clase de selección visual
        if (options[i].classList.contains("selected")) {
            options[i].classList.remove("selected-answer");
        }
    }
    updateUI();
    setTimeout(function() {
        if (result.gameOver) {
            showResults();
        } else {
            nextQuestion();
        }
    }, 2000);
}

function nextQuestion() {
    selectedAnswer = null;
    currentQuestion = game.getNextQuestion();
    if (!currentQuestion) {
        showResults();
    } else {
        renderQuestion(currentQuestion);
    }
}

function updateUI() {
    var livesDisplay = document.getElementById("livesDisplay");
    if (livesDisplay && game) {
        livesDisplay.innerHTML = "";
        for (var i = 0; i < game.lives; i++) {
            var heart = document.createElement("i");
            heart.className = "fas fa-heart heart";
            heart.dataset.index = i;
            if (i >= game.state.currentLives) {
                heart.classList.add("lost");
            }
            livesDisplay.appendChild(heart);
        }
    }
    var scoreDisplay = document.getElementById("scoreDisplay");
    if (scoreDisplay && game) {
        scoreDisplay.textContent = game.state.score;
    }
    var progressDisplay = document.getElementById("progressDisplay");
    if (progressDisplay && currentQuestion) {
        progressDisplay.textContent = currentQuestion.questionNumber + "/" + currentQuestion.totalQuestions;
    }
}

function showResults() {
    gameActive = false;
    currentResults = game.endGame();

    var certificateButton = "";

    html += '<div class="score-grade">';
    html += '<i class="fas fa-award"></i>';

// Funcion para limpiar texto para PDF
function cleanTextForPDF(text) {
    if (!text) return "";
    var str = String(text);
    var replacements = {
        "\u00e1": "a", "\u00e9": "e", "\u00ed": "i", "\u00f3": "o", "\u00fa": "u",
        "\u00c1": "A", "\u00c9": "E", "\u00cd": "I", "\u00d3": "O", "\u00da": "U",
        "\u00f1": "n", "\u00d1": "N",
        "\u00fc": "u", "\u00dc": "U",
        "\u00bf": "", "\u00a1": "",
        "\u0060": "'", "\u00b4": "'",
        "\u00ab": "\"", "\u00bb": "\"",
        "\u201c": "\"", "\u201d": "\"",
        "\u2018": "'", "\u2019": "'"
    };
    for (var key in replacements) {
        if (replacements.hasOwnProperty(key)) {
            str = str.split(key).join(replacements[key]);
        }
    }
    var result = "";
    for (var i = 0; i < str.length; i++) {
        var charCode = str.charCodeAt(i);
        if (charCode >= 0 && charCode <= 127) {
            result += str.charAt(i);
        }
    }
    return result.replace(/  +/g, " ").trim();
}

function generateCertificate(studentName, results) {
    try {
        if (typeof window.jspdf === "undefined") {
            console.error("jsPDF no esta disponible");
            showMessage("Error: No se puede generar el certificado. La libreria PDF no esta disponible.", "error");
            return false;
        }
        var jsPDF = window.jspdf.jsPDF;
        var doc = new jsPDF({
            orientation: "landscape",
            unit: "mm",
            format: "a4",
            compress: true
        });
        var COLOR_PRIMARY = [220, 0, 106];
        var COLOR_SECONDARY = [255, 105, 180];
        var COLOR_SUCCESS = [16, 185, 129];
        var COLOR_TEXT = [55, 65, 81];
        var COLOR_LIGHT = [156, 163, 175];
        var COLOR_BACKGROUND = [255, 255, 255];
        doc.setFillColor(COLOR_BACKGROUND[0], COLOR_BACKGROUND[1], COLOR_BACKGROUND[2]);
        doc.rect(0, 0, 297, 210, "F");
        doc.setDrawColor(COLOR_PRIMARY[0], COLOR_PRIMARY[1], COLOR_PRIMARY[2]);
        doc.setLineWidth(3);
        doc.rect(15, 15, 267, 180);
        doc.setFontSize(32);
        doc.setTextColor(COLOR_PRIMARY[0], COLOR_PRIMARY[1], COLOR_PRIMARY[2]);
        doc.setFont("helvetica", "bold");
        var certificateTitle = cleanTextForPDF("CERTIFICADO DE APROVECHAMIENTO");
        doc.text(certificateTitle, 148.5, 40, { align: "center" });
        var activityTitle = cleanTextForPDF(results.gameTitle || "Actividad Educativa");
        doc.setFontSize(20);
        doc.setTextColor(COLOR_SECONDARY[0], COLOR_SECONDARY[1], COLOR_SECONDARY[2]);
        doc.setFont("helvetica", "bold");
        var titleLines = doc.splitTextToSize(activityTitle, 220);
        var titleY = 55;
        for (var t = 0; t < titleLines.length && t < 2; t++) {
            doc.text(titleLines[t], 148.5, titleY, { align: "center" });
            titleY += 9;
        }
        doc.setDrawColor(COLOR_SECONDARY[0], COLOR_SECONDARY[1], COLOR_SECONDARY[2]);
        doc.setLineWidth(1);
        doc.line(50, titleY + 5, 247, titleY + 5);
        var contentY = titleY + 18;
        doc.setFontSize(14);
        doc.setTextColor(COLOR_TEXT[0], COLOR_TEXT[1], COLOR_TEXT[2]);
        doc.setFont("helvetica", "normal");
        doc.text(cleanTextForPDF("Se otorga el presente certificado a:"), 148.5, contentY, { align: "center" });
        doc.setFontSize(26);
        doc.setTextColor(COLOR_PRIMARY[0], COLOR_PRIMARY[1], COLOR_PRIMARY[2]);
        doc.setFont("helvetica", "bold");
        var cleanStudentName = cleanTextForPDF(studentName);
        doc.text(cleanStudentName.toUpperCase(), 148.5, contentY + 18, { align: "center" });
        doc.setFontSize(14);
        doc.setTextColor(COLOR_TEXT[0], COLOR_TEXT[1], COLOR_TEXT[2]);
        doc.setFont("helvetica", "normal");
        doc.text(cleanTextForPDF("Por haber completado satisfactoriamente la actividad"), 148.5, contentY + 32, { align: "center" });
        var scoreY = contentY + 50;
        doc.setFontSize(18);
        doc.setTextColor(COLOR_SUCCESS[0], COLOR_SUCCESS[1], COLOR_SUCCESS[2]);
        doc.setFont("helvetica", "bold");
        doc.text("Puntuacion: " + results.scoreOutOf10 + " / 10", 148.5, scoreY, { align: "center" });
        if (results.passed) {
            doc.setFontSize(16);
            doc.text("Enhorabuena! Has superado esta actividad", 148.5, scoreY + 12, { align: "center" });
        }
        var detailsY = scoreY + 30;
        doc.setFontSize(11);
        doc.setTextColor(COLOR_LIGHT[0], COLOR_LIGHT[1], COLOR_LIGHT[2]);
        doc.setFont("helvetica", "normal");
        var today = new Date();
        var formattedDate = today.toLocaleDateString("es-ES", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        });
        doc.text("Fecha: " + formattedDate, 50, detailsY);
        doc.text("Aciertos: " + results.correctAnswers + "/" + results.totalRounds, 247, detailsY, { align: "right" });
        doc.text("Precision: " + results.accuracy + "%", 50, detailsY + 7);
        doc.text("Tiempo: " + results.timePlayedFormatted, 247, detailsY + 7, { align: "right" });
        var certificateId = "FLASH-" + Date.now().toString(36).toUpperCase() + "-" + Math.random().toString(36).substr(2, 4).toUpperCase();
        doc.setFontSize(9);
        doc.text("Certificado generado automaticamente - Actividad Interactiva de FOL | ID: " + certificateId, 148.5, detailsY + 18, { align: "center" });
        var cleanFileName = cleanStudentName.toLowerCase().replace(/ +/g, "-").replace(/[^a-z0-9-]/g, "");
        var fileName = "certificado-" + cleanFileName + ".pdf";
        doc.save(fileName);
        return true;
    } catch (error) {
        console.error("Error al generar certificado:", error);
        showMessage("Error al generar el certificado: " + error.message, "error");
        return false;
    }
}
