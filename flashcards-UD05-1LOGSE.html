round:color-mix(in srgb,var(--p) 10%,white);font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.08em}h2{margin:15px 0 8px;color:var(--p);font-size:32px;letter-spacing:-.04em}.lead{margin:0 auto 24px;max-width:680px;color:var(--muted);font-size:17px;line-height:1.55}.mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:28px 0}.mode-card{padding:25px;border:1px solid var(--line);border-radius:18px;background:#fff;text-align:left;box-shadow:0 12px 30px rgba(15,23,42,.07);transition:.2s}.mode-card:hover:not(:disabled){transform:translateY(-4px);border-color:var(--p);box-shadow:0 18px 38px color-mix(in srgb,var(--p) 17%,transparent)}.mode-card .icon{font-size:38px}.mode-card h3{margin:12px 0 5px;font-size:21px}.mode-card p{margin:0;color:var(--muted);line-height:1.5}.mode-card:disabled{opacity:.5;cursor:not-allowed}.summary{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:20px 0}.chip{padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:12px;font-weight:750}.btns{display:flex;justify-content:center;gap:11px;flex-wrap:wrap;margin-top:24px}.btn{border:0;border-radius:11px;padding:12px 20px;font-weight:800;transition:.2s}.btn:hover:not(:disabled){transform:translateY(-2px)}.btn:disabled{opacity:.45}.primary{color:#fff;background:linear-gradient(135deg,var(--p),var(--a));box-shadow:0 10px 24px color-mix(in srgb,var(--p) 28%,transparent)}.secondary{color:#334155;background:#fff;border:1px solid var(--line)}.success{color:#fff;background:var(--ok)}.warning{color:#fff;background:var(--warn)}.danger{color:#fff;background:var(--bad)}.progress{height:12px;margin-bottom:22px;border-radius:999px;background:#e2e8f0;overflow:hidden}.progress span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--p),var(--a));transition:width .35s}.featured{display:inline-flex;padding:6px 10px;margin-bottom:10px;border-radius:999px;color:#92400e;background:#fe stion small{color:var(--muted);font-weight:750}.question h3{margin:13px 0 0;font-size:27px;line-height:1.38}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.option{position:relative;min-height:90px;padding:20px 16px 16px 48px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-weight:700;text-align:left}.option:hover:not(:disabled){border-color:var(--p);transform:translateY(-2px)}.option:before{content:attr(data-key);position:absolute;left:13px;top:13px;display:grid;place-items:center;width:25px;height:25px;border-radius:50%;color:var(--p);background:#eef2ff;font-size:11px}.option.correct{color:#065f46;border-color:var(--ok);background:#d1fae5}.option.incorrect{color:#7f1d1d;border-color:var(--bad);background:#fee2e2}.feedback{margin-top:14px;padding:14px;border-radius:12px;text-align:center;font-weight:800}.feedback.ok{color:#065f46;background:#d1fae5}.feedback.bad{color:#7f1d1d;background:#fee2e2}.result-score{font-size:72px;font-weight:900;line-height:1;color:var(--p);margin:25px 0 8px}.result-grade{font-size:22px;font-weight:850}.certificate-box{margin-top:24px;padding:20px;border:2px solid #fcd34d;border-radius:17px;background:linear-gradient(135deg,#fffbeb,#fff)}.certificate-box input{width:min(450px,100%);padding:12px;border:1px solid #d6b661;border-radius:10px}.diploma-page{padding:38px;border:8px double var(--p);border-radius:7px;background:#fff;text-align:center}.diploma-page .seal{font-size:50px}.diploma-page h2{font-size:34px}.diploma-name{margin:26px 0 8px;color:var(--p);font:900 33px Georgia,serif}.diploma-line{width:70%;height:2px;margin:8px auto 22px;background:var(--a)}.toast{position:fixed;right:18px;bottom:18px;z-index:10;max-width:360px;padding:13px 16px;border-radius:11px;color:#fff;background:#334155;box-shadow:0 14px 35px rgba(0,0,0,.25)}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:720px){body{padding:7px}.app{border-radius:16px;min-height:96vh}.head{align-items:flex-start;flex-direction:column}.content{padding:20px 14px}.mode-grid,.options,.direction-grid{grid-template-columns:1fr}.flip-wrap{height:280px}.face strong{font-size:23px}.review-results{grid-template-columns:1fr}.stats{max-width:100%}h2{font-size:27px}.question h3{font-size:22px}}@media print{body{padding:0;background:#fff}.app>header,.diploma-controls{display:none!important}.app{box-shadow:none;border:0}.content{padding:0}.screen:not(.printable){display:none}.diploma-page{min-height:190mm;display:flex;flex-direction:column;justify-content:center}.toast{display:none}}

<script>
(function(){'use strict';var DATA={"id":"qsu-mu3uc5zw-yf9p3n","cards":[{"id":1,"concept":"Accidente de trabajo","definition":"Toda lesión corporal que el trabajador sufra con ocasión o por consecuencia del trabajo que ejecute por cuenta ajena.","featured":true},{"id":2,"concept":"Accidente no laboral","definition":"Lesión o alteración de la salud derivada de accidente siempre que éste no sea consecuencia del trabajo realizado. Le corresponde la acción protectora en la misma forma que en la enfermedad común, sin exigencia de periodo previo de cotización, salvo para acceder a pensiones de incapacidad permanente absoluta o gran invalidez, o de muerte y supervivencia, desde situaciones de no-alta.","featured":true},{"id":3,"concept":"Acción protectora","definition":"Conjunto de prestaciones, en dinero o en especie, que el Sistema de la Seguridad Social establece para prever, reparar o superar los estados de necesidad nacidos o derivados de las contingencias o situaciones sufridas por los sujetos protegidos y determinadas en la Ley.","featured":false},{"id":4,"concept":"Acogimiento","definition":"Institución que tiene como fin la protección necesaria para la guarda de los menores en situación de desamparo, o por solicitud de padres y tutores, en circunstancias graves. Es una de las situaciones protegidas, mediante los subsidios por maternidad y paternidad","featured":false},{"id":5,"concept":"Acta de infracción","definition":"Documento por el que la Inspección de Trabajo y Seguridad Social inicia el procedimiento sancionador en el que se constatan los hechos y fundamentos de derecho en que se basa la sanción, cuyo importe también se indica, derivada del incumplimiento de normas laborales o de seguridad social.","featured":true},{"id":6,"concept":"Acta de liquidación","definition":"Documento por el que la Inspección de Trabajo y Seguridad Social inicia la tramitación de expedientes liquidatorios por deudas a la Seguridad Social en los supuestos en que legalmente proceden.","featured":true},{"id":7,"concept":"Adopción","definition":"Acto jurídico por el que se concede la patria potestad sobre un menor, creando vínculos jurídicos de parentesco análogos a la filiación.","featured":false},{"id":8,"concept":"Afiliación","definition":"Acto administrativo de la Tesorería General de la Seguridad Social por el que se realiza la incorporación al Sistema de la Seguridad Social de un sujeto protegido, lo que le convierte en titular de derechos y obligaciones con el mismo.","featured":true},{"id":9,"concept":"Alta de oficio","definition":"Alta que se produce por llegar a conocimiento de la TGSS la existencia de una persona que debiendo figurar en alta en el sistema, por cumplir los requisitos, no lo está.","featured":false},{"id":10,"concept":"Alta de pleno derecho","definition":"Los trabajadores por cuenta ajena y asimilados, incluidos en el campo de aplicación de los regímenes del Sistema de la Seguridad Social, se considerarán, de pleno derecho, en situación de alta en los mismos, a efectos de accidentes de trabajo y enfermedades profesionales y desempleo, aunque su empresario hubiere incumplido sus obligaciones al respecto","featured":false},{"id":11,"concept":"Alta en Seguridad Social","definition":"Comunicación a la Tesorería General de la Seguridad Social de la incorporación de un trabajador a una actividad que le convierte en un sujeto protegido del Sistema de Seguridad Social.","featured":true},{"id":12,"concept":"Alta especial","definition":"La que tiene lugar en supuestos de huelga, cierre patronal y otras situaciones que puedan determinarse y tiene los efectos que fije la norma que hubiere establecido este tipo de alta.","featured":false},{"id":13,"concept":"Alta médica","definition":"Declaración médica, mediante parte médico, en las situaciones de incapacidad temporal, tras el reconocimiento del trabajador, que establece la plena aptitud para el trabajo o el alta con propuesta de invalidez.","featured":true},{"id":14,"concept":"Asignación económica por hijo o menor acogido a cargo","definition":"Prestación familiar, de modalidad no contributiva, de carácter económico, que se reconoce en determinadas condiciones, por cada hijo menor de 18 años o, cuando siendo mayor de dicha edad, está afectado por una discapacidad, en un grado igual o superior al 65 por 100, a cargo del beneficiario","featured":false},{"id":15,"concept":"Asistencia jurídica gratuita","definition":"Derecho a participar gratuitamente en los pleitos laborales y de Seguridad Social por parte de los trabajadores, beneficiarios, Entidades Gestoras y otras personas, en los términos reconocidos por las leyes.","featured":false},{"id":16,"concept":"Autónomo","definition":"Trabajador por cuenta propia, mayor de 18 años, que realiza de forma habitual, personal y directa, una actividad económica a título lucrativo, en territorio nacional, sin sujeción por ella a contrato de trabajo y aunque utilice el servicio remunerado de otras personas, sea o no titular de la empresa,","featured":true},{"id":17,"concept":"Auxilio por defunción","definition":"Prestaciones por muerte y supervivencia, consistente en una cantidad a tanto alzado que para el año 2019 asciende a 46,50 euros, actualizándose a partir de ese año con arreglo al índice de precios al consumo (IPC), para hacer frente a los gastos de sepelio a quien los haya soportado.","featured":false},{"id":18,"concept":"Baja en Seguridad Social","definition":"Comunicación obligatoria que debe hacer el empresario cuando un trabajador cesa en la empresa o el trabajador por cuenta propia cuando éste cesa en su actividad profesional.","featured":true},{"id":19,"concept":"Baja médica","definition":"Declaración médica, mediante el parte médico expedido por el facultativo del Servicio Público de Salud, o de la Mutua colaboradora con la Seguridad Social Profesionales, que determina la baja en el trabajo, y en su caso, el derecho a la prestación económica por incapacidad temporal.","featured":true},{"id":20,"concept":"Base reguladora","definition":"Uno de los factores que intervienen en el cálculo de las prestaciones económicas de la Seguridad Social y consiste en fijar una cuantía u obtener un resultado a través de una fórmula de cálculo determinada en función de las bases por las que se hayan efectuado las cotizaciones durante los periodos que se señalan para cada prestación,","featured":true},{"id":21,"concept":"Bases de cotización","definition":"Son las cantidades sobre las que se aplican los tipos de cotización para la obtención de las cuotas de la Seguridad Social, que los sujetos responsables ingresan en el Sistema y que constituyen su principal recurso económico.","featured":true},{"id":22,"concept":"Centro de trabajo","definition":"Unidad productiva con organización específica, que sea dada de alta, como tal, ante la autoridad laboral.","featured":false},{"id":23,"concept":"Cese de actividad","definition":"Situación en la que pueden encontrarse los trabajadores autónomos y que ha sido objeto de un sistema específico de protección, mediante una prestación por cese de actividad, a la que pueden acogerse estos trabajadores voluntariamente, y que garantiza los principios de contributividad, solidaridad y sostenibilidad financiera.","featured":true},{"id":24,"concept":"Cierre patronal","definition":"Derecho por el que se permite al empresario el cierre del centro de trabajo y, por tanto, la suspensión del contrato de trabajo, lo que suspende asimismo las obligaciones recíprocas de trabajar y de percibir el salario y la cotización a la Seguridad Social, entre otros derechos. Los trabajadores permanecen en situación de alta especial durante el cierre patronal.","featured":false},{"id":25,"concept":"Código cuenta de cotización","definition":"Código numérico que la Tesorería General de la Seguridad Social asigna a los empresarios y demás sujetos responsables del pago de cuotas al Sistema de la Seguridad Social.","featured":true},{"id":26,"concept":"Complemento de gran invalidez","definition":"Cuantía que se abona al pensionista de gran invalidez, destinada a que pueda remunerar a la persona que le atienda.","featured":false},{"id":27,"concept":"Contingencias comunes","definition":"Aquéllas que no guardan relación con el desempeño de una actividad laboral","featured":true},{"id":28,"concept":"Contingencias profesionales","definition":"Se derivan, directa o indirectamente, del trabajo.","featured":true},{"id":29,"concept":"Cotización","definition":"Obligación contributiva impuesta a empresarios y trabajadores para el sostenimiento de las cargas económicas de la Seguridad Social.","featured":true},{"id":30,"concept":"Cuidado de menores afectados por una enfermedad grave","definition":"Prestación económica para los progenitores, adoptantes, guardadores con fines de adopción o acogedores con carácter permanente, en aquellos casos en que ambos trabajen, para el cuidado de un menor a su cargo afectado por cáncer u otra enfermedad grave que requiera ingreso hospitalario de larga duración. Exige una reducción de jornada de al menos un 50 por ciento para dedicarse al cuidado directo, continuo y permanente del menor.","featured":false},{"id":31,"concept":"Desempleo","definition":"Situación protegida de quienes, pudiendo y queriendo trabajar, pierden su empleo, o ven reducida su jornada de trabajo, y que atribuye un posible derecho a prestaciones económicas, bien como prestación o como subsidio.","featured":true},{"id":32,"concept":"Empresario","definition":"Toda persona natural o jurídica, aunque su actividad no esté motivada por ánimo de lucro, a la que prestan servicios, con la consideración de trabajadores por cuenta ajena, las personas incluidas en el campo de aplicación de cualquier Régimen de la Seguridad Social.","featured":false},{"id":33,"concept":"Enfermedad común","definition":"Alteración de la salud que no tenga la condición de accidente no laboral, accidente de trabajo o enfermedad profesional.","featured":true},{"id":34,"concept":"Enfermedad profesional","definition":"Enfermedad contraída a consecuencia del trabajo ejecutado por cuenta ajena en las actividades especificadas como causantes de la misma en el cuadro de Enfermedades Profesionales aprobado por el Ministerio de Empleo y Seguridad Social, y que esté provocada por la acción de los elementos o sustancias que en dicho cuadro se indican para cada enfermedad profesional.","featured":true},{"id":35,"concept":"Entidades Gestoras","definition":"Entidades públicas con personalidad jurídica que, bajo la dirección y tutela de los respectivos departamentos ministeriales, efectúan la gestión y administración de las prestaciones y servicios que son competencia de la Seguridad Social.","featured":true},{"id":36,"concept":"Equipo de Valoración de Incapacidades (EVI)","definition":"Órgano colegiado formado por distintos profesionales, existente en cada Dirección Provincial del INSS (excepto en las de Cataluña), que tiene como función, entre otras, examinar la situación de incapacidad del trabajador y formular al Director Provincial el dictamen-propuesta, preceptivo y no vinculante, en materia de anulación o disminución de la capacidad para el trabajo, la procedencia o no de revisión, la determinación del carácter común o profesional de la enfermedad, etc.","featured":false},{"id":37,"concept":"Excedencia por cuidado de hijos","definition":"Derecho individual de los trabajadores, hombres o mujeres, de duración no superior a tres años para atender el cuidado de cada hijo, por naturaleza o adopción, guarda con fines de adopción o acogimiento familiar, a contar desde la fecha de nacimiento o, en su caso, de la resolución judicial o administrativa","featured":false},{"id":38,"concept":"Gran invalidez","definition":"Incapacidad permanente cuando, por consecuencia de pérdidas anatómicas o funcionales, se necesita la asistencia de otra persona para los actos más esenciales de la vida, tales como vestirse, desplazarse, comer o análogos.","featured":false},{"id":39,"concept":"Grupo de cotización","definition":"Cada uno de los actuales 11 grupos, de los 12 establecidos en el Decreto que inicialmente los creó, en los que se clasifican, a efectos de cotización a la Seguridad Social, las categorías profesionales existentes en las distintas Reglamentaciones de Trabajo","featured":true},{"id":40,"concept":"Hecho causante","definition":"Aquél que da lugar a la realización de la contingencia o situación protegida y que ha sido fijado por la ley o por el reglamento en fecha determinada (por ejemplo, la muerte para la pensión de viudedad, el cumplimiento de la edad y el cese en el trabajo para la pensión de jubilación,","featured":true},{"id":41,"concept":"IMSERSO","definition":"Entidad Gestora de la Seguridad Social dotada de personalidad jurídica, a la que se encomienda la gestión de las pensiones no contributivas, y la de los servicios complementarios de las prestaciones del Sistema de la Seguridad Social orientadas fundamentalmente a los colectivos de la tercera edad, personas con discapacidad y otros. En Aragón, sus atribuciones están transferida al IASS.","featured":true},{"id":42,"concept":"Incapacidad permanente absoluta","definition":"La que inhabilita por completo al trabajador para toda profesión u oficio. La pensión es del 100% de la base reguladora.","featured":false},{"id":43,"concept":"Incapacidad permanente parcial","definition":"La que, sin alcanzar el grado de total, ocasione al trabajador una disminución non inferior al 33% en su rendimiento normal para la profesión habitual, sin impedirle la realización de las tareas fundamentales de la misma. La prestación consiste en una cantidad a tanto alzado.","featured":false},{"id":44,"concept":"Incapacidad permanente total","definition":"La que inhabilita al trabajador para la realización de todas o de las fundamentales tareas de su profesión habitual, siempre que pueda dedicarse a otra distinta.","featured":false},{"id":45,"concept":"Incapacidad permanente","definition":"Distintos estados de la reducción, disminución o anulación de la capacidad de trabajo del interesado, que pueden constituir incapacidad permanente parcial, total, absoluta y de gran invalidez, y que pueden atribuir derechos a prestaciones de diversa cuantía.Situación del trabajador que, después de haber estado sometido al tratamiento prescrito y de haber sido dado de alta médicamente, presenta reducciones anatómicas o funcionales graves, susceptibles de determinación objetiva y previsiblemente definitivas, que disminuyan o anulen su capacidad laboral, y que puede causar derecho a una prestación de cuantía variable según su grado","featured":true},{"id":46,"concept":"Incapacidad temporal","definition":"Situación de enfermedad común o profesional y accidente, sea o no de trabajo, que puede atribuir el derecho a un subsidio mientras se reciba asistencia sanitaria de la Seguridad Social y se esté impedido para el trabajo, con una duración máxima","featured":true},{"id":47,"concept":"Indemnización por lesiones permanentes no invalidantes","definition":"Prestación económica abonable, conforme a un baremo establecido, por una sola vez, a causa de la existencia de lesiones permanentes que no impiden trabajar, producidas por contingencia profesional y que no llegan a alcanzar un grado de incapacidad.","featured":false},{"id":48,"concept":"Informe de vida laboral","definition":"Contiene información respecto de las situaciones de alta o baja de una persona en el conjunto de los distintos regímenes del sistema de la Seguridad Social, durante toda su vida de trabajo.","featured":false},{"id":49,"concept":"INGESA","definition":"Entidad Gestora de la Seguridad Social, con personalidad jurídica propia a la que se atribuye la gestión de las prestaciones sanitarias de la Seguridad Social en el ámbito de las Ciudades de Ceuta y Melilla. En Aragón, sus atribuciones están transferidas al SALUD","featured":true},{"id":50,"concept":"Inscripción de empresas","definition":"Acto administrativo por el que la Tesorería General de la Seguridad Social, a solicitud de un empresario, realiza su inscripción en el Sistema de la Seguridad Social, que será válida durante la existencia de la persona natural o jurídica, o del ente empleador solicitante","featured":true},{"id":51,"concept":"INSS","definition":"Entidad Gestora con personalidad jurídica propia, cuya competencia genérica se extiende a la gestión y administración de las prestaciones económicas del Sistema de la Seguridad Social","featured":true},{"id":52,"concept":"IPREM","definition":"Indicador o referencia del nivel de renta que sirve para determinar la cuantía de determinadas prestaciones o para acceder a determinados beneficios, prestaciones o servicios públicos, sustituyendo al salario mínimo interprofesional en esta función","featured":false},{"id":53,"concept":"ISM","definition":"Entidad Gestora de la Seguridad Social en materia de las prestaciones correspondientes a los trabajadores integrados en el Régimen Especial de los Trabajadores del Mar","featured":true},{"id":54,"concept":"Jubilación anticipada","definition":"Jubilación que se concede en ciertos casos antes de cumplir la edad legal que en cada caso resulte aplicable, con o sin aplicación de porcentajes de reducción de su cuantía.","featured":true},{"id":55,"concept":"Jubilación para mayores de la edad ordinaria","definition":"Cuando se acceda a la pensión con posterioridad a la edad que en cada caso resulte aplicable, el trabajador podrá percibir un porcentaje adicional del 2 por 100 de la cuantía resultante, por cada año completo cotizado entre la fecha en que cumplió dicha edad y la del hecho causante,","featured":false},{"id":56,"concept":"Jubilación parcial","definition":"La iniciada después del cumplimiento de la edad exigida según los periodos cotizados en el momento del hecho causante simultánea con un contrato de trabajo a tiempo parcial y vinculada con un contrato de relevo celebrado con un trabajador en situación de desempleo o que tenga concertado con la empresa un contrato de duración determinada.","featured":true},{"id":57,"concept":"Jubilación","definition":"Pensión vitalicia reconocida al trabajador que, una vez alcanzada la edad legal, cesa (o ya había cesado) en el trabajo, habiendo cumplido los requisitos exigidos. Existen distintas clases o tipos de jubilación.","featured":true},{"id":58,"concept":"Lesiones permanentes no invalidantes","definition":"Lesiones, mutilaciones y deformidades de carácter definitivo, causadas por accidentes de trabajo o enfermedades profesionales que, sin llegar a constituir una incapacidad permanente, supongan una disminución o alteración de la integridad física del trabajador y aparezcan recogidas en el baremo anejo a las disposiciones de desarrollo de la Ley General de la Seguridad Social,","featured":false},{"id":59,"concept":"Mejoras voluntarias","definition":"Aumento voluntario de las cotizaciones o de las prestaciones sociales en la forma y condiciones que autorizan las normas reglamentarias del Régimen General y de los regímenes especiales de la Seguridad Social.","featured":false},{"id":60,"concept":"Modalidad contributiva","definition":"De carácter eminentemente profesional, destinada a la protección de los trabajadores cotizantes","featured":true},{"id":61,"concept":"Modalidad no contributiva","definition":"Se dirige a la protección de quienes, acreditando una situación de carencia o insuficiencia de recursos, no han cotizado nunca al Sistema de la Seguridad Social o no han cotizado lo suficiente para acceder a prestaciones del nivel contributivo","featured":true},{"id":62,"concept":"Modelo TA. 0521","definition":"Solicitud de alta / baja / variación de datos en el Régimen Especial de Autónomos","featured":true},{"id":63,"concept":"Modelo TA.1","definition":"Solicitud de Afiliación a la Seguridad Social, Asignación de número de Seguridad Social y Variación de datos","featured":false},{"id":64,"concept":"Modelo TA.2/S","definition":"Alta, Baja, Variación de datos del trabajador por cuenta Ajena","featured":true},{"id":65,"concept":"Modelo TA.6","definition":"Solicitud de inscripción en el sistema de la Seguridad Social.","featured":false},{"id":66,"concept":"Mutua","definition":"Asociación voluntaria de empresas que gestionan servicios relacionados con la atención a su plantilla en caso de AT y EP. No pueden generar beneficios económicos a sus asociados.","featured":true},{"id":67,"concept":"Nacimiento y cuidado de menor","definition":"Prestación que cubre las siguientes situaciones: el nacimiento, la adopción, guarda con fines de adopción y el acogimiento familiar. Estas situaciones originan el derecho a la suspensión del contrato de trabajo, así como el derecho a una prestación económica a cargo de la Seguridad Social.","featured":true},{"id":68,"concept":"Número de afiliación","definition":"El nº que la Tesorería General de la Seguridad Social asigna al trabajador, sea por cuenta ajena o propia, cuando causa alta inicial en la Seguridad Social. Tiene carácter vitalicio y único para el Sistema de la Seguridad Social en todo el territorio nacional.","featured":true},{"id":69,"concept":"Orfandá","definition":"Pensión que perciben los hijos del causante fallecido, cualquiera que sea la naturaleza legal de su filiación, y los aportados al matrimonio por el cónyuge sobreviviente, (si reúnen los demás requisitos exigidos), siempre que, al fallecer el causante, sean menores de veintiún años o estén incapacitados para el trabajo y que el causante se encontrase en alta o situación asimilada al alta.","featured":false},{"id":70,"concept":"Pago delegado","definition":"Forma de colaboración obligatoria consistente en el pago, por delegación de la Entidad gestora, de las prestaciones correspondientes a la incapacidad temporal.","featured":false},{"id":71,"concept":"Pensión compensatoria","definition":"Compensación consistente en una pensión temporal o por tiempo indefinido, o en una prestación única, según se determine en el convenio regulador o en la sentencia, que se abona al cónyuge al que la separación o el divorcio produzca un desequilibrio económico en relación con la posición del otro, que implique un empeoramiento en su situación anterior en el matrimonio.","featured":false},{"id":72,"concept":"Pensiones","definition":"Prestaciones económicas de la Seguridad Social, de pago periódico y de duración normalmente vitalicia o hasta que el beneficiario alcance una edad predeterminada.","featured":true},{"id":73,"concept":"Período de carencia","definition":"Periodo exigido en general, salvo excepciones, entre otros requisitos, para tener derecho a las prestaciones de la Seguridad Social.","featured":true},{"id":74,"concept":"Persona a cargo","definition":"Persona que convive y depende económicamente del trabajador o beneficiario de una prestación y que puede atribuir mayor cuantía de la referida prestación (por ejemplo: complementos por mínimos en las pensiones de jubilación y viudedad).","featured":false},{"id":75,"concept":"Pluriactividad","definition":"Situación del trabajador que desarrolla su trabajo en dos o más actividades que obligan a la inclusión en distintos Regímenes de la Seguridad Social, por lo que ha de considerarse si reúne los requisitos que cada Régimen tenga establecidos.","featured":false},{"id":76,"concept":"Pluriempleo","definition":"Situación del trabajador que desarrolla su actividad en dos o más empresas del mismo Régimen.","featured":false},{"id":77,"concept":"Póliza","definition":"Declaración anexa de la entidad gestora y/o la entidad o entidades colaboradoras por las que opta tanto a la protección por accidentes de trabajo y enfermedades profesionales como a la cobertura de la prestación económica por IT derivada de contingencias comunes.","featured":false},{"id":78,"concept":"Prescripción","definition":"Lapso de tiempo, transcurrido el cual sin interrupción válida, se extinguen los derechos y las acciones no ejercitadas.","featured":false},{"id":79,"concept":"Prestación en favor de familiares","definition":"Prestación (pensión o subsidio) establecida en favor de ciertos familiares del trabajador o pensionista fallecido, que han convivido con él y bajo su dependencia económica.","featured":false},{"id":80,"concept":"Prestaciones económicas","definition":"Derechos de contenido dinerario que corresponden al beneficiario cuando concurren las condiciones exigidas para su adquisición.","featured":false},{"id":81,"concept":"Primas de Accidentes de Trabajo y Enfermedades Profesionales","definition":"Cuotas que deben pagar las empresas para cubrir los riesgos de accidentes de trabajo y enfermedades profesionales según su actividad. Están definidas en la CNAE, Cuadro nacional de actividades Económicas.","featured":true},{"id":82,"concept":"Prótesis","definition":"Aparato o dispositivo quirúrgico u ortopédico que puede ser proporcionado como prestación sanitaria o dar lugar a la concesión de ayudas en los casos y según los baremos que reglamentariamente se establezcan.","featured":false},{"id":83,"concept":"Regímenes de la SS","definition":"Establecidos para algunas actividades profesionales por su naturaleza, sus peculiares condiciones de tiempo y lugar, o por la índole de sus procesos productivos para la correcta aplicación de la acción protectora de la Seguridad Social","featured":true},{"id":84,"concept":"Riesgo durante el embarazo","definition":"Suspensión del contrato o cese en la actividad que da lugar a una prestación económica que consiste en un subsidio equivalente al 100 por 100 de la base reguladora, que será la establecida para la prestación de incapacidad temporal derivada de contingencias profesionales, para proteger la salud de la trabajadora embarazada o del feto durante el período de suspensión del contrato de trabajo","featured":true},{"id":85,"concept":"Riesgo durante la lactancia natural","definition":"Suspensión del contrato o cese en la actividad que da lugar a una prestación económica que consiste en un subsidio equivalente al 100 por 100 de la base reguladora, que será la establecida para la prestación de incapacidad temporal derivada de contingencias profesionales, para proteger la salud de la trabajadora o del hijo durante el período de suspensión del contrato de trabajo o de la actividad en los supuestos en que, debiendo la mujer trabajadora cambiar de puesto de trabajo por otro compatible con su estado, dicho cambio de puesto no resulte técnica u objetivamente posible, o no pueda razonablemente exigirse por motivos justificados. Se concede en los mismos términos y condiciones que la prestación por riesgo durante el embarazo, si bien se extinguirá cuando el hijo cumpla nueve meses","featured":true},{"id":86,"concept":"Seguro Escolar","definition":"Régimen Especial para los estudiantes que, sin embargo, no ha llegado a desarrollarse del todo. Alcanza a los matriculados en centros oficiales desde la enseñanza secundaria hasta la universitaria y, como máximo, hasta los 28 años","featured":false},{"id":87,"concept":"SEPE","definition":"Organismo Autónomo, dotado de personalidad jurídica propia para el cumplimiento de sus fines , tiene como principales competencias la gestión y el control de las prestaciones por desempleo;","featured":true},{"id":88,"concept":"Servicios Sociales","definition":"Prestaciones en materia de reeducación y rehabilitación de discapacitados, asistencia a la tercera edad, asistencia social y en otras competencias del IMSERSO.","featured":false},{"id":89,"concept":"Situación asimilada al alta","definition":"Sujetos protegidos que, sin estar en situación de actividad laboral, reúnen determinadas condiciones reglamentariamente establecidas que permiten el acceso inmediato o latente a toda o parte de la acción protectora de la Seguridad Social.","featured":false},{"id":90,"concept":"Tesorería General de la Seguridad Social","definition":"Servicio Común de la Seguridad Social dotado de personalidad jurídica, al que compete la gestión de los recursos económicos y la administración financiera del sistema, en aplicación de los principios de solidaridad financiera y caja única.","featured":true},{"id":91,"concept":"Tipo de cotización","definition":"Porcentaje que se aplica a las bases de cotización para la obtención de las cuotas de la Seguridad Social, que se fija anualmente por ley. En el trabajo por cuenta ajena el tipo de cotización se distribuye entre empleador y empleado, salvo los Accidentes de Trabajo y Enfermedades Profesionales y los que expresamente se establecen a cargo exclusivo del empresario (Fondo de Garantía Salarial).","featured":true},{"id":92,"concept":"Topes máximos y mínimos de cotización","definition":"Cantidades máximas y mínimas entre las que debe estar siempre comprendida la base de cotización para Accidentes de Trabajo y Enfermedades Profesionales. Si se supera, por exceso, se computará como base el tope máximo y, si no se alcanza, por defecto, se tomará el tope mínimo","featured":false},{"id":93,"concept":"Trabajador por cuenta ajena","definition":"Toda persona física que voluntariamente presta sus servicios retribuidos por cuenta ajena y dentro del ámbito de organización y dirección de otra persona, física o jurídica, denominada empresario.","featured":true}],"config":{"title":"Flashcards UD05 LOGSE La Seguridad Social","description":"Repasa las fichas y comprueba después lo que has aprendido.","subject":"General","filename":"flashcards-ud05-logse","outputMode":"both","startMode":"menu","colors":{"primary":"#55bf1d","accent":"#508505","front":"#ffffff","back":"#f8fafc","success":"#10b981","danger":"#ef4444","warning":"#f59e0b"},"reviewCards":100,"reviewOrder":"random","reviewRandomSelection":true,"reviewAutoFlip":5,"reviewTimer":true,"reviewSound":true,"reviewSaveProgress":true,"quizCards":25,"quizLives":3,"quizDirection":"learner","quizShuffle":true,"quizFeedback":true,"passPercent":75,"diploma":true}},cfg=DATA.config,cards=DATA.cards,content=document.getEle function startReview(onlyDifficult){var ids=readDifficult(),pool=onlyDifficult?cards.filter(function(c){return ids.indexOf(c.id)>=0}):cards.slice();if(!pool.length){notify('No hay fichas en esta selección');return}if(cfg.reviewRandomSelection)pool=shuffle(pool);pool=pool.slice(0,Math.min(cfg.reviewCards,pool.length));if(cfg.reviewOrder==='random')pool=shuffle(pool);clearReviewProgress(false);app.review={deck:pool,index:0,learned:0,difficult:[],start:Date.now(),flipped:false};saveReviewProgress();renderReviewCard()}function updateReviewStats(){var r=app.review;if(!r)return;setStats('<span class="stat">Ficha '+Math.min(r.index+1,r.deck.length)+'/'+r.deck.length+'</span><span class="stat">✓ '+r.learned+'</span>'+(cfg.reviewTimer?'<span class="stat">⏱ '+elapsed(r.start)+'</span>':''))}
function renderReviewCard(){var r=app.review;if(r.index>=r.deck.length){finishReview();return}var c=r.deck[r.index],pct=Math.round(r.index/r.deck.length*100);r.flipped=false;setScreen('review-card','<section class="screen center"><div class="progress"><span style="width:'+pct+'%"></span></div>'+(c.featured?'<div class="featured">★ Ficha destacada</div>':'')+'<div class="flip-wrap"><button class="flashcard" id="flashcard" aria-label="Voltear ficha"><span class="face front"><small>Concepto</small><strong>'+esc(c.concept)+'</strong><em>Haz clic o pulsa espacio para ver la definición</em></span><span class="face back"><small>Definición</small><strong>'+esc(c.definition)+'</strong><em>Haz clic para volver al concepto</em></span></button></div><div class="review-actions"><button class="btn success" id="learnedBtn">✓ Aprendida</button><button class="btn warning" id="difficultBtn">⚠ Necesito repasarla</button><button class="btn secondary" id="endReviewBtn">Terminar</button></div></section>');updateReviewStats();if(cfg.reviewTimer)app.timer=setInterval(updateReviewStats,1000);document.getElementById('flashcard').onclick=flipReview;document.getElementById('learnedBtn').onclick=function(){markReview(true)};document.getElementById('difficultBtn').onclick=function(){markReview(false)};document.getElementById('endReviewBtn').onclick=finishReview;if(cfg.reviewAutoFlip){app.auto=setTimeout(function(){if(app.screen==='review-card'&&!r.flipped)flipReview()},cfg.reviewAutoFlip*1000)}}
function flipReview(){var r=app.review,el=document.getElementById('flashcard');if(!r||!el)return;r.flipped=!r.flipped;el.classList.toggle('flipped',r.flipped);clearTimeout(app.auto);if(cfg.reviewSound)beep(620)}function beep(freq){try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return;var x=window.__qsuAudio||new C();window.__qsuAudio=x;var o=x.createOscillator(),g=x.createGain();o.frequency.value=freq;g.gain.setValueAtTime(.08,x.currentTime);g.gain.exponentialRampToValueAtTime(.001,x.currentTime+.18);o.connect(g);g.connect(x.destination);o.start();o.stop(x.currentTime+.19)}catch(e){}}
function markReview(learned){var r=app.review,c=r.deck[r.index],ids=readDifficult(),at=ids.indexOf(c.id);if(learned){r.learned++;if(at>=0)ids.splice(at,1);beep(820)}else{if(at<0)ids.push(c.id);r.difficult.push(c);beep(240)}writeDifficult(ids);r.index++;if(r.index>=r.deck.length)clearReviewProgress(false);else saveReviewProgress();app.transition=setTimeout(renderReviewCard,220)}function finishReview(){var r=app.review;if(!r){showReviewStart();return}clearReviewProgress(false);var time=elapsed(r.start),remaining=readDifficult().length,list=r.difficult.length?'<div class="difficult-list"><strong>Para volver a repasar:</strong>'+r.difficult.map(function(c){return'<div>⚠ <b>'+esc(c.concept)+'</b> — '+esc(c.definition)+'</div>'}).join('')+'</div>':'';setStats('<span class="stat">Sesión terminada</span>');setScreen('review-results','<section class="screen center"><span class="eyebrow">✓ Sesión completada</span><h2>Resumen del repaso</h2><div class="review-results"><div class="metric"><b>'+r.learned+'</b><span>Aprendidas</span></div><div class="metric"><b>'+r.difficult.length+'</b><span>Difíciles</span></div><div class="metric"><b>'+time+'</b><span>Tiempo</span></div></div>'+list+'<div class="btns"><button class="btn primary" id="newReview">Nueva sesión</button><button class="btn warning" id="againDifficult" '+(remaining?'':'disabled')+'>Repasar pendientes ('+remaining+')</button></div></section>');document.getElementById('newReview').onclick=function(){startReview(false)};document.getElementById('againDifficult').onclick=function(){startReview(true)}}
function showQuizStart(){if(cards.length<4){var missing=4-cards.length;setStats('<span class="stat">🏆 Evaluación</span><span class="stat">Faltan '+missing+' fichas</span>');setScreen('quiz-unavailable','<section class="screen center"><span class="eyebrow">⚠ Evaluación no disponible</span><h2>Se necesitan al menos 4 fichas</h2><p class="lead">Ahora hay '+cards.length+' ficha'+(cards.length===1?'':'s')+' completa'+(cards.length===1?'':'s')+'. Añade '+missing+' más en el editor para activar la evaluación.</p>'+(cfg.outputMode==='both'?'<div class="btns"><button class="btn secondary" id="backAvailable">Volver al menú</button></div>':'')+'</section>');var back=document.getElementById('backAvailable');if(back)back.onclick=function(){showHome(true)};return}var chooser=cfg.quizDirection==='learner'?'<div class="direction-grid"><button class="direction active" data-direction="concept-to-definition"><b>Concepto → definición</b><br><small>Lee el término y elige su explicación</small></button><button class="direction" data-direction="definition-to-concept"><b>Definición → concepto</b><br><small>Lee la explicación y elige el término</small></button></div>':'';setStats('<span class="stat">🏆 Evaluación</span><span class="stat">♥ '+cfg.quizLives+' vidas</span>');setScreen('quiz-start','<section class="screen center"><span class="eyebrow">🏆 Modo evaluación</span><h2>Comprueba lo que sabes</h2><p class="lead">Cada pregunta tiene cuatro opciones. Necesitas un '+cfg.passPercent+'% para superar la actividad'+(cfg.diploma?' y obtener el diploma':'')+'.</p>'+chooser+'<div class="summary"><span class="chip">'+Math.min(cfg.quizCards,cards.length)+' preguntas</span><span class="chip">'+cfg.quizLives+' vidas</span><span class="chip">Aprobado: '+cfg.passPercent+'%</span></div><div class="btns"><button class="btn primary" id="startQuiz">Comenzar evaluación</button></div></section>');if(cfg.quizDirection==='learner')document.querySelectorAll('.direction').forEach(function(b){b.onclick=function(){document.querySelectorAll('.direction').forEach(function(x){x.classList.remove('active')});b.classList.add('active');app.chosenDirection=b.dataset.direction}});document.getElementById('startQuiz').onclick=startQuiz}
function startQuiz(){var deck=cfg.quizShuffle?shuffle(cards):cards.slice();deck=deck.slice(0,Math.min(cfg.quizCards,deck.length));var direction=cfg.quizDirection==='learner'?app.chosenDirection:cfg.quizDirection;app.quiz={deck:deck,index:0,lives:cfg.quizLives,correct:0,answered:0,start:Date.now(),direction:direction,locked:false,current:null};renderQuestion()}
function makeQuestion(card){var q=app.quiz,dir=q.direction==='random'?(Math.random()<.5?'concept-to-definition':'definition-to-concept'):q.direction,question=dir==='concept-to-definition'?card.concept:card.definition,correct=dir==='concept-to-definition'?card.definition:card.concept,candidates=[],seen={};cards.forEach(function(c){var x=dir==='concept-to-definition'?c.definition:c.concept;if(x!==correct&&!seen[x]){seen[x]=1;candidates.push(x)}});candidates=shuffle(candidates).slice(0,3);var fillers=['Ninguna de las demás opciones','Todas las demás opciones','No corresponde a este concepto'];for(var i=0;candidates.length<3;i++)candidates.push(fillers[i]);var options=shuffle([correct].concat(candidates));return{card:card,direction:dir,question:question,correct:correct,options:options,correctIndex:options.indexOf(correct)}}
function quizStats(){var q=app.quiz,hearts='';for(var i=0;i<cfg.quizLives;i++)hearts+=i<q.lives?'♥':'♡';setStats('<span class="stat">'+hearts+'</span><span class="stat">✓ '+q.correct+'</span><span class="stat">'+Math.min(q.index+1,q.deck.length)+'/'+q.deck.length+'</span>')}
function renderQuestion(){var q=app.quiz;if(q.index>=q.deck.length||q.lives<=0){finishQuiz();return}q.locked=false;q.current=makeQuestion(q.deck[q.index]);var x=q.current,pct=Math.round(q.index/q.deck.length*100),label=x.direction==='concept-to-definition'?'Elige la definición correcta':'Elige el concepto correcto';setScreen('quiz-question','<section class="screen"><div class="progress"><span style="width:'+pct+'%"></span></div><div class="question">'+(x.card.featured?'<div class="featured">★ Término evaluable</div>':'')+'<small>'+label+' · Pregunta '+(q.index+1)+' de '+q.deck.length+'</small><h3>'+esc(x.question)+'</h3></div><div class="options">'+x.options.map(function(o,i){return'<button class="option" data-index="'+i+'" data-key="'+(i+1)+'">'+esc(o)+'</button>'}).join('')+'</div><div id="feedback"></div></section>');quizStats();document.querySelectorAll('.option').forEach(function(b){b.onclick=function(){answerQuiz(parseInt(b.dataset.index,10))}})}
function answerQuiz(index){var q=app.quiz;if(q.locked)return;q.locked=true;q.answered++;var x=q.current,ok=index===x.correctIndex;if(ok){q.correct++;beep(880)}else{q.lives--;beep(190)}document.querySelectorAll('.option').forEach(function(b){var i=parseInt(b.dataset.index,10);b.disabled=true;if(i===x.correctIndex)b.classList.add('correct');else if(i===index)b.classList.add('incorrect')});quizStats();var f=document.getElementById('feedback');if(cfg.quizFeedback)f.innerHTML='<div class="feedback '+(ok?'ok':'bad')+'">'+(ok?'✓ Correcto':'✗ Incorrecto. Respuesta correcta: '+esc(x.correct))+'</div>';app.transition=setTimeout(function(){q.index++;renderQuestion()},cfg.quizFeedback?1450:650)}
function finishQuiz(){var q=app.quiz,total=q.deck.length,percent=Math.round(q.correct/total*100),grade=Math.round(q.correct/total*100)/10,passed=percent>=cfg.passPercent,res={correct:q.correct,total:total,percent:percent,grade:grade,time:elapsed(q.start),passed:passed,id:'QSU-'+Date.now().toString(36).toUpperCase()};app.results=res;setStats('<span class="stat">Resultado: '+grade+'/10</span>');var cert=passed&&cfg.diploma?'<div class="certificate-box"><h3>🎓 Generar diploma</h3><p>Escribe tu nombre y apellidos tal como deben aparecer.</p><input id="studentName" placeholder="Nombre y apellidos" autocomplete="name"><div class="btns"><button class="btn warning" id="pdfBtn">Descargar diploma PDF</button><button class="btn secondary" id="printBtn">Ver / imprimir diploma</button></div></div>':'';setScreen('quiz-results','<section class="screen center"><span class="eyebrow">'+(passed?'✓ Actividad superada':'↻ Sigue practicando')+'</span><div class="result-score">'+grade+'<small style="font-size:25px">/10</small></div><div class="result-grade">'+(passed?'¡Enhorabuena!':'Aún no has alcanzado el '+cfg.passPercent+'%')+'</div><p class="lead">Has acertado '+q.correct+' de '+total+' preguntas ('+percent+'%) en '+res.time+'.</p><div class="review-results"><div class="metric"><b>'+q.correct+'/'+total+'</b><span>Aciertos</span></div><div class="metric"><b>'+percent+'%</b><span>Precisión</span></div><div class="metric"><b>'+q.lives+'</b><span>Vidas restantes</span></div></div>'+cert+'<div class="btns"><button class="btn primary" id="retryQuiz">Intentar de nuevo</button><button class="btn secondary" id="quizMenu">Volver</button></div></section>');document.getElementById('retryQuiz').onclick=startQuiz;document.getElementById('quizMenu').onclick=goHome;if(passed&&cfg.diploma){document.getElementById('pdfBtn').onclick=function(){certificate(false)};document.getElementById('printBtn').onclick=function(){certificate(true)}}}
function certName(){var el=document.getElementById('studentName'),name=el?el.value.trim():'';if(name.length<3){notify('Escribe el nombre completo para el diploma');if(el)el.focus();return''}return name}function rgb(hex){hex=String(hex).replace('#','');if(hex.length===3)hex=hex.split('').map(function(x){return x+x}).join('');return[parseInt(hex.slice(0,2),16)||0,parseInt(hex.slice(2,4),16)||0,parseInt(hex.slice(4,6),16)||0]}function ascii(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^ -~]/g,'')}function fileName(s){return ascii(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'alumno'}
function certificate(printOnly){var name=certName(),r=app.results;if(!name)return;if(printOnly||!window.jspdf){showPrintable(name,r);if(!printOnly)notify('La biblioteca PDF no está disponible; usa Imprimir → Guardar como PDF');return}try{var jsPDF=window.jspdf.jsPDF,doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'}),p=rgb(cfg.colors.primary),a=rgb(cfg.colors.accent),ok=rgb(cfg.colors.success);doc.setFillColor(255,255,255);doc.rect(0,0,297,210,'F');doc.setDrawColor(p[0],p[1],p[2]);doc.setLineWidth(3);doc.rect(14,14,269,182);doc.setLineWidth(.7);doc.rect(19,19,259,172);doc.setFont('helvetica','bold');doc.setTextColor(p[0],p[1],p[2]);doc.setFontSize(30);doc.text('DIPLOMA DE APROVECHAMIENTO',148.5,39,{align:'center'});doc.setTextColor(a[0],a[1],a[2]);doc.setFontSize(19);doc.text(doc.splitTextToSize(ascii(cfg.title),220),148.5,55,{align:'center'});doc.setTextColor(55,65,81);doc.setFont('helvetica','normal');doc.setFontSize(14);doc.text('Se concede el presente diploma a',148.5,82,{align:'center'});doc.setFont('helvetica','bold');doc.setTextColor(p[0],p[1],p[2]);doc.setFontSize(27);doc.text(ascii(name).toUpperCase(),148.5,103,{align:'center'});doc.setDrawColor(a[0],a[1],a[2]);doc.line(55,109,242,109);doc.setFont('helvetica','normal');doc.setTextColor(55,65,81);doc.setFontSize(13);doc.text('por haber superado satisfactoriamente la actividad',148.5,122,{align:'center'});doc.setFont('helvetica','bold');doc.setTextColor(ok[0],ok[1],ok[2]);doc.setFontSize(20);doc.text('Calificacion: '+r.grade+' / 10',148.5,139,{align:'center'});doc.setFont('helvetica','normal');doc.setTextColor(100,116,139);doc.setFontSize(10);doc.text('Aciertos: '+r.correct+'/'+r.total+'   |   Precision: '+r.percent+'%   |   Tiempo: '+r.time,148.5,153,{align:'center'});doc.text('Fecha: '+new Date().toLocaleDateString('es-ES')+'   |   Materia: '+ascii(cfg.subject)+'   |   ID: '+r.id,148.5,169,{align:'center'});doc.save('diploma-'+fileName(name)+'.pdf');notify('Diploma descargado')}catch(e){notify('No se pudo crear el PDF: '+e.message);showPrintable(name,r)}}
function showPrintable(name,r){setStats('');setScreen('diploma','<section class="screen printable"><div class="diploma-page"><div class="seal">🎓</div><h2>DIPLOMA DE APROVECHAMIENTO</h2><h3>'+esc(cfg.title)+'</h3><p>Se concede el presente diploma a</p><div class="diploma-name">'+esc(name.toUpperCase())+'</div><div class="diploma-line"></div><p>por haber superado satisfactoriamente la actividad</p><h3 style="color:var(--ok)">Calificación: '+r.grade+' / 10</h3><p>Aciertos: '+r.correct+'/'+r.total+' · Precisión: '+r.percent+'% · Tiempo: '+r.time+'</p><p><small>'+new Date().toLocaleDateString('es-ES')+' · '+esc(cfg.subject)+' · ID: '+r.id+'</small></p></div><div class="btns diploma-controls"><button class="btn primary" id="doPrint">Imprimir / Guardar como PDF</button><button class="btn secondary" id="backResults">Volver a resultados</button></div></section>');document.getElementById('doPrint').onclick=function(){window.print()};document.getElementById('backResults').onclick=finishQuiz}
document.addEventListener('keydown',function(e){if(app.screen==='quiz-question'&&!app.quiz.locked&&/^[1-4]$/.test(e.key))answerQuiz(parseInt(e.key,10)-1);if(app.screen==='review-card'&&(e.key===' '||e.key==='Enter')){e.preventDefault();flipReview()}});window.addEventListener('beforeunload',function(){if(app.screen==='review-card')saveReviewProgress()});document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'&&app.screen==='review-card')saveReviewProgress()});function init(){if(!cards.length){setScreen('home','<section class="screen center"><h2>No hay fichas disponibles</h2></section>');return}if(cfg.outputMode==='both'){if(cfg.startMode==='review')showReviewStart();else if(cfg.startMode==='quiz'&&cards.length>=4)showQuizStart();else showHome(true)}else showHome(false)}init()})();
</script></body></html>
