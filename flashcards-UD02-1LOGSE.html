function finishQuiz(){var q=app.quiz,total=q.deck.length,percent=Math.round(q.correct/total*100),grade=Math.round(q.correct/total*100)/10,passed=percent>=cfg.passPercent,res={correct:q.correct,total:total,percent:percent,grade:grade,time:elapsed(q.start),passed:passed,id:'QSU-'+Date.now().toString(36).toUpperCase()};app.results=res;setStats('<span class="stat">Resultado: '+grade+'/10</span>');var cert=passed&&cfg.diploma?'<div class="certificate-box"><h3>🎓 Generar diploma</h3><p>Escribe tu nombre y apellidos tal como deben aparecer.</p><input id="studentName" placeholder="Nombre y apellidos" autocomplete="name"><div class="btns"><button class="btn warning" id="pdfBtn">Descargar diploma PDF</button><button class="btn secondary" id="printBtn">Ver / imprimir diploma</button></div></div>':'';setScreen('quiz-results','<section class="screen center"><span class="eyebrow">'+(passed?'✓ Actividad superada':'↻ Sigue practicando')+'</span><div class="result-score">'+grade+'<small style="font-size:25px">/10</small></div><div class="result-grade">'+(passed?'¡Enhorabuena!':'Aún no has alcanzado el '+cfg.passPercent+'%')+'</div><p class="lead">Has acertado '+q.correct+' de '+total+' preguntas ('+percent+'%) en '+res.time+'.</p><div class="review-results"><div class="metric"><b>'+q.correct+'/'+total+'</b><span>Aciertos</span></div><div class="metric"><b>'+percent+'%</b><span>Precisión</span></div><div class="metric"><b>'+q.lives+'</b><span>Vidas restantes</span></div></div>'+cert+'<div class="btns"><button class="btn primary" id="retryQuiz">Intentar de nuevo</button><button class="btn secondary" id="quizMenu">Volver</button></div></section>');document.getElementById('retryQuiz').onclick=startQuiz;document.getElementById('quizMenu').onclick=goHome;if(passed&&cfg.diploma){document.getElementById('pdfBtn').onclick=function(){certificate(false)};document.getElementById('printBtn').onclick=function(){certificate(true)}}}
function certName(){var el=document.getElementById('studentName'),name=el?el.value.trim():'';if(name.length<3){notify('Escribe el nombre completo para el diploma');if(el)el.focus();return''}return name}function rgb(hex){hex=String(hex).replace('#','');if(hex.length===3)hex=hex.split('').map(function(x){return x+x}).join('');return[parseInt(hex.slice(0,2),16)||0,parseInt(hex.slice(2,4),16)||0,parseInt(hex.slice(4,6),16)||0]}function ascii(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^ -~]/g,'')}function fileName(s){return ascii(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'alumno'}
function certificate(printOnly){var name=certName(),r=app.results;if(!name)return;if(printOnly||!window.jspdf){showPrintable(name,r);if(!printOnly)notify('La biblioteca PDF no está disponible; usa Imprimir → Guardar como PDF');return}try{var jsPDF=window.jspdf.jsPDF,doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'}),p=rgb(cfg.colors.primary),a=rgb(cfg.colors.accent),ok=rgb(cfg.colors.success);doc.setFillColor(255,255,255);doc.rect(0,0,297,210,'F');doc.setDrawColor(p[0],p[1],p[2]);doc.setLineWidth(3);doc.rect(14,14,269,182);doc.setLineWidth(.7);doc.rect(19,19,259,172);doc.setFont('helvetica','bold');doc.setTextColor(p[0],p[1],p[2]);doc.setFontSize(30);doc.text('DIPLOMA DE APROVECHAMIENTO',148.5,39,{align:'center'});doc.setTextColor(a[0],a[1],a[2]);doc.setFontSize(19);doc.text(doc.splitTextToSize(ascii(cfg.title),220),148.5,55,{align:'center'});doc.setTextColor(55,65,81);doc.setFont('helvetica','normal');doc.setFontSize(14);doc.text('Se concede el presente diploma a',148.5,82,{align:'center'});doc.setFont('helvetica','bold');doc.setTextColor(p[0],p[1],p[2]);doc.setFontSize(27);doc.text(ascii(name).toUpperCase(),148.5,103,{align:'center'});doc.setDrawColor(a[0],a[1],a[2]);doc.line(55,109,242,109);doc.setFont('helvetica','normal');doc.setTextColor(55,65,81);doc.setFontSize(13);doc.text('por haber superado satisfactoriamente la actividad',148.5,122,{align:'center'});doc.setFont('helvetica','bold');doc.setTextColor(ok[0],ok[1],ok[2]);doc.setFontSize(20);doc.text('Calificacion: '+r.grade+' / 10',148.5,139,{align:'center'});doc.setFont('helvetica','normal');doc.setTextColor(100,116,139);doc.setFontSize(10);doc.text('Aciertos: '+r.correct+'/'+r.total+'   |   Precision: '+r.percent+'%   |   Tiempo: '+r.time,148.5,153,{align:'center'});doc.text('Fecha: '+new Date().toLocaleDateString('es-ES')+'   |   Materia: '+ascii(cfg.subject)+'   |   ID: '+r.id,148.5,169,{align:'center'});doc.save('diploma-'+fileName(name)+'.pdf');notify('Diploma descargado')}catch(e){notify('No se pudo crear el PDF: '+e.message);showPrintable(name,r)}}
function showPrintable(name,r){setStats('');setScreen('diploma','<section class="screen printable"><div class="diploma-page"><div class="seal">🎓</div><h2>DIPLOMA DE APROVECHAMIENTO</h2><h3>'+esc(cfg.title)+'</h3><p>Se concede el presente diploma a</p><div class="diploma-name">'+esc(name.toUpperCase())+'</div><div class="diploma-line"></div><p>por haber superado satisfactoriamente la actividad</p><h3 style="color:var(--ok)">Calificación: '+r.grade+' / 10</h3><p>Aciertos: '+r.correct+'/'+r.total+' · Precisión: '+r.percent+'% · Tiempo: '+r.time+'</p><p><small>'+new Date().toLocaleDateString('es-ES')+' · '+esc(cfg.subject)+' · ID: '+r.id+'</small></p></div><div class="btns diploma-controls"><button class="btn primary" id="doPrint">Imprimir / Guardar como PDF</button><button class="btn secondary" id="backResults">Volver a resultados</button></div></section>');document.getElementById('doPrint').onclick=function(){window.print()};document.getElementById('backResults').onclick=finishQuiz}
document.addEventListener('keydown',function(e){if(app.screen==='quiz-question'&&!app.quiz.locked&&/^[1-4]$/.test(e.key))answerQuiz(parseInt(e.key,10)-1);if(app.screen==='review-card'&&(e.key===' '||e.key==='Enter')){e.preventDefault();flipReview()}});window.addEventListener('beforeunload',function(){if(app.screen==='review-card')saveReviewProgress()});document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'&&app.screen==='review-card')saveReviewProgress()});function init(){if(!cards.length){setScreen('home','<section class="screen center"><h2>No hay fichas disponibles</h2></section>');return}if(cfg.outputMode==='both'){if(cfg.startMode==='review')showReviewStart();else if(cfg.startMode==='quiz'&&cards.length>=4)showQuizStart();else showHome(true)}else showHome(false)}init()})();
</script></body></html>
