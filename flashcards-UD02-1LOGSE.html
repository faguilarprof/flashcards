function StandaloneFlashcardsGame(config) {
    config = config || {};
    this.cards = Array.isArray(config.cards) ? config.cards : [];
    this.lives = parseInt(config.lives) || 3;
    this.cardsPerGame = parseInt(config.cardsPerGame) || Math.min(this.cards.length, 10);
    this.mode = config.mode || "concept-to-definition";
    this.shuffleCards = config.shuffleCards !== false;
    this.enableReview = config.enableReview !== false;
    this.showFeedback = config.showFeedback !== false;
    this.gameTitle = config.gameTitle || "Flashcards Interactivas";
    this.gameDescription = config.gameDescription || "Aprende y memoriza conceptos importantes";
    this.pointsPerCorrect = parseInt(config.pointsPerCorrect) || 10;
    this.pointsMultiplier = parseFloat(config.pointsMultiplier) || 1.0;
    this.customColors = config.customColors || {
        primary: "#dc006a",
        selection: "#ff69b4",
        border: "#c6005d",
        light: "#ffe6f2"
    };
    this.state = {
        gameActive: false,
        currentLives: this.lives,
        score: 0,
        currentRound: 0,
        totalRounds: 0,
        startTime: null,
        cardsToReview: [],
        currentQuestion: null,
        answeredQuestions: 0,
        correctAnswers: 0,
        selectedCards: []
    };
    this._validateCards();
}

StandaloneFlashcardsGame.prototype._validateCards = function() {
    if (!Array.isArray(this.cards)) {
        throw new Error("Las cartas deben ser un array");
    }
    var self = this;
    this.cards = this.cards.map(function(card) {
        if (!card || typeof card !== "object") return null;
        var conceptStr = card.concept ? String(card.concept).trim() : "";
        var definitionStr = card.definition ? String(card.definition).trim() : "";
        var warningChar = "\u26A0\uFE0F";
        var isEvaluableConcept = conceptStr.indexOf(warningChar) === 0;
        var isEvaluableDefinition = definitionStr.indexOf(warningChar) === 0;
        var newCard = {
            concept: isEvaluableConcept ? conceptStr.substring(warningChar.length).trim() : conceptStr,
            definition: isEvaluableDefinition ? definitionStr.substring(warningChar.length).trim() : definitionStr,
            evaluable: isEvaluableConcept || isEvaluableDefinition
        };
        return newCard;
    }).filter(function(card) {
        return card && card.concept && card.definition;
    });
    if (this.cards.length < 4) {
        throw new Error("Se necesitan al menos 4 cartas validas. Encontradas: " + this.cards.length);
    }
};

StandaloneFlashcardsGame.prototype._shuffleArray = function(array) {
    var shuffled = array.slice();
    for (var i = shuffled.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = shuffled[i];
        shuffled[i] = shuffled[j];
        shuffled[j] = temp;
    }
    return shuffled;
};

StandaloneFlashcardsGame.prototype._getWrongOptions = function(correctAnswer, count) {
    var self = this;
    var wrong = [];
    var allCards = this.cards.filter(function(card) {
        var candidate = self.mode === "concept-to-definition" ? card.definition : card.concept;
        return candidate !== correctAnswer && candidate.trim() !== "";
    });
    var shuffledCards = this._shuffleArray(allCards.slice());
    for (var i = 0; i < shuffledCards.length; i++) {
        if (wrong.length >= count) break;
        var card = shuffledCards[i];
        var wrongAnswer = this.mode === "concept-to-definition" ? card.definition : card.concept;
        if (wrong.indexOf(wrongAnswer) === -1 && wrongAnswer !== correctAnswer) {
            wrong.push(wrongAnswer);
        }
    }
    while (wrong.length < count) {
        var genericOption = "Opcion " + (wrong.length + 1);
        if (wrong.indexOf(genericOption) === -1 && genericOption !== correctAnswer) {
            wrong.push(genericOption);
        }
    }
    return wrong.slice(0, count);
};

StandaloneFlashcardsGame.prototype._formatTime = function(ms) {
    var seconds = Math.floor(ms / 1000);
    var minutes = Math.floor(seconds / 60);
    var remainingSeconds = seconds % 60;
    if (minutes > 0) {
        return minutes + "m " + remainingSeconds + "s";
    }
    return remainingSeconds + "s";
};

StandaloneFlashcardsGame.prototype.initializeGame = function() {
    if (this.cards.length < 4) {
        throw new Error("Se necesitan al menos 4 cartas para jugar");
    }
    this.state = {
        gameActive: true,
        currentLives: this.lives,
        score: 0,
        currentRound: 0,
        totalRounds: Math.min(this.cardsPerGame, this.cards.length),
        startTime: Date.now(),
        cardsToReview: [],
        currentQuestion: null,
        answeredQuestions: 0,
        correctAnswers: 0,
        selectedCards: []
    };
    var cardsToPlay = this.cards.slice();
    if (this.shuffleCards) {
        cardsToPlay = this._shuffleArray(cardsToPlay);
    }
    this.state.selectedCards = cardsToPlay.slice(0, this.state.totalRounds);
    return this.getNextQuestion();
};

StandaloneFlashcardsGame.prototype.getNextQuestion = function() {
    if (!this.state.gameActive) {
        return null;
    }
    if (this.enableReview && this.state.cardsToReview.length > 0 && this.state.currentRound >= this.state.totalRounds) {
        if (this.state.cardsToReview.length === 0) return null;
        var card = this.state.cardsToReview.shift();
        var questionData = this._createQuestionData(card, true);
        this.state.currentQuestion = questionData;
        return questionData;
    }
    if (this.state.currentRound >= this.state.totalRounds) {
        return null;
    }
    var card = this.state.selectedCards[this.state.currentRound];
    this.state.currentRound++;
    var questionData = this._createQuestionData(card, false);
    this.state.currentQuestion = questionData;
    return questionData;
};

StandaloneFlashcardsGame.prototype._createQuestionData = function(card, isReview) {
    isReview = isReview || false;
    var isConceptToDef = this.mode === "concept-to-definition";
    var question = isConceptToDef ? card.concept : card.definition;
    var correctAnswer = isConceptToDef ? card.definition : card.concept;
    var isEvaluable = card.evaluable;
    if (isEvaluable) {
        var warningSymbol = '<span class="evaluable-symbol">\u26A0\uFE0F</span>';
        question = warningSymbol + question;
    }
    var wrongOptions = this._getWrongOptions(correctAnswer, 3);
    var allOptions = [correctAnswer].concat(wrongOptions);
    var options = this._shuffleArray(allOptions);
    var totalQuestions = this.state.totalRounds + (this.enableReview ? this.state.cardsToReview.length : 0);
    var currentProgress = this.state.currentRound + (this.state.totalRounds - this.state.cardsToReview.length);
    var progress = totalQuestions > 0 ? Math.round((currentProgress / totalQuestions) * 100) : 0;
    return {
        question: question,
        options: options,
        correctAnswer: correctAnswer,
        questionNumber: this.state.currentRound,
        totalQuestions: totalQuestions,
        progress: progress,
        isReview: isReview,
        isEvaluable: isEvaluable,
        lives: this.state.currentLives,
        score: this.state.score,
        concept: card.concept,
        definition: card.definition,
        originalCard: card
    };
};

StandaloneFlashcardsGame.prototype.checkAnswer = function(selectedAnswer) {
    if (!this.state.gameActive || !this.state.currentQuestion) {
        return { valid: false, error: "No hay pregunta activa" };
    }
    if (!this.state.currentQuestion.correctAnswer) {
        console.error("currentQuestion:", this.state.currentQuestion);
        return { valid: false, error: "Error interno" };
    }
    this.state.answeredQuestions++;
    var cleanSelectedAnswer = selectedAnswer.trim();
    var cleanCorrectAnswer = this.state.currentQuestion.correctAnswer.trim();
    var isCorrect = cleanSelectedAnswer === cleanCorrectAnswer;
    if (isCorrect) {
        this.state.correctAnswers++;
        var pointsEarned = this.pointsPerCorrect * this.pointsMultiplier;
        this.state.score += pointsEarned;
        return {
            valid: true,
            isCorrect: true,
            pointsEarned: pointsEarned,
            currentScore: this.state.score,
            livesRemaining: this.state.currentLives,
            gameOver: false
        };
    } else {
        this.state.currentLives--;
        if (this.enableReview) {
            var cardToReview = this.state.currentQuestion.originalCard || {
                concept: this.state.currentQuestion.concept,
                definition: this.state.currentQuestion.definition,
                evaluable: this.state.currentQuestion.isEvaluable
            };
            var self = this;
            var alreadyInReview = this.state.cardsToReview.some(function(card) {
                return card.concept === cardToReview.concept;
            });
            if (!alreadyInReview) {
                this.state.cardsToReview.push(cardToReview);
            }
        }
        var gameOver = this.state.currentLives <= 0;
        if (gameOver) {
            this.state.gameActive = false;
        }
        return {
            valid: true,
            isCorrect: false,
            correctAnswer: this.state.currentQuestion.correctAnswer,
            currentScore: this.state.score,
            livesRemaining: this.state.currentLives,
            gameOver: gameOver,
            addedToReview: this.enableReview
        };
    }
};

StandaloneFlashcardsGame.prototype.endGame = function() {
    this.state.gameActive = false;
    var timePlayed = Date.now() - this.state.startTime;
    var accuracy = this.state.answeredQuestions > 0 ? Math.round((this.state.correctAnswers / this.state.answeredQuestions) * 100) : 0;
    var grade, message;
    var perfectScore = this.state.totalRounds * this.pointsPerCorrect;
    var scorePercentage = perfectScore > 0 ? (this.state.score / perfectScore) * 100 : 0;
    if (scorePercentage >= 90 && this.state.currentLives === this.lives) {
        grade = "Perfecto!";
        message = "Dominaste completamente el material. Excelente trabajo!";
    } else if (scorePercentage >= 70) {
        grade = "Muy bien";
        message = "Buen rendimiento. Ya dominas la mayoria de los conceptos.";
    } else if (scorePercentage >= 50) {
        grade = "Aprobado";
        message = "Conoces los conceptos basicos. Podrias practicar un poco mas.";
    } else {
        grade = "Necesitas repasar";
        message = "Es recomendable revisar el material antes de intentarlo nuevamente.";
    }
    var scoreOutOf10 = perfectScore > 0 ? Math.min(10, Math.round((this.state.score / perfectScore) * 10)) : 0;
    return {
        finalScore: this.state.score,
        maxPossibleScore: perfectScore,
        scoreOutOf10: scoreOutOf10,
        livesRemaining: this.state.currentLives,
        totalRounds: this.state.totalRounds,
        correctAnswers: this.state.correctAnswers,
        accuracy: accuracy,
        grade: grade,
        message: message,
        timePlayed: timePlayed,
        timePlayedFormatted: this._formatTime(timePlayed),
        cardsToReview: this.state.cardsToReview.length,
        gameTitle: this.gameTitle,
        passed: scorePercentage >= 50
    };
};

StandaloneFlashcardsGame.prototype.changeMode = function(newMode) {
    var validModes = ["concept-to-definition", "definition-to-concept"];
    if (validModes.indexOf(newMode) !== -1) {
        this.mode = newMode;
        return true;
    }
    return false;
};

function escapeHTML(text) {

function showMessage(message, type) {
    var messageDiv = document.createElement("div");
    messageDiv.className = "status-message " + type;
    var iconClass = "info-circle";
    if (type === "error") iconClass = "exclamation-circle";
    else if (type === "warning") iconClass = "exclamation-triangle";
    else if (type === "success") iconClass = "check-circle";
    messageDiv.innerHTML = '<i class="fas fa-' + iconClass + '"></i>' + escapeHTML(message);
    var gameContent = document.getElementById("gameContent");
    gameContent.insertBefore(messageDiv, gameContent.firstChild);
    setTimeout(function() {

}

    html += '</div>';

    html += '</div>';

    for (var j = 0; j < options.length; j++) {
        options[j].addEventListener("click", function() {
            if (!gameActive || selectedAnswer !== null) return;
            var answer = this.querySelector(".option-content").textContent;
            selectAnswer(answer, this);
        });
    }
    document.getElementById("menuBtn").addEventListener("click", showStartScreen);
    document.removeEventListener("keydown", handleKeyboardInput);
    document.addEventListener("keydown", handleKeyboardInput);
}

function selectAnswer(answer, element) {
    if (!gameActive || selectedAnswer !== null) return;
    selectedAnswer = answer;
    var options = document.querySelectorAll(".option");
    for (var i = 0; i < options.length; i++) {
        options[i].classList.add("disabled");
        options[i].style.cursor = "not-allowed";
        options[i].classList.remove("selected");
    }
    element.classList.add("selected");
    element.classList.add("selected-answer");
    var result = game.checkAnswer(answer);
    if (result.valid) {
        showFeedback(result);
    }
}

function handleKeyboardInput(event) {
    if (!gameActive || selectedAnswer !== null) return;
    var key = event.key;
    if (key >= "1" && key <= "4") {
        var index = parseInt(key) - 1;
        var option = document.querySelector('.option[data-index="' + index + '"]');
        if (option) {
            var answer = option.querySelector(".option-content").textContent;
            selectAnswer(answer, option);
        }
    }
}

function showFeedback(result) {
    var gameScreen = document.querySelector(".game-screen");
    var optionsContainer = document.getElementById("optionsContainer");
    var feedbackHTML = "";
    if (result.isCorrect) {
        feedbackHTML = '<div class="feedback correct">';
        feedbackHTML += '<div class="feedback-header">';
        feedbackHTML += '<i class="fas fa-check-circle"></i>';
        feedbackHTML += '<span>Correcto!</span>';
        feedbackHTML += '</div>';
        feedbackHTML += '<div class="points-earned">+' + result.pointsEarned + ' puntos</div>';
        feedbackHTML += '</div>';
    } else {
        var reviewNoteHTML = "";
        if (result.addedToReview) {
            reviewNoteHTML = '<div class="review-note"><i class="fas fa-redo"></i> Agregada a repaso</div>';
        }
        feedbackHTML = '<div class="feedback incorrect">';
        feedbackHTML += '<div class="feedback-header">';
        feedbackHTML += '<i class="fas fa-times-circle"></i>';
        feedbackHTML += '<span>Incorrecto</span>';
        feedbackHTML += '</div>';
        feedbackHTML += '<div class="correct-answer">Correcta: ' + escapeHTML(result.correctAnswer) + '</div>';
        feedbackHTML += reviewNoteHTML;
        feedbackHTML += '</div>';
    }
    var feedbackDiv = document.createElement("div");
    feedbackDiv.innerHTML = feedbackHTML;
    gameScreen.insertBefore(feedbackDiv, optionsContainer.nextSibling);
    var options = document.querySelectorAll(".option");
    for (var i = 0; i < options.length; i++) {
        var optionContent = options[i].querySelector(".option-content").textContent.trim();
        var correctAnswerClean = result.correctAnswer ? result.correctAnswer.trim() : "";
        
        // Primero, limpiar clases de color anteriores
        options[i].classList.remove("correct", "incorrect");
        
        // Marcar la respuesta correcta en VERDE (siempre)
        if (optionContent === correctAnswerClean) {
            options[i].classList.add("correct");
        }
        // Marcar la respuesta seleccionada en ROJO (solo si es incorrecta)
        else if (options[i].classList.contains("selected") && !result.isCorrect) {
            options[i].classList.add("incorrect");
        }
        
        // Limpiar la clase de selección visual
        if (options[i].classList.contains("selected")) {
            options[i].classList.remove("selected-answer");
        }
    }
    updateUI();
    setTimeout(function() {
        if (result.gameOver) {
            showResults();
        } else {
            nextQuestion();
        }
    }, 2000);
}

function nextQuestion() {
    selectedAnswer = null;
    currentQuestion = game.getNextQuestion();

function updateUI() {

        for (var i = 0; i < game.lives; i++) {

    var scoreDisplay = document.getElementById("scoreDisplay");

    var progressDisplay = document.getElementById("progressDisplay");
    if (progressDisplay && currentQuestion) {

}

// Funcion para limpiar texto para PDF
function cleanTextForPDF(text) {
    if (!text) return "";
    var str = String(text);
    var replacements = {
        "\u00e1": "a", "\u00e9": "e", "\u00ed": "i", "\u00f3": "o", "\u00fa": "u",
        "\u00c1": "A", "\u00c9": "E", "\u00cd": "I", "\u00d3": "O", "\u00da": "U",
        "\u00f1": "n", "\u00d1": "N",
        "\u00fc": "u", "\u00dc": "U",
        "\u00bf": "", "\u00a1": "",
        "\u0060": "'", "\u00b4": "'",
        "\u00ab": "\"", "\u00bb": "\"",
        "\u201c": "\"", "\u201d": "\"",
        "\u2018": "'", "\u2019": "'"
    };
    for (var key in replacements) {
        if (replacements.hasOwnProperty(key)) {
            str = str.split(key).join(replacements[key]);
        }
    }
    var result = "";
    for (var i = 0; i < str.length; i++) {
        var charCode = str.charCodeAt(i);
        if (charCode >= 0 && charCode <= 127) {
            result += str.charAt(i);
        }
    }
    return result.replace(/  +/g, " ").trim();
}

function generateCertificate(studentName, results) {
    try {
        if (typeof window.jspdf === "undefined") {
            console.error("jsPDF no esta disponible");
            showMessage("Error: No se puede generar el certificado. La libreria PDF no esta disponible.", "error");
            return false;
        }
        var jsPDF = window.jspdf.jsPDF;
        var doc = new jsPDF({
            orientation: "landscape",
            unit: "mm",
            format: "a4",
            compress: true
        });
        var COLOR_PRIMARY = [220, 0, 106];
        var COLOR_SECONDARY = [255, 105, 180];
        var COLOR_SUCCESS = [16, 185, 129];
        var COLOR_TEXT = [55, 65, 81];
        var COLOR_LIGHT = [156, 163, 175];
        var COLOR_BACKGROUND = [255, 255, 255];
        doc.setFillColor(COLOR_BACKGROUND[0], COLOR_BACKGROUND[1], COLOR_BACKGROUND[2]);
        doc.rect(0, 0, 297, 210, "F");
        doc.setDrawColor(COLOR_PRIMARY[0], COLOR_PRIMARY[1], COLOR_PRIMARY[2]);
        doc.setLineWidth(3);
        doc.rect(15, 15, 267, 180);
        doc.setFontSize(32);
        doc.setTextColor(COLOR_PRIMARY[0], COLOR_PRIMARY[1], COLOR_PRIMARY[2]);
        doc.setFont("helvetica", "bold");
        var certificateTitle = cleanTextForPDF("CERTIFICADO DE APROVECHAMIENTO");
        doc.text(certificateTitle, 148.5, 40, { align: "center" });
        var activityTitle = cleanTextForPDF(results.gameTitle || "Actividad Educativa");
        doc.setFontSize(20);
        doc.setTextColor(COLOR_SECONDARY[0], COLOR_SECONDARY[1], COLOR_SECONDARY[2]);
        doc.setFont("helvetica", "bold");
        var titleLines = doc.splitTextToSize(activityTitle, 220);
        var titleY = 55;
        for (var t = 0; t < titleLines.length && t < 2; t++) {
            doc.text(titleLines[t], 148.5, titleY, { align: "center" });
            titleY += 9;
        }
        doc.setDrawColor(COLOR_SECONDARY[0], COLOR_SECONDARY[1], COLOR_SECONDARY[2]);
        doc.setLineWidth(1);
        doc.line(50, titleY + 5, 247, titleY + 5);
        var contentY = titleY + 18;
        doc.setFontSize(14);
        doc.setTextColor(COLOR_TEXT[0], COLOR_TEXT[1], COLOR_TEXT[2]);
        doc.setFont("helvetica", "normal");
        doc.text(cleanTextForPDF("Se otorga el presente certificado a:"), 148.5, contentY, { align: "center" });
        doc.setFontSize(26);
        doc.setTextColor(COLOR_PRIMARY[0], COLOR_PRIMARY[1], COLOR_PRIMARY[2]);
        doc.setFont("helvetica", "bold");
        var cleanStudentName = cleanTextForPDF(studentName);
        doc.text(cleanStudentName.toUpperCase(), 148.5, contentY + 18, { align: "center" });
        doc.setFontSize(14);
        doc.setTextColor(COLOR_TEXT[0], COLOR_TEXT[1], COLOR_TEXT[2]);
        doc.setFont("helvetica", "normal");
        doc.text(cleanTextForPDF("Por haber completado satisfactoriamente la actividad"), 148.5, contentY + 32, { align: "center" });
        var scoreY = contentY + 50;
        doc.setFontSize(18);
        doc.setTextColor(COLOR_SUCCESS[0], COLOR_SUCCESS[1], COLOR_SUCCESS[2]);
        doc.setFont("helvetica", "bold");
        doc.text("Puntuacion: " + results.scoreOutOf10 + " / 10", 148.5, scoreY, { align: "center" });
        if (results.passed) {
            doc.setFontSize(16);
            doc.text("Enhorabuena! Has superado esta actividad", 148.5, scoreY + 12, { align: "center" });
        }
        var detailsY = scoreY + 30;
        doc.setFontSize(11);
        doc.setTextColor(COLOR_LIGHT[0], COLOR_LIGHT[1], COLOR_LIGHT[2]);
        doc.setFont("helvetica", "normal");
        var today = new Date();
        var formattedDate = today.toLocaleDateString("es-ES", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        });
        doc.text("Fecha: " + formattedDate, 50, detailsY);
        doc.text("Aciertos: " + results.correctAnswers + "/" + results.totalRounds, 247, detailsY, { align: "right" });
        doc.text("Precision: " + results.accuracy + "%", 50, detailsY + 7);
        doc.text("Tiempo: " + results.timePlayedFormatted, 247, detailsY + 7, { align: "right" });
        var certificateId = "FLASH-" + Date.now().toString(36).toUpperCase() + "-" + Math.random().toString(36).substr(2, 4).toUpperCase();
        doc.setFontSize(9);
        doc.text("Certificado generado automaticamente - Actividad Interactiva de FOL | ID: " + certificateId, 148.5, detailsY + 18, { align: "center" });
        var cleanFileName = cleanStudentName.toLowerCase().replace(/ +/g, "-").replace(/[^a-z0-9-]/g, "");
        var fileName = "certificado-" + cleanFileName + ".pdf";
        doc.save(fileName);
        return true;
    } catch (error) {
        console.error("Error al generar certificado:", error);
        showMessage("Error al generar el certificado: " + error.message, "error");
        return false;
    }
}

    html += '<button class="btn btn-primary" id="generateCertificateBtn">';
    html += '<i class="fas fa-file-download"></i> Generar Certificado PDF';
    html += '</button>';
    html += '</div>';
    html += '</div>';
    html += '</div>';
    html += '</div>';
    gameContent.innerHTML = html;
    document.getElementById("backToResultsBtn").addEventListener("click", function() {
        showResults();
    });
    document.getElementById("generateCertificateBtn").addEventListener("click", function() {
        var studentName = document.getElementById("studentName").value.trim();
        if (!studentName) {
            showMessage("Por favor, ingresa tu nombre completo", "error");
            document.getElementById("studentName").focus();
            return;
        }
        if (studentName.length < 3) {
            showMessage("El nombre debe tener al menos 3 caracteres", "error");
            return;
        }
        showMessage("Generando certificado PDF...", "info");
        var success = generateCertificate(studentName, results);
        if (success) {
            showMessage("Certificado generado y descargado exitosamente", "success");
            setTimeout(function() {
                var certificateForm = document.querySelector(".certificate-form");
                var downloadSuccess = document.createElement("div");
                downloadSuccess.className = "download-success";
                var successHtml = "";
                successHtml += '<div class="success-message">';
                successHtml += '<i class="fas fa-check-circle"></i>';
                successHtml += '<div>';
                successHtml += '<h4>Certificado Descargado!</h4>';
                successHtml += '<p>El certificado se ha guardado en tu dispositivo.</p>';
                successHtml += '</div>';
                successHtml += '</div>';
                successHtml += '<div class="controls" style="margin-top: 20px;">';
                successHtml += '<button class="btn btn-primary" id="finishBtn">';
                successHtml += '<i class="fas fa-home"></i> Volver al Menu Principal';
                successHtml += '</button>';
                successHtml += '</div>';
                downloadSuccess.innerHTML = successHtml;
                certificateForm.appendChild(downloadSuccess);
                document.getElementById("finishBtn").addEventListener("click", showStartScreen);
            }, 500);
        }
    });
    setTimeout(function() {
        document.getElementById("studentName").focus();
    }, 100);
}
