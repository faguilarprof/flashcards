},{"id":43,"concept":"Notario","definition":"Un profesional legal autorizado para redactar y certificar documentos legales, como escrituras de constitución de sociedades.","featured":true},{"id":44,"concept":"Número de identificación fiscal","definition":"Número único que identifica a una persona o empresa ante la Agencia Tributaria.","featured":true},{"id":45,"concept":"Obtención de un certificado electrónico","definition":"Proceso para obtener un certificado electrónico que permite firmar documentos electrónicos e identificar al propietario de la firma.","featured":false},{"id":46,"concept":"Pasos para la creación de una startup","definition":"Definir la idea de negocio, realizar un estudio de mercado, establecer una propuesta de valor, crear una marca propia, delimitar el público objetivo, formar un equipo de trabajo sólido, desarrollar un Producto Mínimo Viable (MVP), validar el modelo de negocio y conseguir la financiación necesaria.","featured":false},{"id":47,"concept":"Plan de negocios","definition":"Documento que establece la visión, misión, objetivos, estrategias y análisis financiero de una empresa.","featured":true},{"id":48,"concept":"Razón social","definition":"Nombre de una sociedad que incluye los nombres de los socios colectivos.","featured":true},{"id":49,"concept":"Régimen Especial de Trabajadores Autónomos (RETA)","definition":"Régimen al que deben darse de alta los autónomos en la Seguridad Social.","featured":false},{"id":50,"concept":"Registro Mercantil Central","definition":"El organismo encargado de mantener un registro de todas las sociedades mercantiles en España.","featured":true},{"id":51,"concept":"Registro Mercantil Provincial","definition":"Institución encargada de registrar y mantener la información de las empresas en una provincia.","featured":false},{"id":52,"concept":"Responsabilidad ilimitada","definition":"Obligación de responder por las deudas y obligaciones con todos los bienes que uno tenga, presentes y futuros","featured":true},{"id":53,"concept":"Responsabilidad limitada","definition":"Obligación de responder por las deudas y obligaciones hasta el monto del capital aportado.","featured":true},{"id":54,"concept":"Responsabilidad personal","definition":"Obligación de responder por las deudas y obligaciones de manera individual.","featured":true},{"id":55,"concept":"Responsabilidad solidaria","definition":"Obligación que tiene cada uno de los deudores de hacer frente de forma individual a la totalidad de la deuda conjunta a requerimiento del acreedor.","featured":true},{"id":56,"concept":"Responsabilidad subsidiaria","definition":"Obligación de responder por las deudas y obligaciones solo en caso de que otros no puedan hacerlo.","featured":true},{"id":57,"concept":"Scaleups","definition":"Empresas que experimentan un crecimiento anual de más del 20% durante tres años consecutivos.","featured":false},{"id":58,"concept":"Sociedad Anónima","definition":"Sociedad de carácter mercantil en la cual el capital social, dividido en acciones, está integrado por las aportaciones de los socios, los cuales no responden personalmente de las deudas sociales.","featured":true},{"id":59,"concept":"Sociedad Anónima Laboral","definition":"Sociedades anónimas en las que la mayoría del capital social es propiedad de los trabajadores que prestan en ellas servicios retribuidos en forma personal y directa, cuya relación laboral es por tiempo indefinido.","featured":false},{"id":60,"concept":"Sociedad Civil","definition":"Contrato en el que dos o más personas ponen en común capital con el propósito de repartir las ganancias entre sí.","featured":true},{"id":61,"concept":"Sociedad Colectiva","definition":"Sociedad mercantil en la que todos los socios, en nombre colectivo y bajo una razón social, se comprometen a participar en la proporción que establezcan, respondiendo subsidiaria, personal y solidariamente de las deudas sociales.","featured":true},{"id":62,"concept":"Sociedad Comanditaria","definition":"Tipo de s function showPrintable(name,r){setStats('');setScreen('diploma','<section class="screen printable"><div class="diploma-page"><div class="seal">🎓</div><h2>DIPLOMA DE APROVECHAMIENTO</h2><h3>'+esc(cfg.title)+'</h3><p>Se concede el presente diploma a</p><div class="diploma-name">'+esc(name.toUpperCase())+'</div><div class="diploma-line"></div><p>por haber superado satisfactoriamente la actividad</p><h3 style="color:var(--ok)">Calificación: '+r.grade+' / 10</h3><p>Aciertos: '+r.correct+'/'+r.total+' · Precisión: '+r.percent+'% · Tiempo: '+r.time+'</p><p><small>'+new Date().toLocaleDateString('es-ES')+' · '+esc(cfg.subject)+' · ID: '+r.id+'</small></p></div><div class="btns diploma-controls"><button class="btn primary" id="doPrint">Imprimir / Guardar como PDF</button><button class="btn secondary" id="backResults">Volver a resultados</button></div></section>');document.getElementById('doPrint').onclick=function(){window.print()};document.getElementById('backResults').onclick=finishQuiz}
document.addEventListener('keydown',function(e){if(app.screen==='quiz-question'&&!app.quiz.locked&&/^[1-4]$/.test(e.key))answerQuiz(parseInt(e.key,10)-1);if(app.screen==='review-card'&&(e.key===' '||e.key==='Enter')){e.preventDefault();flipReview()}});window.addEventListener('beforeunload',function(){if(app.screen==='review-card')saveReviewProgress()});document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'&&app.screen==='review-card')saveReviewProgress()});function init(){if(!cards.length){setScreen('home','<section class="screen center"><h2>No hay fichas disponibles</h2></section>');return}if(cfg.outputMode==='both'){if(cfg.startMode==='review')showReviewStart();else if(cfg.startMode==='quiz'&&cards.length>=4)showQuizStart();else showHome(true)}else showHome(false)}init()})();
</script></body></html>
