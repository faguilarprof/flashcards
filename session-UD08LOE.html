        "definition": "⚠️ ️ Transmisión de la facultad de explotar una obra/grabación con exclusión de otras personas, comprendido incluso el propio cedente. Debe formalizarse expresamente y por escrito."
      },
      {
        "concept": "⚠️ ️ Cesión no exclusiva",
        "definition": "⚠️ ️ Transmisión de la facultad de explotación, pero en concurrencia con otros cesionarios o con el propio cedente."
      },
      {
        "concept": "⚠️ ️ Competencia desleal",
        "definition": "⚠️ ️ Prácticas comerciales que generan confusión, desacreditan a competidores o engañan al público sobre características de productos"
      },
      {
        "concept": "⚠️ ️ Comunicación pública",
        "definition": "⚠️ ️ Derecho patrimonial exclusivo de autorizar cualquier acto por el cual una pluralidad de personas pueda acceder a la obra"
      },
      {
        "concept": "Comunicación vía satélite",
        "definition": "Forma de comunicación pública que consiste en introducir las señales portadoras de programas en una cadena ininterrumpida de comunicación que se dirige a un satélite, y desde éste a la Tierra."
      },
      {
        "concept": "Concepción (de una obra)",
        "definition": "Formación intelectual de una idea o proyecto."
      },
      {
        "concept": "Confidencialidad",
        "definition": "Políticas, normas, o compromisos tendentes a garantizar que una determinada información no sea comunicada incorrectamente, ni revelada a personas no autorizadas, ni se haga públicamente accesible."
      },
      {
        "concept": "Consentimiento",
        "definition": "Asentimiento, autorización, licencia, permiso. Ha de ser reconocible externamente, bien de forma expresa (escrita o no) o tácita (por ejemplo, mediante un comportamiento inequívoco)."
      },
      {
        "concept": "Contrato",
        "definition": "Compromiso, pacto, o acuerdo de voluntades entre dos o más personas, por el cual libremente se encargan o entregan una cosa, prestan un servicio, crean o extinguen relaciones, etc."
      },
      {
        "concept": "⚠️ ️ Contrato de edición",
        "definition": "⚠️ ️ Acuerdo mediante el cual un autor cede a un editor el derecho de reproducir y distribuir su obra a cambio de remuneración"
      },
      {
        "concept": "Convención Universal de Ginebra",
        "definition": "Tratado internacional que protege los derechos de autor en el ámbito literario y artístico"
      },
      {
        "concept": "⚠️ ️ Convenio de Berna",
        "definition": "⚠️ ️ Tratado internacional de 1886 que establece principios básicos para la protección de obras literarias y artísticas mediante el trato nacional"
      },
      {
        "concept": "⚠️ ️ Convenio de París",
        "definition": "⚠️ ️ Tratado internacional de 1883 para ayudar a obtener protección de creaciones intelectuales mediante derechos de propiedad industrial en otros países"
      },
      {
        "concept": "Copia auténtica",
        "definition": "Copia autorizada y legítima (genuina, garantizada) de un documento."
      },
      {
        "concept": "⚠️ ️ Copia privada",
        "definition": "⚠️ ️ Reproducción de un soporte/grabación realizada exclusivamente para uso privado, conforme a la autorización prevista en la ley, mediante instrumentos no tipográficos, o reproductores sonoros, visuales o audiovisuales, siempre que la copia se destine a uso particular y no lucrativo."
      },
      {
        "concept": "Copiar",
        "definition": "Hacer una cosa igual a otra que ya está hecha, tomando ésta como modelo o referencia. Imitar, repetir, reproducir."
      },
      {
        "concept": "Depósito",
        "definition": "Contrato por el que una persona (depositante) hace entrega a otra persona (depositario) de una cosa mueble para que la guarde y custodie, con la obligación de devolverla cuando la reclame. Es un contrato civil."
      },
      {
        "concept": "⚠️ ️ Derecho de acceso",
        "definition": "⚠️ ️ Derecho moral que permite al autor acceder a la obra para ejercer sus derechos cuando se encuentra en formato no reproducible"
      },
      {
        "concept": "⚠️ ️ Derecho de alquiler",
        "definition": "⚠️ ️ Derecho patrimonial exclusivo de autorizar el alquiler comercial de copias de obras, interpretaciones o fonogramas"
      },
      {
        "concept": "⚠️ ️ Derecho de distribución",
        "definition": "⚠️ ️ Derecho patrimonial exclusivo de autorizar la distribución de copias de la obra al público mediante venta, alquiler o préstamo"
      },
      {
        "concept": "⚠️ ️ Derecho de divulgación",
        "definition": "⚠️ ️ Derecho moral exclusivo del autor para decidir cuándo y cómo su obra será expuesta al público por primera vez"
      },
      {
        "concept": "⚠️ ️ Derecho de integridad",
        "definition": "⚠️ ️ Derecho moral a oponerse a cualquier modificación de la obra que pueda ser perjudicial para la reputación del autor"
      },
      {
        "concept": "⚠️ ️ Derecho de modificación",
        "definition": "⚠️ ️ Derecho moral del autor a hacer cualquier cambio o ajuste a su obra durante su vida"
      },
      {
        "concept": "⚠️ ️ Derecho de participación",
        "definition": "⚠️ ️ Derecho de artistas plásticos a percibir remuneración por ventas sucesivas de sus obras originales durante 70 años tras su fallecimiento"
      },
      {
        "concept": "⚠️ ️ Derecho de paternidad",
        "definition": "⚠️ ️ Derecho moral a ser reconocido y nombrado como autor de la obra en cualquier uso o reproducción"
      },
      {
        "concept": "⚠️ ️ Derecho de prioridad",
        "definition": "⚠️ ️ Derecho que permite beneficiarse de la fecha de presentación de una solicitud anterior en otro país durante 12 meses para patentes o 6 para marcas"
      },
      {
        "concept": "⚠️ ️ Derecho de reproducción",
        "definition": "⚠️ ️ Derecho patrimonial exclusivo de autorizar la reproducción de la obra en cualquier forma o medio físico o digital"
      },
      {
        "concept": "⚠️ ️ Derecho de retirada",
        "definition": "⚠️ ️ Derecho moral a retirar la obra del comercio indemnizando a los titulares de derechos de explotación si hay contratos"
      },
      {
        "concept": "⚠️ ️ Derecho de transformación",
        "definition": "⚠️ ️ Derecho patrimonial exclusivo de autorizar la modificación de la obra creando una obra derivada como traducciones o adaptaciones"
      },
      {
        "concept": "⚠️ ️ Derechos afines o conexos",
        "definition": "⚠️ ️ Derechos que protegen intereses legales de personas que contribuyen a hacer obras disponibles al público sin ser los autores"
      },
      {
        "concept": "⚠️ ️ Derechos compensatorios",
        "definition": "⚠️ ️ Derechos que cubren la propiedad intelectual dejada de percibir por reproducciones privadas para uso particular"
      },
      {
        "concept": "Derechos reales",
        "definition": "Derechos de una persona sobre ciertas cosas, que le permiten actuar sobre ellas, atribuyéndole poderes y facultades; se caracterizan por la relación directa e inmediata del titular sobre el objeto, y frente a todos los demás (ejemplo: una hipoteca)."
      },
      {
        "concept": "⚠️ ️ Derecho de autor",
        "definition": "⚠️ ️ Derechos exclusivos de los creadores sobre sus obras originales, que permiten controlar su uso y distribución. Los hay tanto morales como patrimoniales."
      },
      {
        "concept": "Derecho irrenunciable",
        "definition": "Son irrenunciables aquellos derechos reconocidos por las leyes, y de los cuales su titular no puede disponer, por existir un interés público regulado por normas imperativas ; el titular de estos derechos no puede renunciar a ellos."
      },
      {
        "concept": "⚠️ ️ Derechos de explotación",
        "definition": "⚠️ ️ Conjunto de derechos patrimoniales que la ley reconoce en relación con los actos de explotación y aprovechamiento de la PI, en sentido amplio, sean derechos de autor o derechos conexos, y con el rendimiento económico o comercial derivado de dichos actos. Por su carácter patrimonial son derechos transmisibles inter vivos y mortis causa, son hipotecables y embargables."
      },
      {
        "concept": "⚠️ ️ Derechos morales",
        "definition": "⚠️ ️ Derechos inherentes, inalienables, intransferibles, irrenunciables e imprescriptibles que reconocen autoría e integridad de la obra"
      },
      {
        "concept": "⚠️ ️ Derechos patrimoniales",
        "definition": "⚠️ ️ Derechos transferibles que permiten al autor obtener compensación económica por el uso de sus obras por terceros"
      },
      {
        "concept": "⚠️ ️ DAMA",
        "definition": "⚠️ ️ DERECHOS DE AUTOR DE MEDIOS AUDIOVISUALES. Es una entidad de gestión colectiva que representa a Autores de obras audiovisuales y cinematográficas."
      },
      {
        "concept": "Digitalizar",
        "definition": "Transferir una obra desde un soporte analógico a otro digital, mediante su codificación numérica o transformación en código binario."
      },
      {
        "concept": "Directiva 2001/29/CE",
        "definition": "Normativa europea sobre derechos de autor en la sociedad de la información"
      },
      {
        "concept": "Directiva 2019/790",
        "definition": "Normativa europea sobre derechos de autor en el mercado único digital"
      },
      {
        "concept": "⚠️ ️ Diseño comunitario no registrado",
        "definition": "⚠️ ️ Protección automática durante tres años para diseños divulgados en la UE sin registro, solo contra copia directa"
      },
      {
        "concept": "⚠️ ️ Diseño industrial",
        "definition": "⚠️ ️ Apariencia u ornamentación de un producto que lo hace visualmente diferente sin considerar características técnicas o funcionales"
      },
      {
        "concept": "Distribución no autorizada",
        "definition": "Infracción consistente en comercializar, vender o distribuir copias de obra protegida sin autorización del titular"
      },
      {
        "concept": "⚠️ ️ Dominio público",
        "definition": "⚠️ ️ Situación de obras cuyos derechos de explotación han expirado, pudiendo usarse libremente respetando paternidad e integridad"
      },
      {
        "concept": "Editar",
        "definition": "Hacer, por procedimientos mecánicos o de otro tipo, múltiples ejemplares de una obra escrita, grabados, dibujos, diseños, etc., para difundirlos al público, con o sin precio."
      },
      {
        "concept": "⚠️ ️ Editor",
        "definition": "⚠️ ️ Empresa o persona que se encarga de la producción y distribución de una obra invirtiendo en su edición, promoción y venta"
      },
      {
        "concept": "⚠️ ️ EGEDA",
        "definition": "⚠️ ️ ENTIDAD DE GESTIÓN DE DERECHOS AUDIOVISUALES. Es una entidad de gestión colectiva que representa a Productores audiovisuales."
      },
      {
        "concept": "Emisión",
        "definition": "Acto de comunicación pública por el cual una pluralidad de personas tiene acceso a una obra/grabación, mediante difusión inalámbrica de signos, sonidos, o de imágenes y sonidos."
      },
      {
        "concept": "⚠️ ️ Entidades de gestión colectiva",
        "definition": "⚠️ ️ Entidades sin ánimo de lucro autorizadas para gestionar derechos de explotación por cuenta de varios titulares de propiedad intelectual"
      },
      {
        "concept": "⚠️ ️ EUIPO",
        "definition": "⚠️ ️ Oficina de Propiedad Intelectual de la Unión Europea competente para marcas y modelos comunitarios"
      },
      {
        "concept": "⚠️ ️ Fonograma",
        "definition": "⚠️ ️ Grabación de sonido como álbumes y discos con derechos de reproducción, distribución y comunicación pública para productores"
      },
      {
        "concept": "⚠️ ️ Grabación audiovisual",
        "definition": "⚠️ ️ Fijación de un plano o secuencia de imágenes, con o sin sonido, y sean o no creaciones susceptibles de ser calificadas como obras audiovisuales"
      },
      {
        "concept": "Indemnización",
        "definition": "Resarcimiento, reparación; compensación económica motivada por un daño o perjuicio causado en los derechos e intereses legítimos del afectado. Quien provoca un daño a otro queda obligado a indemnizarle."
      },
      {
        "concept": "Indicaciones geográficas",
        "definition": "Signos que identifican productos originarios de un lugar geográfico específico con cualidades o reputación vinculadas a ese origen"
      },
      {
        "concept": "Inscripción",
        "definition": "Toma de razón en un registro público; nota escrita de un acto o documento en el Registro, a fin de darle publicidad y obtener valor probatorio (constituye la prueba de los hechos inscritos)."
      },
      {
        "concept": "⚠️ ️ Invención",
        "definition": "⚠️ ️ Solución a un problema técnico que es novedosa, tiene carácter inventivo y es susceptible de aplicación industrial"
      },
      {
        "concept": "Legitimación",
        "definition": "Facultad legalmente reconocida de iniciar y conducir un proceso concreto frente a otro sujeto, habitualmente por ser titular de un derecho frente a él."
      },
      {
        "concept": "⚠️ ️ Ley de Propiedad intelectual",
        "definition": "⚠️ ️ Marco legal que regula la protección de la propiedad intelectual en España"
      },
      {
        "concept": "⚠️ ️ Licencia",
        "definition": "⚠️ ️ Autorización que otorga el titular de derechos de propiedad intelectual o industrial a otra persona para que utilice los mismos"
      },
      {
        "concept": "⚠️ ️ Marca",
        "definition": "⚠️ ️ Signo susceptible de representación gráfica que distingue productos o servicios de una empresa de los de otras en el mercado"
      },
      {
        "concept": "⚠️ ️ Marca colectiva",
        "definition": "⚠️ ️ Signo que distingue productos o servicios de miembros de una asociación de los de otras empresas"
      },
      {
        "concept": "⚠️ ️ Marca de garantía",
        "definition": "⚠️ ️ Signo que certifica características específicas de productos o servicios como materiales, origen, calidad o modo de fabricación"
      },
      {
        "concept": "Marca olfativa",
        "definition": "Tipo de marca consistente en un aroma o fragancia específica que identifica productos o servicios"
      },
      {
        "concept": "Marca sonora",
        "definition": "Tipo de marca consistente en sonidos distintivos como melodías o efectos sonoros que identifican productos o servicios"
      },
      {
        "concept": "Marca tridimensional",
        "definition": "Marca constituida por la forma del producto o su embalaje como elemento distintivo en el mercado"
      },
      {
        "concept": "Medidas cautelares",
        "definition": "Resoluciones que un tribunal puede adoptar, al principio de un proceso (o incluso antes de iniciarse éste), bien para proteger de forma preventiva la integridad de un derecho sobre el cual se discute en el proceso, bien para asegurar la ejecución de la resolución definitiva que se dicte."
      },
      {
        "concept": "⚠️ ️ Modelo de utilidad",
        "definition": "⚠️ ️ Invención con menor rango inventivo que una patente que protege configuraciones que derivan utilidad o ventaja práctica"
      },
      {
        "concept": "⚠️ ️ Nombre comercial",
        "definition": "⚠️ ️ Signo susceptible de representación gráfica que identifica a una empresa en el tráfico mercantil distinguiéndola de otras"
      },
      {
        "concept": "⚠️ ️ Novedad",
        "definition": "⚠️ ️ Requisito de patentabilidad que establece que la invención no debe formar parte del estado de la técnica previamente conocido"
      },
      {
        "concept": "⚠️ ️ Obra",
        "definition": "⚠️ ️ Creación original literaria, artística o científica expresada en cualquier medio o soporte tangible o intangible"
      },
      {
        "concept": "Obra audiovisual",
        "definition": "Creación que combina elementos visuales y auditivos como películas, series, documentales y videos musicales"
      },
      {
        "concept": "⚠️ ️ Obra colectiva",
        "definition": "⚠️ ️ Creación realizada por iniciativa y bajo coordinación de una persona que la edita y divulga bajo su nombre"
      },
      {
        "concept": "Obra de arte aplicada",
        "definition": "Creación artística con función utilitaria como esculturas, pinturas o dibujos aplicados a objetos funcionales"
      },
      {
        "concept": "⚠️ ️ Obra derivada",
        "definition": "⚠️ ️ Creación basada en otra obra preexistente mediante traducción, adaptación, arreglo u otra transformación autorizada"
      },
      {
        "concept": "Obra escénica",
        "definition": "Representación teatral, danza, ballet o performance en vivo con guiones y coreografías protegidas"
      },
      {
        "concept": "Obra fonográfica",
        "definition": "Grabación de sonido protegida por derechos de autor y derechos conexos de productores fonográficos"
      },
      {
        "concept": "⚠️ ️ Obra fotográfica",
        "definition": "⚠️ ️ Imagen captada mediante fotografía que cumple requisitos de originalidad y creatividad para protección"
      },
      {
        "concept": "⚠️ ️ Obra huérfana",
        "definition": "⚠️ ️ Creación cuyos titulares de derechos no están identificados o localizados a pesar de búsqueda diligente realizada"
      },
      {
        "concept": "Obra literaria",
        "definition": "Creación escrita como libros, folletos, epistolarios, discursos, conferencias y obras de naturaleza similar"
      },
      {
        "concept": "Obra musical",
        "definition": "Composición musical con o sin letra protegida por derechos de autor sobre melodía, armonía y arreglos"
      },
      {
        "concept": "⚠️ ️ OEP",
        "definition": "⚠️ ️ Oficina Europea de Patentes competente para el registro y protección de patentes a nivel europeo"
      },
      {
        "concept": "⚠️ ️ OEPM",
        "definition": "⚠️ ️ Oficina Española de Patentes y Marcas, organismo nacional competente para registro de propiedad industrial en España"
      },
      {
        "concept": "⚠️ ️ OMPI",
        "definition": "⚠️ ️ Organización Mundial de la Propiedad Intelectual que administra tratados internacionales y protección a nivel mundial"
      },
      {
        "concept": "⚠️ ️ Operadores de gestión independiente",
        "definition": "⚠️ ️ Entidades con ánimo de lucro autorizadas por contrato para gestionar derechos de titulares sin su control directo"
      },
      {
        "concept": "⚠️ ️ Organismos de radiodifusión",
        "definition": "⚠️ ️ Entidades que realizan emisiones de radio y televisión gozando de derechos conexos sobre sus transmisiones"
      },
      {
        "concept": "⚠️ ️ Originalidad",
        "definition": "⚠️ ️ Requisito fundamental que exige que la obra sea resultado de un proceso creativo sin copiar a nadie con resultado novedoso"
      },
      {
        "concept": "⚠️ ️ Patente",
        "definition": "⚠️ ️ Título que reconoce derecho exclusivo de explotar invención impidiendo a otros su fabricación, venta o utilización sin consentimiento"
      },
      {
        "concept": "Periodo de gracia",
        "definition": "Plazo de 12 meses desde divulgación pública del diseño para decidir si se registra formalmente sin perder novedad"
      },
      {
        "concept": "⚠️ ️ Plagio",
        "definition": "⚠️ ️ Copia de obra ajena con total similitud en lo sustancial, actividad mecanizada y carente de toda originalidad, con coincidencias estructurales básicas y fundamentales."
      },
      {
        "concept": "Prescriptor",
        "definition": "Persona que recomienda o prescribe una obra influenciando decisiones de compra sin ser necesariamente el comprador final"
      },
      {
        "concept": "Préstamo",
        "definition": "Puesta a disposición de los originales y copias de una obra  para su uso por tiempo limitado, sin beneficio económico o comercial, directo ni indirecto, siempre que el préstamo se lleve a cabo a través de establecimientos abiertos al público"
      },
      {
        "concept": "Privilegios",
        "definition": "Concesiones gubernamentales históricas otorgadas a impresores y libreros para derechos exclusivos de reproducción de obras"
      },
      {
        "concept": "⚠️ ️ Productores de fonogramas",
        "definition": "⚠️ ️ Personas o entidades responsables de realizar grabaciones de sonido con derechos conexos sobre las mismas"
      },
      {
        "concept": "⚠️ ️ Programa de ordenador",
        "definition": "⚠️ ️ Cualquier secuencia de instrucciones o indicaciones destinadas a ser utilizadas, directa o indirectamente, en un sistema informático para realizar una función o una tarea o para obtener un resultado determinado, sea cual sea su forma de expresión y de fijación. Se incluye la documentación preparatoria."
      },
      {
        "concept": "⚠️ ️ Propiedad industrial",
        "definition": "⚠️ ️ Rama del derecho que protege invenciones, diseños industriales y signos distintivos relacionados con actividad empresarial"
      },
      {
        "concept": "⚠️ ️ Propiedad intelectual",
        "definition": "⚠️ ️ Conjunto de derechos que protegen creaciones originales literarias, artísticas y científicas del intelecto humano"
      },
      {
        "concept": "Proyecto",
        "definition": "Plan, idea que se tiene de algo; dibujo en que se expone una cosa que se piensa hacer o que se puede hacer."
      },
      {
        "concept": "⚠️ ️ Publicación",
        "definition": "⚠️ ️ Divulgación  que se realice mediante la puesta a disposición del público de un número de ejemplares de la obra que satisfaga razonablemente sus necesidades estimadas de acuerdo con su naturaleza y finalidad."
      },
      {
        "concept": "Puesta a disposición",
        "definition": "Nueva forma de explotación de la PI en línea, a través de las redes de comunicación pública. Una creación almacenada en formato digital  se pone a disposición del público de forma interactiva, de forma que los usuarios pueden acceder a la obra en el lugar y en el momento que elijan. Internet  es el ejemplo más relevante."
      },
      {
        "concept": "⚠️ ️ Registro de la Propiedad Intelectual",
        "definition": "⚠️ ️ Organismo oficial donde se inscriben voluntariamente obras para obtener prueba cualificada de existencia y titularidad"
      },
      {
        "concept": "⚠️ ️ Regalía",
        "definition": "⚠️ ️ Pago de cantidad variable ligada al volumen de producción o ventas que debe abonarse al propietario de derechos durante un tiempo"
      },
      {
        "concept": "⚠️ ️ Reivindicaciones",
        "definition": "⚠️ ️ Parte de solicitud de patente que define el objeto para el que se solicita protección basándose en la descripción técnica"
      },
      {
        "concept": "Representación",
        "definition": "Consiste en confiar a una persona (representante) la facultad de actuar y decidir en interés y por cuenta de un tercero (representado). Los actos del representante vinculan al representado."
      },
      {
        "concept": "Reproducción",
        "definition": "Fijación de la obra en un medio o soporte que permita su comunicación y la obtención de copias de toda o parte de ella. Toda grabación sonora o visual es considerada reproducción (BERNA)."
      },

function StandaloneMemoryTrainer(config) {
    config = config || {};
    this.cards = Array.isArray(config.cards) ? config.cards : [];
    this.sessionTitle = config.sessionTitle || "Sesión de Estudio";
    this.instructions = config.instructions || "Haz clic en las cartas para voltearlas.";
    this.studyMode = config.studyMode || "mixed";
    this.cardsPerSession = parseInt(config.cardsPerSession) || Math.min(this.cards.length, 200);
    this.order = config.order || "sequential";
    this.showTimer = config.showTimer !== false;
    this.autoFlip = config.autoFlip !== false;
    this.enableSound = config.enableSound !== false;
    this.showProgress = config.showProgress !== false;
    this.customColors = config.customColors || {
        primary: "#4361ee",
        cardFront: "#ffffff",
        cardBack: "#f8f9fa",
        success: "#06d6a0",
        warning: "#ffd166",
        danger: "#ef476f"
    };
    this.state = {
        active: false,
        currentSession: [],
        currentCardIndex: 0,
        startTime: null,
        learnedCards: [],
        difficultCards: [],
        cardStatus: {},
        flippedCards: new Set(),
        sessionStats: {
            totalCards: 0,
            learned: 0,
            difficult: 0,
            remaining: 0,
            timeSpent: 0
        }
    };
    this._processCards();
}

StandaloneMemoryTrainer.prototype._processCards = function() {
    if (!Array.isArray(this.cards)) {
        throw new Error("Las cartas deben ser un array");
    }
    this.cards = this.cards.map(function(card) {
        if (!card || typeof card !== "object") return null;
        var conceptStr = card.concept ? String(card.concept).trim() : "";
        var definitionStr = card.definition ? String(card.definition).trim() : "";
        var warningChar = "⚠️";
        var isImportantConcept = conceptStr.indexOf(warningChar) === 0;
        var isImportantDefinition = definitionStr.indexOf(warningChar) === 0;
        var newCard = {
            concept: isImportantConcept ? conceptStr.substring(warningChar.length).trim() : conceptStr,
            definition: isImportantDefinition ? definitionStr.substring(warningChar.length).trim() : definitionStr,
            important: isImportantConcept || isImportantDefinition,
            status: "unseen",
            timesSeen: 0,
            timesFlipped: 0,
            lastSeen: null
        };
        return newCard;
    }).filter(function(card) {
        return card && card.concept && card.definition;
    });
    if (this.cards.length < 1) {
        throw new Error("Se necesita al menos 1 carta para estudiar");
    }
};

StandaloneMemoryTrainer.prototype._shuffleArray = function(array) {
    var shuffled = array.slice();
    for (var i = shuffled.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = shuffled[i];
        shuffled[i] = shuffled[j];
        shuffled[j] = temp;
    }
    return shuffled;
};

StandaloneMemoryTrainer.prototype._getElapsedTime = function() {
    if (!this.state.startTime) return 0;
    return Date.now() - this.state.startTime;
};

StandaloneMemoryTrainer.prototype._formatTime = function(ms) {
    var seconds = Math.floor(ms / 1000);
    var minutes = Math.floor(seconds / 60);
    var remainingSeconds = seconds % 60;
    if (minutes > 0) {
        return minutes + ":" + (remainingSeconds < 10 ? "0" : "") + remainingSeconds;
    }
    return "0:" + (remainingSeconds < 10 ? "0" : "") + remainingSeconds;
};

StandaloneMemoryTrainer.prototype._updateStats = function() {
    var total = this.state.currentSession.length;
    var learned = this.state.learnedCards.length;
    var difficult = this.state.difficultCards.length;
    var remaining = total - learned;
    this.state.sessionStats = {
        totalCards: total,
        learned: learned,
        difficult: difficult,
        remaining: remaining,
        timeSpent: this._getElapsedTime()
    };
};

StandaloneMemoryTrainer.prototype.startSession = function() {
    if (this.cards.length < 1) {
        throw new Error("No hay cartas para estudiar");
    }
    this.state = {
        active: true,
        currentSession: [],
        currentCardIndex: 0,
        startTime: Date.now(),
        learnedCards: [],
        difficultCards: [],
        cardStatus: {},
        flippedCards: new Set(),
        sessionStats: {
            totalCards: 0,
            learned: 0,
            difficult: 0,
            remaining: 0,
            timeSpent: 0
        }
    };
    var cardsToStudy = this.cards.slice();
    if (this.studyMode === "difficult") {
        cardsToStudy = cardsToStudy.filter(function(card) {
            return this.state.cardStatus[card.concept] === "difficult" || card.important;
        }.bind(this));
    }
    cardsToStudy = cardsToStudy.slice(0, this.cardsPerSession);
    if (this.order === "random") {
        cardsToStudy = this._shuffleArray(cardsToStudy);
    }
    this.state.currentSession = cardsToStudy;
    this.state.sessionStats.totalCards = cardsToStudy.length;
    this.state.sessionStats.remaining = cardsToStudy.length;
    cardsToStudy.forEach(function(card) {
        this.state.cardStatus[card.concept] = card.status || "unseen";
    }.bind(this));
    return {
        success: true,
        totalCards: cardsToStudy.length,
        firstCard: cardsToStudy[0],
        sessionTitle: this.sessionTitle
    };
};

StandaloneMemoryTrainer.prototype.getNextCard = function() {
    if (!this.state.active || this.state.currentCardIndex >= this.state.currentSession.length) {
        return null;
    }
    var card = this.state.currentSession[this.state.currentCardIndex];
    var totalCards = this.state.currentSession.length;
    var currentNumber = this.state.currentCardIndex + 1;
    var progress = totalCards > 0 ? Math.round((this.state.currentCardIndex / totalCards) * 100) : 0;
    card.timesSeen = (card.timesSeen || 0) + 1;
    card.lastSeen = new Date().toISOString();
    return {
        card: card,
        cardNumber: currentNumber,
        totalCards: totalCards,
        progress: progress,
        isImportant: card.important,
        status: this.state.cardStatus[card.concept] || "unseen",
        flipped: this.state.flippedCards.has(card.concept),
        timeSpent: this._getElapsedTime()
    };
};

StandaloneMemoryTrainer.prototype.nextCard = function() {
    if (this.state.currentCardIndex >= this.state.currentSession.length - 1) {
        return false;
    }
    this.state.currentCardIndex++;
    return true;
};

StandaloneMemoryTrainer.prototype.previousCard = function() {
    if (this.state.currentCardIndex <= 0) {
        return false;
    }
    this.state.currentCardIndex--;
    return true;
};

StandaloneMemoryTrainer.prototype.flipCard = function(cardConcept) {
    var card = this.state.currentSession.find(function(c) {
        return c.concept === cardConcept;
    });
    if (!card) {
        return { success: false, error: "Carta no encontrada" };
    }
    this.state.flippedCards.add(cardConcept);
    card.timesFlipped = (card.timesFlipped || 0) + 1;
    return {
        success: true,
        card: card,
        flipped: true,
        definition: card.definition,
        timesFlipped: card.timesFlipped
    };
};

StandaloneMemoryTrainer.prototype.markAsLearned = function(cardConcept) {
    var card = this.state.currentSession.find(function(c) {
        return c.concept === cardConcept;
    });
    if (!card) {
        return { success: false, error: "Carta no encontrada" };
    }
    this.state.cardStatus[cardConcept] = "learned";
    if (this.state.learnedCards.indexOf(cardConcept) === -1) {
        this.state.learnedCards.push(cardConcept);
    }
    var difficultIndex = this.state.difficultCards.indexOf(cardConcept);
    if (difficultIndex > -1) {
        this.state.difficultCards.splice(difficultIndex, 1);
    }
    this._updateStats();
    return {
        success: true,
        card: card,
        status: "learned",
        learnedCount: this.state.learnedCards.length,
        difficultCount: this.state.difficultCards.length
    };
};

StandaloneMemoryTrainer.prototype.markAsDifficult = function(cardConcept) {
    var card = this.state.currentSession.find(function(c) {
        return c.concept === cardConcept;
    });
    if (!card) {
        return { success: false, error: "Carta no encontrada" };
    }
    this.state.cardStatus[cardConcept] = "difficult";
    if (this.state.difficultCards.indexOf(cardConcept) === -1) {
        this.state.difficultCards.push(cardConcept);
    }
    var learnedIndex = this.state.learnedCards.indexOf(cardConcept);
    if (learnedIndex > -1) {
        this.state.learnedCards.splice(learnedIndex, 1);
    }
    this._updateStats();
    return {
        success: true,
        card: card,
        status: "difficult",
        learnedCount: this.state.learnedCards.length,
        difficultCount: this.state.difficultCards.length
    };
};

StandaloneMemoryTrainer.prototype.resetCard = function(cardConcept) {
    var card = this.state.currentSession.find(function(c) {
        return c.concept === cardConcept;
    });
    if (!card) {
        return { success: false, error: "Carta no encontrada" };
    }
    this.state.cardStatus[cardConcept] = "unseen";
    var learnedIndex = this.state.learnedCards.indexOf(cardConcept);
    if (learnedIndex > -1) {
        this.state.learnedCards.splice(learnedIndex, 1);
    }
    var difficultIndex = this.state.difficultCards.indexOf(cardConcept);
    if (difficultIndex > -1) {
        this.state.difficultCards.splice(difficultIndex, 1);
    }
    this._updateStats();
    return {
        success: true,
        card: card,
        status: "unseen"
    };
};

StandaloneMemoryTrainer.prototype.getStats = function() {
    var timeSpent = this._getElapsedTime();
    var progress = this.state.currentSession.length > 0 ? 
        Math.round((this.state.learnedCards.length / this.state.currentSession.length) * 100) : 0;
    return {
        totalCards: this.state.sessionStats.totalCards,
        learned: this.state.sessionStats.learned,
        difficult: this.state.sessionStats.difficult,
        remaining: this.state.sessionStats.remaining,
        timeSpent: timeSpent,
        timeFormatted: this._formatTime(timeSpent),
        progress: progress,
        currentCard: this.state.currentCardIndex + 1,
        totalCardsInSession: this.state.currentSession.length,
        flippedCards: this.state.flippedCards.size
    };
};

StandaloneMemoryTrainer.prototype.endSession = function() {
    this.state.active = false;
    var timeSpent = this._getElapsedTime();
    var totalCards = this.state.currentSession.length;
    var learnedCards = this.state.learnedCards.length;
    var difficultCards = this.state.difficultCards.length;
    var progress = totalCards > 0 ? Math.round((learnedCards / totalCards) * 100) : 0;
    var message, recommendation;
    if (progress >= 80) {
        message = "¡Excelente trabajo! Has aprendido la mayoría de los conceptos.";
        recommendation = "Puedes repasar las cartas marcadas como difíciles o empezar una nueva sesión.";
    } else if (progress >= 50) {
        message = "Buen progreso. Continúa estudiando para mejorar tu dominio.";
        recommendation = "Enfócate en las cartas marcadas como difíciles en tu próximo estudio.";
    } else {
        message = "Es un buen comienzo. Sigue practicando para mejorar.";
        recommendation = "Te recomendamos repasar más las cartas que aún no dominas.";
    }
    // Obtener la lista completa de conceptos difíciles con sus definiciones
    var difficultConcepts = this.state.difficultCards.map(function(concept) {
        var card = this.state.currentSession.find(function(c) {
            return c.concept === concept;
        });
        return card ? { 
            concept: card.concept, 
            definition: card.definition,
            important: card.important || false
        } : null;
    }.bind(this)).filter(function(item) { return item !== null; });
    return {
        sessionTitle: this.sessionTitle,
        timeSpent: timeSpent,
        timeFormatted: this._formatTime(timeSpent),
        totalCards: totalCards,
        learnedCards: learnedCards,
        difficultCards: difficultCards,
        unseenCards: totalCards - learnedCards - difficultCards,
        progress: progress,
        message: message,
        recommendation: recommendation,
        difficultConcepts: difficultConcepts  // ← INCLUYE TODA LA INFORMACIÓN
    };
};

StandaloneMemoryTrainer.prototype.exportConfig = function() {
    var exportCards = this.cards.map(function(card) {
        return {
            concept: card.important ? ("⚠️ " + card.concept) : card.concept,
            definition: card.important ? ("⚠️ " + card.definition) : card.definition
        };
    });
    return {
        metadata: {
            version: "1.0",
            created: new Date().toISOString(),
            author: "Memory Trainer",
            lastModified: new Date().toISOString(),
            sessionTitle: this.sessionTitle,
            totalCards: this.cards.length,
            importantTerms: this.cards.filter(function(c) { return c.important; }).length
        },
        config: {
            sessionTitle: this.sessionTitle,
            instructions: this.instructions,
            subject: this.subject || "General",
            studyMode: this.studyMode,
            cardsPerSession: this.cardsPerSession,
            order: this.order,
            showTimer: this.showTimer,
            autoFlip: this.autoFlip,
            enableSound: this.enableSound,
            showProgress: this.showProgress,
            customColors: this.customColors
        },
        content: {
            cards: exportCards
        }
    };
};

function escapeHTML(text) {
    if (text === null || text === undefined) return "";
    var div = document.createElement("div");
    div.textContent = String(text);
    return div.innerHTML;
}

function showMessage(message, type) {
    var messageDiv = document.createElement("div");
    messageDiv.className = "status-message " + type;
    var emoji = "ℹ️";
    if (type === "error") emoji = "❌";
    else if (type === "warning") emoji = "⚠️";
    else if (type === "success") emoji = "✅";
    messageDiv.innerHTML = "<span class=\"emoji\">" + emoji + "</span> " + escapeHTML(message);
    var trainerContent = document.getElementById("trainerContent");
    trainerContent.insertBefore(messageDiv, trainerContent.firstChild);
    setTimeout(function() {
        if (messageDiv.parentNode) {
            messageDiv.parentNode.removeChild(messageDiv);
        }
    }, 3000);
}

function initTrainer() {
    try {

        statusBadge = '<div class="status-badge learned"><span class="emoji">✅</span> Aprendida</div>';
    } else if (currentCard.status === "difficult") {
        statusBadge = '<div class="status-badge difficult"><span class="emoji">⚠️</span> Dificultad</div>';
    }
    var html = "";
    html += '<div class="study-screen">';
    html += '<div class="progress-bar-container">';
    html += '<div class="progress-bar" style="width: ' + currentCard.progress + '%"></div>';
    html += '<div class="progress-label">Carta ' + currentCard.cardNumber + ' de ' + currentCard.totalCards + ' (' + currentCard.progress + '%)</div>';
    html += '</div>';
    html += importantBadge;
    html += statusBadge;
    html += '<div class="card-container" id="cardContainer">';
    html += '<div class="flashcard" id="flashcard">';
    html += '<div class="card-front" id="cardFront">';
    html += '<div class="card-content">';
    html += '<h3>Concepto</h3>';
    html += '<div class="concept-text">' + escapeHTML(card.concept) + '</div>';
    html += '</div>';
    html += '<div class="card-hint">Haz clic para ver la definición</div>';
    html += '</div>';
    html += '<div class="card-back" id="cardBack">';
    html += '<div class="card-content">';
    html += '<h3>Definición</h3>';
    html += '<div class="definition-text">' + escapeHTML(card.definition) + '</div>';
    html += '</div>';
    html += '<div class="card-hint">Haz clic para ver el concepto</div>';
    html += '</div>';
    html += '</div>';
    html += '</div>';
    html += '<div class="card-actions">';
    html += '<button class="btn btn-success" id="markLearnedBtn">';
    html += '<span class="emoji">✅</span> ✓ Aprendida';
    html += '</button>';
    html += '<button class="btn btn-warning" id="markDifficultBtn">';
    html += '<span class="emoji">⚠️</span> ✗ Dificultad';
    html += '</button>';
    html += '<button class="btn btn-secondary" id="resetCardBtn">';
    html += '<span class="emoji">🔄</span> Reiniciar';
    html += '</button>';
    html += '</div>';
    html += '<div class="session-controls">';
    html += '<button class="btn btn-danger" id="endSessionBtn">';
    html += '<span class="emoji">⏹️</span> Terminar Sesión';
    html += '</button>';
    html += '</div>';
    html += '</div>';
    trainerContent.innerHTML = html;
    updateUI();
    var flashcard = document.getElementById("flashcard");
    if (currentCard.flipped) {
        flashcard.classList.add("flipped");
    }
    flashcard.addEventListener("click", function() {
        flipCurrentCard();
    });
    document.getElementById("markLearnedBtn").addEventListener("click", function() {
        markCardAsLearnedAndContinue();
    });
    document.getElementById("markDifficultBtn").addEventListener("click", function() {
        markCardAsDifficultAndContinue();
    });
    document.getElementById("resetCardBtn").addEventListener("click", function() {
        resetCardStatus();
    });
    document.getElementById("endSessionBtn").addEventListener("click", endStudySession);
    if (trainer.autoFlip && !currentCard.flipped) {
        startAutoFlipTimer();
    }
}

function flipCurrentCard() {
    if (!currentCard || !sessionActive) return;
    var flashcard = document.getElementById("flashcard");
    var result = trainer.flipCard(currentCard.card.concept);
    if (result.success) {
        flashcard.classList.toggle("flipped");
        if (trainer.enableSound) {
            playFlipSound();
        }
        clearAutoFlipTimer();
    }
}

function markCardAsLearnedAndContinue() {
    if (!currentCard || !sessionActive) return;
    var result = trainer.markAsLearned(currentCard.card.concept);
    if (result.success) {
        showMessage("✅ Marcada como aprendida - Pasando a la siguiente...", "success");
        updateUI();
        setTimeout(function() {
            if (trainer.nextCard()) {
                showStudyCard();
            } else {
                endStudySession();
            }
        }, 800);
    }
}

function markCardAsDifficultAndContinue() {
    if (!currentCard || !sessionActive) return;
    var result = trainer.markAsDifficult(currentCard.card.concept);
    if (result.success) {
        showMessage("⚠️ Marcada como difícil - Pasando a la siguiente...", "warning");
        updateUI();
        setTimeout(function() {
            if (trainer.nextCard()) {
                showStudyCard();
            } else {
                endStudySession();
            }
        }, 800);
    }
}

function resetCardStatus() {
    if (!currentCard || !sessionActive) return;
    var result = trainer.resetCard(currentCard.card.concept);
    if (result.success) {
        showMessage("🔄 Estado de la carta reiniciado", "info");
        updateUI();
    }
}

function startAutoFlipTimer() {
    if (!trainer.autoFlip) return;
    clearAutoFlipTimer();
    autoFlipTimeout = setTimeout(function() {
        if (sessionActive && currentCard && !currentCard.flipped) {
            flipCurrentCard();
        }
    }, 5000);
}

function clearAutoFlipTimer() {
    if (autoFlipTimeout) {
        clearTimeout(autoFlipTimeout);
        autoFlipTimeout = null;
    }
}

function startTimer() {
    if (!trainer.showTimer) return;
    clearInterval(timerInterval);
    timerInterval = setInterval(updateTimer, 1000);
}

function updateTimer() {
    if (!sessionActive) {
        clearInterval(timerInterval);
        return;
    }
    var stats = trainer.getStats();
    document.getElementById("timeDisplay").textContent = stats.timeFormatted;
}

function updateUI() {
    if (!sessionActive) return;
    var stats = trainer.getStats();
    document.getElementById("learnedDisplay").textContent = stats.learned;
    if (trainer.showTimer) {
        document.getElementById("timeDisplay").textContent = stats.timeFormatted;
    }
}

function playFlipSound() {
    try {
        var audioContext = new (window.AudioContext || window.webkitAudioContext)();
        var oscillator = audioContext.createOscillator();
        var gainNode = audioContext.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        oscillator.frequency.value = 523.25;
        gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
        oscillator.start(audioContext.currentTime);
        oscillator.stop(audioContext.currentTime + 0.5);
    } catch (e) {
        // Silenciar error si AudioContext no está disponible
    }
}

function endStudySession() {
    sessionActive = false;
    clearAutoFlipTimer();
    clearInterval(timerInterval);
    var results = trainer.endSession();
    showResultsScreen(results);
}

function showResultsScreen(results) {
    var trainerContent = document.getElementById("trainerContent");
    var html = "";
    html += '<div class="results-screen">';
    html += '<h2><span class="emoji">🏆</span> Sesión Completada</h2>';
    html += '<div class="results-message">' + escapeHTML(results.message) + '</div>';
    html += '<div class="results-recommendation">' + escapeHTML(results.recommendation) + '</div>';
    html += '<div class="results-stats">';
    html += '<div class="stat-card">';
    html += '<div class="stat-icon"><span class="emoji">⏱️</span></div>';
    html += '<div class="stat-value">' + escapeHTML(results.timeFormatted) + '</div>';
    html += '<div class="stat-label">Tiempo</div>';
    html += '</div>';
    html += '<div class="stat-card">';
    html += '<div class="stat-icon"><span class="emoji">✅</span></div>';
    html += '<div class="stat-value">' + results.learnedCards + '</div>';
    html += '<div class="stat-label">Aprendidas</div>';
    html += '</div>';
    html += '<div class="stat-card">';
    html += '<div class="stat-icon"><span class="emoji">⚠️</span></div>';
    html += '<div class="stat-value">' + results.difficultCards + '</div>';
    html += '<div class="stat-label">Difíciles</div>';
    html += '</div>';
    html += '<div class="stat-card">';
    html += '<div class="stat-icon"><span class="emoji">📊</span></div>';
    html += '<div class="stat-value">' + results.progress + '%</div>';
    html += '<div class="stat-label">Progreso</div>';
    html += '</div>';
    html += '</div>';
    if (results.difficultConcepts && results.difficultConcepts.length > 0) {
        html += '<div class="difficult-concepts">';
        html += '<h3><span class="emoji">⚠️</span> Conceptos marcados como difíciles</h3>';
        html += '<p>Estos son los conceptos que deberías repasar en tu próxima sesión:</p>';
        html += '<div class="concepts-list">';
        // Generar cada concepto difícil
        results.difficultConcepts.forEach(function(item) {
            var importantTag = item.important ? '<span class="important-tag">IMPORTANTE</span>' : "";
            html += '<div class="concept-item">';
            html += '<div class="concept-header">';
            html += '<span class="emoji">📌</span>';
            html += '<div class="concept-title">' + escapeHTML(item.concept) + '</div>';
            html += importantTag;
            html += '</div>';
            html += '<div class="definition-content">';
            html += '<strong>Definición:</strong> ' + escapeHTML(item.definition);
            html += '</div>';
            html += '</div>';
        });
        html += '</div>';
        html += '</div>';
    } else {
        html += '<div class="difficult-concepts">';
        html += '<h3><span class="emoji">🎉</span> ¡Excelente trabajo!</h3>';
        html += '<div class="no-difficult-concepts">';
        html += '<span class="emoji">✅</span>';
        html += '<p>No hay conceptos marcados como difíciles. ¡Has dominado todos los conceptos de esta sesión!</p>';
        html += '</div>';
        html += '</div>';
    }
    html += '<div class="controls">';
    html += '<button class="btn btn-primary" id="restartSessionBtn">';
    html += '<span class="emoji">🔄</span> Nueva Sesión';
    html += '</button>';
    html += '<button class="btn btn-secondary" id="mainMenuBtn">';
    html += '<span class="emoji">🏠</span> Menú Principal';
    html += '</button>';
    html += '</div>';
    html += '</div>';
    trainerContent.innerHTML = html;
    document.getElementById("restartSessionBtn").addEventListener("click", function() {
        startStudySession();
    });
    document.getElementById("mainMenuBtn").addEventListener("click", showStartScreen);
}

// INICIALIZAR CUANDO SE CARGA LA PÁGINA
document.addEventListener("DOMContentLoaded", function() {
    initTrainer();
});
