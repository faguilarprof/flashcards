stion small{color:var(--muted);font-weight:750}.question h3{margin:13px 0 0;font-size:27px;line-height:1.38}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.option{position:relative;min-height:90px;padding:20px 16px 16px 48px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-weight:700;text-align:left}.option:hover:not(:disabled){border-color:var(--p);transform:translateY(-2px)}.option:before{content:attr(data-key);position:absolute;left:13px;top:13px;display:grid;place-items:center;width:25px;height:25px;border-radius:50%;color:var(--p);background:#eef2ff;font-size:11px}.option.correct{color:#065f46;border-color:var(--ok);background:#d1fae5}.option.incorrect{color:#7f1d1d;border-color:var(--bad);background:#fee2e2}.feedback{margin-top:14px;padding:14px;border-radius:12px;text-align:center;font-weight:800}.feedback.ok{color:#065f46;background:#d1fae5}.feedback.bad{color:#7f1d1d;background:#fee2e2}.result-score{font-size:72px;font-weight:900;line-height:1;color:var(--p);margin:25px 0 8px}.result-grade{font-size:22px;font-weight:850}.certificate-box{margin-top:24px;padding:20px;border:2px solid #fcd34d;border-radius:17px;background:linear-gradient(135deg,#fffbeb,#fff)}.certificate-box input{width:min(450px,100%);padding:12px;border:1px solid #d6b661;border-radius:10px}.diploma-page{padding:38px;border:8px double var(--p);border-radius:7px;background:#fff;text-align:center}.diploma-page .seal{font-size:50px}.diploma-page h2{font-size:34px}.diploma-name{margin:26px 0 8px;color:var(--p);font:900 33px Georgia,serif}.diploma-line{width:70%;height:2px;margin:8px auto 22px;background:var(--a)}.toast{position:fixed;right:18px;bottom:18px;z-index:10;max-width:360px;padding:13px 16px;border-radius:11px;color:#fff;background:#334155;box-shadow:0 14px 35px rgba(0,0,0,.25)}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:720px){body{padding:7px}.app{border-radius:16px;min-height:96vh}.head{align-items:flex-start;flex-direction:column}.content{padding:20px 14px}.mode-grid,.options,.direction-grid{grid-template-columns:1fr}.flip-wrap{height:280px}.face strong{font-size:23px}.review-results{grid-template-columns:1fr}.stats{max-width:100%}h2{font-size:27px}.question h3{font-size:22px}}@media print{body{padding:0;background:#fff}.app>header,.diploma-controls{display:none!important}.app{box-shadow:none;border:0}.content{padding:0}.screen:not(.printable){display:none}.diploma-page{min-height:190mm;display:flex;flex-direction:column;justify-content:center}.toast{display:none}}

<script>
(function(){'use strict';var DATA={"id":"qsu-mu3uc5zw-yf9p3n","cards":[{"id":1,"concept":"Ámbitos de la RSC","definition":"Son las grandes áreas temáticas que abarca la RSC, como los derechos humanos, las prácticas de trabajo y empleo, la protección de la salud, las cuestiones medioambientales, la lucha contra el fraude y la corrupción, y los intereses de los consumidores.","featured":false},{"id":2,"concept":"Análisis del entorno (DAFO)","definition":"Evaluación de los factores internos y externos que afectan a la empresa, identificando sus debilidades, fortalezas, oportunidades y amenazas.","featured":true},{"id":3,"concept":"Barreras de salida del sector","definition":"Obstáculos o dificultades que impiden a las empresas abandonar un sector.","featured":false},{"id":4,"concept":"Beneficio","definition":"Ganancia económica obtenida por una empresa después de restar los costos.","featured":true},{"id":5,"concept":"Beneficios de la RSC para las empresas","definition":"Mejora de la imagen pública, reconocimiento de marca, reducción de gastos, mayor diferenciación, nuevas oportunidades y trabajadores más implicados.","featured":true},{"id":6,"concept":"Cliente objetivo","definition":"Persona a la que se dirige el producto o servicio, conociendo sus gustos, hábitos de consumo y razones para elegirlo.","featured":true},{"id":7,"concept":"Competencia","definition":"Concurrencia en el mismo mercado de distintos oferentes de bienes o servicios.","featured":true},{"id":8,"concept":"Competencia imperfecta","definition":"Un tipo de mercado en el que hay pocos participantes, un producto diferenciado, barreras de entrada y una información imperfecta.","featured":true},{"id":9,"concept":"Competencia monopolística","definition":"Una situación en la que hay numerosas empresas que ofrecen un producto similar, pero cada una busca destacarse a través de la calidad y la marca de su producto.","featured":true},{"id":10,"concept":"Competencia perfecta","definition":"Un tipo de mercado en el que hay muchos participantes, un producto homogéneo, libertad de entrada y salida, y una información perfecta.","featured":true},{"id":11,"concept":"Concentración de mercado","definition":"Número reducido de competidores en un mercado, lo que otorga más poder a las empresas para influir en los precios y condiciones de venta.","featured":false},{"id":12,"concept":"Criterios de clasificación de las empresas","definition":"Los criterios utilizados para clasificar las empresas en la actualidad, como el tamaño, la propiedad del capital, los costes de producción, el ámbito geográfico, el sector económico y la delegación en la toma de decisiones.","featured":false},{"id":13,"concept":"Cuota de mercado","definition":"La proporción del mercado que consume los productos de una empresa concreta, calculada como el porcentaje de ventas de una empresa respecto al total de ventas de un sector o mercado.","featured":true},{"id":14,"concept":"Economía de mercado","definition":"Sistema económico en el que las empresas producen bienes y servicios para satisfacer las necesidades de la población.","featured":true},{"id":15,"concept":"Empresa","definition":"Una organización que combina recursos humanos, financieros y materiales para producir bienes o servicios con el objetivo de obtener beneficios.","featured":true},{"id":16,"concept":"Empresa privada","definition":"Empresa que busca obtener beneficios a través de la producción y comercialización de bienes y servicios. Los fondos de que se nutre provienen de particulares y de otras empresas que son dueños de ésta.","featured":true},{"id":17,"concept":"Empresa pública","definition":"Empresa orientada a satisfacer necesidades de la población, sin perseguir el objetivo de obtener beneficios. Los fondos de que se nutre provienen del Estado que es el dueño y controla la empresa.","featured":true},{"id":18,"concept":"Empresas centralizadas","definition":"Empresas en las que la toma de decisiones se concentra en uno o varios órganos.","featured":false},{"id":19,"concept":"Empresas de capital intensivas","definition":"Empresas en las que el valor de la maquinaria representa un coste significativo en relación al valor del artículo producido.","featured":true},{"id":20,"concept":"Empresas de los nuevos sectores productivos","definition":"Empresas que pertenecen a los sectores cuaternario y quinario.","featured":true},{"id":21,"concept":"Empresas de material intensivas","definition":"Empresas en las que el coste de la materia prima es elevado en relación al valor del artículo.","featured":false},{"id":22,"concept":"Empresas del sector primario","definition":"Empresas cuya actividad principal involucra la extracción de materias primas, como agricultura, ganadería, silvicultura y pesca.","featured":true},{"id":23,"concept":"Empresas del sector secundario","definition":"Empresas que se centran en la transformación de materias primas, como la industria siderometalúrgica.","featured":true},{"id":24,"concept":"Empresas del sector terciario","definition":"Empresas que prestan servicios a consumidores y empresas.","featured":true},{"id":25,"concept":"Empresas descentralizadas","definition":"Empresas en las que la capacidad de decisión se distribuye entre diferentes niveles jerárquicos.","featured":false},{"id":26,"concept":"Empresas internacionales","definition":"Empresas cuyo ámbito de actividad trasciende las fronteras nacionales.","featured":true},{"id":27,"concept":"Empresas locales","definition":"Empresas cuyas actividades se centran en un entorno cercano, como la localidad, la comarca, una provincia o una región.","featured":true},{"id":28,"concept":"Empresas mano de obra intensivas","definition":"Empresas en las que el coste de la mano de obra es significativo en relación al valor del artículo.","featured":false},{"id":29,"concept":"Empresas mixtas","definition":"Empresas que combinan capital privado y público.","featured":true},{"id":30,"concept":"Empresas nacionales","definition":"Empresas que actúan en la totalidad del territorio nacional, aunque tengan su sede en una localidad concreta.","featured":false},{"id":31,"concept":"Empresas Sociales","definition":"Son empresas que buscan obtener rentabilidad en el mercado, pero su producto tiene un valor social y busca resolver un problema social o medioambiental. Se financian a través de la venta de sus productos y pueden tener acciones complementarias","featured":true},{"id":32,"concept":"Entorno o marco externo","definition":"Factores externos que influyen en la empresa, como la competencia, los proveedores y los clientes.","featured":true},{"id":33,"concept":"Equilibrio de mercado","definition":"Cuando oferta y demanda se equiparan, es decir, la cantidad demandada es igual a la ofrecida a un determinado precio.","featured":true},{"id":34,"concept":"Estrategia concentrada","definition":"Enfocarse en un segmento y adaptar el producto a sus necesidades.","featured":true},{"id":35,"concept":"Estrategia diferenciada","definition":"Adaptar el producto a las necesidades de cada segmento.","featured":true},{"id":36,"concept":"Estrategia indiferenciada","definition":"Dar el mismo producto a todos los segmentos sin diferenciar.","featured":true},{"id":37,"concept":"Estudio de mercado","definition":"Análisis para conocer a los potenciales clientes, la competencia, los proveedores y los productos sustitutivos en el mercado.","featured":true},{"id":38,"concept":"Etapas de la RSC","definition":"Son las diferentes fases por las que las empresas han ido adaptándose a la responsabilidad social corporativa, que incluyen el cumplimiento de la ley, la reacción a las demandas de la sociedad y la concienciación social.","featured":false},{"id":39,"concept":"Funciones de la empresa","definition":"Actividades que realiza la empresa para coordinar sus elementos y alcanzar sus objetivos, como compras, producción, comercialización, recursos humanos, finanzas e investigación y desarrollo.","featured":true},{"id":40,"concept":"Globalización","definition":"Proceso de interconexión y expansión de las empresas a nivel mundial.","featured":true},{"id":41,"concept":"Gran Empresa","definition":"Una empresa cuyo volumen de negocio en el ejercicio anterior ha superado los 6.010.121 euros y tiene la obligación de presentar declaraciones-liquidaciones de retenciones, impuesto sobre el valor añadido (IVA) y otros impuestos de forma mensual.","featured":true},{"id":42,"concept":"Importancia de la RSC","definition":"La RSC surge como una herramienta para aminorar el impacto negativo de las empresas en la sociedad y el medioambiente, en un contexto de globalización que ha generado desequilibrios y favorecido el aumento del poder de las empresas.","featured":false},{"id":43,"concept":"Mercado","definition":"Ámbito en el que se intercambian bienes y servicios entre compradores y vendedores.","featured":true},{"id":44,"concept":"Mercado meta","definition":"Segmento en el que la empresa se enfoca y tiene mayores posibilidades de éxito.","featured":true},{"id":45,"concept":"Monopolio","definition":"Una situación en la que solo existe una empresa que ofrece un producto o servicio, lo que le da un gran poder de mercado.","featured":true},{"id":46,"concept":"Oferta y demanda","definition":"Concepto económico que se refiere a la relación entre la cantidad de un producto o servicio que los productores están dispuestos a vender y la cantidad que los consumidores están dispuestos a comprar.","featured":true},{"id":47,"concept":"Oligopolio","definition":"Una situación en la que un puñado de empresas dominan la oferta de un bien en el mercado.","featured":true},{"id":48,"concept":"Organización","definition":"La tarea principal de los directivos de una empresa, consiste en combinar los factores de producción de manera eficiente para obtener los mejores resultados al menor costo posible.","featured":false},{"id":49,"concept":"Patrimonio","definition":"El conjunto de bienes y derechos económicos de una empresa, que incluye activos no corrientes (como edificios y maquinaria) y activos corrientes (como materias primas y dinero en efectivo).","featured":true},{"id":50,"concept":"Poder de negociación","definition":"Capacidad de influir y persuadir a la otra parte en una negociación comercial.","featured":true},{"id":51,"concept":"Prescriptores","definition":"Personas que, por diferentes motivos, pueden influir en la adquisición o no de un bien determinado.","featured":true},{"id":52,"concept":"Productos complementarios","definition":"Bien cuyo atractivo aumenta con la popularidad de su complemento. Estos bienes pueden ser bienes físicos, como coches y gasolina, o servicios.","featured":true},{"id":53,"concept":"Productos sustitutivos","definition":"Productos diferentes que satisfacen la misma necesidad o función en el mercado.","featured":true},{"id":54,"concept":"Proveedores","definition":"Empresas o personas que suministran bienes o servicios a la empresa.","featured":true},{"id":55,"concept":"Proveedores de outsourcing","definition":"Proveedores que permiten reducir costos al externalizar ciertas funciones.","featured":false},{"id":56,"concept":"Proveedores de servicios","definition":"Proveedores que colaboran directamente con el proyecto de la empresa.","featured":false},{"id":57,"concept":"Proveedores habituales","definition":"Proveedores con los que se establece una relación comercial sólida basada en la confianza.","featured":true},{"id":58,"concept":"Punto de equilibrio","definition":"El punto en el que la cantidad demandada de un producto o servicio es igual a la cantidad ofrecida, lo que resulta en un equilibrio de precios y cantidades.","featured":true},{"id":59,"concept":"PYME","definition":"Todas las empresas que no se enmarcan en el grupo de las grandes empresas. Puede ser una pequeña empresa, en la que no trabajan más de veinte personas y su capital e ingresos son reducidos, o una microempresa, en la que no trabajan más de diez personas y los ingresos son en cuantías personales.","featured":true},{"id":60,"concept":"Recursos humanos","definition":"Trabajadores, propietarios o accionistas, y administradores y directivos que forman parte de la empresa.","featured":true},{"id":61,"concept":"Relación de interdependencia","definition":"La empresa depende de los proveedores para obtener los bienes y servicios necesarios para su funcionamiento, y los proveedores dependen de la empresa para obtener ingresos.","featured":true},{"id":62,"concept":"Rentabilidad","definition":"Medida de la ganancia o beneficio obtenido por una empresa.","featured":false},{"id":63,"concept":"Responsabilidad Social Corporativa (RSC)","definition":"Es una forma de dirigir las empresas basada en la gestión de los impactos que su actividad genera sobre sus clientes, empleados, accionistas, comunidades locales, medioambiente y sobre la sociedad en general.","featured":true},{"id":64,"concept":"Sector cuaternario","definition":"Un sector emergente de la economía que se enfoca en la investigación, desarrollo e innovación.","featured":true},{"id":65,"concept":"Sector primario","definition":"El sector de la economía que obtiene productos de los recursos naturales, como la agricultura, la ganadería y la pesca.","featured":true},{"id":66,"concept":"Sector quinario","definition":"Un sector que agrupa actividades tradicionalmente consideradas como servicios, pero que han desarrollado formas y modelos productivos propios, como las industrias culturales y de entretenimiento.","featured":true},{"id":67,"concept":"Sector secundario","definition":"El sector de la economía que transforma las materias primas en bienes o mercancías, como la industria minera y la transformación de productos.","featured":true},{"id":68,"concept":"Sector terciario","definition":"El sector de la economía que proporciona servicios a los consumidores y a las empresas, como el comercio, el transporte y los servicios financieros.","featured":true},{"id":69,"concept":"Sectores de producción","definition":"Una clasificación de la economía basada en el tipo de proceso productivo, que incluye el sector primario (obtención de recursos naturales), el sector secundario (transformación de materias primas) y el sector terciario (provisión de servicios).","featured":false},{"id":70,"concept":"Segmentación del mercado","definition":"El proceso de dividir el mercado en grupos de compradores con características similares, como geográficas, demográficas, personales, familiares, psicológicas y conductuales.","featured":true},{"id":71,"concept":"Segmentación por uso","definition":"División del mercado en función de la frecuencia con la que los consumidores utilizan un producto o servicio.","featured":false},{"id":72,"concept":"Tamaño de la empresa","definition":"Tamaño y recursos de una empresa, que pueden influir en su capacidad para negociar en mejores condiciones.","featured":false},{"id":73,"concept":"Tamaño del mercado","definition":"La suma total de ventas de un bien o servicio en un periodo de tiempo.","featured":true}],"config":{"title":"Flashcards UD06 LOE La empresa y su entorno","description":"Repasa las fichas y comprueba después lo que has aprendido.","subject":"General","filename":"flashcards-ud06-loe","outputMode":"both","startMode":"menu","colors":{"primary":"#e50052","accent":"#ec4899","front":"#ffffff","back":"#f8fafc","success":"#10b981","danger":"#ef4444","warning":"#f59e0b"},"reviewCards":100,"reviewOrder":"random","reviewRandomSelection":true,"reviewAutoFlip":5,"reviewTimer":true,"reviewSound":true,"reviewSaveProgress":true,"quizCards":25,"quizLives":3,"quizDirection":"learner","quizShuffle":true,"quizFeedback":true,"passPercent":75,"diploma":true}},cfg=DATA.config,cards=DATA.cards,content=document.getElementById('content'),stats=document.getElementById('stats'),homeBtn=document.getElementById('homeBtn');var app={screen:'',review:null,quiz:null,results:null,timer:null,auto:null,transition:null,chosenDirection:'concept-to-definition'};var difficultKey='quizlet-studio-difficul function showPrintable(name,r){setStats('');setScreen('diploma','<section class="screen printable"><div class="diploma-page"><div class="seal">🎓</div><h2>DIPLOMA DE APROVECHAMIENTO</h2><h3>'+esc(cfg.title)+'</h3><p>Se concede el presente diploma a</p><div class="diploma-name">'+esc(name.toUpperCase())+'</div><div class="diploma-line"></div><p>por haber superado satisfactoriamente la actividad</p><h3 style="color:var(--ok)">Calificación: '+r.grade+' / 10</h3><p>Aciertos: '+r.correct+'/'+r.total+' · Precisión: '+r.percent+'% · Tiempo: '+r.time+'</p><p><small>'+new Date().toLocaleDateString('es-ES')+' · '+esc(cfg.subject)+' · ID: '+r.id+'</small></p></div><div class="btns diploma-controls"><button class="btn primary" id="doPrint">Imprimir / Guardar como PDF</button><button class="btn secondary" id="backResults">Volver a resultados</button></div></section>');document.getElementById('doPrint').onclick=function(){window.print()};document.getElementById('backResults').onclick=finishQuiz}
document.addEventListener('keydown',function(e){if(app.screen==='quiz-question'&&!app.quiz.locked&&/^[1-4]$/.test(e.key))answerQuiz(parseInt(e.key,10)-1);if(app.screen==='review-card'&&(e.key===' '||e.key==='Enter')){e.preventDefault();flipReview()}});window.addEventListener('beforeunload',function(){if(app.screen==='review-card')saveReviewProgress()});document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'&&app.screen==='review-card')saveReviewProgress()});function init(){if(!cards.length){setScreen('home','<section class="screen center"><h2>No hay fichas disponibles</h2></section>');return}if(cfg.outputMode==='both'){if(cfg.startMode==='review')showReviewStart();else if(cfg.startMode==='quiz'&&cards.length>=4)showQuizStart();else showHome(true)}else showHome(false)}init()})();
</script></body></html>
